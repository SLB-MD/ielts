const INTERVALS=[1,1,3,7,16,35];
/* ============ BẢNG CHỮ CÁI: NGUYÊN ÂM - PHỤ ÂM + NHÓM THEO ÂM CỦA TÊN CHỮ ============
   Giáo trình ESL/IELTS vỡ lòng dạy bảng chữ cái theo nhóm tên chữ để luyện nghe - đánh vần:
   tên các chữ trong cùng nhóm đọc gần giống nhau nên phải học cạnh nhau để phân biệt.
   Tiến độ từng thẻ khóa theo cardKey(setIdx, ci, w) với ci là chỉ số GỐC trong bộ,
   nên thứ tự trình thẻ chỉ là cách sắp xếp hàng đợi - không ảnh hưởng tiến độ/Hộp nhớ SRS. */
const AZ_GROUP_META={ei:{ipa:"/eɪ/",vn:"ây"},ii:{ipa:"/iː/",vn:"i dài"},e:{ipa:"/e/",vn:"e"},ai:{ipa:"/aɪ/",vn:"ai"},ou:{ipa:"/əʊ/",vn:"âu"},juu:{ipa:"/juː/",vn:"iu"},aa:{ipa:"/ɑː/",vn:"a dài"}};

let azOrderMode="group";
function isAZDeck(d){ return !!(d&&d.cards&&d.cards.length&&d.cards[0]&&d.cards[0].kind&&d.cards[0].ngrp); }
function azOrderIndices(d,mode){
  if(mode!=="group") return d.cards.map((c,ci)=>ci);

  d.cards.forEach((c,ci)=>{ if(c.kind==="vowel"){ out.push(ci); seen.add(ci); } });

  return out;
}
function azQueueFor(d){ return azOrderIndices(d,isAZDeck(d)?azOrderMode:"az").map(ci=>({deck:d,c:d.cards[ci],ci,k:cardKey(d.setIdx,ci,d.cards[ci].w)})); }
function azGroupLabel(c){ const m=AZ_GROUP_META[c.ngrp]; return (c.kind==="vowel"?"Nguyên âm":"Phụ âm")+" - nhóm tên \""+(m?m.vn:"")+"\""+(m?(" "+m.ipa):""); }
function azMapHTML(d){

  +"<div class=\"az-zone az-zone-v\"><div class=\"az-zone-t\">NGUYÊN ÂM - 5 chữ</div><div class=\"az-cells\">"+vowels+"</div><p class=\"az-note\">5 nguyên âm là linh hồn của mọi từ: từ nào cũng có ít nhất một nguyên âm. Hãy học 5 chữ này trước tiên.</p></div>"
  +"<div class=\"az-zone\"><div class=\"az-zone-t\">PHỤ ÂM - 21 chữ, xếp theo nhóm tên chữ</div>"+groups+"<p class=\"mut\" style=\"margin-top:6px\">Bảng nhóm ở trên là bản đồ tra cứu đánh vần: mỗi nhóm liệt kê đủ các chữ có tên đọc giống nhau (có cả nguyên âm nếu chữ đó thuộc nhóm tên này).</p></div>"
  +"<p class=\"mut\" style=\"margin-top:8px\">Vì sao học theo nhóm tên này? Trong IELTS Listening, người ta hay đánh vần tên người và địa chỉ (ví dụ: My name is Linh - L, I, N, H). Các chữ trong cùng một nhóm có tên đọc gần giống nhau (riêng nhóm \"i dài\" có tới 8 chữ), nên học cạnh nhau để nghe và phân biệt cho rõ. Bấm vào một ô chữ để nhảy ngay tới thẻ chữ đó; ô có dấu ✓ là chữ bạn đã thuộc.</p>"
  +"</div>";
}
let vocabSel=null, vocabQueue=null, vocabPos=0, vocabFlipped=false, vocabMode="flash", vocabQuiz=null;
function buildVocabQuiz(d){ const cards=d.cards.slice(0,10); const pool=CONTENT.vocab.flatMap(v=>v.cards); const src=cards.length>=4?cards:pool; const items=cards.map((c,i)=>{ const ds=[]; for(const off of [1,3,5,2,4]){ const cand=src[(i+off)%src.length]; if(cand&&cand.vi!==c.vi&&!ds.includes(cand.vi)) ds.push(cand.vi); if(ds.length>=3) break; } const opts=ds.slice(0,3); const pos=opts.length?i%(opts.length+1):0; opts.splice(pos,0,c.vi); return {w:c.w,ipa:c.ipa||"",vi:c.vi,opts,a:pos}; }); return {items,pos:0,score:0,answered:false,wrongs:[]}; }

    wireHead(); $("#vqAgain").onclick=()=>{ vocabQuiz=buildVocabQuiz(d); render(); }; $("#vqFlash").onclick=()=>{ vocabMode="flash"; render(); }; const vfn2=$("[data-flownav]"); if(vfn2) wireFlowNav(vfn2,"vocab",d.setIdx); return; }
  const it=q.items[q.pos];

  ${guideHTML("Chế độ kiểm tra: đọc từ tiếng Anh rồi chọn nghĩa tiếng Việt đúng trong 4 lựa chọn. Chọn xong là biết ngay đúng hay sai.")}${stageLineHTML(d.band)}
  <p class="mut" style="margin-top:12px">Câu ${q.pos+1}/${q.items.length} · Đã đúng: ${q.score}</p>
  <div style="text-align:center;margin:14px 0"><div style="font-size:30px;font-weight:800;color:var(--teal)">${esc(it.w)}</div><div class="mut">${esc(it.ipa)}</div><button class="btn light" id="vqSpeak" style="margin-top:6px">🔊 Nghe phát âm</button></div>

  wireHead();

  $$(".vqo-opt",app).forEach(b=>b.onclick=()=>{ if(q.answered) return; q.answered=true; const i=+b.dataset.i; $$(".vqo-opt",app).forEach((x,xi)=>{ if(xi===it.a)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#vqWhy"); if(i===it.a){ q.score++; w.innerHTML="<b>Đúng!</b> \""+esc(it.w)+"\" nghĩa là: "+esc(it.vi); } else { w.innerHTML="<b>Chưa đúng.</b> \""+esc(it.w)+"\" nghĩa là: "+esc(it.vi); q.wrongs.push(it); logError({sec:"vocab",q:"Từ \""+it.w+"\" nghĩa là gì?",o:it.opts,a:it.a,why:"\""+it.w+"\" nghĩa là: "+it.vi}); } w.classList.add("show"); $("#vqNext").classList.remove("hidden"); });

function allDecks(){ const decks=CONTENT.vocab.map((v,i)=>({name:v.theme||v.topic||("Bộ từ "+(i+1)),band:vocabSetBand(v),cards:v.cards,setIdx:i})); const saved=Object.values(state.savedWords); if(saved.length) decks.push({name:"Từ đã tra (từ điển)",band:null,cards:saved,setIdx:-1}); return decks; }

/* ================= ĐỌC (IELTS Reading) ================= */
/* Các dạng câu hỏi đọc bổ sung: YNNG / MINFO / MSEND hiển thị như trắc nghiệm thông thường kèm nhãn dạng tiếng Việt dễ hiểu;
   TCOMP gõ đáp án vào ô, so khớp mềm (thường hóa, chấp nhận mọi biến thể cách nhau bằng dấu | trong trường answer). */
const READ_TYPE_LABEL={MC:"Trắc nghiệm (Multiple Choice)",TFNG:"Đúng / Sai / Không nêu (True / False / Not Given)",YNNG:"Ý tác giả - Yes / No / Not Given",MH:"Nối tiêu đề đoạn (Matching Headings)",MINFO:"Tìm thông tin nằm ở đoạn nào (Matching Information)",MSEND:"Nối hai nửa câu (Matching Sentence Endings)",MF:"Đối chiếu đặc điểm (Matching Features)",SC:"Hoàn thành tóm tắt (Summary Completion)",TCOMP:"Điền từ vào chỗ trống (Completion)",DLC:"Gắn nhãn sơ đồ (Diagram Label Completion)",SAQ:"Trả lời ngắn (Short-answer Questions)"};
function readOpts(q){ return q.options||q.o||[]; }
function ansVariants(ans){ return String(ans||"").split("|").map(s=>s.trim()).filter(Boolean); }
function normAns(s){ return String(s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/^[.!?,;:'"]+/g,"").replace(/[.!?,;:'"]+$/g,""); }
function softAnsMatch(typed,ans){ const t=normAns(typed); if(!t) return false; return ansVariants(ans).some(v=>normAns(v)===t); }
function readQHTML(q,qi,r){ const opts=readOpts(q); const label=READ_TYPE_LABEL[q.type]; const lk=r.locked&&r.locked[qi]; const head=`<p><span class="badge gold">${esc(label?("Dạng: "+label):q.type)}</span> <b>Câu ${qi+1}.</b> ${esc(q.q)}</p>`;
  if(q.type==="TCOMP"||q.type==="DLC"||q.type==="SAQ"){ const prev=r.answers[qi]; const val=prev&&typeof prev==="object"?(prev.comp||""):""; const hint=q.type==="DLC"?"Gõ nhãn đúng cho vị trí được hỏi trên sơ đồ hoặc hình vẽ.":(q.type==="SAQ"?"Trả lời ngắn bằng từ hoặc cụm từ lấy từ bài đọc.":"Điền từ hoặc cụm từ còn thiếu vào chỗ ___ trong câu trên."); return `<div style="margin-top:10px">${head}<div class="row" style="margin-top:5px"><input class="r-comp" data-q="${qi}" placeholder="Gõ đáp án của bạn vào đây..." value="${esc(val)}" ${(r.submitted||lk)?"disabled":""} style="flex:1;min-width:180px"><span class="mut">${hint}</span></div><div class="why${lk?" show":""}" id="rWhy${qi}">${lk?("<b>Đúng.</b> "+esc(q.why||"")):""}</div></div>`; }
  return `<div style="margin-top:10px">${head}${opts.map((o,oi)=>`<button class="opt r-opt${lk&&oi===q.a?" right":""}" data-q="${qi}" data-i="${oi}" ${(r.submitted||lk)?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why${lk?" show":""}" id="rWhy${qi}">${lk?("<b>Đúng.</b> "+esc(q.why||"")):""}</div></div>`; }

  r.locked=r.locked||{}; r.attempts=r.attempts||{}; r.firstTry=r.firstTry||{};

/* ================= NGHE DÀI - HIỂU NỘI DUNG (Listening Plus) ================= */
let lpSel=null, lpRun=null;
function lpItems(){ return CONTENT.listeningPlus||[]; }
function lpSentences(text){ const m=String(text||"").match(/[^.!?]+(?:[.!?]+["')\]]*)?\s*/g); const arr=(m||[]).map(s=>s.trim()).filter(Boolean); return arr.length?arr:[String(text||"")]; }
function lpListHTML(f){ const items=lpItems(); const head=`<h3 style="margin-top:16px">📖 Bài nghe dài - hiểu nội dung</h3><p class="mut">Nghe một đoạn dài như trong phòng thi (nghe được toàn bài và nghe lại từng câu), rồi trả lời câu hỏi hiểu nội dung - mỗi câu được chấm ngay.</p>${lpMapHTML(items,f)}`;
  if(!items.length) return head+`<div class="empty" style="margin-top:8px">Đang bổ sung bài nghe dài. Trong lúc chờ, bạn cứ luyện các câu nghe ngắn ở dưới nhé.</div>`;
  const vis=items.map((it,i)=>({it,i})).filter(({it})=>(f==="all"||!it.band||it.band===f)&&(!lpSectionFilter||it.section===lpSectionFilter));
  if(!vis.length) return head+`<div class="empty" style="margin-top:8px">Chưa có bài nghe dài nào ở cấp độ đang chọn. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`;
  return head+`<div class="grid" style="margin-top:8px">${vis.map(({it,i})=>{ const p=getProg("listeningPlus","LP"+i)||{}; const nq=(it.questions||[]).length; return `<div class="tile lptile" data-i="${i}"><span class="badge">${esc(it.section||"")}</span>${it.band?` <span class="badge gold">${esc(it.band)}</span>`:""} ${p.done?`<span class="badge done">Đã làm: ${p.score}/${nq}</span>`:""}<div class="t">${esc(it.topic||"")}</div><div class="mut">${nq} câu hỏi · nghe hiểu nội dung cả đoạn</div></div>`; }).join("")}</div>`; }
function lpWhyText(q,g){ return (g.ok?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why||""); }
function lpQHTML(q,qi,run){ const g=run.graded[qi]; const tn=q.type==="TF"?"Đúng / Sai (True / False)":(q.type==="COMP"?"Điền đáp án (Completion)":(q.type==="SA"?"Trả lời ngắn (Short-answer Questions)":(q.type==="MATCH"?"Nối thông tin (Matching)":"Trắc nghiệm (Multiple Choice)")));
  if(q.type==="COMP"||q.type==="SA") return `<div style="margin-top:12px"><p><span class="badge gold">Dạng: ${tn}</span> <b>Câu ${qi+1}.</b> ${esc(q.q)}</p><div class="row" style="margin-top:5px"><input class="lp-inp" data-q="${qi}" placeholder="Gõ đáp án của bạn vào đây..." ${g?("disabled value=\""+esc(g.chosen||"")+"\""):""} style="flex:1;min-width:170px"><button class="btn teal lp-chk" data-q="${qi}" ${g?"disabled":""}>Kiểm tra</button>${g?`<span style="font-weight:700">${g.ok?"✅ Đúng":"❌ Chưa đúng"}</span>`:""}</div><div class="why ${g?"show":""}" id="lpWhy${qi}">${g?lpWhyText(q,g):""}</div></div>`;
  return `<div style="margin-top:12px"><p><span class="badge gold">Dạng: ${tn}</span> <b>Câu ${qi+1}.</b> ${esc(q.q)}</p>${(q.o||[]).map((o,oi)=>`<button class="opt lp-opt ${g?(oi===q.a?"right":(oi===g.chosen?"wrong":"")):""}" data-q="${qi}" data-i="${oi}" ${g?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why ${g?"show":""}" id="lpWhy${qi}">${g?lpWhyText(q,g):""}</div></div>`; }

let vidSel=null;
function vidPlayerHTML(v,vi){ return `<div style="border:1.5px solid var(--teal2);border-radius:12px;padding:12px;background:#FFFCF6"><div class="row"><span class="badge">${esc(v.level)}</span>${v.skill?` <span class="badge gold">${esc(v.skill)}</span>`:""}<b>${esc(v.title)}</b></div><div class="mut" style="margin-top:3px">Kênh: ${esc(v.channel)}</div><div style="margin-top:8px">${obsIframeHTML(v)}</div><p class="mut" style="margin-top:8px">${esc(v.note)}</p><p class="mut" style="margin-top:4px">Bấm nút phát ngay trên khung video để xem - video phát trong trang này, không cần đi đâu khác. Xem xong, hãy nói nhại theo một đoạn ngắn trong video và ghi lại những cụm câu hay để dùng khi giao tiếp.</p></div>`; }
function selectVideo(vi){ vidSel=vi; setProg("video","V"+vi,{watched:true}); const box=$("#vidPlayerBox"); if(box&&VIDEOS[vi]) box.innerHTML=vidPlayerHTML(VIDEOS[vi],vi); $$(".vid-tile").forEach(t=>t.classList.toggle("playing",+t.dataset.vi===vi)); }
function videoCardHTML(v,vi){ return `<div class="tile vid-tile ${vi===vidSel?"playing":""}" data-vi="${vi}"><span class="badge">${esc(v.level)}</span>${v.skill?` <span class="badge gold">${esc(v.skill)}</span>`:""} ${vi===vidSel?'<span class="badge done">▶ Đang phát ở khung bên cạnh</span>':""}<div class="t">${esc(v.title)}</div><div class="mut">Kênh: ${esc(v.channel)}</div><p class="mut" style="margin:6px 0">${esc(v.note)}</p><p class="mut" style="margin:4px 0">Bấm vào thẻ này để phát video ở khung bên cạnh.</p></div>`; }
function viewVideo(app){
  const f=effectiveBand();
  const vis=v=>f==="all"||v.bands.includes(f);
  const groups=[["foundation","Khối nền tảng - từ Band 0 tới A2/B1"],["ielts","Khối IELTS - theo kỹ năng và band mục tiêu"]];
  const visibleIdx=VIDEOS.map((v,vi)=>({v,vi})).filter(({v})=>vis(v)).map(({vi})=>vi);
  if(vidSel===null||!visibleIdx.includes(vidSel)) vidSel=visibleIdx.length?visibleIdx[0]:null;
  app.innerHTML=`<section class="page on"><div class="card"><h2>Video bài học</h2><p class="mut">Mỗi video là một bài học được chọn lọc, xếp từ nền tảng Band 0 tới band cao. Bấm vào một video trong danh sách, khung phát sẽ hiện ngay bên cạnh và phát trong trang - bạn không cần rời khỏi web. Xem video để nghe cách người bản ngữ nói thật; xem xong hãy nói nhại theo một đoạn ngắn và ghi lại những cụm câu hay để dùng khi giao tiếp.</p>
  ${howToHTML("video")}
  ${visibleIdx.length?`<div class="vid-layout" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:flex-start"><div class="vid-player" style="flex:1 1 430px;min-width:270px"><div id="vidPlayerBox">${vidSel!==null?vidPlayerHTML(VIDEOS[vidSel],vidSel):""}</div></div><div class="vid-list" style="flex:1 1 330px;min-width:260px">${groups.map(([g,gt])=>{ const items=VIDEOS.map((v,vi)=>({v,vi})).filter(({v})=>v.g===g&&vis(v)); if(!items.length) return ""; return `<h3 style="margin-top:2px">${gt}</h3><div class="grid" style="margin-top:8px">${items.map(({v,vi})=>videoCardHTML(v,vi)).join("")}</div>`; }).join("")}</div></div>`:`<div class="empty" style="margin-top:12px">Chưa có video nào ở cấp độ ${esc(f)}. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`}
  </div></section>`;
  $$(".vid-tile",app).forEach(t=>t.onclick=e=>{ if(e.target.closest("button")) return; selectVideo(+t.dataset.vi); });
  wireHowTo(app);
}

/* ================= SUY ÂM ĐÍCH TỪ CÂU MẪU ================= */
function derivePhonemeFromText(text,ipa){ if(ipa){ const prio=["tʃ","dʒ","θ","ð","ʃ","ʒ","æ","u:","ʊ","ɔ:","ɑ:","aɪ","aʊ","ɔɪ","eɪ","əʊ","ŋ","r","w","f","v","s","z","ɪ","i:","e","ʌ","ɒ","ɜ:","ə"]; for(const s of prio){ if(String(ipa).includes(s)) return s; } }
  const rawSyms=["tʃ","dʒ","θ","ð","ʃ","ʒ","æ","u:","ʊ","ɔ:","ɑ:","aɪ","aʊ","ɔɪ","eɪ","əʊ","ɪ","ʌ","ɒ","ɜ:","i:","ə","ŋ"]; const rawT=String(text||""); for(const s of rawSyms){ if(rawT.includes(s)) return s; }
  const words=String(text||"").toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
  for(const w of words){ const t=targetSoundOf(w); if(t&&PHONEMES.some(p=>p.s===t)) return t; }
  for(const w of words){ if(w.startsWith("th")) return "θ"; if(w.startsWith("sh")) return "ʃ"; if(w.startsWith("ch")) return "tʃ"; if(w.startsWith("wh")) return "w"; if(w.endsWith("ng")&&w.length>3) return "ŋ"; }
  return null; }
function lineTargetPhoneme(l){ if(!l) return null; let out=derivePhonemeFromText(l.en,l.ipa); if(!out&&l.link) out=derivePhonemeFromText(l.link); if(!out&&l.chunks&&l.chunks.length){ for(const ch of l.chunks){ out=derivePhonemeFromText(ch); if(out) break; } } return out; }

function pbCheckVoice(o){ const btn=o.btn; if(!btn) return; if(btn._pbOn){ pbStopBtn(btn); return; } if(PB_ACTIVE&&PB_ACTIVE.btn!==btn) pbStopBtn(PB_ACTIVE.btn);
  const st={btn,o,label:btn.textContent,chunks:[],rec:null,stream:null,sr:null,judged:false}; btn._pb=st; btn._pbOn=true; PB_ACTIVE=st; btn.textContent="⏹ Dừng và xem kết quả";

  if(SR_OK()){ try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; st.sr=rec;
    rec.onresult=e=>{ const said=e.results[0][0].transcript; st.judged=true; const g=gradeWords(o.text,said); pbGenericJudge(o,g); if(o.judge) o.judge(said,g); setTimeout(()=>pbStopBtn(btn),600); };
    rec.onerror=()=>{ if(!st.judged&&o.resEl){ o.resEl.innerHTML="Chưa nghe rõ - hãy bấm lại nút ghi âm và đọc to, rõ hơn."; if(o.typeBox!==false) pbTypeIn(o); } };

  else if(o.typeBox!==false) pbTypeIn(o);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){ navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ if(!btn._pbOn){ stream.getTracks().forEach(t=>t.stop()); return; } st.stream=stream; try{ const mr=new MediaRecorder(stream); st.rec=mr; mr.ondataavailable=e=>{ if(e.data&&e.data.size) st.chunks.push(e.data); }; mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(st.chunks.length){ const rawMime=mr.mimeType||"audio/webm"; const blob=new Blob(st.chunks,{type:String(rawMime).split(";")[0]}); if(o.playEl){ const url=URL.createObjectURL(blob); let box=o.playEl.querySelector(".pb-playbox"); if(!box){ box=document.createElement("div"); box.className="pb-playbox"; o.playEl.appendChild(box); } box.innerHTML=`<p class="mut" style="margin-top:6px">🎧 Bản ghi giọng của bạn - nghe lại và so với giọng mẫu:</p><audio controls src="${url}" style="width:100%"></audio>`; } pronounceAICheck(o,blob,rawMime); } }; mr.start(); }catch(e){} }).catch(()=>{ if(o.playEl&&!o.playEl.querySelector(".pb-playbox")){ const box=document.createElement("div"); box.className="pb-playbox"; box.innerHTML=`<p class="mut" style="margin-top:6px">Không ghi âm được vì chưa được cấp quyền micro. Bạn vẫn check được bằng nhận diện giọng nói hoặc gõ lại câu.</p>`; o.playEl.appendChild(box); } }); }

function pbNormMime(t){ let m=String(t||"").split(";")[0].trim().toLowerCase(); if(m==="audio/x-wav"||m==="audio/wave"||m==="audio/vnd.wave") m="audio/wav"; else if(m==="audio/mp3") m="audio/mpeg"; else if(m==="audio/m4a"||m==="audio/x-m4a"||m==="audio/aac") m="audio/mp4"; if(["audio/webm","audio/ogg","audio/mp4","audio/mpeg","audio/wav"].indexOf(m)>=0) return m; return "audio/webm"; }
function pbBlobToB64(blob){ return new Promise((res,rej)=>{ try{ const fr=new FileReader(); fr.onload=()=>{ const s=String(fr.result||""); const i=s.indexOf(","); res(i>=0?s.slice(i+1):s); }; fr.onerror=()=>rej(new Error("read")); fr.readAsDataURL(blob); }catch(e){ rej(e); } }); }

async function pronounceAICheck(o,blob,rawMime){ const ref=String((o&&o.text)||"").trim(); if(!ref||!blob) return; const box=pbAIBox(o); if(!box) return;
  if(!IS_REAL||!sbUser){ box.innerHTML=`<div class="pb-ai-card">🔐 <b>Đăng nhập để AI nghe và chấm phát âm chi tiết</b> - AI sẽ chỉ ra từng từ bạn đọc sai hoặc thiếu, kèm âm cần luyện lại. Phần check bằng trình duyệt ở trên vẫn chạy bình thường.</div>`; return; }
  box.innerHTML=`<div class="pb-ai-card">🤖 AI đang nghe và chấm phát âm của bạn...</div>`;
  try{
    if(!sb) throw new Error("no client");

  const itemHTML=e=>`<div class="tile" style="cursor:default"><span class="badge">${esc(ERR_SEC_NAME[e.sec]||e.sec)}</span> ${e.done?'<span class="badge done">Đã sửa xong</span>':`<span class="badge gold">Đã sửa đúng ${e.streak||0}/2 lần</span>`}<div class="t" style="font-size:15.5px">${esc(e.q)}</div><div class="mut">Đáp án đúng: <b>${esc(errAnswerText(e))}</b>${e.why?(" - "+esc(e.why)):""}</div><div class="mut">Sai ${e.count||1} lần · Lần gần nhất: ${esc(e.date)}${e.done?"":(" · Đến hạn ôn: "+esc(e.due))}</div>${!e.done?`<div class="row" style="margin-top:7px"><button class="btn teal err-practice" data-id="${esc(e.id)}">${errPracticeId===e.id?"Đang luyện...":"Luyện lại câu này"}</button></div><div class="err-practice-box" data-id="${esc(e.id)}"></div>`:""}</div>`;
  const hardHTML=h=>{ const hk=encodeURIComponent(h.kind+":"+h.key); const isDue=h.due&&h.due<=today(); return `<div class="tile" style="cursor:default"><span class="badge">${esc(HARD_KIND_LABEL[h.kind]||"Mục khó")}</span> <span class="badge ${isDue?"gold":""}">${isDue?"Đến hạn ôn":"Đã ôn đúng "+(h.streak||0)+"/2 lần liên tiếp"}</span><div class="t" style="font-size:15.5px">${esc(h.label||"")}</div><div class="mut">${h.due?("Đến hạn ôn: "+esc(h.due)):""} · Đánh dấu ngày: ${esc(h.added||"")}</div><div class="row" style="margin-top:7px"><button class="btn teal hard-practice" data-hk="${hk}">${hardPracticeKey===(h.kind+":"+h.key)?"Đang luyện...":"Luyện mục này"}</button><button class="btn light hard-remove" data-hk="${hk}">Bỏ đánh dấu khó</button></div><div class="hard-practice-box" data-hk="${hk}"></div></div>`; };
  app.innerHTML=`<section class="page on"><div class="card"><h2>📕 Sổ lỗi sai và hàng đợi ôn giãn cách</h2><p class="mut">Mọi câu trả lời sai ở mọi phần học đều tự lưu vào đây. Luyện lại đúng 2 lần liên tiếp là lỗi đó coi như đã sửa xong. Lỗi chưa sửa sẽ quay lại theo nhịp ôn giãn cách, giống thẻ từ vựng.</p><p class="mut" style="margin-top:4px">Các mục bạn tự bấm <b>Đánh dấu khó</b> (thẻ từ, trạm ngữ pháp, từng câu hỏi) cũng vào chung hàng đợi này: ôn theo các mốc giãn dần 1-3-7-14-30 ngày, đúng 2 lần liên tiếp ở các lần ôn cách quãng là xong hẳn.</p>
  ${howToHTML("errors")}
  <h3 style="margin-top:14px">Lỗi sai đến hạn ôn hôm nay (${due.length})</h3>${due.length?`<div class="grid">${due.map(itemHTML).join("")}</div>`:`<p class="mut">Không có lỗi nào đến hạn hôm nay. Tốt lắm!</p>`}
  <h3 style="margin-top:16px">Lỗi sai chưa đến hạn (${upcoming.length})</h3>${upcoming.length?`<div class="grid">${upcoming.map(itemHTML).join("")}</div>`:`<p class="mut">Chưa có lỗi nào đang chờ ôn.</p>`}
  <h3 style="margin-top:16px">Lỗi sai đã sửa xong (${done.length})</h3>${done.length?`<div class="grid">${done.map(itemHTML).join("")}</div>`:`<p class="mut">Chưa có lỗi nào được sửa xong. Cứ luyện lại đúng 2 lần liên tiếp là xong một lỗi.</p>`}
  <h3 style="margin-top:18px">★ Mục khó đến hạn ôn (${dueH.length})</h3>${dueH.length?`<div class="grid">${dueH.map(hardHTML).join("")}</div>`:`<p class="mut">Không có mục khó nào đến hạn hôm nay. Khi học, hãy bấm nút "Đánh dấu khó" ở thẻ từ, trạm ngữ pháp hoặc câu hỏi nào bạn thấy khó - web sẽ nhắc bạn ôn lại đúng lúc.</p>`}
  <h3 style="margin-top:16px">Tất cả mục khó đang theo dõi (${allH.length})</h3>${allH.length?`<div class="grid">${allH.map(hardHTML).join("")}</div>`:`<p class="mut">Bạn chưa đánh dấu khó mục nào.</p>`}
  </div></section>`;
  wireHowTo(app);
  $$(".err-practice",app).forEach(b=>b.onclick=()=>{ errPracticeId=b.dataset.id; renderErrPractice(app); });
  if(errPracticeId) renderErrPractice(app);
  $$(".hard-practice",app).forEach(b=>b.onclick=()=>{ hardPracticeKey=decodeURIComponent(b.dataset.hk); hardGramAns={}; renderHardPractice(app); });
  $$(".hard-remove",app).forEach(b=>b.onclick=()=>{ const k=decodeURIComponent(b.dataset.hk); delete hardMap()[k]; syncHard(); saveLocal(); if(hardPracticeKey===k) hardPracticeKey=null; toast("Đã bỏ đánh dấu khó."); render(); });
  if(hardPracticeKey) renderHardPractice(app);
}
function renderHardPractice(app){ const m=hardMap(); const h=m[hardPracticeKey]; const box=$(`.hard-practice-box[data-hk="${CSS.escape(encodeURIComponent(hardPracticeKey||""))}"]`,app); if(!h||!box) return;
  const judge=ok=>{ awardXp(1); hardJudge(h,ok); toast(ok?(h.done?"Đã xong hẳn mục khó này - đúng 2 lần liên tiếp ở các lần ôn cách quãng!":"Đúng rồi! Mục này sẽ quay lại sau ít ngày - đúng thêm 1 lần nữa ở lần ôn sau là xong hẳn."):"Chưa đúng - mục khó này sẽ quay lại vào ngày mai."); hardPracticeKey=null; render(); };
  if(h.kind==="mc"&&h.data&&h.data.o){ box.innerHTML=`<div style="margin-top:8px"><p><b>Trả lời lại:</b> ${esc(h.data.q||"")}</p>${h.data.o.map((o,oi)=>`<button class="opt hp-opt" data-i="${oi}">${esc(o)}</button>`).join("")}<div class="why" id="hpWhy"></div></div>`;
    $$(".hp-opt",box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; const ok=i===h.data.a; $$(".hp-opt",box).forEach((x,xi)=>{ if(xi===h.data.a)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#hpWhy",box); if(w){ w.innerHTML=(ok?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(h.data.why||""); w.classList.add("show"); } setTimeout(()=>judge(ok),700); });
  } else if(h.kind==="type"&&h.data){ box.innerHTML=`<div style="margin-top:8px"><p><b>${esc(h.data.q||"")}</b></p><textarea class="hp-inp" rows="2" placeholder="Gõ đáp án của bạn vào đây..."></textarea><div class="row" style="margin-top:6px"><button class="btn teal hp-chk">Kiểm tra</button><span class="hp-res" style="font-weight:600"></span></div></div>`;
    $(".hp-chk",box).onclick=()=>{ const inp=$(".hp-inp",box); const typed=inp?inp.value:""; const ans=String(h.data.a||""); const long=ans.trim().split(/\s+/).length>6; let ok; if(long){ const g=gradeDictation(ans,typed); ok=g.total>0&&g.ok===g.total; } else ok=softAnsMatch(typed,ans); const r=$(".hp-res",box); if(r) r.textContent=ok?"Đúng rồi!":("Chưa đúng - đáp án đúng: "+ans); setTimeout(()=>judge(ok),800); };
  } else if(h.kind==="vocab"){ const c=hardVocabCard(h); box.innerHTML=`<div style="margin-top:8px"><p style="font-size:19px"><b>${esc(c.w||"")}</b> <span class="mut">${esc(c.ipa||"")}</span></p><button class="btn light hp-flip">Xem nghĩa</button><div class="hp-mean hidden" style="margin-top:6px"><p><b>Nghĩa:</b> ${esc(c.vi||"")}</p>${c.col?`<p><b>Collocation:</b> ${esc(c.col)}</p>`:""}${c.ex?`<p><b>Ví dụ:</b> ${esc(c.ex)}</p>`:""}</div><div class="row" style="margin-top:8px"><button class="btn light hp-no">Chưa thuộc</button><button class="btn teal hp-yes">Đã thuộc</button></div></div>`;
    $(".hp-flip",box).onclick=()=>{ const mn=$(".hp-mean",box); if(mn) mn.classList.toggle("hidden"); };
    $(".hp-yes",box).onclick=()=>judge(true); $(".hp-no",box).onclick=()=>judge(false);
  } else if(h.kind==="grammar"){ const g=CONTENT.grammar[h.data&&h.data.g]; if(!g){ box.innerHTML=`<p class="mut" style="margin-top:8px">Trạm ngữ pháp này không còn tồn tại.</p>`; return; }
    box.innerHTML=`<div style="margin-top:8px"><p><b>Ôn lại trạm: ${esc(g.name)}</b> - trả lời lại các câu luyện tập, đạt từ 80% là tính một lần ôn đúng.</p>${g.quiz.map((q,qi)=>`<div style="margin-top:8px"><p><b>Câu ${qi+1}.</b> ${esc(q.q)}</p>${q.o.map((o,oi)=>`<button class="opt hp-g-opt" data-q="${qi}" data-i="${oi}">${esc(o)}</button>`).join("")}<div class="why" id="hpGWhy${qi}"></div></div>`).join("")}<div class="row" style="margin-top:8px"><button class="btn teal hp-g-submit">Chấm bài ôn</button><span class="hp-g-res" style="font-weight:700"></span></div></div>`;
    $$(".hp-g-opt",box).forEach(b=>b.onclick=()=>{ const q=+b.dataset.q; hardGramAns[q]=+b.dataset.i; $$(".hp-g-opt",box).filter(x=>+x.dataset.q===q).forEach(x=>{ x.style.borderColor=""; x.style.background=""; }); b.style.borderColor="var(--teal)"; b.style.background="#FFF3D6"; });
    $(".hp-g-submit",box).onclick=()=>{ if(Object.keys(hardGramAns).length<g.quiz.length){ toast("Hãy trả lời đủ "+g.quiz.length+" câu."); return; } let sc=0; g.quiz.forEach((q,qi)=>{ const ch=hardGramAns[qi]; if(ch===q.a) sc++; $$(".hp-g-opt",box).filter(x=>+x.dataset.q===qi).forEach(x=>{ const i=+x.dataset.i; if(i===q.a)x.classList.add("right"); else if(i===ch)x.classList.add("wrong"); x.disabled=true; }); const w=$("#hpGWhy"+qi,box); if(w){ w.innerHTML=(ch===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why||""); w.classList.add("show"); } }); const ok=sc>=Math.ceil(g.quiz.length*0.8); const r=$(".hp-g-res",box); if(r) r.textContent=`Kết quả ôn: ${sc}/${g.quiz.length} - ${ok?"đạt!":"chưa đạt 80%"}`; setTimeout(()=>judge(ok),1000); };
  } else { box.innerHTML=`<p class="mut" style="margin-top:8px">Dạng mục khó này chưa có bài ôn riêng - hãy quay lại phần học tương ứng để luyện.</p>`; }
}
function renderErrPractice(app){ const e=(state.errors||[]).find(x=>x.id===errPracticeId); const box=$(`.err-practice-box[data-id="${CSS.escape(errPracticeId||"")}"]`,app); if(!e||!box) return;
  const judge=ok=>{ awardXp(1); if(ok){ e.streak=(e.streak||0)+1; if(e.streak>=2){ e.done=true; e.due=""; } else { e.due=addDays(today(),1); } } else { e.streak=0; e.due=addDays(today(),1); e.count=(e.count||1)+1; e.date=today(); }
    syncErrors(); saveLocal(); toast(ok?(e.done?"Đã sửa xong lỗi này!":"Đúng rồi! Sửa đúng thêm 1 lần nữa (vào ngày mai) là xong."):"Chưa đúng - lỗi này sẽ quay lại vào ngày mai."); errPracticeId=null; render(); };
  if(e.kind==="mc"&&e.o){ box.innerHTML=`<div style="margin-top:8px"><p><b>Trả lời lại:</b></p>${e.o.map((o,oi)=>`<button class="opt err-opt" data-i="${oi}">${esc(o)}</button>`).join("")}<div class="why" id="errWhy"></div></div>`;
    $$(".err-opt",box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; const ok=i===e.a; $$(".err-opt",box).forEach((x,xi)=>{ if(xi===e.a)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#errWhy",box); if(w){ w.innerHTML=(ok?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(e.why||""); w.classList.add("show"); } setTimeout(()=>judge(ok),700); });
  } else { box.innerHTML=`<div style="margin-top:8px"><p><b>Gõ lại đáp án đúng:</b></p><textarea class="err-inp" rows="2" placeholder="Gõ lại câu đúng vào đây..."></textarea><div class="row" style="margin-top:6px"><button class="btn teal err-chk">Kiểm tra</button><span class="err-res" style="font-weight:600"></span></div></div>`;
    $(".err-chk",box).onclick=()=>{ const inp=$(".err-inp",box); const g=gradeDictation(String(e.a),inp?inp.value:""); const ok=g.ok===g.total&&g.total>0; const r=$(".err-res",box); if(r) r.textContent=ok?"Đúng hết!":("Đúng "+g.ok+"/"+g.total+" từ - đáp án đúng: "+e.a); setTimeout(()=>judge(ok),700); }; }
}

/* ================= THI THỬ ĐÚNG FORMAT IELTS (Giai đoạn 4) =================
   Mốc thi thử ở cuối các chặng 4.5, 5.5, 6.5, 7.5+: lắp từ kho hiện có theo đúng format thi thật
   (Nghe khoảng 40 câu/30 phút, Đọc 3 bài/60 phút, Viết Task 1 + Task 2/60 phút, Nói Part 1-2-3/11-14 phút).
   Đồng hồ là giờ tham khảo - hết giờ vẫn làm tiếp được. Kết quả: điểm thô + band ước lượng cho Nghe/Đọc,
   khung 4 tiêu chí tự chấm cho Viết/Nói, màn xem lại chi tiết từng câu cho Nghe/Đọc. */
const MOCK_BANDS=["Band 4.5","Band 5.5","Band 6.5","Band 7.5+"];
const MOCK_MIN={listening:30,reading:60,writing:60,speaking:14};
const MOCK_PARTS=[["listening","Nghe (Listening)"],["reading","Đọc (Reading)"],["writing","Viết (Writing)"],["speaking","Nói (Speaking)"]];
let mockState=null, mockTimerId=null;
function mockClearTimer(){ if(mockTimerId){ clearInterval(mockTimerId); mockTimerId=null; } }
function mockStartTimer(){ mockClearTimer(); mockTimerId=setInterval(()=>{ if(!mockState||mockState.part==="result"){ mockClearTimer(); return; } mockState.left=Math.max(0,(mockState.left||0)-1); const el=$("#mockTimer"); if(el){ el.textContent=mockState.left>0?("⏱ Thời gian tham khảo còn lại: "+Math.floor(mockState.left/60)+":"+String(mockState.left%60).padStart(2,"0")+" - hết giờ vẫn làm tiếp được, đây là thi thử luyện tập"):("⏱ Đã hết giờ tham khảo của phần này - cứ làm tiếp cho xong nhé."); } if(mockState.left<=0) mockClearTimer(); },1000); }
function nearestByBand(arr,band,bandOf){ const t=bandNum(band); return arr.slice().sort((a,b)=>Math.abs(bandNum(bandOf(a)||"")-t)-Math.abs(bandNum(bandOf(b)||"")-t)); }
function buildMock(band){ const tb=bandNum(band);
  let lp=lpItems().filter(it=>!it.band||bandNum(it.band)<=tb+0.5);
  if(lp.reduce((s,it)=>s+(it.questions||[]).length,0)<20) lp=lpItems().slice();
  const LQ=[]; lp.forEach(it=>{ const ii=lpItems().indexOf(it); (it.questions||[]).forEach(q=>LQ.push({src:"lp",item:ii,section:it.section,type:q.type,q:q.q,o:q.o,a:q.a,answer:q.answer,why:q.why})); });
  if(LQ.length<40){ const singles=CONTENT.listening.filter(l=>{ const b=listeningBand(l); return !b||bandNum(b)<=tb+0.5; }); for(const l of singles){ if(LQ.length>=40) break; LQ.push({src:"dict",type:"DICT",text:l.text,topic:l.topic,section:l.section}); } }
  const L={qs:LQ.slice(0,40),answers:{}};
  const ps=nearestByBand(CONTENT.reading,band,r=>itemBand(r)).slice(0,3);
  const R={passages:ps.map(r=>CONTENT.reading.indexOf(r)),qs:[],answers:{}};
  ps.forEach(r=>{ r.questions.forEach(q=>R.qs.push({ri:CONTENT.reading.indexOf(r),type:q.type,q:q.q,o:readOpts(q),a:q.a,answer:q.answer,why:q.why})); });
  const w1=nearestByBand(CONTENT.writing.filter(w=>w.type==="Task 1"),band,w=>itemBand(w))[0];
  const w2=nearestByBand(CONTENT.writing.filter(w=>w.type==="Task 2"),band,w=>itemBand(w))[0];
  const W={t1:w1?CONTENT.writing.indexOf(w1):-1,t2:w2?CONTENT.writing.indexOf(w2):-1,text1:"",text2:"",crit:{}};
  const S={scen:{},checks:{},crit:{}};
  ["Part 1","Part 2","Part 3"].forEach(pt=>{ const c=nearestByBand(CONTENT.speaking.filter(s=>s.part===pt),band,s=>itemBand(s))[0]; if(c) S.scen[pt]=CONTENT.speaking.indexOf(c); });
  return {band,part:"listening",left:MOCK_MIN.listening*60,L,R,W,S,res:{},finished:false};
}
function startMock(band){ mockState=buildMock(band); if(curTab!=="roadmap"){ go("roadmap"); } else { render(); } setTimeout(()=>{ const el=$("#mockBox"); if(el) el.scrollIntoView({block:"start"}); },80); }
function exitMock(){ mockClearTimer(); mockState=null; render(); }
function mockGradeText(q,typed){ const ansSrc=q.answer!==undefined?q.answer:(typeof q.a==="string"?q.a:""); return softAnsMatch(typed||"",ansSrc); }
function mockGradeDict(q,typed){ const g=gradeDictation(q.text,typed||""); return {ok:g.total>0&&(g.ok/g.total)>=0.9,g}; }
function mockScoreL(){ const ms=mockState; let sc=0; ms.L.qs.forEach((q,gi)=>{ const a=ms.L.answers[gi]; if(q.type==="DICT"){ if(mockGradeDict(q,a).ok) sc++; } else if(q.type==="COMP"||q.type==="SA"){ if(mockGradeText(q,a)) sc++; } else if(a===q.a) sc++; }); return sc; }
function mockScoreR(){ const ms=mockState; let sc=0; ms.R.qs.forEach((q,gi)=>{ const a=ms.R.answers[gi]; if(q.type==="TCOMP"||q.type==="DLC"||q.type==="SAQ"){ if(mockGradeText(q,a)) sc++; } else if(a===q.a) sc++; }); return sc; }
function mockAnsSrc(q){ return q.answer!==undefined?q.answer:(typeof q.a==="string"?q.a:""); }
function viewMock(app){ const ms=mockState; if(!ms){ render(); return; }
  const order=["listening","reading","writing","speaking"]; const curIdx=ms.part==="result"?4:order.indexOf(ms.part);
  const partName=ms.part==="result"?"Kết quả":(MOCK_PARTS.find(p=>p[0]===ms.part)||[])[1];
  let body="";
  if(ms.part==="listening") body=mockListeningHTML(ms); else if(ms.part==="reading") body=mockReadingHTML(ms); else if(ms.part==="writing") body=mockWritingHTML(ms); else if(ms.part==="speaking") body=mockSpeakingHTML(ms); else body=mockResultHTML(ms);
  app.innerHTML=`<section class="page on"><div id="mockBox"><div class="card" style="border-color:var(--gold)"><div class="row"><b>📝 Thi thử đúng format IELTS - chặng ${esc(ms.band)}</b><span class="grow"></span><button class="btn light" id="mockExit">Thoát thi thử</button></div>
  <div class="mockpart" style="margin-top:8px">${MOCK_PARTS.map(([k,lb])=>{ const my=order.indexOf(k); return `<span class="chip ${ms.part===k?"on":""}" style="cursor:default">${my<curIdx?"✅ ":""}${lb}</span>`; }).join("")}${ms.part==="result"?'<span class="chip on" style="cursor:default">Kết quả</span>':""}</div>
  <div class="lfbar" style="margin-top:10px"><i style="width:${Math.round(curIdx/4*100)}%"></i></div>
  ${ms.part!=="result"?`<p class="mut" id="mockTimer">⏱ Thời gian tham khảo còn lại: ${Math.floor(ms.left/60)}:${String(ms.left%60).padStart(2,"0")} - hết giờ vẫn làm tiếp được, đây là thi thử luyện tập</p><p class="mut" style="margin-top:4px">Phần hiện tại: <b>${esc(partName||"")}</b>. Làm xong phần này, bấm nút nộp ở dưới cùng để sang phần tiếp theo. Đáp án và giải thích sẽ hiện ở trang kết quả.</p>`:`<p class="mut" style="margin-top:4px">Kết quả thi thử luyện tập lắp từ kho nội dung của web theo đúng format IELTS - dùng để đo mức sẵn sàng, không phải điểm thi thật.</p>`}
  </div>${body}</div></section>`;
  $("#mockExit").onclick=()=>exitMock();
  if(ms.part==="listening") wireMockListening(ms); else if(ms.part==="reading") wireMockReading(ms); else if(ms.part==="writing") wireMockWriting(ms); else if(ms.part==="speaking") wireMockSpeaking(ms); else wireMockResult(ms);
  if(ms.part!=="result") mockStartTimer(); else mockClearTimer();

  let action="";
  if(run.finished){ const total=run.passed+run.failed; const pct=total?Math.round(run.passed/total*100):0;
    action=`<div class="card sumcard" style="background:#eafaf1;border-color:#bfe8d2;margin-top:12px"><h3>Tổng kết tình huống</h3><p>Bạn đạt <b>${run.passed}/${total}</b> lượt (${pct}%).</p><p class="mut">Lỗi đã lưu vào Sổ lỗi sai trong buổi này: <b>${run.errCount}</b> lỗi.</p>${run.chunks.length?`<p style="margin-top:6px"><b>Cụm câu người bản ngữ hay dùng mà bạn đã dùng được:</b></p>${run.chunks.map(c=>`<p style="margin:3px 0">• ${esc(c)}</p>`).join("")}`:`<p class="mut">Chưa thu thập được cụm câu nào của người bản ngữ - hãy thử dùng các cụm gợi ý ở từng lượt.</p>`}<div class="row" style="margin-top:10px"><button class="btn teal" id="cbAgain">Làm lại tình huống</button><button class="btn light" id="cbList">Về danh sách</button><button class="btn light" onclick="go('errors')">Xem Sổ lỗi sai</button></div></div>`;
  } else if(cur&&cur.from==="partner"){ action=`<div class="row" style="margin-top:10px"><button class="btn teal" id="cbNext">Đã nghe - tiếp tục</button></div>`; }
  else if(cur){ action=`<div style="margin-top:10px"><label class="mut">Câu trả lời của bạn ${SR_OK()?"(gõ vào ô, hoặc dùng nút Ghi âm và check giọng ở thanh luyện tập bên dưới)":"(gõ vào ô dưới)"}:</label><textarea id="cbInp" rows="2" placeholder="Trả lời bằng tiếng Anh..."></textarea><div class="row" style="margin-top:7px"><button class="btn teal" id="cbSend">Gửi câu trả lời</button><span class="mut" id="cbHint">${cur.hint?esc(cur.hint):""}</span></div><div class="row pb-bar" style="margin-top:8px"><button class="btn light" id="cbPlay" data-act="play">🔊 Nghe mẫu</button><button class="btn light" id="cbSlow" data-act="slow">🐢 Nghe chậm</button><button class="btn light" id="cbMirror" data-act="mirror">📹 Gương khẩu hình</button><button class="btn teal" id="cbRec" data-act="rec">🎤 Ghi âm và check giọng</button><span class="mut" id="cbPbRes"></span></div><div id="cbExtra" style="margin-top:6px"></div></div>`; }
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="cbBack">← Danh sách tình huống</button>${combatBand(sc)?`<span class="badge">${esc(combatBand(sc))}</span>`:""}<b>${esc(sc.title)}</b><span class="mut">Lượt ${Math.min(run.ti+1,turns.length)}/${turns.length}</span></div>
  <p class="mut" style="margin-top:8px">${esc(sc.setting||"")}</p>${sc.goal?`<p style="margin-top:4px"><b>Mục tiêu của bạn:</b> ${esc(sc.goal)}</p>`:""}
  <div id="cbObs" style="margin:10px 0"></div>
  <div style="margin-top:10px">${transcript}</div>${action}</div></section>`;
  $("#cbBack").onclick=()=>{ combatSel=null; combatRun=null; render(); };
  $$(".cb-speak",app).forEach(b=>b.onclick=()=>{ const t=turns[+b.dataset.ti]; if(t) speak(t.text||"",0.95); });
  if(cur&&cur.from==="partner"&&!run.finished&&run.spokeTurn!==run.ti){ run.spokeTurn=run.ti; setTimeout(()=>speak(cur.text||"",0.95),250); }
  const nx=$("#cbNext"); if(nx) nx.onclick=()=>{ run.ti++; if(run.ti>=turns.length) finishCombat(sc,run); render(); };
  const send=()=>{ const inp=$("#cbInp"); const said=(inp?inp.value:"").trim(); if(!said){ toast("Hãy nhập hoặc nói câu trả lời của bạn."); return; } judgeCombatTurn(sc,run,said); };
  const sb2=$("#cbSend"); if(sb2) sb2.onclick=send;
  const cObs=$("#cbObs"); if(cObs){ const syms=sc.turns.filter(t=>t.from==="learner").map(t=>derivePhonemeFromText(t.expect||"")).filter(Boolean); cObs.innerHTML=obsStripHTML(syms[0]||null,"sp"); wireObsVideos(cObs); }
  if(cur&&cur.from==="learner"){ const cp=$("#cbPlay"); if(cp) cp.onclick=()=>{ if(cur.expect) speak(cur.expect,0.95); else toast("Lượt này không có câu mẫu sẵn - hãy tự nói theo gợi ý ở trên."); };
    const cs=$("#cbSlow"); if(cs) cs.onclick=()=>{ if(cur.expect) speak(cur.expect,0.55); else toast("Lượt này không có câu mẫu sẵn - hãy tự nói theo gợi ý ở trên."); };
    const cm=$("#cbMirror"); if(cm) cm.onclick=()=>{ const slot=$("#cbExtra"); if(slot) mirrorToggle(slot,derivePhonemeFromText(cur.expect||"")); };
    const cr=$("#cbRec"); if(cr) cr.onclick=()=>pbCheckVoice({text:cur.expect||(cur.keywords||[]).join(" "),btn:cr,resEl:$("#cbPbRes"),playEl:$("#cbExtra"),typeBox:false,judge:said=>{ const inp=$("#cbInp"); if(inp) inp.value=said; judgeCombatTurn(sc,run,said); }}); }
  const mic=$("#cbMic"); if(mic) mic.onclick=()=>{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; mic.textContent="🎙️ Đang nghe..."; rec.onresult=e=>{ const inp=$("#cbInp"); if(inp) inp.value=e.results[0][0].transcript; mic.textContent="🎤 Nói câu trả lời"; }; rec.onerror=()=>{ mic.textContent="🎤 Nói câu trả lời"; }; try{ rec.start(); }catch(e){} };
  const ag=$("#cbAgain"); if(ag) ag.onclick=()=>{ combatRun={ti:0,passed:0,failed:0,answers:{},verdicts:{},chunks:[],errCount:0,finished:false,spokeTurn:-1}; render(); };
  const bl=$("#cbList"); if(bl) bl.onclick=()=>{ combatSel=null; combatRun=null; render(); };
}
function judgeCombatTurn(sc,run,said){ const t=sc.turns[run.ti]; let ok=false;
  if(t.keywords&&t.keywords.length){ const low=" "+said.toLowerCase()+" "; const hit=t.keywords.filter(k=>low.includes(k.toLowerCase())).length; ok=hit>=Math.ceil(t.keywords.length*0.6); }
  else if(t.expect){ ok=gradeWords(t.expect,said).ok/Math.max(1,gradeWords(t.expect,said).total)>=0.7; }
  else ok=said.trim().length>0;
  run.answers[run.ti]=said; run.verdicts[run.ti]=ok;
  if(ok){ run.passed++; (t.chunks||[]).concat(sc.chunks||[]).forEach(c=>{ if(!run.chunks.includes(c)) run.chunks.push(c); }); }
  else { run.failed++; run.errCount++; logError({sec:"combat",kind:"type",q:"Thực chiến \""+sc.title+"\": "+(t.prompt||"Lượt của bạn"),a:t.expect||(t.keywords||[]).join(", "),why:t.tip||"Xem cụm câu gợi ý trong tình huống và thử lại lượt này."}); }
  run.ti++; if(run.ti>=sc.turns.length) finishCombat(sc,run); render(); }
function finishCombat(sc,run){ run.finished=true; const total=run.passed+run.failed; const prev=getProg("combat","C"+combatSel)||{}; setProg("combat","C"+combatSel,{best:Math.max(prev.best||0,run.passed),total}); if(prev.best===undefined&&prev.total===undefined) xpFirst("lesson:combat:"+combatSel,10); else awardXp(5); }

/* ================= GIA SƯ AI ================= */
const TUTOR_SOON="Gia sư AI sắp ra mắt - tính năng đang được hoàn thiện. Trong lúc chờ, bạn cứ học theo lộ trình ở trang chủ nhé, phần nào chưa hiểu hãy bấm vào các từ có gạch chấm để xem giải thích dễ hiểu.";
let tutorState={mode:"chat",msgs:[],busy:false};
const TUTOR_MODES=[["explain","Giải thích từ/câu này"],["fix","Sửa câu tiếng Anh của tôi"],["writing","Nhận xét bài Writing của tôi"],["grammar","Hỏi về ngữ pháp"]];
function latestWriting(){ let found=null; CONTENT.writing.forEach((w,i)=>{ const p=getProg("writing","W"+i); if(p&&p.text&&p.text.trim()) found={i,title:w.title,text:p.text}; }); return found; }
function tutorCtxText(){ if(tutorState.mode==="writing"){ const lw=latestWriting(); return lw?("Bài Writing sẽ gửi kèm: \""+lw.title+"\" ("+lw.text.trim().split(/\s+/).length+" từ). Bạn chỉ cần ghi thêm yêu cầu nếu muốn, hoặc bấm Gửi luôn."):"Bạn chưa lưu bài Writing nào. Hãy viết một bài ở phân hệ Writing trước, hoặc dán bài viết của bạn vào ô hỏi ở dưới."; } if(tutorState.mode==="explain") return "Dán từ hoặc câu tiếng Anh bạn chưa hiểu vào ô hỏi, gia sư sẽ giải thích bằng tiếng Việt thật dễ hiểu."; if(tutorState.mode==="fix") return "Dán câu tiếng Anh bạn tự viết vào ô hỏi, gia sư sẽ sửa và giải thích vì sao."; if(tutorState.mode==="grammar") return "Gõ câu hỏi ngữ pháp của bạn vào ô hỏi, ví dụ: khi nào dùng thì hiện tại hoàn thành?"; return ""; }
function viewTutor(app){
  app.innerHTML=`<section class="page on"><div class="card"><h2>🤖 Gia sư AI</h2>
  <p class="mut">Gia sư AI trả lời câu hỏi học tiếng Anh của bạn: giải thích từ và câu, sửa câu bạn viết, nhận xét bài Writing, giải thích ngữ pháp. Chọn một việc ở dưới rồi gõ câu hỏi của bạn.</p>
  <div class="row" style="margin-top:10px">${TUTOR_MODES.map(([m,lb])=>`<button class="chip tutor-mode ${tutorState.mode===m?"on":""}" data-m="${m}" style="font-size:14px;padding:9px 13px">${lb}</button>`).join("")}</div>
  <p class="mut" id="tutorCtx" style="margin-top:8px">${esc(tutorCtxText())}</p>
  <div id="tutorLog" style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px">
    ${tutorState.msgs.length?tutorState.msgs.map(m=>`<div style="align-self:${m.who==="me"?"flex-end":"flex-start"};max-width:88%;background:${m.who==="me"?"#FFF3D6":"#FFFCF6"};border:1px solid var(--line);border-radius:12px;padding:9px 12px;white-space:pre-wrap">${esc(m.text)}</div>`).join(""):`<div style="align-self:flex-start;max-width:88%;background:#FFFCF6;border:1px solid var(--line);border-radius:12px;padding:9px 12px">Chào bạn! Mình là gia sư AI của web. Bạn muốn mình giúp gì hôm nay?</div>`}
  </div>
  <div class="row" style="margin-top:10px;align-items:flex-end"><textarea id="tutorInp" rows="2" placeholder="Gõ câu hỏi của bạn vào đây..." style="flex:1"></textarea><button class="btn" id="tutorSend" ${tutorState.busy?"disabled":""}>${tutorState.busy?"Đang gửi...":"Gửi cho gia sư"}</button></div>
  </div></section>`;
  $$(".tutor-mode",app).forEach(b=>b.onclick=()=>{ tutorState.mode=b.dataset.m; render(); });
  $("#tutorSend").onclick=sendTutor;
  const inp=$("#tutorInp"); if(inp) inp.onkeydown=e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) sendTutor(); };
  const log=$("#tutorLog"); if(log) log.scrollTop=log.scrollHeight;
}
async function sendTutor(){ const inp=$("#tutorInp"); const msg=(inp?inp.value:"").trim(); if(tutorState.busy) return;
  const mode=tutorState.mode; const lw=mode==="writing"?latestWriting():null;
  if(!msg&&!lw){ toast("Hãy gõ câu hỏi của bạn trước nhé."); return; }
  const shown=msg||("(Nhận xét bài Writing đã lưu của tôi)");
  tutorState.msgs.push({who:"me",text:(mode==="writing"&&lw)?(shown+"\n[Đã gửi kèm bài: "+lw.title+"]"):shown});
  const context=lw?lw.text:undefined;
  if(!IS_REAL||!sbUser){ tutorState.msgs.push({who:"ai",text:TUTOR_SOON}); render(); return; }
  tutorState.busy=true; tutorState.msgs.push({who:"ai",text:"Gia sư đang suy nghĩ..."}); render();
  const waitIdx=tutorState.msgs.length-1;
  try{
    const sess=await sb.auth.getSession(); const token=sess&&sess.data&&sess.data.session?sess.data.session.access_token:null;
    if(!token) throw new Error("no session");
    const res=await fetch(window.SUPABASE_URL+"/functions/v1/ai-tutor",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"apikey":window.SUPABASE_ANON_KEY},body:JSON.stringify({message:msg,mode,context})});
    if(!res.ok) throw new Error("bad status");
    const data=await res.json(); const reply=data&&(data.reply||data.message||data.text);
    if(!reply) throw new Error("empty reply");
    tutorState.msgs[waitIdx]={who:"ai",text:String(reply)};
  }catch(e){ tutorState.msgs[waitIdx]={who:"ai",text:TUTOR_SOON}; }
  tutorState.busy=false; render();
}

/* ================= TỪ ĐIỂN ================= */
$("#dictFab").onclick=()=>{ $("#dictPanel").classList.toggle("open"); $("#dictInput").focus(); };
$("#dictClose").onclick=()=>$("#dictPanel").classList.remove("open");
$("#dictInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#dictGo").click(); });
$("#dictGo").onclick=async()=>{
  const w=$("#dictInput").value.trim().toLowerCase(); const box=$("#dictResult");
  if(!w){ box.innerHTML=""; return; }
  box.innerHTML="<p class='mut'>Đang tra...</p>";
  try{
    const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
    if(!res.ok) throw new Error("nf");
    const data=await res.json(); const e0=data[0];
    const phon=e0.phonetic||((e0.phonetics||[]).find(x=>x.text)||{}).text||"";
    const meanings=(e0.meanings||[]).slice(0,2).map(m=>`<p style="margin:6px 0"><i>${esc(m.partOfSpeech)}</i>: ${esc((m.definitions||[]).slice(0,2).map(d=>d.definition).join("; "))}</p>`).join("");
    const ex=((e0.meanings||[]).flatMap(m=>m.definitions||[]).find(d=>d.example)||{}).example||"";
    const defShort=(((e0.meanings||[])[0]||{}).definitions||[])[0]?.definition||"";
    box.innerHTML=`<div class="word" style="font-size:26px">${esc(e0.word)}</div><div class="ipa">${esc(phon)}</div>${meanings}${ex?`<p class="mut">Ví dụ: ${esc(ex)}</p>`:""}<div class="row" style="margin-top:10px"><button class="btn teal" id="dictSave">Lưu vào bộ ôn tập</button><button class="btn light" id="dictSpeak">🔊 Nghe</button></div>`;
    $("#dictSpeak").onclick=()=>speak(e0.word,0.9);
    $("#dictSave").onclick=()=>{ state.savedWords[e0.word.toLowerCase()]={w:e0.word,ipa:phon,vi:"Nghĩa (Anh-Anh): "+defShort,col:"",ex:ex,exv:"Từ đã tra từ từ điển"}; saveLocal(); pushWord(e0.word.toLowerCase()); toast("Đã lưu từ '"+e0.word+"' vào bộ Từ đã tra."); };
  }catch(err){ box.innerHTML="<p class='mut'>Không tìm thấy từ này, hoặc máy đang mất mạng. Hãy kiểm tra chính tả và thử lại.</p>"; }
};

document.addEventListener("click",e=>{ const t=e.target&&e.target.closest?e.target.closest(".term"):null; if(!t) return; const pop=$("#glossPop"); if(pop&&GLOSSARY[t.dataset.term]){ $("#glossText").textContent=GLOSSARY[t.dataset.term]; pop.classList.add("open"); } });
const __gc=$("#glossClose"); if(__gc) __gc.onclick=()=>$("#glossPop").classList.remove("open");

/* ================= KHỞI ĐỘNG ================= */
loadLocal();
if(!IS_REAL) $("#previewBanner").style.display="block";
renderTabs(); renderUserBox(); render();
if(IS_REAL&&window.__supabaseReady){ window.__supabaseReady.then(async client=>{ sb=client; if(!sb) return; try{ const {data}=await sb.auth.getSession(); if(data&&data.session){ sbUser=data.session.user; await pullRemote(); renderUserBox(); render(); } sb.auth.onAuthStateChange(async(_ev,session)=>{ sbUser=session?session.user:null; renderUserBox(); if(sbUser){ await pullRemote(); render(); } }); }catch(e){} }); }
</script>
