<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi IELTS - Học tiếng Anh theo band điểm</title>
<style>
:root{--teal:#1F2430;--teal2:#FFB800;--gold:#FFB800;--amber:#FFB800;--amberhi:#FFC800;--ambersoft:#FFF3D6;--amberring:#FFE9B0;--ambertx:#8A5E00;--coral:#FF6B4A;--coraldeep:#F0522E;--paper:#FFFBF2;--bg:#FFFBF2;--card:#ffffff;--ink:#1F2430;--mut:#6E6A61;--ok:#1e9e6a;--bad:#d9534f;--line:#F0E7D8;--line2:#E7DCC6;--track:#F3ECDC;--radius:16px;--shadow:0 1px 4px rgba(122,84,0,.06);--shadow2:0 8px 22px rgba(122,84,0,.13);--focus:#FFB800;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
header{background:#fff;color:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:50;border-bottom:2px solid var(--line2);box-shadow:0 2px 10px rgba(122,84,0,.08)}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo span{color:var(--ink);background:var(--amber);border-radius:8px;padding:1px 8px 2px}
.hwrap .sp{flex:1}
.userbox{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--gold);color:var(--ink);transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
.btn.teal{background:var(--coral);color:#fff}
.btn.light{background:var(--ambersoft);color:var(--ambertx)}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
.twrap{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.twrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.tab.on{background:var(--amber);color:var(--ink)}
#previewBanner{display:none;background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
main{max-width:1080px;margin:0 auto;padding:18px 14px 110px}
section.page{display:none}
section.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(122,84,0,.05)}
.card h2{font-size:19px;margin-bottom:8px;color:var(--teal)}
.card h3{font-size:16px;margin-bottom:6px;color:var(--teal)}
.mut{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.tile:hover{border-color:var(--teal2);transform:translateY(-1px)}
.tile .t{font-weight:700;font-size:15px;margin:4px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ambersoft);color:var(--ambertx)}
.badge.gold{background:#fdf0cd;color:#8a6410}
.badge.done{background:#dcf4e7;color:#12714a}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--teal2)}
select,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 1 auto}
.grow{flex:1 1 200px}
.hero{background:linear-gradient(180deg,#FFF8E6,#FFF3D6);color:var(--ink);border:0}
.hero h2{color:var(--ink)}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.ring .num small{font-size:11px;font-weight:600;opacity:.85}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{font-size:12.5px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;margin:7px 0;font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--teal2)}
.opt.right{border-color:var(--ok);background:#eafaf1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.why{display:none;background:#FFF8E6;border-left:4px solid var(--teal2);padding:9px 12px;border-radius:6px;font-size:14px;margin:6px 0 12px}
.why.show{display:block}
.typesent{font-size:21px;line-height:1.9;letter-spacing:.3px;background:#FFFCF6;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:70px}
.typesent span.ok{color:var(--ok)}
.typesent span.cur{background:#ffe9a8;border-radius:3px}
.flip{perspective:900px;cursor:pointer}
.flip .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;overflow:auto}
.face.back{transform:rotateY(180deg);background:#FFF8E6;align-items:flex-start;text-align:left;justify-content:flex-start}
.word{font-size:34px;font-weight:800;color:var(--teal)}
.ipa{color:var(--mut);font-size:16px;margin-top:4px}
.passage{white-space:pre-wrap;font-size:16.5px;line-height:1.85;background:#FFFCF6;border:1px solid var(--line);border-radius:12px;padding:18px}
.line{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;align-items:flex-start}
.line .who{font-weight:700;color:var(--teal);min-width:78px;font-size:13px;padding-top:2px}
.line .txt{flex:1}
.line .vi{color:var(--mut);font-size:14px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:0 0 auto}
.iconbtn:hover{border-color:var(--teal2)}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.modebar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.modebar button.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
#dictFab{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#dictPanel{position:fixed;right:14px;bottom:78px;z-index:81;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:16px;display:none}
#dictPanel.open{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;background:#1F2430;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;max-width:92vw;text-align:center}
footer{max-width:1080px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:13px;text-align:center}
.kbd{font-size:13px;color:var(--mut)}
.modelbox{background:#fbf8ee;border:1px solid #ecdfae;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.8;font-size:15.5px}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
select:focus,input:focus,textarea:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(255,184,0,.28);outline:none}
#bandBar{background:#FFF8E6;border-bottom:1px solid var(--line);position:sticky;top:112px;z-index:39}
.bandwrap{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px}
.bandwrap .bb-label{font-weight:700;color:var(--teal);font-size:14px}
.bandwrap select{width:auto;min-width:180px;padding:8px 10px}
.bandwrap .bb-hint{font-size:13px;color:var(--mut)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.skillcard{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.skillcard:hover{border-color:var(--teal2);transform:translateY(-2px);box-shadow:var(--shadow2)}
.skillcard .ic{font-size:26px}
.skillcard .t{font-weight:800;font-size:16px;margin:6px 0 2px;color:var(--teal)}
.skillcard .d{font-size:13.5px;color:var(--mut);min-height:38px}
.skillcard .n{font-size:13px;margin-top:8px;color:var(--ink)}
.stage{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fff}
.stage.target{border-color:var(--gold);background:#fffdf4;box-shadow:var(--shadow2)}
.stage.start{border-color:#9fd4b6;background:#f4fcf7}
.stage .shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage .sname{font-weight:800;font-size:16px;color:var(--teal)}
.stage .spct{margin-left:auto;font-weight:800;color:var(--teal)}
.stage .skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#FFFCF6;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal2);background:#FFF3D6}
.chip b{color:var(--teal)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mut);background:#FFFCF6;font-size:14.5px}
.line.playing{background:#fff6d8;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,179,60,.25)}
.playing-row{background:#fff6d8}
.guide{background:#FFF3D6;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 13px;font-size:14.5px;margin-top:12px}
.posline{font-size:13.5px;color:var(--mut);background:#FFFCF6;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.term{border-bottom:1.5px dotted var(--teal2);cursor:pointer;color:var(--teal);font-weight:600;white-space:nowrap}
.term sup{font-size:10px}
#glossPop{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;width:min(430px,calc(100vw - 28px));background:#fff;border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.25);padding:16px;display:none}
#glossPop.open{display:block}
#glossPop p{font-size:14.5px;margin:6px 0 10px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;flex-wrap:wrap;text-align:left;background:#FFFCF6;border:1px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:14px;width:100%;color:var(--ink)}
.step .slab{flex:1 1 150px;min-width:0}
.step .sstat{font-size:12px;font-weight:700;color:var(--mut);white-space:normal;background:#F3ECDC;border-radius:999px;padding:2px 9px}
.step.st-done{border-color:#bfe8d2;background:#eafaf1}
.step.st-doing{border-color:var(--gold);background:#fffdf4}
.step:disabled{opacity:.55;cursor:default}
.pathbox{margin-top:14px;background:#FFFCF6;border:1.5px solid var(--line);border-radius:18px;padding:14px}
.pathhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pathhead .ptitle{font-weight:800;color:var(--teal);font-size:16px}
.pathhead .pprog{font-size:13px;color:var(--teal);font-weight:800;background:#FFF3D6;border-radius:999px;padding:3px 11px}
.pathbar{margin-top:8px;height:12px}
.path{margin-top:10px;display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:stretch}
.pnode{flex:0 0 46px;display:flex;flex-direction:column;align-items:center}
.pdot{width:46px;height:46px;border-radius:50%;background:#F1EFE9;color:#6E6A61;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:3px solid #E7DCC6;box-shadow:0 3px 0 #E7DCC6;position:relative;z-index:1}
.prow.done .pdot{background:#2fb457;border-color:#25a047;color:#fff;box-shadow:0 3px 0 #1e8439;font-size:21px}
.prow.current .pdot{background:var(--gold);border-color:#d99a16;color:#4d3a00;box-shadow:0 3px 0 #b97e0e;animation:pathpulse 1.8s ease-in-out infinite}
.plink{flex:1 1 auto;width:6px;min-height:10px;background:#F1E7CF;border-radius:3px;margin:2px 0}
.prow.done .plink{background:#2fb457}
.prow .step{flex:1;margin:4px 0;border-radius:16px;padding:11px 13px;background:#fff;border-width:2px;box-shadow:0 2px 0 rgba(122,84,0,.05)}
.prow .step.st-done{background:#eafaf1;border-color:#bfe8d2}
.prow .step.st-doing{background:#fffdf4}
.prow.done .sstat{background:#dcf3e2;color:#177245}
.prow.current .sstat{background:#fdeec3;color:#7a5200}
.prow.future .step{opacity:.62;background:#FBFAF6}
.prow.current .step{border-color:var(--gold);background:#fff8e1;box-shadow:0 3px 0 #ecd28a,var(--shadow2)}
.prow.flash .step{animation:stepflash 1.1s ease-in-out 2}
@keyframes pathpulse{0%,100%{box-shadow:0 3px 0 #b97e0e,0 0 0 3px #fbeec3}50%{box-shadow:0 3px 0 #b97e0e,0 0 0 8px #fbeec3}}
.pnav{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:4px 0}
.pnavbtn{border:2px solid var(--teal2);background:#fff;color:var(--teal);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 #FFE9B0}
.pnavbtn:active{transform:translateY(1px);box-shadow:none}
.pnavbtn.next{background:var(--coral);border-color:var(--coraldeep);color:#fff;box-shadow:0 3px 0 var(--coraldeep)}
.pathnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pstagebtn{border-radius:999px;font-size:15px;padding:12px 20px;font-weight:800}
.pathend{font-weight:700;color:var(--mut);font-size:14px}
#continueCard .bar{height:12px}
#btnPathGo{border-radius:14px;box-shadow:0 4px 0 #b97e0e}
#btnPathGo:active{transform:translateY(2px);box-shadow:0 1px 0 #b97e0e}
.lessonframe{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,#FFF8E6,#FFF3D6);border:1.5px solid #FFE1A1;border-radius:14px;padding:9px 12px;margin:10px 0}
.lfbtn{border:2px solid var(--teal2);background:#fff;color:var(--teal);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 #FFE9B0}
.lfbtn:active{transform:translateY(1px);box-shadow:none}
.lfbtn.next{background:var(--coral);border-color:var(--coraldeep);color:#fff;box-shadow:0 3px 0 var(--coraldeep)}
.lfprog{flex:1;text-align:center;font-weight:800;color:var(--teal);font-size:13.5px;min-width:130px}
.workedbox{background:#FFF8E6;border:1.5px solid #FFE1A1;border-radius:14px;padding:12px 14px;margin-top:12px}
.summarybox{background:#eafaf1;border:1.5px solid #bfe8d2;border-radius:14px;padding:12px 14px}
.plansteps{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:thin}
.pstep{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.pstep.done{background:#e2f6e4;border-color:#2fb457;color:#177245}
.pstep.cur{background:#fff3cf;border-color:var(--gold);color:#7a5200;box-shadow:0 0 0 3px #fbeec3}
.ph-btn.phst-done{background:#e2f6e4;border-color:#2fb457;color:#177245;font-weight:700}
.ph-btn.phst-cur{border-color:var(--gold);background:#fff3cf;font-weight:800;box-shadow:0 0 0 3px #fbeec3}
.ph-btn.phst-lock{opacity:.55;background:#F1EFE9;color:var(--mut)}
.ph-prog{font-weight:800;color:var(--teal);background:#FFF3D6;border-radius:10px;padding:7px 11px;margin-bottom:8px}
@keyframes stepflash{0%,100%{background:#fff8e1}50%{background:#ffe9a8}}
.stage.currentstage{border-color:var(--teal2);box-shadow:0 0 0 3px #FFE9B0,var(--shadow2)}
.here-badge{background:var(--gold);color:#4d3a00;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}

.ph-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ph-diff-dot{font-size:9px;margin-left:3px}
.ph-diffbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.ph-diffnote{background:#fdf6e0;border:1px solid #ecd9a0;border-radius:10px;padding:8px 10px;margin:6px 0}
.ph-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.ph-btn.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
@keyframes mouthMove{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.mouth-anim .tongue{animation:mouthMove .45s ease-in-out 2}
.pb-bar{flex-wrap:wrap;gap:6px}
.pb-bar .btn{padding:7px 11px;font-size:13.5px}
.pb-res{font-weight:600}
.pb-marks{margin-top:4px;font-size:15px}
.pb-ai-card{margin-top:8px;border:1px solid var(--line);border-left:4px solid var(--amber);background:#FFFCF6;border-radius:10px;padding:9px 11px;text-align:left}
.obs-strip{display:flex;gap:14px;flex-wrap:wrap}
.obs-img{flex:0 1 300px;min-width:230px}
.obs-vids{flex:1 1 300px;display:flex;flex-direction:column;gap:12px;min-width:250px}
.obs-vid{border:1px solid var(--line);border-radius:12px;padding:10px;background:#FFFCF6}
.ph-figs{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.ph-fig{flex:1 1 150px;min-width:132px;margin:0;display:flex;flex-direction:column;align-items:center}
.ph-fig svg{width:100%;max-width:300px;height:200px !important}
.ph-fig figcaption{text-align:center;font-size:12.5px;color:var(--mut);margin-top:4px}
.ph-arrow{align-self:center;font-size:24px;font-weight:700;color:var(--teal);padding:0 1px}
.ph-strip .obs-img{flex:1 1 430px;min-width:290px}
.jawline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.jaw-segs{display:inline-flex;gap:2px}
.jaw-segs i{width:15px;height:9px;border-radius:2px;background:#F3ECDC}
.jaw-segs i.on{background:var(--amber)}
@media(max-width:640px){.ph-figs{flex-direction:column;align-items:stretch}.ph-fig{flex:1 1 100%;width:100%}.ph-arrow{transform:rotate(90deg);text-align:center;padding:0}.ph-strip .obs-img{flex:1 1 100%;min-width:0}}
.mirror-box{border:1.5px solid var(--teal2);border-radius:12px;padding:12px;background:#FFFCF6;margin-top:10px}
.mr-stage{position:relative;border-radius:12px;overflow:hidden;background:#1F2430;max-width:520px}
.mr-video{width:100%;display:block;transform:scaleX(-1)}
.mr-cv{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.g-row{display:flex;align-items:center;gap:8px;margin-top:5px}
.g-lab{flex:0 0 128px;font-size:13px;color:var(--mut)}
.g-lab.in{color:var(--ok);font-weight:700}
.g-track{position:relative;flex:1;height:12px;background:#F3ECDC;border-radius:99px}
.g-zone{position:absolute;top:0;bottom:0;background:rgba(30,158,106,.30);border-radius:99px;display:none}
.g-val{position:absolute;top:-3px;width:4px;height:18px;background:var(--teal);border-radius:2px;transform:translateX(-2px)}
.g-num{flex:0 0 42px;font-size:13px;font-weight:600}

/* Bản đồ bảng chữ cái: nguyên âm - phụ âm, nhóm theo âm của tên chữ */

.az-zone-v{background:#fffaf0;border:1px solid #f0d9a0;border-radius:10px;padding:9px 10px}
.az-zone-v .az-zone-t{color:#8a6410}
.az-note{font-size:13.5px;color:#7a5d12;margin-top:6px}
.az-cells{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.az-cell{position:relative;min-width:40px;height:40px;padding:0 6px;border-radius:10px;border:1.5px solid var(--teal2);background:#FFF3D6;color:var(--teal);font-size:17px;font-weight:800;cursor:pointer}
.az-cell:hover{background:#FFE9B0}

.az-cell.az-v:hover{background:#fbe7ae}

/* ===== GIAI ĐOẠN 5: bản đồ nhóm + trò chơi ===== */
.gmap{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#FFFCF6}
.gmap summary{cursor:pointer;font-weight:700;color:var(--teal);font-size:15px}
.gmap-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gmap-chip{border:1.5px solid var(--teal2);background:#FFF3D6;color:var(--teal);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13.5px;min-height:38px;text-align:left}
.gmap-chip.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.gmap-zone-t{font-weight:700;font-size:13.5px;color:var(--teal);margin-top:10px}
.hookline{background:#fff7e0;border:1px solid #f0d9a0;border-left:4px solid var(--gold);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.ph-zone{flex:0 0 100%;font-weight:700;color:var(--teal);font-size:13.5px;margin-top:8px}
.ph-zone-empty{flex:0 0 100%;font-size:13px;color:var(--mut);margin-top:8px}
.gm-match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gm-col{display:flex;flex-direction:column;gap:6px}
.gm-w,.gm-m{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-size:14.5px;text-align:left;color:var(--ink);min-height:44px}

.gm-w.bad,.gm-m.bad{border-color:#d9534f;background:#fdf0ef}
.gm-tok,.gm-ans{border:1.5px solid var(--teal2);background:#FFF3D6;color:var(--teal);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:15px;min-height:42px;margin:0 5px 6px 0}
.gm-ans{background:#fff7e0;border-color:var(--gold);color:var(--ink)}

/* ===== GIAI ĐOẠN 6: kết cấu 5 cửa + làm đẹp trò chơi ===== */
.gmap summary::after{content:"▾";float:right;color:var(--mut);font-weight:400}

.hub-t{font-size:16px;color:var(--teal);margin:18px 0 4px}
#bottomNav button.on{box-shadow:inset 0 3px 0 var(--gold)}

.gm-tile{border-top:5px solid var(--gmA,var(--teal2));text-align:center;padding:18px 14px}
.gm-tile .gm-ic{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;background:var(--gmA,var(--teal2));color:#fff;font-size:27px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(122,84,0,.18)}

.gm-stage{border-top:6px solid var(--gmA,var(--teal2))}
.gm-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:12px}
.gm-head .gm-title{display:flex;gap:10px;align-items:center;flex:1;min-width:200px}
.gm-head .gm-ic{width:52px;height:52px;flex:0 0 auto;border-radius:14px;background:var(--gmA,var(--teal2));color:#fff;font-size:25px;display:flex;align-items:center;justify-content:center}
.gm-head .gm-name{font-size:19px;font-weight:800;color:var(--ink);line-height:1.25}
.gm-head .gm-sub{font-size:13px;color:var(--mut);margin-top:2px}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}

.gm-stat.gm-low{background:#fdf0ef;border-color:#d9534f;color:#a33}
.gm-stat.gm-low b{color:#d9534f}
@keyframes gmPop{0%{transform:scale(.93);opacity:.35}100%{transform:scale(1);opacity:1}}
@keyframes gmShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes gmStarIn{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.3) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
#gmFb:empty{display:none}
#gmFb .oktxt,#gmFb .badtxt{display:block;padding:10px 14px;border-radius:10px;font-size:14.5px;animation:gmPop .25s ease}

.gm-stage .opt{padding:14px 16px;font-size:16px;transition:border-color .15s,background .15s,transform .15s}
.gm-stage .opt.right{animation:gmPop .3s ease}
.gm-stage .opt.wrong{animation:gmShake .3s ease}
.gm-w,.gm-m{transition:all .18s ease}
.gm-w.bad,.gm-m.bad{animation:gmShake .3s ease}
.gm-letter{display:inline-block;min-width:40px;padding:8px 4px;margin:3px;border:2px solid var(--gmA,var(--teal2));border-radius:10px;background:#fff;color:var(--gmA,var(--teal));font-size:24px;font-weight:800;text-align:center}

.gm-star.on{color:var(--gold);text-shadow:0 2px 6px rgba(232,179,60,.45);display:inline-block;animation:gmStarIn .45s ease both}
.gm-star.on:nth-child(2){animation-delay:.13s}
.gm-star.on:nth-child(3){animation-delay:.26s}
.gm-end-score{font-size:17px;margin-top:6px}

.gm-end-btns{justify-content:center;margin-top:14px}

#gmAgain{color:#fff}

@media(max-width:480px){.gm-letter{min-width:32px;font-size:20px;padding:6px 2px}.gm-star{font-size:32px}}

/* ===== KHUNG BUỔI HỌC THỐNG NHẤT (LESSON SHELL) =====
   Mọi màn luyện tập dùng chung một khung trình bày theo đúng thứ tự:
   (1) thanh đầu dính trên cùng: nút về danh sách + tên bài + dòng tiến trình
       (mục X trên Y, %) + thanh tiến trình mảnh + nút Quay lại/Tiếp theo;
   (2) dải chip các bước của chặng khi học theo kế hoạch (.plansteps);
   (3) một thẻ nội dung lớn, bo góc rộng, thoáng - mỗi câu hỏi là một khối con (.qblock),
       các nút phụ gom vào hàng công cụ (.modebar/.pb-bar);
   (4) dải phản hồi .why thống nhất ngay dưới câu hỏi, trong cùng thẻ;
   (5) thanh điều hướng dính dưới cùng (.lshell-bar): Bài trước | tiến trình | nút chính;
   (6) thẻ tổng kết cuối bài cùng một mẫu (.summarybox, [data-flownav], .sumcard). */
.lessonframe{display:block;background:linear-gradient(180deg,#FFF8E6,#FFF3D6);border:1.5px solid #FFE1A1;border-radius:16px;padding:12px 14px;margin:10px 0;position:sticky;top:156px;z-index:35;box-shadow:var(--shadow2)}
.lf-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lf-mid{flex:1;min-width:150px}
.lf-title{font-weight:800;color:var(--teal);font-size:15.5px;line-height:1.3;text-align:center}
.lessonframe .lfprog{display:block;text-align:center}
.lf-nav{display:flex;gap:8px;flex-wrap:wrap}
.lfbar{height:8px;background:#F3ECDC;border-radius:99px;overflow:hidden;margin-top:10px}
.lfbar>i{display:block;height:100%;background:linear-gradient(90deg,#FFC800,#FFB800);border-radius:99px;transition:width .3s ease}
@media(max-width:768px){.lessonframe{top:98px}}
.plansteps{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px}
.card.shellcard{border-color:#FFE1A1}
section.shellsec>.card{border-radius:20px;padding:24px 22px;box-shadow:var(--shadow2)}

section.shellsec .passage{padding:20px;border-radius:14px}

.qblock{background:#FFFCF6;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:14px}
.qblock .why{margin:10px 0 2px}
.why{border-radius:10px;padding:11px 13px;font-size:14.5px;line-height:1.6}
.modebar{background:#FFF3D6;border:1px solid var(--line);border-radius:12px;padding:6px;display:inline-flex;max-width:100%}
.modebar button{border-radius:8px}

<script>
"use strict";
/* ================= TIỆN ÍCH ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let toastT=null; function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2600)}
function bandNum(b){ const m=String(b||"").match(/[\d.]+/); return m?parseFloat(m[0]):999; }
function bandFromText(s){ const m=String(s||"").match(/^Band\s*[\d.]+\+?/); return m?m[0].replace(/\s+/g," "):null; }
function itemBand(x){ if(!x) return null; if(x.band) return x.band; if(x.level) return x.level; return null; }
function vocabSetBand(v){ return itemBand(v)||bandFromText(v&&(v.theme||v.topic)); }
function listeningBand(l){ return itemBand(l)||bandFromText(l&&l.topic); }
function collectBands(){ const s=new Set(); const add=b=>{ if(b&&/^Band /.test(b)) s.add(b); };
  (CONTENT.typing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.grammar||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.reading||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.speaking||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.writing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.vocab||[]).forEach(x=>add(vocabSetBand(x)));
  (CONTENT.listening||[]).forEach(x=>add(listeningBand(x)));
  return [...s].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b)); }
const BANDS=collectBands();
/* THANG BAND CHUẨN của web - nguồn định nghĩa duy nhất cho mọi nơi liệt kê hoặc suy ra band:
   thanh lọc cấp độ, lộ trình các chặng, ô chọn Band mục tiêu, kiểm tra cuối chặng, nhiệm vụ thực chiến, gợi ý sau bài kiểm tra thử.
   Nhãn CEFR ghi kèm theo kiểu "tương đương" nằm ở BAND_CEFR ngay dưới đây. */
const BAND_SCALE=["Band 0","Band 2.0","Band 2.5","Band 3.0","Band 3.5","Band 4.0","Band 4.5","Band 5.0","Band 5.5","Band 6.0","Band 6.5","Band 7.0","Band 7.5+"];
const BAND_CEFR={"Band 0":"Pre-A1","Band 2.0":"A1","Band 2.5":"A1","Band 3.0":"A2","Band 3.5":"A2","Band 4.0":"B1","Band 4.5":"B1","Band 5.0":"cuối B1 - bắt đầu B2","Band 5.5":"B2 (đầu dải)","Band 6.0":"B2","Band 6.5":"B2","Band 7.0":"C1","Band 7.5+":"C1"};
const LADDER=[...new Set([...BAND_SCALE,...BANDS])].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b));
const BAND0_NAME="Band 0 - Nền tảng cho người mất gốc";
function bandLabel(b){ return b==="Band 0"?BAND0_NAME:b; }
function bandStageName(b){ const c=BAND_CEFR[b]; const base=bandLabel(b); return c?base+" · tương đương "+c:base; }
function trialSuggestBand(score,total){ const f=total?score/total:0; const TH=[0,0.16,0.22,0.28,0.34,0.41,0.47,0.53,0.59,0.66,0.72,0.78,0.84]; let idx=0; TH.forEach((t,i)=>{ if(f>=t) idx=i; }); return BAND_SCALE[Math.min(idx,BAND_SCALE.length-1)]; }
/* ================= THANG ĐIỂM: QUY ĐỔI ĐIỂM THÔ -> BAND ƯỚC LƯỢNG (Giai đoạn 4) =================
   Bảng quy đổi tham khảo phổ biến cho đề 40 câu, neo vào 2 điểm Cambridge công bố trong Teacher's Book
   Mindset Level 1: Reading 15-22/40 tương đương khoảng Band 5.0-5.5; Listening 16-22/40 tương đương khoảng Band 5.0-5.5.
   Bài có số câu khác 40: quy điểm thô về thang 40 theo tỉ lệ rồi tra bảng. IELTS không công bố bảng quy đổi cố định. */
const BAND_EST_NOTE="Band ước lượng để tham khảo - IELTS không công bố bảng quy đổi cố định";
const RAW_BAND_TABLE={reading:[[39,9.0],[37,8.5],[35,8.0],[33,7.5],[30,7.0],[27,6.5],[23,6.0],[19,5.5],[15,5.0],[13,4.5],[10,4.0],[8,3.5],[6,3.0],[4,2.5],[0,2.0]],listening:[[39,9.0],[37,8.5],[35,8.0],[32,7.5],[30,7.0],[26,6.5],[23,6.0],[19,5.5],[16,5.0],[13,4.5],[10,4.0],[8,3.5],[6,3.0],[4,2.5],[0,2.0]]};
function rawToBand(score,total,skill){ if(!total||total<=0) return null; const raw40=Math.round(score/total*40); const tbl=RAW_BAND_TABLE[skill]||RAW_BAND_TABLE.reading; for(const pair of tbl){ if(raw40>=pair[0]) return pair[1]; } return 2.0; }
function fmtBand(b){ return (Math.round(b*10)/10).toFixed(1); }
function bandEstHTML(score,total,skill,label){ const b=rawToBand(score,total,skill); if(b===null) return ""; return `<div class="bandest"><b>${esc(label||"Band ước lượng")}: Band ${fmtBand(b)}</b> <span class="mut">(điểm thô ${score}/${total} câu, quy về thang 40 câu)</span><br><span class="mut">${BAND_EST_NOTE}. Điểm neo tham khảo: Teacher's Book Mindset Level 1 (Cambridge) - Reading 15-22/40 và Listening 16-22/40 tương đương khoảng Band 5.0-5.5.</span></div>`; }

/* ================= SRS THỐNG NHẤT: MỤC KHÓ (Giai đoạn 4) =================

const HARD_INTERVALS=[1,3,7,14,30];
function hardMap(){ if(!state.hard||typeof state.hard!=="object"||Array.isArray(state.hard)) state.hard={}; return state.hard; }
function hardKeyOf(it){ return it.kind+":"+it.key; }
function syncHard(){ setProg("meta","hard",{map:hardMap()}); }
function isHard(it){ const h=hardMap()[hardKeyOf(it)]; return !!(h&&!h.done); }
function toggleHard(it){ const m=hardMap(); const k=hardKeyOf(it); if(m[k]&&!m[k].done){ delete m[k]; toast("Đã bỏ đánh dấu khó."); } else { m[k]={kind:it.kind,key:it.key,label:it.label||"",data:it.data||{},due:today(),streak:0,level:0,done:false,added:today()}; toast("Đã đánh dấu khó - mục này sẽ vào hàng đợi ôn giãn cách ở Sổ lỗi sai."); } syncHard(); saveLocal(); }
function dueHard(){ const t=today(); return Object.values(hardMap()).filter(h=>!h.done&&h.due<=t); }
function allHard(){ return Object.values(hardMap()).filter(h=>!h.done); }
function totalDueToday(){ return dueErrors().length+dueCards().length+dueHard().length; }
function hardBtnHTML(it){ const on=isHard(it); return `<button class="btn light hardbtn" data-hard="${encodeURIComponent(JSON.stringify(it))}">${on?"★ Đã đánh dấu khó (bấm để bỏ)":"☆ Đánh dấu khó"}</button>`; }
function wireHardBtns(root){ if(!root) return; $$(".hardbtn",root).forEach(b=>b.onclick=()=>{ try{ const it=JSON.parse(decodeURIComponent(b.dataset.hard)); toggleHard(it); b.textContent=isHard(it)?"★ Đã đánh dấu khó (bấm để bỏ)":"☆ Đánh dấu khó"; const n=$("#dueStripNum"); if(n) n.textContent=totalDueToday(); }catch(e){} }); }
function mountHardBtn(el,it){ if(!el) return; const d=document.createElement("div"); d.style.marginTop="6px"; d.innerHTML=hardBtnHTML(it); el.appendChild(d); wireHardBtns(d); }
function hardJudge(h,ok){ if(ok){ h.streak=(h.streak||0)+1; if(h.streak>=2){ h.done=true; h.due=""; } else { h.level=(h.level||0)+1; h.due=addDays(today(),HARD_INTERVALS[Math.min(h.level,HARD_INTERVALS.length-1)]); } } else { h.streak=0; h.due=addDays(today(),1); } syncHard(); saveLocal(); }
function hardVocabCard(h){ const d=h.data||{}; if(typeof d.setIdx==="number"&&d.setIdx>=0){ const deck=CONTENT.vocab[d.setIdx]; if(deck&&deck.cards[d.ci]) return deck.cards[d.ci]; } const sw=Object.values(state.savedWords||{}).find(x=>x&&x.w===d.w); return sw||{w:d.w||h.label,vi:""}; }

function studyTitle(tab,idx){ try{ if(tab==="typing")return CONTENT.typing[idx].title; if(tab==="grammar")return CONTENT.grammar[idx].name; if(tab==="reading")return CONTENT.reading[idx].title; if(tab==="listening")return CONTENT.listening[idx].topic; if(tab==="speaking")return CONTENT.speaking[idx].topic; if(tab==="writing")return CONTENT.writing[idx].title; if(tab==="vocab"){ const d=allDecks().find(d=>d.setIdx===idx); return d?d.name:"Từ vựng"; } }catch(e){} return ""; }
function markStudy(tab,idx,title){ if(idx===null||idx===undefined||isNaN(idx))return; const same=state.lastStudy&&state.lastStudy.tab===tab&&state.lastStudy.idx===idx; state.lastStudy={tab,idx,title:title||studyTitle(tab,idx),ts:Date.now()}; if(!same) sessErrs=[]; saveLocal(); }
let sessErrs=[];
function syncErrors(){ setProg("meta","errors",{list:(state.errors||[]).slice(-200)}); }
function logError(e){ if(!Array.isArray(state.errors)) state.errors=[]; const t=today(); const key=e.sec+"|"+e.q; const ex=state.errors.find(x=>(x.sec+"|"+x.q)===key&&!x.done);
  if(ex){ ex.count=(ex.count||1)+1; ex.date=t; ex.due=addDays(t,1); ex.streak=0; if(e.o)ex.o=e.o; if(e.a!==undefined)ex.a=e.a; if(e.why)ex.why=e.why; }
  else state.errors.push({id:"e"+Date.now()+"_"+Math.floor(Math.random()*1e5),sec:e.sec,kind:e.kind||"mc",q:e.q,o:e.o||null,a:e.a,why:e.why||"",date:t,due:addDays(t,1),streak:0,done:false,count:1});
  if(state.errors.length>200) state.errors=state.errors.slice(-200);
  sessErrs.push({sec:e.sec,q:e.q}); syncErrors(); saveLocal(); }
function dueErrors(){ const t=today(); return (state.errors||[]).filter(e=>!e.done&&e.due<=t); }
function errReviewHTML(){ if(!sessErrs.length) return ""; const items=sessErrs.map(se=>{ const e=(state.errors||[]).filter(x=>x.sec===se.sec&&x.q===se.q).pop(); return e?`<div style="margin:7px 0"><p><b>${esc(e.q)}</b></p><p class="mut">Đáp án đúng: <b>${esc(e.kind==="mc"&&e.o?String(e.o[e.a]):String(e.a))}</b>${e.why?(" - "+esc(e.why)):""}</p></div>`:""; }).join("");
  return `<div class="card" style="border-color:#f0d3d1;background:#fdf3f3;margin-top:12px"><h3>Xem lại lỗi sai trong bài này (${sessErrs.length} câu)</h3>${items}<div class="row" style="margin-top:8px"><button class="btn teal" onclick="go('errors')">Mở Sổ lỗi sai để luyện lại</button></div><p class="mut" style="margin-top:6px">Mọi câu sai đã được tự lưu vào Sổ lỗi sai. Luyện lại đúng 2 lần liên tiếp là coi như đã sửa xong lỗi đó.</p></div>`; }

function setProg(section,key,val){ state.progress[section+":"+key]=val; saveLocal(); pushProgress(section,key); if(!(section==="meta"&&(key==="targetBand"||key==="welcomed"||key==="checkin"||key==="xp"))) noteActivity(); const tab=PROG_TAB[section], re=PROG_IDX[section]; if(tab&&re){ const m=String(key).match(re); if(m) markStudy(tab,parseInt(m[1],10)); } }

/* ================= LUỒNG HỌC LẦN LƯỢT =================
   Ba việc: (1) mở bài từ một BƯỚC trong chặng thì ghi nhớ ngữ cảnh chặng/bước (flowCtx);
   (2) bấm bước trong chặng luôn mở mục CHƯA xong đầu tiên của bước đó - học tiếp đúng chỗ cũ,

   học tiếp bước này / bước tiếp theo khi học theo chặng, hoặc "Bài tiếp theo" theo đúng
   thứ tự danh sách đang hiển thị khi học tự do trong lưới phân hệ. */
let flowCtx=null;
function flowBandOf(sec,idx){ try{
  if(sec==="vocab"){ const d=allDecks().find(x=>x.setIdx===idx); return d?(d.band||null):null; }
  if(sec==="listening") return listeningBand(CONTENT.listening[idx]);
  if(sec==="listeningPlus"){ const it=lpItems()[idx]; return it?(it.band||null):null; }
  const it=CONTENT[sec]&&CONTENT[sec][idx]; return it?itemBand(it):null;
}catch(e){ return null; } }
function firstUndoneInBand(sec,b){
  if(sec==="vocab"){ let ds=allDecks().filter(d=>d.setIdx>=0&&d.band===b); if(b==="Band 0"){ const ai=alphabetDeckIdx(); ds=ds.slice().sort((x,y)=>(y.setIdx===ai?1:0)-(x.setIdx===ai?1:0)); } for(const d of ds){ if(d.cards.some((c,ci)=>{ const st=state.cards[cardKey(d.setIdx,ci,c.w)]; return !st||st.box<1; })) return d.setIdx; } return -1; }
  const arr=CONTENT[sec]; if(!arr) return -1;
  for(let i=0;i<arr.length;i++){ const ib=sec==="listening"?listeningBand(arr[i]):itemBand(arr[i]); if(ib===b&&!itemDone(sec,i)) return i; }
  return -1;
}
function firstInBand(sec,b){
  if(sec==="vocab"){ if(b==="Band 0"){ const ai=alphabetDeckIdx(); if(ai>=0) return ai; } const d=allDecks().find(d=>d.setIdx>=0&&d.band===b); return d?d.setIdx:-1; }
  const arr=CONTENT[sec]; if(!arr) return -1;
  for(let i=0;i<arr.length;i++){ const ib=sec==="listening"?listeningBand(arr[i]):itemBand(arr[i]); if(ib===b) return i; }
  return -1;

function resumeIdxForBand(sec,b){ const u=firstUndoneInBand(sec,b); return u>=0?u:firstInBand(sec,b); }
function stageStepKey(s){ return (s.secs||[]).join(",")+"|"+(s.isMock?"M":"")+(s.isGame?"G":"")+(s.isTest?"T":""); }
function currentStageCtx(sec,band){ if(!flowCtx||!band||flowCtx.band!==band) return null; const want=sec==="listeningPlus"?"listening":sec; return (flowCtx.secs||[]).includes(want)?flowCtx:null; }
function stepRemaining(band,ctx){ for(const sec of ctx.secs){ if(sec==="video") continue; const i=firstUndoneInBand(sec,band); if(i>=0) return {sec,i}; } return null; }
function nextStageStep(band,ctx){ const defs=stageSteps(band); const k=stageStepKey(ctx); const start=defs.findIndex(s=>stageStepKey(s)===k); for(let j=start+1;j<defs.length;j++){ const s=defs[j]; if(s.status!=="done"&&s.status!=="empty") return s; } return null; }
function prevStageStep(band,ctx){ const defs=stageSteps(band); const k=stageStepKey(ctx); const start=defs.findIndex(s=>stageStepKey(s)===k); for(let j=start-1;j>=0;j--){ if(defs[j].status!=="empty") return defs[j]; } return null; }

  const act=()=>{ if(sec==="vocab"){ const d=allDecks().find(d2=>d2.setIdx>=0&&d2.cards.some((c,ci)=>{ const st2=state.cards[cardKey(d2.setIdx,ci,c.w)]; return !st2||st2.box<1; })); if(d){ vocabSel=d; if(isAZDeck(d)) azOrderMode="group"; vocabQueue=azQueueFor(d); vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; markStudy("vocab",d.setIdx,d.name); go("vocab"); return; } go("vocab"); return; } for(let j=0;j<CONTENT[sec].length;j++){ if(!itemDone(sec,j)){ openItem(sec,j); return; } } go(sec); };
  return {text:`Kỹ năng đang yếu nhất của bạn là ${names[sec]} - mới hoàn thành ${worst.done}/${worst.total} mục (${worst.pct}%). Luyện thêm một mục ${names[sec]} hôm nay để giữ cân bằng giữa các kỹ năng.`,btn:"Luyện "+names[sec],act:act,type:"Luyện tập · "+names[sec],mins:minsMap[sec]||6,done:false}; }
function buildTodayPlan(){ const plan=[]; const secName={typing:"Gõ câu",vocab:"Từ vựng",grammar:"Ngữ pháp",reading:"Đọc",listening:"Nghe",speaking:"Luyện nói",writing:"Writing",video:"Video"};
  const de=dueErrors();

  const dh0=dueHard();

  if(!de.length&&!dh0.length&&!due.length&&(Object.keys(state.cards||{}).length||(state.errors||[]).length||Object.keys(hardMap()).length)) plan.push({text:"Đã ôn hết các mục đến hạn hôm nay trong hàng đợi ôn giãn cách (lỗi sai, thẻ từ và mục khó). Làm tốt lắm - cứ giữ nhịp ôn đúng lúc sắp quên này là nhớ lâu.",btn:"Xem hàng đợi ôn",act:()=>go("errors"),type:"Ôn tập giãn cách",mins:0,done:true});
  const azIdx=alphabetDeckIdx();
  if(azIdx>=0){ const azDeck=allDecks().find(d=>d.setIdx===azIdx); const azDone=!!(azDeck&&azDeck.cards.length&&azDeck.cards.every((c,ci)=>{ const st3=state.cards[cardKey(azIdx,ci,c.w)]; return st3&&st3.box>=1; })); if(azDeck&&!azDone) plan.push({text:"Bước đầu tiên cho người mất gốc: học 26 chữ cái tiếng Anh (A-Z) - mỗi chữ có cách đọc và một từ ví dụ dễ nhớ",btn:"Học chữ cái",act:()=>startFromZero(),type:"Lộ trình · Nền tảng",mins:10,done:false}); }
  const curB=state.targetBand||LADDER.find(b=>!stagePassed(b))||LADDER[LADDER.length-1];
  const steps=curB?stageSteps(curB):[];
  const curStep=steps.find(s=>!s.isTest&&!s.isGame&&(s.status==="doing"||s.status==="todo"));
  if(curStep&&plan.length<5){ let pushed=false;
    const ls=state.lastStudy;
    if(ls&&ls.title&&curStep.secs.includes(ls.tab)&&!(PROG_KEY[ls.tab]&&itemDone(ls.tab,ls.idx))){ plan.push({text:`Học tiếp bước "${curStep.label}" ở chặng ${curB}: ${ls.title}`,btn:"Học tiếp",act:()=>{ if(curStep) flowCtx={band:curB,secs:curStep.secs.slice(),label:curStep.label}; continueStudy(ls); },type:"Lộ trình chặng "+curB,mins:stepEstMins(curStep),done:false}); pushed=true; }
    if(!pushed){ for(const sec of curStep.secs){ if(sec==="video"){ plan.push({text:`Theo lộ trình chặng ${curB} - ${curStep.label}: xem một video của chặng này và nói nhại theo một đoạn ngắn trong video`,btn:"Xem video",act:()=>{ setGlobalBand(curB,true); go("video"); },type:"Lộ trình chặng "+curB,mins:stepEstMins(curStep),done:false}); pushed=true; break; }
      const idxs=sec==="vocab"?allDecks().filter(d=>d.band===curB).map(d=>d.setIdx):CONTENT[sec].map((x,i)=>({x,i})).filter(({x})=>(sec==="listening"?listeningBand(x):itemBand(x))===curB).map(({i})=>i);
      const ii=idxs.find(i=>sec==="vocab"?((allDecks().find(d=>d.setIdx===i)||{cards:[]}).cards.some((c,ci)=>{ const st2=state.cards[cardKey(i,ci,c.w)]; return !st2||st2.box<1; })):!itemDone(sec,i));
      if(ii!==undefined&&ii>=0){ plan.push({text:`Theo lộ trình chặng ${curB} - ${curStep.label}: ${studyTitle(sec,ii)}`,btn:"Học ngay",act:()=>{ if(curStep) flowCtx={band:curB,secs:curStep.secs.slice(),label:curStep.label}; openItem(sec,ii); },type:"Lộ trình chặng "+curB,mins:stepEstMins(curStep),done:false}); pushed=true; break; } } }
  }
  if(plan.length<5&&curB){ const contentSteps=steps.filter(s=>!s.isTest&&!s.isGame&&s.status!=="empty"); if(contentSteps.length&&contentSteps.every(s=>s.status==="done")&&!stagePassed(curB)&&stageTestPool(curB).length){ plan.push({text:`Các bước học ở chặng ${curB} đã xong - làm bài kiểm tra cuối chặng để chốt chặng này`,btn:"Kiểm tra cuối chặng",act:()=>startStageTest(curB),type:"Kiểm tra cuối chặng",mins:6,done:false}); } }

  if(checkedOn(today())) plan.push({text:"Bạn đã điểm danh hôm nay rồi - chuỗi ngày học đang được giữ đều. Cứ thong thả học tiếp các mục khác trong kế hoạch nhé.",btn:"Đã điểm danh",act:null,type:"Điểm danh",mins:1,done:true});
  else plan.push({text:"Điểm danh hôm nay để giữ chuỗi ngày học và nhận +5 XP. Học xong bất kỳ mục nào trong ngày, web cũng tự điểm danh cho bạn.",btn:"Điểm danh ngay",act:()=>{ if(doCheckin()) toast("Đã điểm danh hôm nay. Chuỗi ngày học: "+checkinStreak()+" ngày! Bạn nhận +5 XP."); render(); },type:"Điểm danh",mins:1,done:false});

  return plan.slice(0,5); }

/* ================= GIAI ĐOẠN 5: BẢN ĐỒ NHÓM + TRÒ CHƠI HỌC =================
   Bản đồ nhóm cho mọi phân hệ (đọc nhãn phân loại thật trong content.js:
   grammar.fam/hook, speaking.partNum/topicStd, vocab.topic cấp bộ, reading.topic,
   writing.wtype) và khu Trò chơi dựng hoàn toàn từ kho dữ liệu sẵn có.
   Lỗi sai trong game ghi vào Sổ lỗi sai qua logError như bài luyện thường. */
let vocabTopicFilter=null, spPartFilter=null, spTopicFilter=null, readTypeFilter=null, wrTypeFilter=null, lpSectionFilter=null, lisTopicFilter=null, tyTopicFilter=null;
function gmapHTML(title,purpose,inner){ return '<details class="gmap"><summary>🗺️ '+esc(title)+'</summary><p class="mut" style="margin-top:6px">'+esc(purpose)+'</p>'+inner+'</details>'; }
function gmapChips(chips){ if(!chips||!chips.length) return ""; return '<div class="gmap-chips">'+chips.map(c=>'<button class="gmap-chip'+(c.on?" on":"")+'" '+c.attrs+'>'+esc(c.label)+'</button>').join("")+'</div>'; }

/* ----- Từ vựng: bản đồ theo chủ đề (trường topic cấp bộ) ----- */
function vocabTopicOf(d){ if(!d) return ""; if(d.setIdx>=0){ const v=CONTENT.vocab[d.setIdx]; if(v&&v.topic) return v.topic; } return d.name||"Từ đã tra"; }
function vocabMapHTML(){ const decks=allDecks().filter(deckVisible); const groups={}; decks.forEach(d=>{ const t=vocabTopicOf(d); if(!groups[t]) groups[t]={sets:0,cards:0,known:0}; groups[t].sets++; groups[t].cards+=d.cards.length; groups[t].known+=d.cards.filter((c,ci)=>{ const st=state.cards[cardKey(d.setIdx,ci,c.w)]; return st&&st.box>=1; }).length; });
  const chips=Object.keys(groups).sort().map(t=>({label:t+" · "+groups[t].sets+" bộ · đã học "+groups[t].known+"/"+groups[t].cards+" thẻ", attrs:'data-vtopic="'+esc(t)+'"', on:vocabTopicFilter===t}));
  if(vocabTopicFilter) chips.push({label:"✕ Xem mọi chủ đề", attrs:'data-vall="1"', on:false});
  return gmapHTML("Bản đồ từ vựng theo chủ đề", "Học từ theo chủ đề giúp bạn gom vốn từ theo đúng các chủ đề hay xuất hiện trong đề IELTS: gặp bài đọc, bài nghe hay câu hỏi nói về chủ đề nào là bạn có sẵn từ của chủ đề đó để dùng ngay. Bấm vào một chủ đề để chỉ xem các bộ từ của chủ đề đó.", gmapChips(chips)); }

/* ----- Ngữ pháp: bản đồ theo họ kiến thức (trường fam + hook) ----- */

/* ----- Phát âm: bản đồ 44 âm theo 3 khu ----- */
const PH_SINGLE=["i:","ɪ","ʊ","u:","e","ə","ɜ:","ɔ:","æ","ʌ","ɑ:","ɒ"], PH_DIPH=["eɪ","aɪ","ɔɪ","əʊ","aʊ","ɪə","eə","ʊə"];
function phonemeGroupOf(s){ if(PH_SINGLE.includes(s)) return "Nguyên âm đơn"; if(PH_DIPH.includes(s)) return "Nguyên âm đôi"; return "Phụ âm"; }
/* ----- Lớp hiển thị thêm: 44 âm theo ĐỘ KHÓ VỚI NGƯỜI VIỆT -----
   quen = tiếng Việt có âm gần giống, ít khi đọc sai nặng.
   lech = có âm quen gần giống nên người Việt hay đọc trượt sang âm quen
          (ví dụ /ɪ/ thành /i:/, /ʊ/ thành /u:/, /r/ thành /r/ rung kiểu Việt).
   kho  = tiếng Việt không có hẳn (/θ/ /ð/ /æ/ /ɜ:/ /ʒ/) - phải học khẩu hình mới;
          nhóm này cũng là nơi câu chuyện ÂM CUỐI hay bị nuốt được nhắc riêng.
   Lớp này chỉ thêm chip lọc + huy hiệu + ghi chú; thứ tự khóa tiến tuần tự 44
   âm và 3 khu nguyên âm đơn/đôi/phụ âm giữ nguyên không đổi. */
const PH_DIFF={"i:":"quen","e":"quen","ə":"quen","ɑ:":"quen","ɔ:":"quen","u:":"quen","aɪ":"quen","aʊ":"quen","eɪ":"quen","ɔɪ":"quen","m":"quen","n":"quen","ŋ":"quen","p":"quen","b":"quen","t":"quen","d":"quen","k":"quen","ɡ":"quen","f":"quen","s":"quen","h":"quen","l":"quen","j":"quen","ɪ":"lech","ʊ":"lech","ʌ":"lech","ɒ":"lech","ɪə":"lech","eə":"lech","ʊə":"lech","əʊ":"lech","v":"lech","z":"lech","tʃ":"lech","dʒ":"lech","ʃ":"lech","r":"lech","w":"lech","æ":"kho","ɜ:":"kho","θ":"kho","ð":"kho","ʒ":"kho"};
const PH_DIFF_META={quen:{label:"Dễ - âm quen với người Việt",dot:"#1e9e6a",note:"Các âm này tiếng Việt có âm gần giống nên học nhanh. Chỉ cần chú ý độ dài hơi (âm dài như /i:/, /u:/, /ɑ:/ phải kéo dài hơn hẳn âm ngắn) và vị trí lưỡi là nghe đã rõ ràng."},lech:{label:"Vừa - âm hay đọc lệch",dot:"#d99a17",note:"Các âm này có một âm quen gần giống trong tiếng Việt nên rất dễ bị đọc trượt sang âm quen: /ɪ/ hay thành /i:/ (ship thành sheep), /ʊ/ hay thành /u:/, /əʊ/ hay thành 'ô', /r/ hay rung như r tiếng Việt. Nghe kỹ điểm khác nhau của từng cặp rồi mới đọc theo."},kho:{label:"Khó - âm khó và âm cuối",dot:"#d9534f",note:"Đây là các âm tiếng Việt không có (/θ/, /ð/, /æ/, /ɜ:/, /ʒ/) - phải học khẩu hình mới hẳn, đừng cố tìm âm Việt thay thế. Riêng chuyện ÂM CUỐI: người Việt còn hay 'nuốt' âm cuối của từ (đọc 'cat' thiếu /t/, 'bus' thiếu /s/, 'watched' thiếu /t/) làm người nghe không hiểu hoặc hiểu sai thì - khi luyện các âm phụ âm, hãy bật hẳn âm cuối ra rồi dừng một nhịp mới sang từ tiếp theo."}};
let phDiffFilter=null;
function phonemeDiffOf(s){ return PH_DIFF[s]||"lech"; }
function phDiffCounts(){ const c={quen:0,lech:0,kho:0}; PH_SEQ.forEach(x=>{ c[phonemeDiffOf(x)]++; }); return c; }
function phZonesHTML(lock){ const btn=p=>{ if(!lock) return '<button class="ph-btn" data-s="'+esc(p.s)+'" data-diff="'+phonemeDiffOf(p.s)+'"'+(phDiffFilter&&phonemeDiffOf(p.s)!==phDiffFilter?' style="display:none"':"")+'>/'+esc(p.s)+'/<span class="ph-diff-dot" style="color:'+PH_DIFF_META[phonemeDiffOf(p.s)].dot+'">●</span></button>'; const ci=phonemeCurrentIdx(); const st=phonemeDone(p.s)?"done":(PH_SEQ[ci]===p.s?"cur":"lock"); return '<button class="ph-btn phst-'+st+'" data-s="'+esc(p.s)+'" data-diff="'+phonemeDiffOf(p.s)+'"'+(phDiffFilter&&phonemeDiffOf(p.s)!==phDiffFilter?' style="display:none"':"")+(st==="lock"?' data-lock="1"':"")+'>'+'<span class="ph-ipa">'+(st==="done"?"✓ ":"")+"/"+esc(p.s)+"/"+(st==="lock"?" 🔒":"")+'</span><span class="ph-ex">'+esc(p.w)+'</span><span class="ph-st">'+(st==="done"?"Đã xong":(st==="cur"?"Đang học":"Khóa"))+'</span><span class="ph-diff-dot" style="color:'+PH_DIFF_META[phonemeDiffOf(p.s)].dot+'">●</span></button>'; };
  const bySym=arr=>arr.map(s=>PHONEMES.find(p=>p.s===s)).filter(Boolean); const sg=bySym(PH_SINGLE), dp=bySym(PH_DIPH), cs=PHONEMES.filter(p=>!PH_SINGLE.includes(p.s)&&!PH_DIPH.includes(p.s)); const zone=(label,list)=>{ const vis=phDiffFilter?list.filter(p=>phonemeDiffOf(p.s)===phDiffFilter):list; if(phDiffFilter&&!vis.length) return '<div class="ph-zone-empty">Không có âm nào trong nhóm này ở khu '+label+'.</div>'; return '<div class="ph-zone">'+label+' ('+vis.length+' âm)</div>'+list.map(btn).join(""); };
  const head=lock?('<p class="ph-prog">Đã học '+phonemeDoneCount()+' trên 44 âm - học xong âm này, âm tiếp theo sẽ hiện ra.<span class="pn-progbar"><i style="width:'+Math.round(phonemeDoneCount()/44*100)+'%"></i></span></p><p class="mut" style="margin-bottom:2px">🗺️ Bản đồ 44 âm theo 3 khu: nguyên âm đơn là các âm ngắn gọn rung từ cổ họng, nguyên âm đôi là âm trượt từ âm này sang âm khác, phụ âm được tạo khi môi, răng và lưỡi chặn luồng hơi. Học lần lượt từng âm: âm có dấu ✓ là đã học xong, âm viền vàng là âm bạn đang học, âm có 🔒 sẽ mở ra khi bạn học xong âm ngay trước nó. Bấm vào một âm đã mở để học âm đó.</p>'):'<p class="mut" style="margin-bottom:2px">🗺️ Bản đồ 44 âm theo 3 khu: nguyên âm đơn là các âm ngắn gọn rung từ cổ họng, nguyên âm đôi là âm trượt từ âm này sang âm khác, phụ âm được tạo khi môi, răng và lưỡi chặn luồng hơi. Bấm vào một âm để xem khẩu hình của âm đó.</p>';
  const dc=phDiffCounts(); const diffbar='<div class="ph-diffbar"><span class="mut">Nhìn theo độ khó với người Việt:</span><button class="chip ph-diffchip'+(!phDiffFilter?" on":"")+'" data-phdiff="">Tất cả 44 âm</button>'+Object.keys(PH_DIFF_META).map(k=>'<button class="chip ph-diffchip'+(phDiffFilter===k?" on":"")+'" data-phdiff="'+k+'"><span style="color:'+PH_DIFF_META[k].dot+'">●</span> '+PH_DIFF_META[k].label+' ('+dc[k]+')</button>').join("")+'</div>'+(phDiffFilter&&PH_DIFF_META[phDiffFilter]?'<p class="ph-diffnote">'+PH_DIFF_META[phDiffFilter].note+'</p><p class="mut" style="margin:2px 0 4px">Đang xem nhóm: <b>'+PH_DIFF_META[phDiffFilter].label+'</b> - bấm một âm trong nhóm để học. Bộ lọc chỉ giúp nhìn rõ nhóm cần chú ý; thứ tự khóa tiến vẫn giữ nguyên.</p>':"");
  return '<div class="ph-zones">'+head+diffbar+'<div class="ph-grid">'+zone("Nguyên âm đơn",sg)+zone("Nguyên âm đôi",dp)+zone("Phụ âm",cs)+'</div></div>'; }

let gameSel=null, gameBand=null, gameRun=null, gameTimer=null;
const GAME_DEFS=[
 ["match","🔗","Nối từ thần tốc","Bấm một từ tiếng Anh rồi bấm đúng nghĩa tiếng Việt của nó. Nối đúng cả 8 cặp càng nhanh thì điểm càng cao."],
 ["unscramble","🔤","Giải mã chữ","Các chữ cái của một từ đã bị xáo trộn. Nhìn nghĩa tiếng Việt, đoán và gõ lại từ đúng. Đúng liên tiếp thì điểm cộng dồn theo chuỗi."],
 ["listeng","👂","Nghe và đoán","Bấm nút nghe để nghe một câu, rồi chọn đúng câu bạn vừa nghe trong 3 lựa chọn."],

 ["order","🧩","Xếp câu đúng","Các từ của một câu đang bị xáo trộn. Bấm chọn từng từ để xếp lại thành câu đúng."],
 ["quiz","🧗","Quiz leo thang","Trả lời trắc nghiệm ngữ pháp và câu kiểm tra thử: đúng liên tiếp thì lên cấp và cộng điểm theo chuỗi; sai thì mất một mạng (có 3 mạng)."]];
function gameBestAll(){ try{ return JSON.parse(localStorage.getItem("ielts_game_best_v1")||"{}"); }catch(e){ return {}; } }
function gameBest(id){ return gameBestAll()[id]||null; }
function saveGameBest(id,score,stars){ noteActivity(); const all=gameBestAll(); const prev=all[id]; if(!prev||score>prev.score){ all[id]={score:score,stars:stars,at:Date.now()}; try{ localStorage.setItem("ielts_game_best_v1",JSON.stringify(all)); }catch(e){} } }
function gameStars(frac){ return frac>=0.9?3:(frac>=0.6?2:(frac>0?1:0)); }
function starStr(n){ return n?("⭐".repeat(n)):"☆ chưa có sao"; }
function normSent(s){ return String(s||"").toLowerCase().replace(/[.!?,;:'"]/g,"").replace(/\s+/g," ").trim(); }
function gPoolVocab(band){ const out=[]; CONTENT.vocab.forEach(v=>{ const b=vocabSetBand(v); if(band!=="all"&&b!==band) return; (v.cards||[]).forEach(c=>{ if(c.w&&c.vi) out.push({w:String(c.w),vi:String(c.vi)}); }); }); return out; }
function gPoolListen(band){ return CONTENT.listening.filter(l=>{ if(band==="all") return true; const lb=listeningBand(l); return !lb||lb===band; }); }
function gPoolTyping(band){ const out=[]; CONTENT.typing.forEach(l=>{ if(band!=="all"&&itemBand(l)!==band) return; l.sentences.forEach(s=>out.push({s:s,title:l.title})); }); return out; }
function orderTokensFor(pieces,model){ const nm=normSent(model); const pos=pieces.map(p=>nm.indexOf(normSent(p))); if(pos.some(x=>x<0)) return null; return pieces.map((p,i)=>i).sort((a,b)=>pos[a]-pos[b]).map(i=>pieces[i]); }
function gPoolOrder(band){ const out=[]; (CONTENT.writingDrills||[]).forEach(d=>{ if(d.kind!=="order") return; if(band!=="all"&&d.band&&d.band!==band) return; const pieces=String(d.given||"").split(" / ").map(x=>x.trim()).filter(Boolean); const toks=orderTokensFor(pieces,String(d.model||"")); if(toks&&toks.length>=3) out.push({tokens:toks,model:String(d.model||"")}); }); gPoolTyping(band).forEach(t=>{ const ws=t.s.replace(/[.!?]+$/,"").split(/\s+/).filter(Boolean); if(ws.length>=4&&ws.length<=9) out.push({tokens:ws,model:t.s}); }); return out; }
function gPoolQuiz(band){ const out=[]; CONTENT.grammar.forEach(g=>{ if(band!=="all"&&itemBand(g)!==band) return; g.quiz.forEach(q=>out.push({q:q.q,o:q.o,a:q.a,why:q.why,sec:"grammar",from:g.name})); }); CONTENT.trial.forEach(q=>{ if(band!=="all"&&q.level!==band) return; out.push({q:q.q,o:q.options,a:q.a,why:q.why,sec:"trial",from:"Kiểm tra thử"}); }); return out; }
function widenPool(fn,band,min){ let p=fn(band); let w=false; if(p.length<min&&band!=="all"){ p=fn("all"); w=true; } return {pool:p,widened:w}; }
function openGamesForBand(b){ gameBand=b||"all"; gameSel=null; gameRun=null; if(gameTimer){ clearInterval(gameTimer); gameTimer=null; } go("games"); }
function startGame(id){ if(gameTimer){ clearInterval(gameTimer); gameTimer=null; } const band=gameBand||"all"; const run={id:id,band:band,score:0,finished:false,stars:0,endDetail:""};
  if(id==="match"){ const wp=widenPool(gPoolVocab,band,8); const seenW=new Set(), seenV=new Set(), uniq=[]; shuffleArr(wp.pool).forEach(c=>{ const k=c.w.toLowerCase(); if(!seenW.has(k)&&!seenV.has(c.vi)){ seenW.add(k); seenV.add(c.vi); uniq.push(c); } }); run.pairs=uniq.slice(0,8); run.meanings=shuffleArr(run.pairs.map(p=>p.vi)); run.selW=null; run.matched={}; run.wrong=0; run.left=90; run.deadline=Date.now()+90000; run.widened=wp.widened; }
  else if(id==="unscramble"){ const wp=widenPool(gPoolVocab,band,10); const seen=new Set(), words=[]; shuffleArr(wp.pool).forEach(c=>{ const w=c.w.toLowerCase(); if(/^[a-z]{4,10}$/.test(w)&&!seen.has(w)){ seen.add(w); words.push({w:w,vi:c.vi}); } }); run.queue=words.slice(0,10); run.i=0; run.streak=0; run.correct=0; run.widened=wp.widened; gUnSetCur(run); }
  else if(id==="listeng"){ const wp=widenPool(gPoolListen,band,8); run.queue=shuffleArr(wp.pool).slice(0,8); run.i=0; run.correct=0; run.widened=wp.widened; gLisSetCur(run); }
  else if(id==="typerace"){ const wp=widenPool(gPoolTyping,band,1); const cand=wp.pool.filter(t=>{ const n=t.s.split(/\s+/).length; return n>=5&&n<=16; }); const src=cand.length?cand:wp.pool; run.cur=src.length?src[Math.floor(Math.random()*src.length)]:null; run.started=null; run.typed=""; run.widened=wp.widened; }
  else if(id==="order"){ const wp=widenPool(gPoolOrder,band,6); run.queue=shuffleArr(wp.pool).slice(0,8); run.i=0; run.correct=0; run.widened=wp.widened; gOrdSetCur(run); }
  else if(id==="quiz"){ const wp=widenPool(gPoolQuiz,band,5); run.queue=shuffleArr(wp.pool).slice(0,12); run.i=0; run.streak=0; run.best=0; run.lives=3; run.correct=0; run.answered=0; run.widened=wp.widened; run.fb=null; }
  const empty=(id==="match"&&!run.pairs.length)||((id==="unscramble"||id==="listeng"||id==="order"||id==="quiz")&&!run.queue.length)||(id==="typerace"&&!run.cur);
  if(empty){ toast("Chưa đủ dữ liệu để chơi game này."); return; }
  gameSel=id; gameRun=run; render(); }
function gameEndHTML(run){ const best=gameBest(run.id); const def=GAME_DEFS.find(g=>g[0]===run.id); const st=run.stars||0; return '<div class="gm-end gm-acc-'+run.id+'"><div class="gm-ic">'+(def?def[1]:"🎮")+'</div><h3 class="gm-end-t">🏁 Hết ván!</h3><div class="gm-stars">'+[1,2,3].map(i=>'<span class="gm-star'+(i<=st?" on":"")+'">★</span>').join("")+'</div><p class="gm-end-score">Điểm của bạn: <b>'+run.score+'</b></p><p class="mut">Sao đạt được: '+starStr(st)+'</p>'+(run.endDetail||"")+(best?'<p class="mut" style="margin-top:4px">🏆 Kỷ lục của game này: '+best.score+' điểm · '+starStr(best.stars)+'</p>':"")+'<div class="row gm-end-btns"><button class="btn" id="gmAgain">🔁 Chơi lại ván mới</button><button class="btn light" id="gmHub">Về khu Trò chơi</button></div></div>'; }

function gmRenderMatch(body,run){ body.innerHTML='<div class="gm-hud"><span class="gm-stat">⭐ Điểm: <b id="gmScore">'+run.score+'</b></span><span class="gm-stat">⏱ Còn: <b id="gmTime">'+run.left+'</b> giây</span><span class="gm-stat">🔗 Đã nối: <b id="gmDone">'+Object.keys(run.matched).length+'</b>/'+run.pairs.length+'</span></div>'+(run.widened?'<p class="mut" style="margin-top:6px">Kho từ ở band này hơi ít nên ván này lấy thêm từ ở mọi band.</p>':"")+'<p class="mut" style="margin-top:8px">Bấm vào một từ tiếng Anh ở cột trái, rồi bấm vào nghĩa tiếng Việt đúng của nó ở cột phải.</p><div class="gm-match"><div class="gm-col">'+run.pairs.map(p=>'<button class="gm-w'+(run.matched[p.w]?" done":"")+'" data-w="'+esc(p.w)+'" '+(run.matched[p.w]?"disabled":"")+'>'+esc(p.w)+'</button>').join("")+'</div><div class="gm-col">'+run.meanings.map(m=>{ const used=run.pairs.some(p=>p.vi===m&&run.matched[p.w]); return '<button class="gm-m'+(used?" done":"")+'" data-vi="'+esc(m)+'" '+(used?"disabled":"")+'>'+esc(m)+'</button>'; }).join("")+'</div></div><div id="gmFb" style="margin-top:8px"></div>';

  $$(".gm-m",body).forEach(b=>b.onclick=()=>{ if(run.finished) return; if(!run.selW){ fb('<span class="badtxt">Hãy bấm chọn một từ tiếng Anh ở cột trái trước.</span>'); return; } const pair=run.pairs.find(p=>p.w===run.selW); if(!pair) return;
    if(pair.vi===b.dataset.vi){ run.matched[pair.w]=true; run.score+=10; const wb=body.querySelector('.gm-w[data-w="'+CSS.escape(pair.w)+'"]'); if(wb){ wb.classList.add("done"); wb.disabled=true; } b.classList.add("done"); b.disabled=true; const sc=$("#gmScore"); if(sc) sc.textContent=run.score; const dn=$("#gmDone"); if(dn) dn.textContent=Object.keys(run.matched).length; fb('<span class="oktxt"><b>Đúng!</b> "'+esc(pair.w)+'" nghĩa là: '+esc(pair.vi)+'</span>'); run.selW=null; $$(".gm-w",body).forEach(x=>x.classList.remove("sel")); if(Object.keys(run.matched).length>=run.pairs.length) gmFinishMatch(run); }
    else { run.wrong++; logError({sec:"vocab",kind:"type",q:'Nối từ trong game: "'+pair.w+'"',a:pair.vi,why:'"'+pair.w+'" nghĩa là: '+pair.vi}); fb('<span class="badtxt"><b>Chưa đúng.</b> "'+esc(pair.w)+'" không có nghĩa đó - lỗi này đã được lưu vào Sổ lỗi sai để ôn lại.</span>'); b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),600); } });
  if(gameTimer) clearInterval(gameTimer); gameTimer=setInterval(()=>{ if(curTab!=="games"||!gameRun||gameRun.id!=="match"||gameRun.finished){ clearInterval(gameTimer); gameTimer=null; return; } run.left=Math.max(0,Math.round((run.deadline-Date.now())/1000)); const t=$("#gmTime"); if(t){ t.textContent=run.left; const chip=t.closest?t.closest(".gm-stat"):null; if(chip) chip.classList.toggle("gm-low",run.left<=10); } if(run.left<=0) gmFinishMatch(run); },250); }
function gmFinishMatch(run){ if(run.finished) return; run.finished=true; if(gameTimer){ clearInterval(gameTimer); gameTimer=null; } const m=Object.keys(run.matched).length; const bonus=m>=run.pairs.length?run.left:0; run.score+=bonus; run.stars=gameStars(run.pairs.length?m/run.pairs.length:0); run.endDetail='<p style="margin-top:4px">Bạn đã nối đúng '+m+'/'+run.pairs.length+' cặp, chọn sai '+run.wrong+' lần.'+(bonus?(' Nối xong trước giờ nên được cộng thêm '+bonus+' điểm thời gian.'):"")+'</p>'; saveGameBest("match",run.score,run.stars); const body=$("#gmBody"); if(body){ body.innerHTML=gameEndHTML(run); wireGameEnd(); } }

function gUnSetCur(run){ const it=run.queue[run.i]; if(!it){ run.cur=null; return; } let scr=it.w; for(let k=0;k<12;k++){ const a=it.w.split(""); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } scr=a.join(""); if(scr!==it.w) break; } run.cur={w:it.w,vi:it.vi,scrambled:scr}; run.hint=false; run.fb=null; }

  const fb=$("#gmFb",body); if(run.fb&&fb) fb.innerHTML=run.fb;

  const chk=$("#gmCheck",body); if(chk) chk.onclick=()=>{ const v=(inp?inp.value:"").trim().toLowerCase(); if(!v){ toast("Hãy gõ từ bạn đoán trước đã."); return; } gUnAnswer(run,v); render(); };
  const hb=$("#gmHint",body); if(hb) hb.onclick=()=>{ run.hint=true; run.score=Math.max(0,run.score-2); render(); };
  const nx=$("#gmNext",body); if(nx) nx.onclick=()=>{ run.i++; if(run.i>=run.queue.length){ run.finished=true; run.stars=gameStars(run.queue.length?run.correct/run.queue.length:0); run.endDetail='<p style="margin-top:4px">Bạn giải đúng '+run.correct+'/'+run.queue.length+' từ.</p>'; saveGameBest("unscramble",run.score,run.stars); } else gUnSetCur(run); render(); }; }
function gUnAnswer(run,typed){ const cur=run.cur; if(typed===cur.w){ run.streak++; run.correct++; const pts=10+Math.min(6,Math.max(0,run.streak-1)); run.score+=pts; run.fb='<span class="oktxt"><b>Đúng!</b> Từ "'+esc(cur.w)+'" nghĩa là: '+esc(cur.vi)+' (+'+pts+' điểm)</span>'; } else { run.streak=0; logError({sec:"vocab",kind:"type",q:"Giải mã chữ trong game: "+cur.scrambled+" (nghĩa: "+cur.vi+")",a:cur.w,why:'Từ đúng là "'+cur.w+'" - nghĩa: '+cur.vi}); run.fb='<span class="badtxt"><b>Chưa đúng.</b> Bạn gõ "'+esc(typed)+'", từ đúng là "'+esc(cur.w)+'" - nghĩa: '+esc(cur.vi)+'. Lỗi đã lưu vào Sổ lỗi sai.</span>'; } }

/* ----- Game 3: Nghe và đoán ----- */
function gLisSetCur(run){ const it=run.queue[run.i]; if(!it){ run.cur=null; return; } const others=CONTENT.listening.filter(l=>l!==it&&l.section===it.section); const ds=shuffleArr(others).slice(0,2); let guard=0; while(ds.length<2&&guard++<60){ const c=CONTENT.listening[Math.floor(Math.random()*CONTENT.listening.length)]; if(c!==it&&ds.indexOf(c)<0) ds.push(c); } const opts=shuffleArr([it].concat(ds)); run.cur={text:it.text,topic:it.topic,opts:opts.map(x=>x.text),a:opts.indexOf(it)}; run.fb=null; }
function gmRenderListen(body,run){ const cur=run.cur; if(!cur){ body.innerHTML=gameEndHTML(run); wireGameEnd(); return; }
  body.innerHTML='<div class="gm-hud"><span class="gm-stat">⭐ Điểm: <b>'+run.score+'</b></span><span class="gm-stat">🎧 Câu: <b>'+(run.i+1)+'/'+run.queue.length+'</b></span><span class="gm-stat">📌 Chủ đề: <b>'+esc(cur.topic||"")+'</b></span></div>'+(run.widened&&run.i===0?'<p class="mut" style="margin-top:6px">Kho câu nghe ở band này hơi ít nên ván này lấy thêm câu ở mọi band.</p>':"")+'<p class="mut" style="margin-top:8px">Bấm Nghe câu, nghe kỹ rồi chọn đúng câu bạn vừa nghe trong 3 lựa chọn.</p><div class="row" style="margin-top:8px"><button class="btn" id="gmPlay">▶ Nghe câu</button><button class="btn light" id="gmPlaySlow">🐢 Nghe chậm</button></div><div style="margin-top:10px">'+cur.opts.map((o,oi)=>{ let cls=""; if(run.fb){ if(oi===cur.a) cls=" right"; else if(oi===run.fb.chosen) cls=" wrong"; } return '<button class="opt gm-opt'+cls+'" data-i="'+oi+'" '+(run.fb?"disabled":"")+'>'+esc(o)+'</button>'; }).join("")+'</div><div id="gmFb" style="margin-top:8px"></div>'+(run.fb?'<div class="row" style="margin-top:8px"><button class="btn teal" id="gmNext">'+(run.i>=run.queue.length-1?"Xem kết quả":"Câu tiếp theo")+'</button></div>':"");
  const fb=$("#gmFb",body); if(run.fb&&fb) fb.innerHTML=run.fb.html;
  const pl=$("#gmPlay",body); if(pl) pl.onclick=()=>speak(cur.text,1); const ps=$("#gmPlaySlow",body); if(ps) ps.onclick=()=>speak(cur.text,0.6);

  const nx=$("#gmNext",body); if(nx) nx.onclick=()=>{ run.i++; if(run.i>=run.queue.length){ run.finished=true; run.stars=gameStars(run.queue.length?run.correct/run.queue.length:0); run.endDetail='<p style="margin-top:4px">Bạn nghe đúng '+run.correct+'/'+run.queue.length+' câu.</p>'; saveGameBest("listeng",run.score,run.stars); } else gLisSetCur(run); render(); }; }

function gmRenderType(body,run){ body.innerHTML='<p class="mut">Câu mẫu lấy từ bài "'+esc(run.cur.title)+'". Gõ lại y hệt câu ở khung trên vào ô dưới: càng đúng và càng nhanh, điểm càng cao.</p>'+(run.widened?'<p class="mut" style="margin-top:6px">Kho câu ở band này hơi ít nên ván này lấy thêm câu ở mọi band.</p>':"")+'<div class="typesent" style="margin-top:10px">'+esc(run.cur.s)+'</div><textarea id="gmTypeInp" rows="2" style="margin-top:10px" placeholder="Gõ lại câu ở trên vào đây..."></textarea><div class="gm-hud"><span class="gm-stat" id="gmTypeStat">Đã gõ 0/'+run.cur.s.length+' ký tự</span></div><div class="row" style="margin-top:8px"><span class="grow"></span><button class="btn teal" id="gmTypeDone">Chấm câu này</button></div>';
  const inp=$("#gmTypeInp",body); if(inp){ inp.focus(); inp.addEventListener("input",()=>{ if(!run.started) run.started=Date.now(); run.typed=inp.value; const st=$("#gmTypeStat",body); if(st) st.textContent="Đã gõ "+inp.value.length+"/"+run.cur.s.length+" ký tự"; }); inp.addEventListener("paste",e=>e.preventDefault()); }
  const dn=$("#gmTypeDone",body); if(dn) dn.onclick=()=>{ gTypeFinish(run); render(); }; }
function gTypeFinish(run){ const target=run.cur.s; const typed=run.typed||""; let cor=0; for(let i=0;i<Math.min(typed.length,target.length);i++){ if(typed[i]===target[i]) cor++; } const acc=target.length?Math.round(cor/target.length*100):0; const words=target.split(/\s+/).length; const mins=run.started?(Date.now()-run.started)/60000:0; const wpm=run.started?Math.max(1,Math.round(words/Math.max(mins,0.05))):0; const bonus=wpm>=35?20:(wpm>=25?12:(wpm>=15?6:0)); run.score=acc+bonus; run.stars=gameStars(acc/100); if(acc<100) logError({sec:"typing",kind:"type",q:"Đua gõ câu trong game: "+target,a:target,why:"Độ chính xác của bạn: "+acc+"% - gõ sai hoặc thiếu "+(target.length-cor)+" ký tự. Hãy gõ lại câu này cho khớp từng ký tự."}); run.endDetail='<p style="margin-top:4px">Độ chính xác: <b>'+acc+'%</b> · Tốc độ: <b>'+wpm+' WPM</b> · Điểm cộng tốc độ: '+bonus+'</p>'; run.finished=true; saveGameBest("typerace",run.score,run.stars); }

function gmRenderOrder(body,run){ const cur=run.cur; if(!cur){ body.innerHTML=gameEndHTML(run); wireGameEnd(); return; } const pool=cur.shown.filter(x=>cur.picked.indexOf(x.id)<0);

  const fb=$("#gmFb",body); if(run.fb&&fb) fb.innerHTML=run.fb.html;
  $$(".gm-tok",body).forEach(b=>b.onclick=()=>{ cur.picked.push(+b.dataset.id); render(); });
  $$(".gm-ans",body).forEach(b=>b.onclick=()=>{ cur.picked=cur.picked.filter(id=>id!==+b.dataset.id); render(); });
  const rs=$("#gmResetOrder",body); if(rs) rs.onclick=()=>{ cur.picked=[]; render(); };
  const ck=$("#gmCheckOrder",body); if(ck) ck.onclick=()=>{ if(cur.picked.length<cur.tokens.length){ toast("Hãy xếp đủ "+cur.tokens.length+" từ trước khi kiểm tra."); return; } const got=cur.picked.map(id=>cur.shown.find(x=>x.id===id).t); if(normSent(got.join(" "))===normSent(cur.tokens.join(" "))){ run.score+=10; run.correct++; run.fb={ok:true,html:'<span class="oktxt"><b>Đúng!</b> Câu đúng là: '+esc(cur.model)+'</span>'}; } else { logError({sec:"writing",kind:"type",q:"Xếp câu trong game: "+cur.shown.map(x=>x.t).join(" / "),a:cur.model,why:"Thứ tự đúng là: "+cur.model}); run.fb={ok:false,html:'<span class="badtxt"><b>Chưa đúng.</b> Thứ tự đúng là: '+esc(cur.model)+' - lỗi đã lưu vào Sổ lỗi sai.</span>'}; } render(); };
  const nx=$("#gmNext",body); if(nx) nx.onclick=()=>{ run.i++; if(run.i>=run.queue.length){ run.finished=true; run.stars=gameStars(run.queue.length?run.correct/run.queue.length:0); run.endDetail='<p style="margin-top:4px">Bạn xếp đúng '+run.correct+'/'+run.queue.length+' câu.</p>'; saveGameBest("order",run.score,run.stars); } else gOrdSetCur(run); render(); }; }

/* ----- Game 6: Quiz leo thang ----- */
function gmRenderQuiz(body,run){ const cur=run.queue[run.i]; if(!cur){ body.innerHTML=gameEndHTML(run); wireGameEnd(); return; } const level=1+Math.floor(run.best/3);
  body.innerHTML='<div class="gm-hud"><span class="gm-stat">⭐ Điểm: <b>'+run.score+'</b></span><span class="gm-stat">🧗 Cấp: <b>'+level+'</b></span><span class="gm-stat">Mạng: <b>'+"❤️".repeat(Math.max(0,run.lives))+"🖤".repeat(Math.max(0,3-run.lives))+'</b></span><span class="gm-stat">🔥 Chuỗi đúng: <b>'+run.streak+'</b></span></div>'+(run.widened&&run.i===0?'<p class="mut" style="margin-top:6px">Kho câu hỏi ở band này hơi ít nên ván này lấy thêm câu ở mọi band.</p>':"")+'<p style="margin-top:10px"><b>Câu '+(run.i+1)+':</b> '+esc(cur.q)+'</p><p class="mut">Nguồn: '+esc(cur.from)+'</p><div style="margin-top:6px">'+cur.o.map((o,oi)=>{ let cls=""; if(run.fb){ if(oi===cur.a) cls=" right"; else if(oi===run.fb.chosen) cls=" wrong"; } return '<button class="opt gm-qopt'+cls+'" data-i="'+oi+'" '+(run.fb?"disabled":"")+'>'+esc(o)+'</button>'; }).join("")+'</div><div id="gmFb" style="margin-top:8px"></div>'+(run.fb?'<div class="row" style="margin-top:8px"><button class="btn teal" id="gmNext">'+((run.lives<=0||run.i>=run.queue.length-1)?"Xem kết quả":"Câu tiếp theo")+'</button></div>':"");

  const nx=$("#gmNext",body); if(nx) nx.onclick=()=>{ if(run.lives<=0||run.i>=run.queue.length-1){ run.finished=true; run.stars=gameStars(run.answered?run.correct/run.answered:0); run.endDetail='<p style="margin-top:4px">Bạn trả lời đúng '+run.correct+'/'+run.answered+' câu · Cấp cao nhất đã leo: Cấp '+(1+Math.floor(run.best/3))+' · Chuỗi đúng dài nhất: '+run.best+' câu liên tiếp.</p>'; saveGameBest("quiz",run.score,run.stars); } else { run.i++; run.fb=null; } render(); }; }

/* ================= TÀI KHOẢN ================= */
/* ================= ĐIỂM DANH, THÔNG BÁO NHẮC NHỞ, BẢNG THEO DÕI TIẾN ĐỘ =================
   Cả ba tính năng dựng trên dữ liệu thật sẵn có: state.checkin (đồng bộ qua meta:checkin
   giống meta:hard), state.progress, state.cards, state.errors, state.hard và kỷ lục game. */
function checkinDays(){ if(!state.checkin||typeof state.checkin!=="object"||Array.isArray(state.checkin)) state.checkin={}; return state.checkin; }
function syncCheckin(){ setProg("meta","checkin",{days:Object.assign({},checkinDays())}); }
/* ================= ĐIỂM KINH NGHIỆM (XP) =================
   XP nội bộ của người học: lưu trong state.xp, đồng bộ qua khóa riêng meta "xp"
   (không đụng các khóa cũ). Điểm chỉ cộng tại đúng các điểm hoàn thành đã có sẵn
   trong code: học xong một bài, ôn xong một mục SRS, điểm danh, mốc chuỗi điểm
   danh. Bảng giá công khai là XP_RULES - hiển thị ở cửa Của tôi và cạnh dòng XP
   ở trang chủ, đúng các mức đang áp dụng thật, không hơn không kém. */
const XP_RULES=[["Hoàn thành một bài học lần đầu (ngữ pháp, đọc, nghe, nói, writing, thực chiến, nghe dài)",10],["Hoàn thành một bài Gõ câu lần đầu",20],["Hoàn thành một bài Luyện viết từng bước (ghép câu, viết lại câu, sắp xếp câu) lần đầu",20],["Học lại một bài đã hoàn thành (làm lại và chấm lại bài đó)",5],["Ôn xong một mục ôn tập giãn cách (một thẻ từ, một lỗi sai hoặc một mục khó)",1],["Điểm danh trong ngày (bấm nút Điểm danh, hoặc học bất kỳ mục nào trong ngày)",5],["Chuỗi điểm danh đạt mốc 7 ngày (mỗi mốc chỉ nhận một lần)",50],["Chuỗi điểm danh đạt mốc 30 ngày (mỗi mốc chỉ nhận một lần)",150],["Chuỗi điểm danh đạt mốc 100 ngày (mỗi mốc chỉ nhận một lần)",400]];
const XP_STREAK_BONUS=[[7,50],[30,150],[100,400]];
function xpState(){ if(!state.xp||typeof state.xp!=="object"||typeof state.xp.total!=="number"||!isFinite(state.xp.total)) state.xp={total:0,claimed:{}}; if(!state.xp.claimed||typeof state.xp.claimed!=="object"||Array.isArray(state.xp.claimed)) state.xp.claimed={}; return state.xp; }
function syncXp(){ const x=xpState(); setProg("meta","xp",{total:x.total,claimed:Object.assign({},x.claimed)}); }
function awardXp(n){ if(!n||n<=0) return 0; const x=xpState(); x.total+=n; saveLocal(); syncXp(); return n; }
function xpClaimed(k){ return !!xpState().claimed[k]; }
function xpFirst(key,pts){ if(xpClaimed(key)) return 0; xpState().claimed[key]=1; return awardXp(pts); }
/* Thang cấp độ XP: mốc XP tích lũy để đạt từng cấp; sau Cấp 10, mỗi cấp cần thêm 700 XP. */
const XP_LEVEL_STARTS=[0,50,120,220,350,520,750,1050,1450,2000];
function xpLevelInfo(total){ total=Math.max(0,Math.floor(total||0)); let lvl=1,start=0,next=XP_LEVEL_STARTS[1];
  for(let i=0;i<XP_LEVEL_STARTS.length;i++){ if(total>=XP_LEVEL_STARTS[i]){ lvl=i+1; start=XP_LEVEL_STARTS[i]; next=(i+1<XP_LEVEL_STARTS.length)?XP_LEVEL_STARTS[i+1]:start+700; } }
  while(total>=next){ start=next; next+=700; lvl++; }
  return {level:lvl,into:total-start,span:next-start,toNext:next-total,nextAt:next}; }
function xpBarHTML(){ const x=xpState(); const li=xpLevelInfo(x.total); const pct=li.span?Math.min(100,Math.round(li.into/li.span*100)):0;
  return `<div class="row" style="gap:8px"><span style="font-size:19px">⭐</span><span><b>${x.total} XP</b> · Cấp độ người học: <b>Cấp ${li.level}</b></span><span class="grow"></span><span class="mut">Còn ${li.toNext} XP nữa lên Cấp ${li.level+1}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>`; }
function xpRulesHTML(){ return `<div style="margin-top:10px"><b>🏆 Cách nhận XP - bảng giá công khai (đúng các mức web đang cộng)</b>${XP_RULES.map(r=>`<p style="margin:4px 0">· ${esc(r[0])}: <b>+${r[1]} XP</b></p>`).join("")}<p class="mut" style="margin-top:4px">Thang cấp độ: Cấp 2 ở 50 XP · Cấp 3 ở 120 XP · Cấp 4 ở 220 XP · Cấp 5 ở 350 XP · Cấp 6 ở 520 XP · Cấp 7 ở 750 XP · Cấp 8 ở 1.050 XP · Cấp 9 ở 1.450 XP · Cấp 10 ở 2.000 XP; từ Cấp 10 trở đi, mỗi cấp cần thêm 700 XP.</p></div>`; }
function doCheckin(){ const t=today(); const days=checkinDays(); if(days[t]) return false; days[t]=Date.now(); saveLocal(); syncCheckin(); awardXp(5); const s=checkinStreak(); XP_STREAK_BONUS.forEach(([m,pts])=>{ if(s>=m) xpFirst("streak"+m,pts); }); return true; }
function noteActivity(){ doCheckin(); }
function checkedOn(ds){ return !!checkinDays()[ds]; }
function checkinStreak(){ const days=checkinDays(); let n=0; let d=today(); if(!days[d]) d=addDays(d,-1); while(days[d]){ n++; d=addDays(d,-1); } return n; }
function checkinBest(){ const ds=Object.keys(checkinDays()).sort(); let best=0,run=0,prev=null; for(const d of ds){ run=(prev&&addDays(prev,1)===d)?run+1:1; if(run>best)best=run; prev=d; } return best; }
let ciMonthOff=0;
function ciMonthBase(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+ciMonthOff); return d; }
function ciCalendarHTML(){ const base=ciMonthBase(); const y=base.getFullYear(), m=base.getMonth(); const dim=new Date(y,m+1,0).getDate(); const lead=(new Date(y,m,1).getDay()+6)%7; const days=checkinDays(); const t=today(); let cells=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div style="text-align:center;font-weight:700;color:var(--mut);font-size:12px;padding:3px 0">${x}</div>`).join("");
  for(let i=0;i<lead;i++) cells+="<div></div>";
  for(let d=1;d<=dim;d++){ const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); const on=!!days[ds]; const isT=ds===t; const past=ds<t;
    cells+=`<div style="text-align:center;padding:5px 0;border-radius:8px;font-size:13px;${on?"background:#eafaf1;color:#0d7a4f;font-weight:700;":""}${isT?"outline:2px solid var(--gold);outline-offset:-2px;font-weight:700;":""}${(!on&&past)?"color:#A89F8D;":""}">${d}${on?" ✓":""}</div>`; }
  return `<div class="row" style="margin-bottom:6px"><button class="btn light ci-prev" style="padding:4px 10px">‹ Tháng trước</button><b style="flex:1;text-align:center">Tháng ${m+1}/${y}</b><button class="btn light ci-next" style="padding:4px 10px">Tháng sau ›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div><p class="mut" style="margin-top:6px">Ngày có dấu ✓ là ngày đã điểm danh. Ngày đã qua mà trống là ngày vắng. Hôm nay được viền vàng.</p>`; }
function renderCiCals(){ $$(".ci-cal").forEach(el=>{ el.innerHTML=ciCalendarHTML(); }); $$(".ci-prev").forEach(b=>b.onclick=()=>{ ciMonthOff--; renderCiCals(); }); $$(".ci-next").forEach(b=>b.onclick=()=>{ ciMonthOff++; renderCiCals(); }); }
function checkinCardHTML(){ const on=checkedOn(today());

/* ================= GÕ CÂU (câu mẫu Writing) ================= */
let typingSel=null, typingRun=null;
let typingMode="adv";
/* Thang độ khó Gõ câu:
   - "adv" (Nâng cao, MẶC ĐỊNH): gõ thẳng câu hoàn chỉnh như trước nay.
   - "basic" (Cơ bản): mỗi câu đi 3 pha - pha 1 gõ từng từ của câu, pha 2 gõ
     từng mảnh 3 từ liên tiếp, pha 3 gõ cả câu hoàn chỉnh.
   Các pha suy ra từ chính câu mẫu có sẵn (tách từ theo khoảng trắng, bỏ dấu
   câu ở pha từ cho dễ gõ) - không thêm dữ kiện nào ngoài câu mẫu. */
function typingUnits(L,mode){ if(mode!=="basic") return (L.sentences||[]).map((t,si)=>({text:t,si:si,phase:3}));
  const units=[]; (L.sentences||[]).forEach((sent,si)=>{ const raw=sent.split(/\s+/).filter(Boolean); const words=[]; raw.forEach(w=>{ const cw=w.replace(/[.!?,;:"\u201C\u201D]/g,""); if(cw&&words.indexOf(cw)<0) words.push(cw); });
    words.forEach(w=>units.push({text:w,si:si,phase:1}));
    for(let i=0;i<raw.length;i+=3) units.push({text:raw.slice(i,i+3).join(" "),si:si,phase:2});
    units.push({text:sent,si:si,phase:3}); });
  return units; }
