<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học tiếng Anh từ đầu — Bản mới</title>
<style>
:root{--paper:#FFFBF2;--ink:#1F2430;--amber:#FFB800;--amber2:#FFC800;--coral:#FF6B4A;--coralD:#F0522E;--line:#E7DCC6;--line2:#F0E7D8;--green:#1E9E6A;--red:#D9534F;--mut:#6E6A61}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header h1{font-size:22px;margin:6px 0 2px}
header .sub{color:var(--mut);font-size:14px}
.tabbar{display:flex;gap:6px;position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.tab.on{background:var(--amber);border-color:var(--amber);font-weight:700}
.card{background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:16px;margin:12px 0}
h2{font-size:20px;margin:2px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 20px;font-size:16px;cursor:pointer;background:#fff;border:1.5px solid var(--line);margin:4px 4px 4px 0}
.btn-primary{background:var(--coral);color:#fff;border-color:var(--coralD);font-weight:700}
.btn-amber{background:var(--amber);border-color:var(--amber);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.chip.cur{background:var(--amber2);border-color:var(--amber);font-weight:700}
.bar{height:14px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:999px}
.dimlink{color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px;background:none;border:0;padding:0}
.lessonframe{position:sticky;top:52px;background:var(--paper);padding:8px 0;z-index:4;border-bottom:1.5px solid var(--line2)}
.qblock{background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:16px;margin:12px 0}
.why{display:none;background:#FFF8E1;border:1.5px solid var(--amber);border-radius:14px;padding:10px 12px;margin:10px 0}
.why.show{display:block}
.summarybox{background:#fff;border:2px solid var(--amber);border-radius:18px;padding:16px;margin:12px 0}
.sumcard{background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0}
.bigletter{font-size:76px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.step-row{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left;font-size:16px}
.step-row.done{border-color:var(--green)}
.step-row.cur{border-color:var(--amber);border-width:2px;background:#FFFBEA}
.step-row.future{opacity:.62}
.step-row .num{font-weight:800;min-width:26px}
.step-row .st{margin-left:auto;font-size:20px}
.ph-table{display:flex;flex-wrap:wrap;gap:6px}
.ph-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:15px}
.ph-btn.done{border-color:var(--green)}
.ph-btn.cur{border-color:var(--amber);border-width:2px;background:#FFFBEA}
.ph-btn.lock{opacity:.55}
.ph-figs{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ph-fig{margin:0;text-align:center;font-size:13px;color:var(--mut)}
.ph-arrow{font-size:22px;align-self:center}
.jawline{margin:8px 0;font-size:14px}
.jaw-segs i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--line2);margin-right:2px}
.jaw-segs i.on{background:var(--amber)}
.g-tile{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font-size:17px;cursor:pointer;min-width:110px;text-align:center}
.g-tile.sel{border-color:var(--amber);border-width:2px;background:#FFFBEA}
.g-tile.ok{border-color:var(--green);background:#EAF7F0;color:var(--green)}
.g-tile.bad{border-color:var(--red);background:#FDECEA}
.q-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-size:16px;cursor:pointer}
.q-opt.ok{border-color:var(--green);background:#EAF7F0}
.q-opt.bad{border-color:var(--red);background:#FDECEA}
.q-opt:disabled{cursor:default}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;display:none;z-index:50;max-width:92vw;text-align:center}
#previewBanner{background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
#nudgeModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#nudgeModal .box{background:#fff;border-radius:18px;padding:20px;max-width:480px}
input[type=text],input[type=number]{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px}
iframe{width:100%;aspect-ratio:16/9;border:1.5px solid var(--line2);border-radius:14px}
.mirror-box{margin-top:14px}.mr-video{transform:scaleX(-1);width:100%;max-width:420px;border-radius:14px;background:#000}.mr-stage{position:relative;max-width:420px}.mr-overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.mr-feed table{width:100%;border-collapse:collapse}.mr-feed td,.mr-feed th{border-bottom:1px solid #E7DCC6;padding:4px 6px;text-align:left;font-size:13px}.mr-lib-row{display:flex;gap:10px;flex-wrap:wrap}.mr-item{width:280px}.mr-item video{width:100%;border-radius:12px}.ai-good{color:#1E9E6A;font-weight:700}.ai-mid{color:#B7791F;font-weight:700}.ai-bad{color:#D9534F;font-weight:700}
.mr-overlay{filter:drop-shadow(0 0 3px rgba(0,0,0,0.85))}
.chat-msg{border:1.5px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff}
.chat-msg.user{background:#FFFBEA}
.chat-msg.ai{background:#fff}
.mr-diag{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Học tiếng Anh từ đầu</h1><div class="sub">Bản mới — học theo từng bước, không vội, không rối.</div></header>
<div id="previewBanner">Bạn đang ở chế độ xem trước — tiến trình lưu trên máy này, chưa đồng bộ tài khoản. Đồng bộ Supabase sẽ mở ở giai đoạn 2.</div>
<nav class="tabbar" id="tabBar">
<button class="tab" data-tab="home">Học</button>
<button class="tab" data-tab="roadmap">Lộ trình</button>
<button class="tab" data-tab="practice">Luyện tập</button>
<button class="tab" data-tab="review">Ôn tập</button>
<button class="tab" data-tab="mine">Của tôi</button>
</nav>
<main id="app"></main>
<div id="toast"></div>
<div id="nudgeModal"><div class="box" id="nudgeBox"></div></div>
</div>
<script src="config.js"></script>
<script src="content.js"></script>
<script src="content-new.js"></script>
<script>
"use strict";
/* ============ SHELL BẢN MỚI — GIAI ĐOẠN 1 ============
   Một nguồn số liệu duy nhất: state (localStorage ielts_rebuild_v1).

var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDaysStr(base, n) { var d = new Date(base + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtBandComma(b) { return (Math.round(b * 10) / 10).toFixed(1).replace(".", ","); }
function speak(text, rate) { try { if (window.speechSynthesis && window.SpeechSynthesisUtterance) { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; if (rate) u.rate = rate; window.speechSynthesis.speak(u); } } catch (e) {} }
var toastTimer = null;
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.style.display = "block"; if (toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = "none"; }, 3200); }

/* ---------- Minh họa khẩu hình (port từ code cũ của trang, dữ liệu RB_PH1) ---------- */
function mouthSVG(p) {

  return '<svg viewBox="0 0 240 178" style="width:100%;max-width:300px;height:auto;background:#fffdf8;border:1px solid var(--line);border-radius:14px" role="img" aria-label="Khẩu hình âm /' + p.s + '/">'
    + '<path d="M57,80 C52,84 50,88 52,92 C50,96 52,100 55,103 C56,110 60,118 66,126 C74,136 88,141 108,143 C140,146 168,145 186,140 C196,137 201,148 203,160 L203,172 L216,172 C218,150 218,118 212,92 C206,58 188,32 156,21 C126,11 98,13 82,28 C70,39 64,50 61,61 C56,66 50,70 50,74 C50,78 53,80 57,80 Z" fill="#fdeed6" stroke="#cf9a58" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<path d="M66,88 C100,76 150,72 178,84 L186,96 C187,118 181,133 168,138 C130,144 90,142 74,134 C64,128 62,104 66,88 Z" fill="#bd7261"/>'
    + '<path d="M57,77 C84,60 122,53 156,58 C168,60 176,66 179,76" fill="none" stroke="#dcbd8d" stroke-width="2" stroke-linecap="round"/>'
    + '<path d="M71,83 C96,72 124,65 147,68 C160,70 170,78 175,90 C176,94 176,97 175,100" fill="none" stroke="#bd8a4a" stroke-width="4.5" stroke-linecap="round"/>'
    + '<rect x="62" y="78" width="11" height="19" rx="4.5" fill="#ffffff" stroke="#D8CFC0"/>'
    + '<rect x="63" y="' + (112 + jaw) + '" width="11" height="18" rx="4.5" fill="#ffffff" stroke="#D8CFC0"/>'
    + '<g class="tongue"><path d="M183,104 C' + (dorX + 38) + ',' + (dorY - 10) + ' ' + (dorX - 24) + ',' + (dorY - 2) + ' ' + (tipX + 14) + ',' + tipY + ' C' + (tipX + 2) + ',' + (tipY + 8) + ' ' + (tipX + 6) + ',' + (tipY + 16) + ' ' + (tipX + 20) + ',' + (tipY + 19) + ' C116,141 150,141 168,136 C180,132 185,118 183,104 Z" fill="#f0a3b2" stroke="#cf7183" stroke-width="1.5" stroke-linejoin="round"/></g>'
    + (p.tip >= 0.97 ? '<ellipse cx="59" cy="92" rx="6.5" ry="3.6" fill="#f0a3b2" stroke="#cf7183" stroke-width="1.2"/>' : "")
    + '<path d="M73,' + (lipUy - 3) + ' C64,' + (lipUy - 10) + ' ' + (lipTx + 5) + ',' + (lipUy - 8) + ' ' + lipTx + ',' + (lipUy - 1) + ' C' + (lipTx + 4) + ',' + (lipUy + 2) + ' 66,' + (lipUy + 2) + ' 73,' + (lipUy + 1) + ' Z" fill="#d4655f" stroke="#b84a44" stroke-width="0.8"/>'
    + '<path d="M73,' + (lowLipY + 3) + ' C64,' + (lowLipY + 10) + ' ' + (lipTx + 5) + ',' + (lowLipY + 8) + ' ' + lipTx + ',' + (lowLipY + 1) + ' C' + (lipTx + 4) + ',' + (lowLipY - 2) + ' 66,' + (lowLipY - 2) + ' 73,' + (lowLipY - 1) + ' Z" fill="#d4655f" stroke="#b84a44" stroke-width="0.8"/>'
    + flowPath
    + (nasal ? '<path d="M150,57 C112,47 78,54 61,67" stroke="#F0522E" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.6" fill="none"/><polygon points="53,71 62,63 63,73" fill="#F0522E" opacity="0.6"/>' : "")
    + '<g stroke="#C4B393" stroke-width="0.8" fill="none"><path d="M40,64 L51,79"/><path d="M29,88 L60,88"/><path d="M42,122 L55,108"/><path d="M124,42 L126,61"/><path d="M128,163 L128,144"/></g>'
    + '<g font-size="9" fill="#6E6A61"><text x="3" y="62">môi trên</text><text x="3" y="91">răng</text><text x="3" y="126">môi dưới</text><text x="124" y="36" text-anchor="middle">vòm miệng</text><text x="128" y="170" text-anchor="middle">lưỡi</text></g></svg>';
}
function frontMouthSVG(p) {
  var mode = ["p", "b", "m"].indexOf(p.s) >= 0 ? "closed" : ["f", "v"].indexOf(p.s) >= 0 ? "bite" : ["θ", "ð"].indexOf(p.s) >= 0 ? "tongue" : ["s", "z"].indexOf(p.s) >= 0 ? "teeth" : "open";
  var cx = 80, cy = 102, lip = "#d4655f", lipD = "#b84a44", inner = "#7c3f39", teethF = "#ffffff", tongueF = "#f0a3b2", tongueS = "#cf7183";
  var mouth = "";
  if (mode === "closed") {
    mouth = '<path d="M50,' + cy + ' Q' + cx + ',' + (cy - 6) + ' 110,' + cy + ' Q' + cx + ',' + (cy + 6) + ' 50,' + cy + ' Z" fill="' + lip + '" stroke="' + lipD + '" stroke-width="1"/><path d="M52,' + cy + ' Q' + cx + ',' + (cy + 1) + ' 108,' + cy + '" stroke="' + lipD + '" stroke-width="1.4" fill="none"/>';
  } else if (mode === "bite") {
    mouth = '<path d="M54,' + (cy - 13) + ' Q' + cx + ',' + (cy - 18) + ' 106,' + (cy - 13) + ' L106,' + (cy - 10) + ' Q' + cx + ',' + (cy - 14) + ' 54,' + (cy - 10) + ' Z" fill="' + lip + '"/><rect x="57" y="' + (cy - 12) + '" width="46" height="13" rx="3.5" fill="' + teethF + '" stroke="#D8CFC0"/><path d="M56,' + (cy + 1) + ' Q' + cx + ',' + (cy + 13) + ' 104,' + (cy + 1) + ' Q' + cx + ',' + (cy + 6) + ' 56,' + (cy + 1) + ' Z" fill="' + lip + '" stroke="' + lipD + '" stroke-width="0.8"/>';
  } else if (mode === "tongue") {
    mouth = '<rect x="58" y="' + (cy - 14) + '" width="44" height="10" rx="3" fill="' + teethF + '" stroke="#D8CFC0"/><rect x="62" y="' + (cy + 8) + '" width="36" height="7" rx="3" fill="' + teethF + '" stroke="#D8CFC0"/><ellipse cx="' + cx + '" cy="' + (cy + 3) + '" rx="14" ry="6.5" fill="' + tongueF + '" stroke="' + tongueS + '" stroke-width="1.2"/><path d="M50,' + (cy - 6) + ' Q44,' + cy + ' 50,' + (cy + 8) + '" stroke="' + lipD + '" stroke-width="2.4" fill="none"/><path d="M110,' + (cy - 6) + ' Q116,' + cy + ' 110,' + (cy + 8) + '" stroke="' + lipD + '" stroke-width="2.4" fill="none"/>';
  } else if (mode === "teeth") {
    mouth = '<path d="M52,' + (cy - 11) + ' Q' + cx + ',' + (cy - 15) + ' 108,' + (cy - 11) + ' L108,' + (cy + 11) + ' Q' + cx + ',' + (cy + 15) + ' 52,' + (cy + 11) + ' Z" fill="' + lip + '"/><rect x="57" y="' + (cy - 9) + '" width="46" height="8.5" rx="2.5" fill="' + teethF + '" stroke="#D8CFC0"/><rect x="57" y="' + (cy + 1.5) + '" width="46" height="8.5" rx="2.5" fill="' + teethF + '" stroke="#D8CFC0"/><path d="M57,' + cy + ' L103,' + cy + '" stroke="' + inner + '" stroke-width="1.6"/>';
  } else {
    var rx = Math.round(30 - p.r * 20), ry = Math.round(3 + p.o * 15);
    var showTeeth = p.o >= 0.3 && p.r < 0.6, showTongue = p.o >= 0.65;
    mouth = '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (rx + 3) + '" ry="' + (ry + 3) + '" fill="' + lip + '"/><ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + inner + '"/>'
      + (showTongue ? '<path d="M' + (cx - rx + 3) + ',' + (cy + ry - 5) + ' Q' + cx + ',' + (cy + ry - 11) + ' ' + (cx + rx - 3) + ',' + (cy + ry - 5) + ' Q' + cx + ',' + (cy + ry + 1) + ' ' + (cx - rx + 3) + ',' + (cy + ry - 5) + ' Z" fill="' + tongueF + '"/>' : "")
      + (showTeeth ? '<path d="M' + (cx - rx + 2) + ',' + (cy - ry + 1) + ' L' + (cx + rx - 2) + ',' + (cy - ry + 1) + ' L' + (cx - rx - 4) + ',' + (cy - ry + 6) + ' Q' + cx + ',' + (cy - ry + 8) + ' ' + (cx - rx + 4) + ',' + (cy - ry + 6) + ' Z" fill="' + teethF + '" opacity="0.95"/>' : "");
  }
  return '<svg viewBox="0 0 160 152" data-front="1" data-mode="' + mode + '" style="width:100%;max-width:300px;height:auto;background:#fffdf8;border:1px solid var(--line);border-radius:14px" role="img" aria-label="Khẩu hình nhìn trực diện âm /' + p.s + '/">'
    + '<ellipse cx="80" cy="76" rx="57" ry="67" fill="#fdeed6" stroke="#cf9a58" stroke-width="2.5"/>'
    + '<path d="M44,44 Q58,38 70,43" stroke="#8a6a48" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
    + '<path d="M90,43 Q102,38 116,44" stroke="#8a6a48" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
    + '<ellipse cx="58" cy="56" rx="4.2" ry="5.6" fill="#4a3b30"/><ellipse cx="102" cy="56" rx="4.2" ry="5.6" fill="#4a3b30"/>'
    + '<path d="M80,64 Q85,76 81,82 Q77,85 72,83" stroke="#cf9a58" stroke-width="2" fill="none" stroke-linecap="round"/>'
    + mouth + '</svg>';
}
function jawTxt(x) { return String(x).replace(".", ","); }
function jawSegsHTML(x) { var h = ""; for (var i = 0; i < 8; i++) h += '<i class="' + (i < Math.round(x * 2) ? "on" : "") + '"></i>'; return h; }
function mouthFiguresHTML(p) {
  var side = function (q, cap) { return '<figure class="ph-fig">' + mouthSVG(q) + '<figcaption>' + cap + '</figcaption></figure>'; };
  var front = function (q, cap) { return '<figure class="ph-fig">' + frontMouthSVG(q) + '<figcaption>' + cap + '</figcaption></figure>'; };
  var jawNote = '<span class="mut">(độ mở hàm do trang tự gán, tương đối — để so sánh giữa các âm)</span>';
  var tgt = RB_PH_GLIDE[p.s];
  if (tgt) {
    var e = RB_PH_TARGETS[tgt] || p;

/* ---------- Store: một nguồn số liệu duy nhất ---------- */
var LS_NEW = "ielts_rebuild_v1", LS_OLD = "ielts_standalone_v1";
function freshState() { return { progress: {}, cards: {}, hard: {}, xp: 0, checkin: {}, studyLog: {}, savedWords: {}, goal: 30, pos: {}, skipped: [], phDone: {}, phSkipped: [], chatStars: [], chatReports: [], testDone: false, xpClaimed: {}, migrated: false }; }
function saveState() { try { localStorage.setItem(LS_NEW, JSON.stringify(state)); } catch (e) {} }
function loadState() {
  var st = freshState();
  try {
    var raw = localStorage.getItem(LS_NEW);
    if (raw) return Object.assign(st, JSON.parse(raw));
  } catch (e) {}
  try {
    var old = JSON.parse(localStorage.getItem(LS_OLD) || "null");
    if (old) {
      st.progress = old.progress || {}; st.cards = old.cards || {}; st.hard = old.hard || {};
      st.xp = (old.xp && old.xp.total) || 0; st.checkin = old.checkin || {}; st.studyLog = old.studyLog || {};
      st.savedWords = old.savedWords || {}; if (old.goal) st.goal = old.goal;
      ["69", "24"].forEach(function (setIdx) {
        var pos = 0;
        while (st.cards["s" + setIdx + ":" + pos] && st.cards["s" + setIdx + ":" + pos].box >= 1) pos++;
        st.pos["vocab:" + setIdx] = pos;
      });
      st.migrated = true; state = st; saveState();
    }
  } catch (e) {}
  return st;
}
var state = loadState();
var curTab = "home", curLesson = null, returnTab = "home", nudgeShown = false, phNudgeShown = false, phViewMode = "wave", phNudgePhShown = false, lessonStart = 0, runFirstTry = {}, runWrong = [];

function awardXp(n) { state.xp = (state.xp || 0) + n; saveState(); }
function xpLevel(xp) {
  var lv = 0;
  for (var i = 0; i < RB_XP_LEVELS.length; i++) { if (xp >= RB_XP_LEVELS[i]) lv = i; else break; }
  var next = lv + 1 < RB_XP_LEVELS.length ? RB_XP_LEVELS[lv + 1] : RB_XP_LEVELS[RB_XP_LEVELS.length - 1] + RB_XP_LEVEL_STEP * (lv + 2 - RB_XP_LEVELS.length);
  if (lv >= RB_XP_LEVELS.length - 1) next = RB_XP_LEVELS[RB_XP_LEVELS.length - 1] + RB_XP_LEVEL_STEP * (lv - RB_XP_LEVELS.length + 2);
  return { level: lv, next: next };
}
function streakDays() {
  var d = new Date(), n = 0;
  while (true) { var k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); if (state.checkin[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function checkinToday() {
  var t = todayStr();
  if (state.checkin[t]) { toast("Hôm nay bạn đã điểm danh rồi."); return; }
  state.checkin[t] = true; awardXp(5);
  var s = streakDays();
  [[7, 50], [30, 150], [100, 400]].forEach(function (pair) {
    if (s >= pair[0] && !state.xpClaimed["streak" + pair[0]]) { state.xpClaimed["streak" + pair[0]] = true; awardXp(pair[1]); toast("Chuỗi " + pair[0] + " ngày! Cộng " + pair[1] + " XP."); }
  });
  saveState(); render();
}
function dueCards() {
  var t = todayStr(), out = [];
  Object.keys(state.cards).forEach(function (k) {
    var st = state.cards[k];
    if (st && st.due && st.due <= t && (st.box || 0) < 5) {
      var m = k.match(/^s(\d+):(\d+)$/);
      if (m && CONTENT.vocab[+m[1]]) out.push({ key: k, setIdx: +m[1], ci: +m[2], card: CONTENT.vocab[+m[1]].cards[+m[2]] });
    }
  });
  return out;
}
function dueHard() {
  var t = todayStr(), out = [];
  Object.keys(state.hard).forEach(function (k) {
    var h = state.hard[k];
    if (h && !h.done && (!h.due || h.due <= t)) out.push({ key: k, h: h });
  });
  return out;
}
function dueCount() { return dueCards().length + dueHard().length; }
function hardJudge(key, ok) {
  var h = state.hard[key] || { streak: 0, level: 0 };
  if (ok) {
    h.streak = (h.streak || 0) + 1;
    if (h.streak >= 2) { h.done = true; h.due = ""; }
    else { h.level = (h.level || 0) + 1; h.due = addDaysStr(todayStr(), RB_INTERVALS[Math.min(h.level, RB_INTERVALS.length - 1)]); }
  } else { h.streak = 0; h.due = addDaysStr(todayStr(), 1); }
  state.hard[key] = h; saveState();
}
function recordQuizError(lessonId, qi, q) {
  var key = "quiz:" + lessonId + ":" + qi;
  if (!state.hard[key]) state.hard[key] = { kind: "quiz", lesson: lessonId, qi: qi, q: q.q, options: q.o, a: q.a, why: q.why, streak: 0, level: 0, due: addDaysStr(todayStr(), 1) };
  saveState();
}

/* ---------- Lộ trình chương 1 ---------- */
function stepById(id) { return RB_CH1_STEPS.filter(function (s) { return s.id === id; })[0]; }
function stepIdx(id) { for (var i = 0; i < RB_CH1_STEPS.length; i++) if (RB_CH1_STEPS[i].id === id) return i; return -1; }
function isLearningStep(s) { return s.id !== "test"; }
function stepDone(id) { return !!(state.progress["ch1:" + id] && state.progress["ch1:" + id].done); }
function learningSteps() { return RB_CH1_STEPS.filter(isLearningStep); }
function doneLearnCount() { return learningSteps().filter(function (s) { return stepDone(s.id); }).length; }
function gateOpen() { return doneLearnCount() >= RB_CH1_GATE_NEED; }
function nextLearnStep() { var ls = learningSteps(); for (var i = 0; i < ls.length; i++) if (!stepDone(ls[i].id)) return ls[i]; return null; }
function finishStep(id) {
  var was = stepDone(id);
  state.progress["ch1:" + id] = { done: true, at: Date.now() };
  if (state.skipped.indexOf(id) >= 0) state.skipped = state.skipped.filter(function (x) { return x !== id; });

}
function openStep(step, opts) {
  opts = opts || {};

  if (step.id === "test") {
    if (!gateOpen()) { toast("Bài kiểm tra mở khi bạn học xong " + RB_CH1_GATE_NEED + "/" + learningSteps().length + " bước (mốc 80% — chuẩn nội bộ của web)."); return; }
    openLesson({ type: "test" }); return;

  if (ns && step.id !== ns.id && stepIdx(step.id) > stepIdx(ns.id) && !nudgeShown && !opts.noNudge) {

      if (stepIdx(s.id) < stepIdx(step.id) && !stepDone(s.id) && state.skipped.indexOf(s.id) < 0) state.skipped.push(s.id);
    });
    saveState();
    var box = $("#nudgeBox");
    box.innerHTML = "<h2>Bạn đang nhảy cóc</h2><p>Bước này nằm sau bước tiếp theo của bạn (" + esc(ns.title) + "). Bạn vẫn có thể học trước, và các bước bị bỏ qua sẽ vào danh sách 'Đã bỏ qua' để quay lại học nốt.</p>"
      + '<div class="row"><button class="btn btn-primary" id="nudgeGo">Vẫn học bước này</button><button class="btn" id="nudgeBack">Quay lại bước tiếp theo</button></div>';
    $("#nudgeModal").style.display = "flex";
    $("#nudgeGo").onclick = function () { $("#nudgeModal").style.display = "none"; openLessonFor(step); };
    $("#nudgeBack").onclick = function () { $("#nudgeModal").style.display = "none"; openLessonFor(ns); };

}
function openLessonFor(step) {

/* ---------- Đường dây AI: giữ nguyên hợp đồng, chưa gọi khi chưa đăng nhập ---------- */
function supabaseFnUrl(fn) { try { return (window.SUPABASE_URL || "") + "/functions/v1/" + fn; } catch (e) { return ""; } }
function callAiTutor(message) {
  return new Promise(function (resolve, reject) {
    reject("Cần đăng nhập để dùng gia sư AI (đăng nhập mở ở giai đoạn 2).");
  });
}
/* Hợp đồng trò chuyện tự do (C7, giai đoạn 2): gọi thật hàm ai-tutor đã live
   qua Supabase, cần JWT (đăng nhập mở ở giai đoạn 2). Hợp đồng máy chủ:
   POST SUPABASE_URL/functions/v1/ai-tutor, headers Authorization Bearer JWT +
   apikey anon, body {message, mode: "chat", context} -> {reply}.
   messages = [{role: "user"|"assistant", text: "..."}] — lịch sử hội thoại
   trong phiên. AI phải tự nhận là AI, không chấm điểm trong lúc nói.
   HẠN CHẾ THẬT: hàm máy chủ có BASE prompt trả lời bằng tiếng Việt trước nên
   phiên này là tiếng Anh đơn giản kèm tiếng Việt hỗ trợ, không quảng cáo là
   trò chuyện hoàn toàn bằng tiếng Anh. */
function callAiTutorChat(messages) {
  return new Promise(function (resolve, reject) {
    var loginMsg = "Cần đăng nhập để dùng trò chuyện với AI (đăng nhập mở ở giai đoạn 2).";
    var ready = window.__supabaseReady;
    if (!ready || typeof ready.then !== "function") { reject(loginMsg); return; }
    ready.then(function (client) {
      if (!client || !client.auth || !client.auth.getSession) { reject(loginMsg); return; }
      client.auth.getSession().then(function (res) {
        var sess = res && res.data && res.data.session;
        if (!sess || !sess.access_token) { reject(loginMsg); return; }
        var lastUser = "";
        (messages || []).forEach(function (m) { if (m.role === "user") lastUser = m.text; });
        var guidance = "Bạn là bạn trò chuyện tiếng Anh thân thiện của web học IELTS này. Bạn TỰ NHẬN LÀ AI, không phải người thật; khi được hỏi, nói rõ mình là AI. Trả lời CHỦ YẾU bằng tiếng Anh đơn giản, câu ngắn, kèm nghĩa tiếng Việt ngắn khi cần. Sửa lỗi nhẹ bằng cách nhắc lại câu đúng, không chấm điểm, không bảng đúng/sai trong lúc nói. Tuyệt đối tuân thủ 3 cấm: không nói bậy, không nội dung 18+, không nội dung vi phạm pháp luật — nếu người học đưa nội dung đó, từ chối ngắn gọn bằng tiếng Anh đơn giản + tiếng Việt rồi lái lại chủ đề luyện nói.";
        var hist = (messages || []).slice(-12).map(function (m) { return (m.role === "user" ? "Học viên: " : "AI: ") + m.text; }).join("\n");
        fetch(supabaseFnUrl("ai-tutor"), { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + sess.access_token, "apikey": window.SUPABASE_ANON_KEY || "" }, body: JSON.stringify({ message: lastUser, mode: "chat", context: guidance + "\nLịch sử gần đây:\n" + hist }) })
          .then(function (resp) {
            if (!resp.ok) {
              if (resp.status === 401) throw new Error(loginMsg);
              if (resp.status === 429) throw new Error("AI đã hết lượt cho phép — hãy thử lại sau.");
              if (resp.status === 502 || resp.status === 503) throw new Error("AI đang bận — hãy thử lại sau ít phút.");
              throw new Error("AI chưa trả lời được (lỗi máy chủ " + resp.status + ") — hãy thử lại.");
            }
            return resp.json();
          })
          .then(function (data) {
            if (data && data.reply) resolve(data.reply);
            else reject("AI trả về trống — hãy thử gửi lại.");
          })
          .catch(function (e) { reject((e && e.message) || "Mất mạng — hãy kiểm tra kết nối rồi gửi lại."); });
      }, function () { reject(loginMsg); });
    }, function () { reject(loginMsg); });
  });
}
function callPronounce(audioBase64, mimeType, referenceText) {
  return new Promise(function (resolve, reject) {
    reject("Cần đăng nhập để dùng chấm phát âm AI (đăng nhập mở ở giai đoạn 2).");
  });
}
function rawToBand(score, total, skill) {
  if (!total || total <= 0) return null;
  var raw40 = Math.round(score / total * 40);
  var tbl = RB_BAND_TABLE[skill] || RB_BAND_TABLE.reading;
  for (var i = 0; i < tbl.length; i++) { if (raw40 >= tbl[i][0]) return tbl[i][1]; }
  return 2.0;
}

/* ----- Phát âm GĐ2: khóa tuần tự U6 + từ/cụm/câu từ kho cũ theo IPA ----- */
/* Dải 44 âm hiện đủ để xem trước; bài học chỉ mở khi âm đó đã xong hoặc là
   âm chưa xong đầu tiên. Âm bị khóa khi bấm vào: lần đầu mỗi phiên hiện hộp
   nhắc đầy đủ, các lần sau chỉ toast ngắn; âm đó gom vào state.phSkipped. */
function phIdx(sym) { return phAllOrder().indexOf(sym); }
function phOpenSym(sym) {
  var cur = phNextSym();
  if (!cur) return true;
  if (phDone(sym)) return true;
  return phIdx(sym) <= phIdx(cur);
}
function phNudge(sym) {
  var cur = phNextSym();
  if (!phNudgePhShown) {
    phNudgePhShown = true;
    var box = $("#nudgeBox");
    box.innerHTML = "<h2>Âm này chưa mở</h2><p>Bài học phát âm đi theo thứ tự: học xong âm /" + esc(cur || "") + "/ trước, rồi mới tới âm /" + esc(sym) + "/. Dải 44 âm vẫn hiện đủ để bạn xem trước hình miệng và từ ví dụ — chỉ bài học mới giữ thứ tự.</p>"
      + '<div class="row"><button class="btn btn-primary" id="phNudgeGo">Học âm /' + esc(cur || "") + '/ trước</button><button class="btn" id="phNudgeLater">Để sau</button></div>';
    $("#nudgeModal").style.display = "flex";
    $("#phNudgeGo").onclick = function () {
      $("#nudgeModal").style.display = "none";
      var l2 = curLesson;
      if (l2 && l2.type === "pron") { l2.sound = cur; l2.sub = 0; l2.diffOk = false; l2.diffHeard1 = false; l2.diffHeard2 = false; l2.diffRevealed = false; l2.diffLogged = false; render(); }
      else openLesson({ type: "pron", step: stepById("pron1"), sound: cur, sub: 0 });
    };
    $("#phNudgeLater").onclick = function () { $("#nudgeModal").style.display = "none"; render(); };
    return;
  }
  toast("Âm này chưa mở — học xong âm /" + esc(cur || "") + "/ trước nhé.");
}
function phTryOpenSound(sym) {
  if (phOpenSym(sym)) return true;
  if (!state.phSkipped) state.phSkipped = [];
  if (state.phSkipped.indexOf(sym) < 0) state.phSkipped.push(sym);
  saveState();
  phNudge(sym);
  return false;
}
function phBtnHTML(sym) {
  var ex = RB_PH_ALL_EXAMPLES[sym] || "";
  var cls = "", st = "", lock = "";
  var cur = phNextSym();
  if (phDone(sym)) { cls = "done"; st = " ✓ Đã xong"; }
  else if (sym === cur) { cls = "cur"; st = " ▶ Đang học"; }
  else if (!phOpenSym(sym)) { cls = "lock"; st = " 🔒 Chưa mở"; lock = "1"; }
  return '<button class="ph-btn ' + cls + '" data-s="' + esc(sym) + '" data-lock="' + lock + '">/' + esc(sym) + '/<br><span class="mut">' + esc(ex) + '</span><br><span class="mut">' + st + '</span></button>';
}
/* Tách IPA thành từng âm bằng phép khớp dài nhất với bảng 44 âm (kỹ thuật của
   web cũ, dữ kiện là phiên âm của chính thẻ từ trong kho) — "từ chứa âm X"
   là chứa thật theo phiên âm đó, không đoán theo chữ viết. */
var PH_TOK_ORDER = ["tʃ", "dʒ", "i:", "u:", "ɑ:", "ɔ:", "eɪ", "aɪ", "ɔɪ", "əʊ", "aʊ", "ɪə", "eə", "ʊə", "ɪ", "e", "æ", "ɒ", "ʊ", "ʌ", "ɜ:", "ə", "p", "b", "t", "d", "k", "ɡ", "f", "v", "θ", "ð", "s", "z", "ʃ", "ʒ", "h", "m", "n", "ŋ", "l", "r", "w", "j"];
function phTokIpa(ipa) {
  var raw = String(ipa || "").replace(/[/.]/g, "").replace(/ː/g, ":");
  var toks = [], stressed = {};
  raw.split(/\s+/).filter(Boolean).forEach(function (part) {
    var i = 0, pending = false;
    while (i < part.length) {
      var ch = part[i];
      if (ch === "ˈ") { pending = true; i++; continue; }
      if (ch === "ˌ") { i++; continue; }
      if (ch === "(") { var j = part.indexOf(")", i); i = (j < 0 ? part.length : j + 1); continue; }
      var m = null;
      for (var k = 0; k < PH_TOK_ORDER.length; k++) if (part.indexOf(PH_TOK_ORDER[k], i) === i) { m = PH_TOK_ORDER[k]; break; }
      if (pending) { stressed[toks.length] = true; pending = false; }
      if (m) { toks.push(m); i += m.length; } else { toks.push(ch); i++; }
    }
  });
  return { toks: toks, stressed: stressed };
}
var PH_POOL_CACHE = null;
function phPool() {

      else singles.push({ w: cd.w, ipa: cd.ipa || "", vi: cd.vi || "", ex: cd.ex || "", exv: cd.exv || "", col: cd.col || "", toks: t.toks, stressed: t.stressed });

function phRankScore(sym, c, mainW) {
  var sc = c.toks.length * 10 + c.w.length;
  if (c.w.toLowerCase() === mainW.toLowerCase()) sc -= 1000;
  c.toks.forEach(function (t, i) { if (t === sym && c.stressed[i]) sc -= 40; });
  if (c.toks[0] === sym || c.toks[c.toks.length - 1] === sym) sc -= 30;

}

    .sort(function (a, b) { return phRankScore(sym, a, mainW) - phRankScore(sym, b, mainW); })
    .forEach(function (c) {
      var k = c.w.toLowerCase();
      if (k === mainW.toLowerCase() || seen[k]) return;
      seen[k] = true; out.push(c);

}
function phExtraPhrases(sym) {

  phPool().phrases.filter(function (c) { return c.toks.indexOf(sym) >= 0; })

    .sort(function (a, b) { return phRankScore(sym, a, mainW) - phRankScore(sym, b, mainW); })

}

/* ----- Trò chuyện tự do với AI (C7, giai đoạn 2) -----
   Mô hình nguồn = AI trò chuyện liên tục, không phải người thật.
   Trong phiên: chỉ hội thoại, không điểm số, không bảng đúng/sai chen ngang.
   Sau phiên: transcript + câu hay dùng lại (⭐, lưu trên máy) + ghi chú lỗi.
   XP +10 chỉ cộng một lần cho mỗi phiên đã kết thúc. */
function chatGreeting() { return "Chào bạn! Mình là AI trò chuyện tiếng Anh của web này (không phải người thật). Bạn muốn nói về gì hôm nay? Cứ nói tự do bằng tiếng Anh hoặc tiếng Việt — mình trả lời bằng tiếng Anh đơn giản kèm nghĩa tiếng Việt ngắn khi cần. Trong lúc nói mình không chấm điểm."; }
function renderChat(app, l) {
  if (!l.msgs) l.msgs = [{ role: "assistant", text: chatGreeting() }];
  if (l.ended) { renderChatSummary(app, l); return; }
  var html = '<div class="lessonframe"><div class="row"><button class="btn" id="btnBack">← Quay lại</button><span class="chip cur">Nói · Trò chuyện với AI</span></div><div style="margin-top:6px"><b>Trò chuyện tự do với AI</b><div class="mut">Nói live bằng mic + gõ bàn phím, nói tự do thích gì nói đó, không chấm điểm trong lúc nói. Mô hình nguồn là AI trò chuyện liên tục — không phải người thật.</div></div></div>';
  html += '<div class="qblock"><div id="chatBox">';
  l.msgs.forEach(function (m, i) {
    var cls = m.role === "user" ? "user" : "ai";
    var starred = (state.chatStars || []).some(function (s) { return s.text === m.text; });
    html += '<div class="chat-msg ' + cls + '"><b>' + (m.role === "user" ? "Bạn" : "AI") + ':</b> ' + esc(m.text)
      + (m.role === "assistant" && i > 0 ? '<div class="row"><button class="btn" data-speak="' + i + '">🔊 Nghe</button><button class="btn" data-star="' + i + '">' + (starred ? "★ Đã giữ" : "☆ Giữ câu hay") + '</button></div>' : "")
      + '</div>';
  });
  html += '</div><div class="row"><input type="text" id="chatInp" placeholder="Gõ câu của bạn rồi bấm Gửi — hoặc bấm mic để nói..." style="flex:1"><button class="btn btn-primary" id="chatSend">Gửi</button><button class="btn" id="chatMic">🎤 Nói</button></div>'
    + '<div class="row"><button class="btn btn-amber" id="chatEnd">Kết thúc phiên (+10 XP)</button><button class="btn" id="chatReport">⚑ Báo cáo nội dung không phù hợp</button></div>'
    + '<p class="mut">Trò chuyện cần đăng nhập (đăng nhập mở ở giai đoạn 2) — nếu chưa đăng nhập, web báo rõ và không bịa câu trả lời. Lưu ý thật: hàm ai-tutor phía máy chủ trả lời bằng tiếng Việt trước, nên phiên này là tiếng Anh đơn giản kèm tiếng Việt hỗ trợ, không phải trò chuyện hoàn toàn bằng tiếng Anh. Bản ghi giọng nói qua trình duyệt chỉ là ước lượng — kiểm tra lại câu trước khi gửi. Câu bạn bấm ⭐ sẽ lưu trên máy này vào mục "Câu hay dùng lại". Báo cáo hiện chỉ lưu trên máy này — chưa có hệ thống xử lý báo cáo phía máy chủ.</p></div>';

function renderGame(app, l) {
  var step = l.step;
  var pairs = [["A", "apple"], ["B", "ball"], ["C", "cat"], ["D", "dog"], ["E", "egg"], ["F", "fish"]];
  if (l.finished) {
    var best = 0;
    try { best = +(localStorage.getItem("ielts_rebuild_game_best") || 0); } catch (e) {}
    var secs = l.secs || 0;
    var isBest = secs > 0 && (best === 0 || secs < best);
    if (isBest) { try { localStorage.setItem("ielts_rebuild_game_best", String(secs)); } catch (e) {} }
    app.innerHTML = stepHeader(step) + finishSummaryHTML("Chơi xong rồi!",
      '<p>Bạn nối đúng cả 6 cặp trong ' + secs + ' giây.' + (isBest ? ' Đây là kỷ lục mới của riêng bạn!' : (best ? ' Kỷ lục của bạn: ' + best + ' giây.' : '')) + '</p>', "");
    wireBack(); wireNextStep();
    $("#btnRedo").onclick = function () { l.finished = false; l.matched = []; l.sel = null; l.started = 0; render(); };
    return;
  }
  l.matched = l.matched || [];
  var html = stepHeader(step, "Bấm một chữ cái, rồi bấm từ đúng của nó.");
  html += '<div class="qblock" id="gameBoard"><div class="row">';
  pairs.forEach(function (pr) {
    var done = l.matched.indexOf(pr[0]) >= 0;
    html += '<button class="g-tile' + (done ? " ok" : (l.sel === pr[0] ? " sel" : "")) + '" data-pair="' + pr[0] + '" data-kind="letter"' + (done ? " disabled" : "") + '>' + pr[0] + pr[0].toLowerCase() + '</button>';
  });
  html += '</div><div class="row" style="margin-top:10px">';
  pairs.forEach(function (pr) {
    var done = l.matched.indexOf(pr[0]) >= 0;
    html += '<button class="g-tile' + (done ? " ok" : "") + '" data-pair="' + pr[0] + '" data-kind="word"' + (done ? " disabled" : "") + '>' + pr[1] + '</button>';
  });
  html += '</div><p class="mut">Đã nối đúng: ' + l.matched.length + '/6 cặp</p></div>';
  app.innerHTML = html;
  wireBack();
  $$("#gameBoard .g-tile[data-kind=letter]").forEach(function (b) {
    b.onclick = function () { if (!l.started) l.started = Date.now(); l.sel = b.dataset.pair; render(); };
  });
  $$("#gameBoard .g-tile[data-kind=word]").forEach(function (b) {
    b.onclick = function () {
      if (!l.sel) { toast("Hãy bấm một chữ cái trước, rồi mới bấm từ."); return; }
      if (!l.started) l.started = Date.now();
      if (b.dataset.pair === l.sel) {
        l.matched.push(l.sel); l.sel = null;
        if (l.matched.length >= 6) {
          l.secs = Math.max(1, Math.round((Date.now() - l.started) / 1000));
          finishStep(step.id); l.finished = true;
        }
        render();
      } else {
        b.classList.add("bad"); l.sel = null;
        setTimeout(function () { render(); }, 600);
      }
    };
  });
}

/* ----- Bài kiểm tra cuối chương ----- */
function renderTest(app, l) {
  var step = stepById("test");
  if (l.summary) {
    var score = l.score || 0, total = RB_CH1_TEST.questions.length;
    var partHTML = "", allPass = true;
    RB_CH1_TEST.parts.forEach(function (pt) {
      var c = pt.idx.filter(function (i) { return l.answers && l.answers[i]; }).length;
      var need = Math.ceil(pt.idx.length / 2);
      var pass = c >= need; if (!pass) allPass = false;
      partHTML += '<p>Phần "' + esc(pt.name) + '": ' + c + '/' + pt.idx.length + ' (' + Math.round(c / pt.idx.length * 100) + '%)' + (pass ? ' — đạt' : ' — chưa đạt (cần từ 50%)') + '</p>';
    });
    var partsArr = RB_CH1_TEST.parts.map(function (pt) { var c = pt.idx.filter(function (i) { return l.answers && l.answers[i]; }).length; return { name: pt.name, c: c, n: pt.idx.length, pct: Math.round(c / pt.idx.length * 100) }; });
    var band = rawToBand(score, total, "reading");
    var wrongHTML = "";
    if (runWrong.length) wrongHTML = '<div class="sumcard"><b>Câu chưa vững:</b>' + runWrong.map(function (i) {
      var q = RB_CH1_TEST.questions[i]; return '<p>· ' + esc(q.q) + '<br>Đáp án đúng: <b>' + esc(q.o[q.a]) + '</b> — ' + esc(q.why) + '</p>';
    }).join("") + '<p class="mut">Các câu này đã vào Sổ lỗi sai để ôn lại sau.</p></div>';
    var weakest = RB_CH1_TEST.parts.slice().sort(function (a, b) {
      var ca = a.idx.filter(function (i) { return l.answers && l.answers[i]; }).length / a.idx.length;
      var cb = b.idx.filter(function (i) { return l.answers && l.answers[i]; }).length / b.idx.length;
      return ca - cb;
    })[0];
    if (allPass) { state.testDone = true; saveState(); }
    state.lastTest = { score: score, total: total, band: band, parts: partsArr, date: todayStr(), passed: allPass }; saveState();
    var stats = '<p>Kết quả: ' + score + '/' + total + ' câu đúng · Thời gian học thật: ' + elapsedText() + '.</p>' + partHTML
      + '<p><b>Band ước lượng: ' + fmtBandComma(band) + '</b> <span class="mut">(dùng bảng Đọc làm bảng chung cho kiểm tra tổng hợp)</span><br><span class="mut">' + RB_BAND_NOTE + '</span></p>'
      + (allPass ? '<p><b>Bạn đã qua bài kiểm tra cuối chương 1!</b></p>' : '<p><b>Chưa đạt — mỗi phần cần từ 50% trở lên.</b> Ôn lại các câu sai rồi làm lại nhé.</p>');
    app.innerHTML = stepHeader(step) + '<div class="summarybox"><h2>Kết quả kiểm tra cuối chương 1</h2>' + stats + wrongHTML
      + '<div class="row" style="margin-top:10px"><button class="btn btn-amber" id="btnWeak">Luyện phần yếu nhất</button><button class="btn" id="btnRedo">Làm lại</button><button class="btn" id="btnHome">Về màn chính</button></div></div>';
    wireBack();
    $("#btnWeak").onclick = function () {
      backFromLesson();
      openStep(weakest.name === "Chữ cái" ? stepById("letters") : stepById("classroom"), { noNudge: true });
    };
    $("#btnRedo").onclick = function () { curLesson = { type: "test", qi: 0, answers: {}, score: 0 }; runWrong = []; runFirstTry = {}; lessonStart = Date.now(); render(); };
    $("#btnHome").onclick = function () { backFromLesson(); go("home"); };
    return;
  }
  var l2 = { type: "test", step: step, qi: l.qi || 0, answers: l.answers || {}, score: l.score || 0 };
  var qi = l2.qi, questions = RB_CH1_TEST.questions;
  if (qi >= questions.length) {
    l.summary = true; l.answers = l2.answers; l.score = l2.score; render(); return;
  }
  var q = questions[qi];
  var html = stepHeader(step, "Kiểm tra tổng hợp — band ước lượng dùng bảng Đọc làm bảng chung.");
  html += '<div class="qblock" id="quizBox"><div class="row"><span class="chip">Câu ' + (qi + 1) + '/' + questions.length + '</span></div>'
    + '<p><b>' + esc(q.q) + '</b></p>';
  q.o.forEach(function (opt, i) { html += '<button class="q-opt" data-i="' + i + '">' + esc(opt) + '</button>'; });
  html += '<div class="why" id="quizWhy"></div><button class="btn btn-primary" id="quizNext" style="display:none">Câu tiếp theo</button></div>';
  app.innerHTML = html;
  wireBack();
  var answered = false;
  $$("#quizBox .q-opt").forEach(function (b) {
    b.onclick = function () {
      if (answered) return; answered = true;
      var i = +b.dataset.i;
      if (i === q.a) { b.classList.add("ok"); l2.answers[qi] = true; l2.score++; }
      else { b.classList.add("bad"); $$("#quizBox .q-opt")[q.a].classList.add("ok"); l2.answers[qi] = false; if (runWrong.indexOf(qi) < 0) { runWrong.push(qi); recordQuizError("test", qi, q); } }
      $$("#quizBox .q-opt").forEach(function (x) { x.disabled = true; });
      var whyEl = $("#quizWhy");
      whyEl.textContent = "Đáp án đúng: " + q.o[q.a] + " — " + q.why; whyEl.classList.add("show");
      $("#quizNext").style.display = "inline-block";
      $("#quizNext").onclick = function () {
        curLesson = { type: "test", qi: qi + 1, answers: l2.answers, score: l2.score };
        if (qi + 1 >= questions.length) { curLesson.summary = true; }
        render();
      };
    };
  });
}

/* ----- Kiểm tra nhanh (tùy chọn, không bao giờ là cổng) ----- */
function renderQuickcheck(app, l) {
  var qs = [RB_CH1_TEST.questions[0], RB_CH1_TEST.questions[2], RB_CH1_TEST.questions[4], RB_CH1_TEST.questions[6]];
  if (l.qi === undefined) l.qi = 0;
  if (l.qi >= qs.length) {
    var score = l.score || 0;
    var sug = score >= 3
      ? "Bạn đã biết khá nhiều — bạn có thể bắt đầu từ Chương 1 hoặc nhảy tới bước mình thích trong Lộ trình."
      : "Bạn nên bắt đầu từ Chương 1, bài đầu tiên (chữ cái A-Z).";
    app.innerHTML = '<div class="lessonframe"><div class="row"><button class="btn" id="btnBack">← Quay lại</button><span class="chip">Kiểm tra nhanh (tùy chọn)</span></div></div>'
      + '<div class="summarybox"><h2>Kết quả kiểm tra nhanh</h2><p>Bạn đúng ' + score + '/' + qs.length + ' câu.</p><p>' + sug + '</p>'
      + '<p class="mut">Bài kiểm tra này chỉ gợi ý điểm bắt đầu, không bắt buộc và không khóa bước nào.</p>'
      + '<button class="btn btn-primary" id="btnHome">Về màn chính</button></div>';
    wireBack();
    $("#btnHome").onclick = function () { backFromLesson(); go("home"); };
    return;
  }
  var q = qs[l.qi];
  var html = '<div class="lessonframe"><div class="row"><button class="btn" id="btnBack">← Quay lại</button><span class="chip">Kiểm tra nhanh (tùy chọn) · Câu ' + (l.qi + 1) + '/' + qs.length + '</span></div></div>'
    + '<div class="qblock" id="quizBox"><p><b>' + esc(q.q) + '</b></p>';
  q.o.forEach(function (opt, i) { html += '<button class="q-opt" data-i="' + i + '">' + esc(opt) + '</button>'; });
  html += '<div class="why" id="quizWhy"></div><button class="btn btn-primary" id="quizNext" style="display:none">Câu tiếp theo</button></div>';
  app.innerHTML = html;
  wireBack();
  var answered = false;
  $$("#quizBox .q-opt").forEach(function (b) {
    b.onclick = function () {
      if (answered) return; answered = true;
      var i = +b.dataset.i;
      if (i === q.a) { b.classList.add("ok"); l.score = (l.score || 0) + 1; }
      else { b.classList.add("bad"); $$("#quizBox .q-opt")[q.a].classList.add("ok"); }
      $$("#quizBox .q-opt").forEach(function (x) { x.disabled = true; });
      var whyEl = $("#quizWhy");
      whyEl.textContent = "Đáp án đúng: " + q.o[q.a] + " — " + q.why; whyEl.classList.add("show");
      $("#quizNext").style.display = "inline-block";
      $("#quizNext").onclick = function () { l.qi++; render(); };
    };
  });
}

/* ---------- Khởi động ---------- */
render();
</script>
