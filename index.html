<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học tiếng Anh từ đầu — Bản mới</title>
<style>
:root{--paper:#FFFBF2;--ink:#1F2430;--amber:#FFB800;--amber2:#FFC800;--coral:#FF6B4A;--coralD:#F0522E;--line:#E7DCC6;--line2:#F0E7D8;--green:#1E9E6A;--red:#D9534F;--mut:#6E6A61}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:100%;margin:0 auto;padding:12px 14px 96px}
@media (min-width:900px){.wrap{max-width:1080px}}
@media (min-width:1200px){.wrap{max-width:min(1360px,94vw);padding:12px 24px 96px}}
.qblock p{max-width:820px}
.qblock .mut{max-width:820px}
header h1{font-size:30px;margin:6px 0 2px}
header .sub{color:var(--mut);font-size:14px}
.tabbar{display:flex;gap:6px;position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;min-height:44px}
.tab.on{background:var(--amber);border-color:var(--amber);font-weight:700}
.card{background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:20px;margin:12px 0}
h2{font-size:22px;margin:2px 0 8px}
h3{font-size:18px;margin:14px 0 6px}
p{margin:8px 0}
.mut{color:var(--mut);font-size:14px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font-size:16px;cursor:pointer;background:#fff;border:1.5px solid var(--line);margin:4px 4px 4px 0;min-height:44px}
.btn-primary{background:var(--coral);color:var(--ink);border-color:var(--coralD);font-weight:700}
.btn-amber{background:var(--amber);border-color:var(--amber);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.chip.cur{background:var(--amber2);border-color:var(--amber);font-weight:700}
.bar{height:14px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:999px}.bar.gold{outline:2px solid var(--amber)}
.dimlink{color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px;background:none;border:0;padding:0}
.lessonframe{position:sticky;top:52px;background:var(--paper);padding:8px 0;z-index:4;border-bottom:1.5px solid var(--line2)}
/* Bo cuc desktop chung: cot phu chi hien khi cau truc bai hoc da boc xong
   (.lesson-main ton tai) — man tu ve lai giua chung thi roi ve 1 cot, khong vo. */
.lesson-side{display:none}
@media (min-width:1200px){#app.lesson-view:has(>.lesson-main){display:grid;grid-template-columns:minmax(0,820px);gap:24px;align-items:start}#app.lesson-view:has(>.lesson-main)>.lessonframe{grid-column:1/-1}#app.lesson-view:has(>.lesson-main)>.lesson-main{min-width:0}#app.lesson-view:has(>.lesson-main)>.lesson-side{display:block;position:sticky;top:120px}#app.lesson-view:has(>.lesson-main)>.lesson-side .card{margin:0 0 12px}}
.qblock{background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:20px;margin:12px 0}
.why{display:none;background:#FFF8E1;border:1.5px solid var(--amber);border-radius:14px;padding:10px 12px;margin:10px 0}
.why.show{display:block}
.q-opt-sel{outline:3px solid var(--amber);outline-offset:1px}
.summarybox{background:#fff;border:2px solid var(--amber);border-radius:18px;padding:20px;margin:12px 0;position:relative}
.sumcard{background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0}
.bigletter{font-size:76px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.step-row{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line2);border-radius:14px;padding:12px 16px;margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left;font-size:16px}
.step-row.done{border-color:var(--green)}
.step-row.cur{border-color:var(--amber);border-width:2px;background:#FFFBEA}
.step-row.future{opacity:.62}
.step-row .num{font-weight:800;min-width:26px}
.step-row .st{margin-left:auto;font-size:20px}
.ph-table{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.ph-btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;font-size:15px;min-height:44px}
.ph-btn.done{border-color:var(--green)}
.ph-btn.cur{border-color:var(--amber);border-width:2px;background:#FFFBEA}
.ph-btn.lock{opacity:.55}
.ph-map{margin:10px 0}
.ph-map summary{cursor:pointer;font-weight:700}
.q-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;margin:8px 0;font-size:16px;cursor:pointer}
.q-opt.ok{border-color:var(--green);background:#EAF7F0}
.q-opt.bad{border-color:var(--red);background:#FDECEA}
.q-opt:disabled{cursor:default}
#tutorFloatBtn{position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;border:2px solid var(--amber);background:var(--coral);color:#1F2430;font-size:26px;line-height:1;cursor:pointer;z-index:45;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:0}
#tutorFloatPanel{position:fixed;right:16px;bottom:80px;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:#fff;border:2px solid var(--amber);border-radius:18px;padding:14px;z-index:45;box-shadow:0 4px 20px rgba(0,0,0,.25)}
#tutorFloatMsgs .chat-msg{font-size:15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;display:none;z-index:50;max-width:92vw;text-align:center}
#previewBanner{background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
#nudgeModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#nudgeModal .box{background:#fff;border-radius:18px;padding:20px;max-width:480px}
input[type=text],input[type=number],input[type=email],input[type=password]{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px}
iframe{width:100%;aspect-ratio:16/9;border:1.5px solid var(--line2);border-radius:14px}
.mr-video{transform:scaleX(-1);width:100%;max-width:420px;border-radius:14px;background:#000}.mr-stage{position:relative;max-width:420px}
@media (min-width:1200px){.mr-video,.mr-stage{max-width:640px}}.mr-overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}.mr-feed table{width:100%;border-collapse:collapse}.mr-feed td,.mr-feed th{border-bottom:1px solid #E7DCC6;padding:4px 6px;text-align:left;font-size:14px}.mr-lib-row{display:flex;gap:10px;flex-wrap:wrap}.mr-item{width:280px}.mr-item video{width:100%;border-radius:12px}.ai-good{color:#147A4E;font-weight:700}.ai-mid{color:#856000;font-weight:700}.ai-bad{color:#B03A2E;font-weight:700}
.mr-overlay{filter:drop-shadow(0 0 3px rgba(0,0,0,0.85))}
.chat-msg{border:1.5px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff}
.chat-msg.user{background:#FFFBEA}
.chat-msg.ai{background:#fff}
.mr-diag{font-weight:600}
.ai-seg{cursor:pointer;padding:2px 5px;border-radius:7px;line-height:1.9}
.ai-seg-red{background:#FDECEA;border:1.5px solid #D9534F;color:#8B1E1E}
.ai-seg-green{background:#EAF7F0;border:1.5px solid #1E9E6A;color:#14532D}
.ai-seg-lab{font-size:12px;font-weight:700;margin-left:3px}
.btn-soft{background:#FFF3D6;border-color:#E8C87A;color:#1F2430;font-weight:700}
.qblock,.lessonframe{overflow-wrap:break-word}

/* ---- v2 (2026-10-26): he thi giac + bo cuc moi; cac class cu giu nguyen ---- */
:root{--greenbg:#EAF7F0;--redbg:#FDECEA;--soft:#FFF8E1;--sk-vocab:#1F6FB2;--sk-grammar:#7A4FA3;--sk-read:#0E7C6B;--sk-listen:#B45309;--sk-speak:#C2410C;--sk-write:#BE185D}
.eyebrow{font-size:14px;letter-spacing:1.5px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:2px 0 6px}
#app>.card{margin:32px 0}
.stat-strip{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:10px 16px;margin:12px 0;font-size:14px}
.stat-strip .sep{color:var(--line)}
.next-card{border:2px solid var(--amber);background:var(--soft);box-shadow:0 2px 10px rgba(31,36,48,.08)}
.hero-pair{display:flex;gap:16px;align-items:flex-start}
.hero-pair .mascots{flex:0 0 auto;display:flex;gap:2px}
.hero-pair .hero-text{flex:1;min-width:0}
.dragon,.snake{width:64px;height:64px;flex:0 0 auto}
.dragon.sm,.snake.sm{width:56px;height:56px}
@keyframes mascBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.masc-bob{animation:mascBob 3s ease-in-out infinite}
.unit-banner{background:#fff;border:1.5px solid var(--line2);border-left:6px solid var(--amber);border-radius:16px;padding:16px 20px;margin:24px 0 8px}
.unit-banner.sk-vocab{border-left-color:var(--sk-vocab)}.unit-banner.sk-grammar{border-left-color:var(--sk-grammar)}.unit-banner.sk-read{border-left-color:var(--sk-read)}.unit-banner.sk-listen{border-left-color:var(--sk-listen)}.unit-banner.sk-speak{border-left-color:var(--sk-speak)}.unit-banner.sk-write{border-left-color:var(--sk-write)}
.unit-banner b{font-size:18px}
.skill-chip{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:#fff}
.skill-chip.sk-vocab{color:var(--sk-vocab);border-color:var(--sk-vocab)}.skill-chip.sk-grammar{color:var(--sk-grammar);border-color:var(--sk-grammar)}.skill-chip.sk-read{color:var(--sk-read);border-color:var(--sk-read)}.skill-chip.sk-listen{color:var(--sk-listen);border-color:var(--sk-listen)}.skill-chip.sk-speak{color:var(--sk-speak);border-color:var(--sk-speak)}.skill-chip.sk-write{color:var(--sk-write);border-color:var(--sk-write)}
.path-v{position:relative;margin:8px 0 24px}
.path-v::before{content:"";position:absolute;left:29px;top:10px;bottom:10px;width:3px;background:var(--line2)}
.path-node{display:flex;gap:12px;align-items:flex-start;position:relative;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:8px 0;font-size:16px;font-family:inherit;color:inherit}
.path-node .dotwrap{flex:0 0 58px;display:flex;justify-content:center}
.path-node .dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:#fff;border:2px dashed var(--line);color:var(--mut)}
.path-node.done .dot{background:var(--green);border-style:solid;border-color:var(--green);color:#fff}
.path-node.cur .dot{width:58px;height:58px;border:3px solid var(--amber);background:var(--soft);color:var(--ink);box-shadow:0 0 0 6px rgba(255,184,0,.18)}
.path-node .pn-title{font-weight:700}
.path-node .pn-type{font-size:14px;color:var(--mut)}
.path-node .pn-st{font-size:13px}
.path-node.done .pn-st{color:#147A4E;font-weight:700}
.path-node.cur .pn-st{color:#8A6100;font-weight:700}
body.landing-on #tabBar,body.landing-on #previewBanner,body.landing-on #tutorFloatBtn{display:none}
.land-grid{display:grid;gap:12px;margin:16px 0}
@media(min-width:700px){.land-grid{grid-template-columns:1fr 1fr}}
.land-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:64px;padding:14px 16px;text-align:left;border-width:2px}
.land-opt b{font-size:18px}.zh-han{font-size:44px;line-height:1.4}
.path-node.skipped .pn-st{color:var(--mut)}
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:44;background:#fff;border-top:1.5px solid var(--line2);padding:10px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center;box-shadow:0 -2px 10px rgba(31,36,48,.08)}
#bottombar .btn{margin:0}
body.has-bottombar #tutorFloatBtn{bottom:88px}
body.has-bottombar #tutorFloatPanel{bottom:152px}
body.has-bottombar #toast{bottom:88px}
body.has-bottombar #btnBack{display:none}
#bottombar{flex-wrap:wrap}
#bottombar .btn{min-height:44px}
.vocab-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px 20px;grid-template-areas:"main pron" "actions pron" "foot foot" "lib lib";align-items:start}
.vocab-main{grid-area:main;min-width:0}
.vocab-pron{grid-area:pron;min-width:0}
.vocab-actions{grid-area:actions}
.vocab-foot{grid-area:foot}
.vocab-layout .mr-lib-section{grid-area:lib}
.vocab-pron .mr-stage video,.vocab-pron .mr-stage canvas{width:100%}
.native-vid .yg-slot{min-height:220px}
@media (max-width:1199px){.vocab-layout{display:block}}
.summarybox .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.summarybox .confetti i{position:absolute;top:-8px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:confFall 3.2s ease-in forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(160px) rotate(320deg);opacity:0}}
details.card summary,details.rule-more summary,details.why-more summary,details.guide-more summary{cursor:pointer;font-weight:700}
details>summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.why-more{margin-top:8px}
.why-more summary{font-size:14px;color:var(--mut)}
.rule-more{margin:10px 0}
.rule-more summary{font-size:15px}
.dimlink:disabled{opacity:.55;text-decoration:none;cursor:default}
.les-progress{height:8px;background:var(--line2);border-radius:999px;overflow:hidden;margin:8px 0 12px}
.les-progress>i{display:block;height:100%;background:var(--amber);border-radius:999px}
@media (hover:hover){.tip{position:relative}.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);background:var(--ink);color:#fff;font-size:13px;font-weight:400;padding:6px 10px;border-radius:10px;width:220px;z-index:30}}
@media (prefers-reduced-motion:reduce){.masc-bob{animation:none}.summarybox .confetti i{animation:none;display:none}}

/* ---- UI DA NGON NGU (29/10/2026): he thi giac thong nhat, khong doi noi dung ---- */
.lang-label{margin:10px 0 2px}
.tracksw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.tracksw .btn{margin:0;padding:12px 8px;text-align:center;font-size:15px}
.tracksw .btn.on{background:var(--amber2);border-color:var(--amber)}
.tracksw .lang-soon{opacity:.62;border-style:dashed;cursor:default}
.tracksw .lang-soon .soon-tag{display:block;font-size:12px;color:var(--mut);font-weight:400}
@media(max-width:699px){.tracksw{grid-template-columns:1fr 1fr}}
.stat-strip{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px 16px;align-items:center}
@media(max-width:699px){.stat-strip{grid-template-columns:1fr 1fr}.stat-strip #statProgressLink{grid-column:1/-1}}
#nextCard h2,#zhNextCard h2,#entryWelcome h2,#zhEntryWelcome h2,#landingScreen h2,#landingAuth h2{font-size:28px;line-height:1.25;margin:4px 0 8px}
#nextCard .dragon,#nextCard .snake,#zhNextCard .dragon,#zhNextCard .snake,#entryWelcome .dragon,#entryWelcome .snake,#zhEntryWelcome .dragon,#zhEntryWelcome .snake,#landingScreen .dragon,#landingScreen .snake{width:88px;height:88px}
@media(max-width:699px){#nextCard .dragon,#nextCard .snake,#zhNextCard .dragon,#zhNextCard .snake,#entryWelcome .dragon,#entryWelcome .snake,#zhEntryWelcome .dragon,#zhEntryWelcome .snake,#landingScreen .dragon,#landingScreen .snake{width:64px;height:64px}}
</style>
</head>

<div class="wrap">
<header><h1 id="siteTitle">Học tiếng Anh từ đầu</h1></header>
<div id="previewBanner">Bạn đang ở chế độ khách — tiến trình lưu trên máy này, chưa đồng bộ tài khoản. Đăng nhập ở mục Của tôi → Tài khoản để đồng bộ.</div>
<nav class="tabbar" id="tabBar">
<button class="tab" data-tab="home">Học</button>
<button class="tab" data-tab="roadmap">Bản đồ</button>
<button class="tab" data-tab="mypath">Lộ trình riêng</button>
<button class="tab" data-tab="practice">Luyện tập</button>
<button class="tab" data-tab="review">Ôn tập</button>
<button class="tab" data-tab="native">Giao tiếp bản địa</button>
<button class="tab" data-tab="mine">Của tôi</button>
</nav>
<main id="app"><div class="card"><p>Đang tải bài học…</p></div></main>
<div id="toast"></div>
<div id="nudgeModal"><div class="box" id="nudgeBox"></div></div>
</div>
<button id="tutorFloatBtn" aria-label="Gia sư AI" title="Gia sư AI">🤖</button>
<div id="tutorFloatPanel" aria-label="Khung trò chuyện với gia sư AI" style="display:none">
<div class="row" style="justify-content:space-between"><b>Gia sư AI</b><button class="btn" id="tutorFloatClose">✕ Đóng</button></div>

  Object.keys((st && st.hard) || {}).forEach(function (k) {

/* ---------- DONG BANG CHUOI MIEN PHI (U2) ----------
   Hoan toan mien phi, khong mua ban, khong tru XP/ngoc/tien.

function settleStreakFreeze() {
  normFreeze(state);

  var counted = freezeCountedDays();
  var before = Object.keys(counted).filter(function (k) { return k < t; }).sort();
  if (!before.length) return false;
  var anchor = before[before.length - 1];
  var missed = [], d = addDaysStr(anchor, 1);
  while (d < t) { if (!counted[d]) missed.push(d); d = addDaysStr(d, 1); }
  if (!missed.length) return false;
  if (missed.length > state.freeze.count) return false;
  missed.forEach(function (m) { state.freeze.used.push({ missed: m, at: t }); });
  state.freeze.count -= missed.length;
  saveState();
  return true;
}

      state.freeze.granted.push(m);

}

  var t = todayStr(), out = [];
  Object.keys(state.cards).forEach(function (k) {
    var st = state.cards[k];
    if (st && st.due && st.due <= t && (st.box || 0) < 5) {
      var m = k.match(/^s(\d+):(\d+)$/);
      if (m && CONTENT.vocab[+m[1]]) out.push({ key: k, setIdx: +m[1], ci: +m[2], card: CONTENT.vocab[+m[1]].cards[+m[2]], due: st.due, box: (st.box || 0) });

  var t = todayStr(), out = [];

  /* Ưu tiên ôn: câu sai nhiều nhất lên đầu, rồi tới ngày đến hạn sớm nhất. */
  out.sort(function (a, b) {

/* DOT honest 28/10/2026: tang nac SRS cho the tu vung — chi khi dung lan dau

function vocabBoxJudge(key, firstTryOk, opts) {

    var box = Math.min(5, (cur.box || 0) + 1);

/* ---------- Lộ trình chương 1 ---------- */
function stepById(id) { return RB_CH1_STEPS.filter(function (s) { return s.id === id; })[0]; }

/* ---------- v2 (2026-10-26): BUOI HOC HOM NAY + DAT CHANG TU KIEM TRA ---------- */
/* Thu tu buoi hoc: (a) muc on toi han trong ngay truoc; (b) buoc lo trinh

function entryBandFor(part, firstN, total) {

}

  if (learningSteps().every(function (s) { return stepDone(s.id); }) && !state.testDone) return { kind: "test", title: "Bài kiểm tra cuối chương 1", type: "Kiểm tra cuối chương" };

  if (pp && pp.stepId) { var st2 = stepById(pp.stepId); if (st2) return { kind: "step", title: st2.title, type: st2.type, step: st2, fromPp: true }; }
  var ns = nextLearnStep();
  if (ns) return { kind: "step", title: ns.title, type: ns.type, step: ns };

/* ---------- SPEC 29/10/2026 (1): DASHBOARD VIEC HOM NAY ----------

/* Bao loi AI dung ma that tu may chu (dot 2): 429 het luot, 404 sai ten mo hinh,
   400/403 khoa/y eu cau, 502 loi tam thoi that, 503 chua cau hinh hoac dang ban.
   Khong gop moi loi thanh mot cau "AI dang ban" chung chung. */
function aiErrMessage(status, errCode, loginMsg) {
  if (status === 401) return loginMsg || "Cần đăng nhập để dùng AI.";
  if (status === 429) return "AI đã hết lượt cho phép — hãy thử lại sau. (mã lỗi 429)";
  if (status === 404) return "Mô hình AI không còn đúng tên — máy chủ đang dùng tên mô hình cũ. (mã lỗi 404)";
  if (status === 400) return "Yêu cầu gửi AI chưa đúng — hãy thử gửi lại. (mã lỗi 400)";
  if (status === 403) return "Khóa AI không còn hợp lệ — cần kiểm tra lại khóa trên máy chủ. (mã lỗi 403)";
  if (errCode === "not_configured" || errCode === "server_misconfigured") return "AI chưa được cấu hình trên máy chủ. (mã lỗi 503)";
  if (errCode === "empty_reply") return "AI trả về trống — hãy thử gửi lại. (mã lỗi 502)";
  if (status === 502) return "Máy chủ AI đang lỗi tạm thời — hãy thử lại sau ít phút. (mã lỗi 502)";
  if (status === 503) return "AI đang bận — hãy thử lại sau ít phút. (mã lỗi 503)";
  if (status) return "AI chưa trả lời được (lỗi máy chủ " + status + ") — hãy thử lại.";
  return "Mất mạng — hãy kiểm tra kết nối rồi gửi lại.";
}

/* ----- Máy chấm câu hỏi MỞ RỘNG (luyện tập thi): trắc nghiệm + điền đáp án ----- */
/* Chuẩn hóa mọi dạng câu hỏi của kho cũ về một hình duy nhất để máy chấm dùng chung:
   - trắc nghiệm: q.o = q.o || q.options, q.a = chỉ số đáp án đúng;
   - điền đáp án: q.answer = "đáp án 1|đáp án 2" (các cách viết chấp nhận, tách bằng |).
   Bài luyện: câu sai vào Sổ lỗi sai, gợi ý rồi chặn tới khi làm đúng.
   (Máy chấm này nay chỉ dùng cho bài luyện; phần thi dùng dạng thi riêng.) */
function normSkillQ(q) {
  var o = q.o || q.options || null;
  var ans = (q.answer !== undefined && q.answer !== null) ? String(q.answer) : null;
  return { q: q.q, o: o, a: (o ? q.a : null), answer: ans, why: q.why || "", type: q.type || "", key: q.key || null };
}
function normAnsText(s) {
  return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
function textAnsOk(input, answer) {
  var n = normAnsText(input);
  if (!n) return false;
  return String(answer).split("|").some(function (alt) { return normAnsText(alt) === n; });
}
function phaseBarHTML(phase) {
  var p1 = phase === 1 ? "<b>1. Lý thuyết</b>" : "1. Lý thuyết";
  var p2 = phase === 2 ? "<b>2. Thực hành</b>" : "2. Thực hành";
  return '<p class="mut">Pha: ' + p1 + " \u2192 " + p2 + "</p>";
}
function videoSlotIf(key) { /* khung video CHỈ khi bản đồ có clip cho khóa này; màn chưa có video thì không hiện khung trống (khác khung "Sắp có" của trạm ngữ pháp) */
  return (typeof GRAMMAR_VIDEOS !== "undefined" && GRAMMAR_VIDEOS[key]) ? videoSlotHTML(key) : "";
}
function fmtSegTime(sec) {
  sec = Math.max(0, Math.floor(+sec || 0));

/* Tách IPA thành từng âm bằng phép khớp dài nhất với bảng 44 âm (kỹ thuật của
   web cũ, dữ kiện là phiên âm của chính thẻ từ trong kho) — "từ chứa âm X"
   là chứa thật theo phiên âm đó, không đoán theo chữ viết. */
var PH_TOK_ORDER = ["tʃ", "dʒ", "i:", "u:", "ɑ:", "ɔ:", "eɪ", "aɪ", "ɔɪ", "əʊ", "aʊ", "ɪə", "eə", "ʊə", "ɪ", "e", "æ", "ɒ", "ʊ", "ʌ", "ɜ:", "ə", "p", "b", "t", "d", "k", "ɡ", "f", "v", "θ", "ð", "s", "z", "ʃ", "ʒ", "h", "m", "n", "ŋ", "l", "r", "w", "j"];
function phTokIpa(ipa) {
  var raw = String(ipa || "").replace(/[/.]/g, "").replace(/ː/g, ":");
  var toks = [], stressed = {};
  raw.split(/\s+/).filter(Boolean).forEach(function (part) {
    var i = 0, pending = false;
    while (i < part.length) {
      var ch = part[i];
      if (ch === "ˈ") { pending = true; i++; continue; }
      if (ch === "ˌ") { i++; continue; }
      if (ch === "(") { var j = part.indexOf(")", i); i = (j < 0 ? part.length : j + 1); continue; }
      var m = null;
      for (var k = 0; k < PH_TOK_ORDER.length; k++) if (part.indexOf(PH_TOK_ORDER[k], i) === i) { m = PH_TOK_ORDER[k]; break; }
      if (pending) { stressed[toks.length] = true; pending = false; }
      if (m) { toks.push(m); i += m.length; } else { toks.push(ch); i++; }
    }

}
var PH_POOL_CACHE = null;
function phPool() {
  if (PH_POOL_CACHE) return PH_POOL_CACHE;
  var singles = [], phrases = [];
  (CONTENT.vocab || []).forEach(function (v) {
    (v.cards || []).forEach(function (cd) {
      if (!cd || !cd.w || cd.w.length < 2 || /\d/.test(cd.w)) return;
      var t = phTokIpa(cd.ipa);
      if (cd.w.indexOf(" ") >= 0) phrases.push({ w: cd.w, ipa: cd.ipa || "", vi: cd.vi || "", toks: t.toks });
      else singles.push({ w: cd.w, ipa: cd.ipa || "", vi: cd.vi || "", ex: cd.ex || "", exv: cd.exv || "", col: cd.col || "", toks: t.toks, stressed: t.stressed });
    });

}
function phRankScore(sym, c, mainW) {
  var sc = c.toks.length * 10 + c.w.length;
  if (c.w.toLowerCase() === mainW.toLowerCase()) sc -= 1000;
  c.toks.forEach(function (t, i) { if (t === sym && c.stressed[i]) sc -= 40; });
  if (c.toks[0] === sym || c.toks[c.toks.length - 1] === sym) sc -= 30;
  return sc;
}
function phExtraWords(sym) {
  var mainW = (phEntry(sym) || {}).w || "";
  var seen = {}, out = [];
  phPool().singles.filter(function (c) { return c.toks.indexOf(sym) >= 0; })
    .sort(function (a, b) { return phRankScore(sym, a, mainW) - phRankScore(sym, b, mainW); })
    .forEach(function (c) {
      var k = c.w.toLowerCase();
      if (k === mainW.toLowerCase() || seen[k]) return;
      seen[k] = true; out.push(c);
    });
  return out.slice(0, 4);
}
function phExtraPhrases(sym) {
  var seen = {}, out = [];
  phPool().phrases.filter(function (c) { return c.toks.indexOf(sym) >= 0; })
    .forEach(function (c) { var k = c.w.toLowerCase(); if (!seen[k]) { seen[k] = true; out.push(c); } });
  return out.slice(0, 2);
}
function phExtraSentences(sym) {
  var mainW = (phEntry(sym) || {}).w || "";
  var seen = {}, out = [];
  phPool().singles.filter(function (c) { return c.toks.indexOf(sym) >= 0 && c.ex; })
    .sort(function (a, b) { return phRankScore(sym, a, mainW) - phRankScore(sym, b, mainW); })
    .forEach(function (c) {
      var k = c.w.toLowerCase();
      if (k === mainW.toLowerCase() || seen[k]) return;
      seen[k] = true; out.push(c);
    });
  return out.slice(0, 2);
}

function phShadowQuizQs(sym) {

  var viOpts = uniqBy(pool, function (x) { return (x.vi || "").toLowerCase(); }).filter(function (x) { return x.vi && x.vi.toLowerCase() !== (p.vi || "").toLowerCase(); }).slice(0, 3).map(function (x) { return x.vi; });

/* ----- Bài kiểm tra cuối chương ----- */
function normBandStr(b) { return String(b || "").replace(".", ","); }
function chapterTestOpen(band) {
  var steps = rbGateSteps(band);
  if (!steps.length) return false;
  var dc = steps.filter(function (st) { return rbStepDone(st); }).length;
  return dc >= Math.ceil(steps.length * 0.8);
}
function chapterTestQuestions(band) {
  var parts = [], gQs = [], rQs = [], lQs = [];
  CONTENT.grammar.forEach(function (g) { if (normBandStr(g.level) === band) (g.quiz || []).forEach(function (q) { gQs.push(q); }); });
  if (gQs.length) parts.push({ name: "Ngữ pháp", qs: gQs.slice(0, 10) });
  CONTENT.reading.forEach(function (r) { if (normBandStr(r.level) === band) (r.questions || []).forEach(function (q) { rQs.push(q); }); });
  if (rQs.length) parts.push({ name: "Đọc", qs: rQs.slice(0, 10) });
  CONTENT.listeningPlus.forEach(function (r) { if (normBandStr(r.band) === band) (r.questions || []).forEach(function (q) { lQs.push(q); }); });
  if (lQs.length) parts.push({ name: "Nghe dài", qs: lQs.slice(0, 10) });
  return parts;
}
/* ROADMAP-N10: can-do cuoi chuong — hien khi qua kiem tra cuoi chuong. */

        + '<p><b>Band ước lượng: ' + fmtBandComma(bandEst) + '</b> <span class="mut">(dùng bảng Đọc làm bảng chung cho kiểm tra tổng hợp)</span><br><span class="mut">' + RB_BAND_NOTE + '</span></p>'

}

var EXAM_MOCK_MIN = { listening: 30, reading: 60, writing: 60, speaking: 14 };
var EXAM_PHASE_MIN = { listening: 10, reading: 20, writing: 40 };
var EXAM_SPEAK_PART_MIN = { 1: 5, 2: 4, 3: 5 };
function examClockText(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" + r : r);
}
function makeExamTimer() {
  var t = null;
  return {
    start: function (key, minutes, onTimeout, elId) {
      if (t && t.key === key) return;
      if (t && t.intId) clearInterval(t.intId);
      t = { key: key, endAt: Date.now() + minutes * 60000, onTimeout: onTimeout, elId: elId || "examClock" };
      var tick = function () {
        /* UI 28/10 (D-L4): man ve lai lam mat phan tu #examClock trong choc
           lat khong duoc giet dong ho lang le — chi bo qua lan cap nhat do,
           lan sau tim lai phan tu. Het gio van chay callback du phan tu mat. */
        if (!t) return;
        var el = document.getElementById(t.elId);
        var left = t.endAt - Date.now();
        if (left <= 0) { if (el) el.textContent = "Hết giờ!"; var cb = t.onTimeout; if (t.intId) clearInterval(t.intId); t = null; if (cb) cb(); return; }
        if (el) el.textContent = "Còn " + examClockText(left);
      };
      t.intId = setInterval(tick, 1000); tick();
    },
    stop: function () { if (t && t.intId) clearInterval(t.intId); t = null; },
    running: function () { return !!t; }
  };
}
var examTimer = makeExamTimer();
var examPartTimer = makeExamTimer();
function examTimerStart(key, minutes, onTimeout, elId) { examTimer.start(key, minutes, onTimeout, elId); }
function examTimerStop() { examTimer.stop(); }
function examPartTimerStart(key, minutes, onTimeout, elId) { examPartTimer.start(key, minutes, onTimeout, elId); }
function examPartTimerStop() { examPartTimer.stop(); }
function examClockBlock(minutes, note) {
  return '<div class="qblock"><b>⏱ Đồng hồ thi: <span id="examClock">Còn ' + examClockText(minutes * 60000) + '</span></b>'
    + '<span class="mut"> · ' + (note || "Hết giờ bài tự nộp.") + '</span></div>';
}
function examPartClockBlock(minutes) {
  return '<div class="qblock"><b>⏱ Đồng hồ Part này: <span id="examClockPart">Còn ' + examClockText(minutes * 60000) + '</span></b></div>';
}
/* Kiểm tra đã đăng nhập chưa mà KHÔNG gọi mạng (getSession chỉ đọc phiên đã lưu trên máy).
   Dùng để chặn gọi AI khi chưa đăng nhập: chưa đăng nhập thì AI chấm không chạy, chỉ ước lượng tại chỗ. */
function examHasSession() {
  return new Promise(function (resolve) {
    try {
      var ready = window.__supabaseReady;
      if (!ready || typeof ready.then !== "function") { resolve(false); return; }
      ready.then(function (client) {
        if (!client || !client.auth || !client.auth.getSession) { resolve(false); return; }
        client.auth.getSession().then(function (res) { resolve(!!(res && res.data && res.data.session && res.data.session.access_token)); }, function () { resolve(false); });
      }, function () { resolve(false); });
    } catch (e) { resolve(false); }
  });
}

/* Chuẩn hóa từ để so khớp (dùng cho chấm Nói tại chỗ và gom vấn đề theo câu). */
function normSpeakWord(s) { return String(s || "").toLowerCase().replace(/[^a-zà-ỹ0-9']/g, ""); }
/* Ước lượng tại chỗ từ bản ghi trình duyệt (KHÔNG phải AI chấm): % từ mẫu có trong bản ghi. */
function localSpeechEstimate(transcript, refText) {
  var norm = function (s) { return String(s || "").toLowerCase().replace(/[^a-zà-ỹ0-9'\s]/g, " ").split(/\s+/).filter(Boolean); };
  var heard = {}; norm(transcript).forEach(function (w) { heard[w] = true; });
  var seen = {}, ref = [];
  norm(refText).forEach(function (w) { if (!seen[w]) { seen[w] = true; ref.push(w); } });
  var found = ref.filter(function (w) { return heard[w]; });
  var missing = ref.filter(function (w) { return !heard[w]; });
  return { pct: ref.length ? Math.round(found.length / ref.length * 100) : 0, found: found, missing: missing, total: ref.length };
}
/* Gom kết quả pronounce theo từng câu nói của thí sinh (mỗi dòng Candidate = một câu).
   words của máy chủ xếp đúng thứ tự từ của bài mẫu nên chia theo số từ từng dòng. */
function examSpeakSentences(refLines, words, issues) {
  var issueByNorm = {};
  (issues || []).forEach(function (it) { issueByNorm[normSpeakWord(it.word)] = it; });
  var out = [], wi = 0;
  refLines.forEach(function (line) {
    var toks = String(line).split(/\s+/).filter(Boolean);
    var seg = [], ok = 0;
    for (var k = 0; k < toks.length; k++) {
      var w = (words || [])[wi] || null; wi++;
      var isOk = !!(w && w.ok);
      if (isOk) ok++;
      var iss = null;
      if (w && !isOk) iss = issueByNorm[normSpeakWord(w.word)] || null;
      seg.push({ word: w ? w.word : toks[k], ok: isOk, issue: iss });
    }
    out.push({ text: line, total: toks.length, ok: ok, pct: toks.length ? Math.round(ok / toks.length * 100) : 0, words: seg });
  });
  return out;
}
/* Các dòng thí sinh nói trong kịch bản (bỏ dòng giám khảo). */
function examSpeakRefLines(script) {
  return (script.lines || []).filter(function (ln) { return !/examiner|giám khảo/i.test(ln.who || ""); }).map(function (ln) { return ln.en; });
}
function examSpeakRefText(script) { return examSpeakRefLines(script).join(" "); }

var phaseRun = null;
function phasePick(arr, phase) { return arr[(phase - 1) % arr.length]; }
function phasePickBandIdx(arr, phase) {
  var order = arr.map(function (x, i) { return i; }).sort(function (a, b) { var ba = bandSortVal(arr[a].band || arr[a].level), bb = bandSortVal(arr[b].band || arr[b].level); return ba - bb || a - b; });
  return order[(phase - 1) % order.length];
}

/* AI chấm phát âm dùng đúng hàm callPronounce đã có (functions/v1/pronounce + JWT).
   Hàm pronounce chỉ trả điểm phát âm từng chữ, KHÔNG trả 4 tiêu chí Nói — nên band
   4 tiêu chí do AI chấm (mode speaking), AI phát âm từng chữ đi kèm.

function examSpeakPartHTML(script, opts) {

    + '<p class="mut">Chỉ có 1 nút duy nhất dưới đây, đổi nhãn theo từng bước: bấm để bắt đầu ghi âm, bấm lại để dừng và chấm, chấm xong bấm tiếp để sang AI chấm 4 tiêu chí. Bài nói mẫu của giám khảo giữ nguyên phía trên để đối chiếu.</p>'

    + '<div id="spRecResult"></div></div>';

function wireExamSpeakPart(l, script, opts) {
  /* Ghi am lai toan bai (spAiReRecord) quay lai man nay: trang thai cu done/failed
     phai reset ve idle, neu khong nut gop se hieu la da cham xong va di thang tiep. */
  if (l.spRec && (l.spRec.status === "done" || l.spRec.status === "noscored" || l.spRec.status === "failed")) l.spRec = null;
  var st = function () { if (!l.spRec) l.spRec = { status: "idle", blob: null, mime: "", transcript: "", ai: null, aiErr: "", local: null, gen: 0, discarded: false, timeoutAdvance: false }; return l.spRec; };
  var statusEl = $("#spRecStatus"), resultEl = $("#spRecResult");
  var mainBtn = $("#" + opts.skipId);
  var continueLabel = opts.continueLabel || "Tiếp tục → AI chấm 4 tiêu chí";
  var failLabel = opts.failLabel || "Không ghi âm được → AI chấm 4 tiêu chí";
  var setStatus = function (t) { if (statusEl) statusEl.textContent = t; };
  var refreshBtn = function () {
    var s = st();
    if (!mainBtn) return;
    if (s.status === "rec") { mainBtn.textContent = "Dừng và chấm"; mainBtn.disabled = false; }
    else if (s.status === "scoring") { mainBtn.textContent = "Đang chấm..."; mainBtn.disabled = true; }
    else if (s.status === "failed") { mainBtn.textContent = failLabel; mainBtn.disabled = false; }
    else if (s.status === "done" || s.status === "noscored") { mainBtn.textContent = continueLabel; mainBtn.disabled = false; }
    else { mainBtn.textContent = "🎤 Bắt đầu ghi âm"; mainBtn.disabled = false; }
  };
  /* Sau khi cham xong (AI, uoc luong tai cho, hoac bao loi AI): render ket qua,
     doi nut thanh nut tiep tuc, va doi dong trang thai khoi "Dang cham bai noi..."
     (loi ket dong trang thai ma Bui chup anh 15:50 25/10). */
  var completeScore = function () {
    renderResult(); refreshBtn();
    if (st().timeoutAdvance) { setStatus("Đã hết giờ — tự chuyển tiếp sau 3 giây."); setTimeout(opts.onSkip, 3000); }
    else setStatus("Đã chấm xong — bấm nút dưới để tiếp tục.");
  };
  var stopTracks = function () {
    var s = st();
    try { if (s.sr) s.sr.stop(); } catch (e) {}
    try { if (s.stream) s.stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
  };
  var renderResult = function () {
    var s = st();
    if (!resultEl) return;
    if (s.ai) {
      var sens = examSpeakSentences(examSpeakRefLines(script), s.ai.words || [], s.ai.issues || []);
      var h = '<div class="sumcard"><h3>AI chấm phát âm: ' + s.ai.score + '%</h3>'
        + '<p class="mut">Máy ước lượng theo từng chữ đã nghe (không phải điểm thi thật).</p>'
        + '<p>Nghe được: ' + esc(s.ai.transcript || "") + '</p>'
        + sens.map(function (sn) {
          return '<p><b>' + esc(sn.text) + '</b> — ' + sn.ok + '/' + sn.total + ' từ đúng (' + sn.pct + '%)'
            + sn.words.filter(function (w) { return !w.ok; }).map(function (w) {
              return '<br>· <b>' + esc(w.word) + '</b>' + (w.issue ? ' — nghe thành “' + esc(w.issue.heard || "?") + '”, âm /' + esc(w.issue.ipa || "") + '/ (' + esc(w.issue.sound || "") + ')' : ' — chưa nghe được');
            }).join("") + '</p>';
        }).join("")
        + '</div>';
      resultEl.innerHTML = h;
    } else if (s.local) {
      resultEl.innerHTML = '<div class="sumcard"><h3>Ước lượng tại chỗ: ' + s.local.pct + '% từ khớp với bài mẫu</h3>'
        + '<p class="mut">Bản ghi trình duyệt chỉ là ước lượng, chưa phải AI chấm (cần đăng nhập để AI chấm).</p>'
        + (s.local.missing.length ? '<p>Chưa nghe được: ' + esc(s.local.missing.join(", ")) + '</p>' : '<p>Nghe được đủ các từ mẫu.</p>')
        + '</div>';
    } else if (s.aiErr) {
      resultEl.innerHTML = '<div class="sumcard"><p>' + esc(s.aiErr) + '</p>'
        + (s.local ? '<p>Ước lượng tại chỗ từ bản ghi: ' + s.local.pct + '% từ khớp (chưa phải AI chấm).</p>' : '')
        + '<p class="mut">Không chấm được bằng AI ở bước này — bấm nút dưới để tiếp tục sang AI chấm 4 tiêu chí.</p></div>';
    } else if (s.status === "noscored") {
      resultEl.innerHTML = '<div class="sumcard"><p class="mut">Không có bản ghi để chấm — bấm nút dưới để tiếp tục sang AI chấm 4 tiêu chí (ở đó AI sẽ báo cần bản ghi và cho ghi âm lại).</p></div>';
    }
  };
  var finishScore = function () {
    var s = st();
    if (s.discarded) return;
    if (!s.blob) {
      s.status = "noscored"; completeScore();
      return;
    }
    setStatus("Đang chấm bài nói...");
    var ref = examSpeakRefText(script);
    var gen = s.gen;
    examHasSession().then(function (logged) {
      if (gen !== st().gen || st().discarded) return;
      if (!logged) {
        if (!s.transcript) { s.aiErr = "Không nghe được gì từ bản ghi trình duyệt nên không ước lượng được."; s.local = null; }
        else s.local = localSpeechEstimate(s.transcript, ref);
        s.status = "done"; completeScore();
        return;
      }
      mrBlobToBase64(s.blob, function (b64) {
        if (gen !== st().gen || st().discarded) return;
        if (!b64) {
          s.aiErr = "Không đọc được bản ghi — hãy thử ghi lại.";
          if (s.transcript) s.local = localSpeechEstimate(s.transcript, ref);
          s.status = "done"; completeScore();
          return;
        }
        callPronounce(b64, s.mime || "audio/webm", ref).then(function (data) {
          if (gen !== st().gen || st().discarded) return;
          s.ai = data; s.status = "done";
          if (opts.onScored) opts.onScored(data);
          completeScore();
        }, function (err) {
          if (gen !== st().gen || st().discarded) return;
          s.aiErr = (err && err.message) || String(err);
          if (s.transcript) s.local = localSpeechEstimate(s.transcript, ref);
          s.status = "done"; completeScore();
        });
      });
    });
  };
  var doSkip = function () {
    var s = st();
    s.discarded = true; s.gen++;
    stopTracks();
    try { if (s.rec && s.rec.state === "recording") s.rec.stop(); } catch (e) {}
    opts.onSkip();
  };
  var stopRec = function () {
    var s = st();
    try { if (s.sr) s.sr.stop(); } catch (e) {}
    try { if (s.rec && s.rec.state === "recording") s.rec.stop(); } catch (e) {}
  };
  if (mainBtn) mainBtn.onclick = function () {
    var s = st();
    if (s.status === "rec") { stopRec(); return; }
    if (s.status === "scoring") return;
    if (s.status === "done" || s.status === "noscored" || s.status === "failed") { doSkip(); return; }
    if (!mrSupported() || !mrRecSupported()) { s.status = "failed"; setStatus("Trình duyệt này chưa hỗ trợ ghi âm — bấm nút dưới để tiếp tục (cần mic để AI chấm phát âm)."); refreshBtn(); return; }
    s.gen++;
    s.discarded = false; s.timeoutAdvance = false;
navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      s.stream = stream; s.chunks = []; s.transcript = ""; s.ai = null; s.aiErr = ""; s.local = null;
      try {
        var mime = mrPickAudioMime();
        var rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        s.rec = rec; s.mime = mime || rec.mimeType || "";
        rec.ondataavailable = function (e) { if (e.data && e.data.size) s.chunks.push(e.data); };
        rec.onstop = function () {
          stopTracks();
          try { s.blob = new Blob(s.chunks, { type: s.mime || "audio/webm" }); } catch (e) { s.blob = null; }
          s.status = "scoring"; refreshBtn(); setStatus("Đã ghi xong — đang chấm...");
          finishScore();

function gd23Levenshtein(a, b) {
  a = String(a || ""); b = String(b || "");
  var m = a.length, n = b.length, prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    var tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}
function gd23NormLoose(s) {
  return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

}

/* ----- c3: đề tự sinh trộn dạng ----- */
function gd23BuildMixedQuiz(n) {
  n = n || 12;
  var mc = [], tf = [], fill = [];
  (CONTENT.reading || []).forEach(function (r) {
    (r.questions || []).forEach(function (q) {
      var opts = q.o || q.options;
      if (opts && typeof q.a === "number" && q.type !== "TFNG" && q.type !== "YNNG") mc.push({ q: q.q, o: opts, a: q.a, why: q.why || "", kind: "mc" });
      else if (typeof q.answer === "string" && q.answer) fill.push({ q: q.q, answer: q.answer, why: q.why || "", kind: "fill" });
    });
  });
  (CONTENT.listeningPlus || []).forEach(function (r) {
    (r.questions || []).forEach(function (q) {
      if (q.type === "TF" && q.o) {
        var a = (q.o[q.a] === "True") ? 0 : 1;
        tf.push({ q: q.q, o: ["Đúng", "Sai"], a: a, why: q.why || "", kind: "tf" });
      } else if (q.type === "MC" && q.o && typeof q.a === "number") mc.push({ q: q.q, o: q.o, a: q.a, why: q.why || "", kind: "mc" });
      else if (typeof q.answer === "string" && q.answer) fill.push({ q: q.q, answer: q.answer, why: q.why || "", kind: "fill" });
    });
  });
  var pools = [mc, tf, fill], idx = [0, 0, 0], out = [], turn = 0;
  while (out.length < n && (idx[0] < mc.length || idx[1] < tf.length || idx[2] < fill.length)) {
    var p = pools[turn % 3];
    if (idx[turn % 3] < p.length) { out.push(p[idx[turn % 3]]); idx[turn % 3]++; }
    turn++;
    if (turn > n * 4 + 10) break;
  }
  return out;
}
function renderMixedQuiz(app, l) {
  if (!l.qs) l.qs = gd23BuildMixedQuiz(12);
  l.title = "Đề tự sinh trộn dạng";
  l.sub = "Trộn trắc nghiệm, đúng/sai, điền từ — sinh từ kho câu sẵn có của web, không phải đề thi thật, không chép đề thật.";
  l.skillKey = "mixedQuiz";
  if (!l.theoryDone) {
    var ex = function (kind) { for (var i = 0; i < l.qs.length; i++) if (l.qs[i].kind === kind) return l.qs[i]; return null; };
    var mc = ex("mc"), tf = ex("tf"), fl = ex("fill");
    var exHTML = "";
    if (mc) exHTML += '<p><b>Ví dụ trắc nghiệm:</b> ' + esc(mc.q) + ' — đáp án đúng: <b>' + esc(mc.o[mc.a]) + '</b>' + (mc.why ? ' (' + esc(mc.why) + ')' : '') + '</p>';
    if (tf) exHTML += '<p><b>Ví dụ đúng/sai:</b> ' + esc(tf.q) + ' — đáp án đúng: <b>' + esc(tf.o[tf.a]) + '</b>' + (tf.why ? ' (' + esc(tf.why) + ')' : '') + '</p>';
    if (fl) exHTML += '<p><b>Ví dụ điền từ:</b> ' + esc(fl.q) + ' — đáp án đúng: <b>' + esc(fl.answer) + '</b>' + (fl.why ? ' (' + esc(fl.why) + ')' : '') + '</p>';
    app.innerHTML = skillHead("Đề tự sinh trộn dạng", "Trộn trắc nghiệm, đúng/sai, điền từ — sinh từ kho câu sẵn có của web, không phải đề thi thật, không chép đề thật.")
      + phaseBarHTML(1) + '<div class="qblock"><h3>1. Lý thuyết — làm đề trộn như thế nào</h3>' + exHTML
      + '<p><b>Quy tắc:</b> đọc kỹ câu hỏi trước khi chọn; câu đúng/sai chỉ chọn “Đúng” khi câu khẳng định đúng hẳn với dữ kiện, còn lại chọn “Sai”; câu điền từ gõ đúng dạng từ cần điền; câu nào sai sẽ vào Sổ lỗi sai để ôn lại.</p>'
      + '<div class="row"><button class="btn btn-primary" id="mixedTheoryNext">Vào luyện tập →</button></div></div>';
    wireBack();

  }

/* ----- c20: luyện nói cloze ----- */
function gd23VocabWordMap() {
  var map = {};
  (CONTENT.vocab || []).forEach(function (v) {
    (v.cards || []).forEach(function (c) { if (c.w) map[c.w.toLowerCase()] = c; });
  });
  return map;
}
function gd23BuildClozeItems() {
  var dict = gd23VocabWordMap(), out = [];
  (CONTENT.speaking || []).forEach(function (s) {
    if (out.length >= 6) return;
    (s.lines || []).forEach(function (ln) {
      if (out.length >= 6 || ln.who !== "Candidate") return;
      var words = String(ln.en || "").split(/\s+/);
      for (var i = 0; i < words.length; i++) {
        var clean = words[i].replace(/[^A-Za-z']/g, "").toLowerCase();
        if (clean.length >= 4 && dict[clean]) {
          var target = words[i].replace(/[^A-Za-z']/g, "");
          var re = new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z])");
          var blanked = String(ln.en).replace(re, "___");
          if (blanked.indexOf("___") >= 0) out.push({ full: ln.en, blanked: blanked, target: target, vi: dict[clean].vi || "" });
          break;
        }
      }
    });
  });
  return out;
}
function gd23CheckClozeSpeech(transcript, full) {
  var norm = function (s) {
    return String(s || "").toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
  };

/* ----- GĐ3: gõ dịch khoan dung + độ nghiêm ngặt theo trình độ ----- */
function gd23Strictness(band) {
  var n = null;
  if (typeof bandNumOf === "function") { try { n = bandNumOf(band); } catch (e) { n = null; } }
  if (n === null || n === undefined) { var m = String(band || "").match(/([0-9]+(?:[,.][0-9]+)?)/); n = m ? parseFloat(m[1].replace(",", ".")) : 0; }
  if (n < 4) return { key: "khoan", label: "khoan dung (chặng thấp)", maxDist: 2 };
  if (n < 6) return { key: "vua", label: "vừa (chặng giữa)", maxDist: 1 };
  return { key: "chat", label: "chặt (chặng cao)", maxDist: 0 };
}
function gd23StrictBandForLesson(l, lessonId) {
  if (l && l.band) return l.band;
  var parts = String(lessonId || "").split(":");
  if (parts[0] === "read" && CONTENT.reading[+parts[1]]) return CONTENT.reading[+parts[1]].level || "Band 0";
  if (parts[0] === "listenLong" && CONTENT.listeningPlus[+parts[1]]) return CONTENT.listeningPlus[+parts[1]].band || "Band 0";
  return "Band 0";
}
function gd23TolerantCheck(input, answer, strict) {
  var rawIn = String(input || "").toLowerCase().replace(/\s+/g, " ").trim();
  var alts = String(answer).split("|");
  var best = null;
  alts.forEach(function (alt) {
    var rawAlt = String(alt).toLowerCase().replace(/\s+/g, " ").trim();
    var d = gd23Levenshtein(gd23NormLoose(input), gd23NormLoose(alt));
    var cand = { alt: alt, distance: d, rawEqual: rawIn === rawAlt };
    if (!best || d < best.distance) best = cand;
  });
  if (!best) return { ok: false, minor: [], distance: 99 };
  if (strict.key === "chat") {
    if (best.rawEqual) return { ok: true, minor: [], distance: 0 };
    if (best.distance === 0) return { ok: false, minor: ["chặng cao chấm chặt: cần đúng cả dấu câu, bạn gõ khác mẫu ở dấu câu"], distance: 0 };
    return { ok: false, minor: [], distance: best.distance };
  }
  if (best.distance === 0) {
    var minor = best.rawEqual ? [] : ["dấu câu/chữ hoa khác mẫu"];
    return { ok: true, minor: minor, distance: 0 };
  }
  if (best.distance <= strict.maxDist) return { ok: true, minor: ["sai " + best.distance + " ký tự so với mẫu"], distance: best.distance };
  return { ok: false, minor: [], distance: best.distance };
}

/* ----- GĐ3: Speech Analyzer 5 mảng ----- */
function gd23AnalyzeSpeech(transcript, aiScore) {
  var t = String(transcript || "");
  var normStr = t.toLowerCase().replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
  var words = normStr ? normStr.split(" ").filter(Boolean) : [];
  var sents = t.split(/[.!?]+/).map(function (s) { return s.trim(); }).filter(Boolean);
  var distinct = {};
  words.forEach(function (w) { distinct[w] = true; });
  var padded = " " + normStr + " ";
  var linkers = ["firstly", "secondly", "finally", "however", "because", "for example", "in conclusion", "also", "moreover", "on the other hand"];
  var foundLink = linkers.filter(function (lw) { return padded.indexOf(" " + lw + " ") >= 0; });
  var fillerN = 0;
  words.forEach(function (w) { if (w === "um" || w === "uh") fillerN++; });
  var vocabSet = {};
  (CONTENT.vocab || []).forEach(function (v) { (v.cards || []).forEach(function (c) { if (c.w) vocabSet[c.w.toLowerCase()] = true; }); });
  var inVocab = 0;
  Object.keys(distinct).forEach(function (w) { if (vocabSet[w]) inVocab++; });

   lien tiep o cac lan on cach quang. Muc zhHard cu thieu truong moi van hien
   binh thuong: coi nhu den han ngay (due rong), fails = 0. */
function zhDueHard() {
  var t = todayStr(), out = [];
  Object.keys(state.zhHard || {}).forEach(function (k) {
    var h = state.zhHard[k];
    if (h && !h.done && (!h.due || h.due <= t)) out.push({ key: k, h: h });
  });
  /* Uu tien on: cau sai nhieu nhat len dau, roi toi ngay den han som nhat. */
  out.sort(function (a, b) {
    var fa = (a.h.fails || 0), fb = (b.h.fails || 0);
    if (fb !== fa) return fb - fa;
    var da = a.h.due || "", db = b.h.due || "";
    if (da !== db) return da < db ? -1 : 1;
    return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
  });
  return out;
}
function zhHardJudge(key, ok) {
  var h = (state.zhHard || {})[key];

    h.streak = (h.streak || 0) + 1;
    if (h.streak >= 2) { h.done = true; h.due = ""; }
    else { h.level = (h.level || 0) + 1; h.due = addDaysStr(todayStr(), RB_INTERVALS[Math.min(h.level, RB_INTERVALS.length - 1)]); }
  } else { h.fails = (h.fails || 0) + 1; h.streak = 0; h.due = addDaysStr(todayStr(), 1); }

}

function zhFaceItems(setKey) {
  var d = zhSetByKey(setKey);
  if (!d) return [];
  var cards = (d.set.cards || []).filter(function (c) { return c.han && c.vi; });
  var items = [];
  gameShuffle(cards.slice()).forEach(function (c, i) {
    var dir = (i % 2 === 0) ? "han2vi" : "vi2han";
    if (dir === "han2vi") {
      var ds = [];
      cards.forEach(function (p) { if (p.han !== c.han && p.vi !== c.vi && ds.indexOf(p.vi) < 0) ds.push(p.vi); });
      if (ds.length < 3) return;
      var opts = gameShuffle([c.vi].concat(gameShuffle(ds).slice(0, 3)));
      items.push({ han: c.han, py: c.pinyin || "", vi: c.vi, dir: dir, o: opts, a: opts.indexOf(c.vi) });
    } else {
      var ds2 = [];
      cards.forEach(function (p) { if (p.han !== c.han && p.vi !== c.vi && ds2.indexOf(p.han) < 0) ds2.push(p.han); });
      if (ds2.length < 3) return;
      var opts2 = gameShuffle([c.han].concat(gameShuffle(ds2).slice(0, 3)));
      items.push({ han: c.han, py: c.pinyin || "", vi: c.vi, dir: dir, o: opts2, a: opts2.indexOf(c.han) });

function tcWireQuiz(scope, stepId, finishId) {
  var answered = 0, total = scope.querySelectorAll(".tcq").length;
  var fin = finishId ? document.getElementById(finishId) : null;
  if (fin) fin.disabled = true;
  scope.querySelectorAll(".tcopt").forEach(function (b) {
    b.onclick = function () {
      var block = b.closest(".tcq"); if (!block || block.dataset.done) return;
      block.dataset.done = "1"; answered++;
      var qi = +b.dataset.qi, oi = +b.dataset.oi;
      var qs = scope._tcQs; var q = qs[qi];
      block.querySelectorAll(".tcopt").forEach(function (x) { x.disabled = true; });
      var whyEl = block.querySelector(".tcwhy");
      if (oi === q.a) { whyEl.innerHTML = '<p>✓ Đúng. ' + esc(q.why) + '</p>'; }
      else { whyEl.innerHTML = '<p>✗ Chưa đúng. Đáp án đúng: <b>' + esc(q.o[q.a]) + '</b>. ' + esc(q.why) + '</p>'; tcAddHard(stepId, q.q, q.o[q.a], q.why); }
      if (answered >= total && fin) fin.disabled = false;

  });
}

function tcEst(lc, rc) {
  var nl = (typeof TC_MOCK_L !== "undefined") ? TC_MOCK_L.length : 50;
  var nr = (typeof TC_MOCK_R !== "undefined") ? TC_MOCK_R.length : 50;
  var le = lc === 0 ? 5 : Math.round(lc / nl * 495 / 5) * 5;
  var re = rc === 0 ? 5 : Math.round(rc / nr * 495 / 5) * 5;
  var total = le + re; if (total < 10) total = 10; if (total > 990) total = 990;
  return { l: le, r: re, total: total };
}

  html += '<section class="card"><h3>Thi thử TOPIK I rút gọn</h3><p class="mut">20 câu, 20 phút tham khảo, cấp ước lượng chỉ để tham khảo.</p><div class="row">' + tpStepBtnHTML("m0") + '</div></section>';
  if (state.tpHard.length > 0) html += '<section class="card"><h3>Lỗi sai TOPIK chưa sửa: ' + state.tpHard.length + '</h3><p class="mut">Xem và sửa ở tab Ôn tập.</p></section>';
  app.innerHTML = html;
  wireTp(app);
}
function viewReviewTp(app) {
  tpNorm();
  var html = trackSwitchHTML() + '<h2>Ôn tập · TOPIK</h2>';
  if (state.tpHard.length === 0) {
    html += '<section class="card"><h3>Không còn lỗi sai TOPIK 🎉</h3><p class="mut">Các câu bạn làm sai trong track TOPIK sẽ hiện ở đây để ôn lại đúng bước đó, cho tới khi bạn bấm đã sửa xong.</p></section>';
  } else {
    html += '<section class="card"><h3>' + state.tpHard.length + ' lỗi sai TOPIK chưa sửa</h3>';
    html += state.tpHard.map(function (h, i) {
      var m = tpStepMeta(h.step);
      return '<div class="qblock"><p><b>' + esc(h.q) + '</b></p><p class="mut">Đáp án đúng: ' + esc(h.ans) + ' · ' + esc(h.why) + '</p><div class="row"><button class="btn" data-tpretry="' + esc(h.step) + '">Ôn lại bước: ' + esc(m ? m.title : h.step) + '</button><button class="btn" data-tpfix="' + i + '">Đã sửa xong</button></div></div>';
    }).join("");
    html += '</section>';
  }
  if (state.tpMockTests.length > 0) {
    html += '<section class="card"><h3>Lịch sử thi thử TOPIK</h3>';
    html += state.tpMockTests.map(function (m) {
      return '<p>' + new Date(m.at).toISOString().slice(0, 10) + ' — Nghe ' + m.l + '/10 · Đọc ' + m.r + '/10 · Ước lượng ' + m.est + '/200 — ' + esc(m.level) + ' (tham khảo)</p>';
    }).join("");
    html += '</section>';
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-tpfix]").forEach(function (b) { b.onclick = function () { state.tpHard.splice(+b.dataset.tpfix, 1); saveState(); viewReviewTp(app); wireTp(app); }; });
  app.querySelectorAll("[data-tpretry]").forEach(function (b) { b.onclick = function () { tpOpenStep(b.dataset.tpretry, "review"); }; });
}

/* ---------- Khởi động ---------- */
render();
try { mrPruneLibBest(); } catch (e) {}
authRefresh().then(function () { render(); }, function () {});
authWatch();
wireTutorFloat();
</script>
