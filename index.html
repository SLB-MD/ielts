<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi IELTS - Học tiếng Anh theo band điểm</title>
<style>
:root{--teal:#0b5563;--teal2:#0e7490;--gold:#e8b33c;--bg:#f4f7f8;--card:#ffffff;--ink:#16323a;--mut:#5b7180;--ok:#1e9e6a;--bad:#d9534f;--line:#dbe6ea;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo span{color:var(--gold)}
.hwrap .sp{flex:1}
.userbox{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--gold);color:#17323b;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.btn.teal{background:var(--teal);color:#fff}
.btn.light{background:#e8f1f4;color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
.twrap{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.twrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.tab.on{background:var(--teal);color:#fff}
#previewBanner{display:none;background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
main{max-width:1080px;margin:0 auto;padding:18px 14px 110px}
section.page{display:none}
section.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(20,60,80,.05)}
.card h2{font-size:19px;margin-bottom:8px;color:var(--teal)}
.card h3{font-size:16px;margin-bottom:6px;color:var(--teal)}
.mut{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.tile:hover{border-color:var(--teal2);transform:translateY(-1px)}
.tile .t{font-weight:700;font-size:15px;margin:4px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#e3f0f2;color:var(--teal)}
.badge.gold{background:#fdf0cd;color:#8a6410}
.badge.done{background:#dcf4e7;color:#12714a}
.bar{height:8px;background:#e6eef1;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--teal2)}
select,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 1 auto}
.grow{flex:1 1 200px}
.hero{background:linear-gradient(135deg,#0b5563,#12809b);color:#fff;border:0}
.hero h2{color:#fff}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.ring .num small{font-size:11px;font-weight:600;opacity:.85}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal)}
.stat span{font-size:12.5px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;margin:7px 0;font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--teal2)}
.opt.right{border-color:var(--ok);background:#eafaf1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.why{display:none;background:#f0f7f9;border-left:4px solid var(--teal2);padding:9px 12px;border-radius:6px;font-size:14px;margin:6px 0 12px}
.why.show{display:block}
.typesent{font-size:21px;line-height:1.9;letter-spacing:.3px;background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:70px}
.typesent span.ok{color:var(--ok)}
.typesent span.cur{background:#ffe9a8;border-radius:3px}
.flip{perspective:900px;cursor:pointer}
.flip .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;overflow:auto}
.face.back{transform:rotateY(180deg);background:#f2f9fa;align-items:flex-start;text-align:left;justify-content:flex-start}
.word{font-size:34px;font-weight:800;color:var(--teal)}
.ipa{color:var(--mut);font-size:16px;margin-top:4px}
.passage{white-space:pre-wrap;font-size:16.5px;line-height:1.85;background:#fcfdfd;border:1px solid var(--line);border-radius:12px;padding:18px}
.line{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;align-items:flex-start}
.line .who{font-weight:700;color:var(--teal);min-width:78px;font-size:13px;padding-top:2px}
.line .txt{flex:1}
.line .vi{color:var(--mut);font-size:14px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:0 0 auto}
.iconbtn:hover{border-color:var(--teal2)}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.modebar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.modebar button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#dictFab{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#dictPanel{position:fixed;right:14px;bottom:78px;z-index:81;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:16px;display:none}
#dictPanel.open{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;background:#17323b;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;max-width:92vw;text-align:center}
footer{max-width:1080px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:13px;text-align:center}
.kbd{font-size:13px;color:var(--mut)}
.modelbox{background:#fbf8ee;border:1px solid #ecdfae;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.8;font-size:15.5px}
.hidden{display:none!important}
@media(max-width:640px){.word{font-size:27px}.typesent{font-size:18px}nav.tabs{top:56px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">IELTS <span>Master</span> · Luyện thi IELTS</div>
    <div class="sp"></div>
    <div class="userbox" id="userBox"></div>
  </div>
</header>
<div id="previewBanner">Chế độ xem trước - dữ liệu lưu trên máy này. Để đồng bộ theo tài khoản, hãy kết nối Supabase theo file HUONG_DAN_CAI_DAT.md.</div>
<nav class="tabs"><div class="twrap" id="tabBar"></div></nav>
<main id="app"></main>
<footer>Web luyện thi IELTS tự soạn theo định dạng và tiêu chí band của IELTS. Nội dung phục vụ tự học, không phải đề thi thật.</footer>
<button id="dictFab">📖 Từ điển</button>
<div id="dictPanel">
  <div class="row"><b style="color:var(--teal)">Tra từ điển Anh - Anh</b><span class="grow"></span><button class="iconbtn" id="dictClose">✕</button></div>
  <div class="row" style="margin-top:10px"><input type="text" id="dictInput" class="grow" placeholder="Nhập từ tiếng Anh..."><button class="btn teal" id="dictGo">Tra</button></div>
  <div id="dictResult" style="margin-top:12px"></div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="content.js"></script>
<script>
"use strict";
/* ================= TIỆN ÍCH ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let toastT=null; function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2600)}
const BANDS=["Band 5.0","Band 5.5","Band 6.0","Band 6.5","Band 7.0","Band 7.5+"];
const IS_REAL=!!(window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&String(window.SUPABASE_URL).startsWith("http"));

/* ================= TRẠNG THÁI & LƯU TRỮ ================= */
const LS_KEY="ielts_standalone_v1";
let state={progress:{},cards:{},savedWords:{},studyLog:{},goal:30,lastSection:"typing"};
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);state=Object.assign(state,p)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
let sb=null, sbUser=null;
async function pushProgress(section,key){ if(!sb||!sbUser)return; try{await sb.from("progress").upsert({user_id:sbUser.id,section,item_key:key,state:state.progress[section+":"+key]||{},updated_at:new Date().toISOString()})}catch(e){} }
async function pushWord(w){ if(!sb||!sbUser)return; try{await sb.from("saved_words").upsert({user_id:sbUser.id,word:w,data:state.savedWords[w]||{}})}catch(e){} }
async function pushLog(day){ if(!sb||!sbUser)return; try{await sb.from("study_log").upsert({user_id:sbUser.id,day,minutes:state.studyLog[day]||0})}catch(e){} }
function setProg(section,key,val){ state.progress[section+":"+key]=val; saveLocal(); pushProgress(section,key); }
function getProg(section,key){ return state.progress[section+":"+key]; }
async function pullRemote(){ if(!sb||!sbUser)return;
  try{
    const pr=await sb.from("progress").select("section,item_key,state").eq("user_id",sbUser.id);
    if(pr.data) pr.data.forEach(r=>{state.progress[r.section+":"+r.item_key]=r.state});
    const sw=await sb.from("saved_words").select("word,data").eq("user_id",sbUser.id);
    if(sw.data) sw.data.forEach(r=>{state.savedWords[r.word]=r.data});
    const sl=await sb.from("study_log").select("day,minutes").eq("user_id",sbUser.id);
    if(sl.data) sl.data.forEach(r=>{state.studyLog[r.day]=r.minutes});
    saveLocal();
  }catch(e){}
}
/* ================= GIỌNG ĐỌC (TTS) ================= */
function speak(text,rate){ try{ const u=new SpeechSynthesisUtterance(text); u.lang="en-GB"; u.rate=rate||1; const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("en")); if(vs.length)u.voice=vs.find(v=>v.lang==="en-GB")||vs[0]; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){ toast("Trình duyệt không hỗ trợ giọng đọc."); } }
if("speechSynthesis" in window){ try{speechSynthesis.getVoices()}catch(e){} }
/* ================= ĐẾM PHÚT HỌC & CHUỖI NGÀY ================= */
let lastAct=Date.now();
["click","keydown","input","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-lastAct<120000){ const d=today(); state.studyLog[d]=(state.studyLog[d]||0)+1; saveLocal(); pushLog(d); const el=$("#statMin"); if(el) renderHomeStats(); } },60000);
function streak(){ let n=0; let d=today(); if(!state.studyLog[d]) d=addDays(d,-1); while(state.studyLog[d]){ n++; d=addDays(d,-1);} return n; }

/* ================= ĐIỀU HƯỚNG ================= */
const TABS=[["home","Trang chủ"],["typing","Gõ câu"],["vocab","Từ vựng"],["grammar","Ngữ pháp"],["reading","Đọc"],["listening","Nghe"],["speaking","Luyện nói"],["writing","Writing"],["account","Tài khoản"]];
let curTab="home";
function renderTabs(){ $("#tabBar").innerHTML=TABS.map(([k,v])=>`<button class="tab ${k===curTab?"on":""}" data-tab="${k}">${v}</button>`).join(""); $$("#tabBar .tab").forEach(b=>b.onclick=()=>go(b.dataset.tab)); }
function go(tab){ curTab=tab; state.lastSection=tab; saveLocal(); renderTabs(); render(); window.scrollTo({top:0}); }
function render(){ const app=$("#app"); ({home:viewHome,typing:viewTyping,vocab:viewVocab,grammar:viewGrammar,reading:viewReading,listening:viewListening,speaking:viewSpeaking,writing:viewWriting,account:viewAccount}[curTab]||viewHome)(app); }
function bandFilterHTML(id,cur){ return `<select id="${id}" style="max-width:210px"><option value="all">Tất cả band</option>${BANDS.map(b=>`<option ${b===cur?"selected":""}>${b}</option>`).join("")}</select>`; }
function renderUserBox(){ const ub=$("#userBox"); if(IS_REAL&&sbUser){ ub.innerHTML=`<span>Xin chào, ${esc(sbUser.email)}</span><button class="btn ghost" id="btnOut">Đăng xuất</button>`; $("#btnOut").onclick=async()=>{ await sb.auth.signOut(); sbUser=null; renderUserBox(); render(); toast("Đã đăng xuất."); }; } else if(IS_REAL){ ub.innerHTML=`<button class="btn ghost" id="btnIn">Đăng nhập</button>`; $("#btnIn").onclick=()=>go("account"); } else { ub.innerHTML=`<span style="opacity:.85">Chế độ xem trước</span>`; } }

/* ================= TRANG CHỦ ================= */
let trialState=null;
function viewHome(app){
  const totalSent=CONTENT.typing.reduce((s,l)=>s+l.sentences.length,0);
  const totalCards=CONTENT.vocab.reduce((s,v)=>s+v.cards.length,0);
  const totalQ=CONTENT.grammar.reduce((s,g)=>s+g.quiz.length,0)+CONTENT.reading.reduce((s,r)=>s+r.questions.length,0);
  app.innerHTML=`
  <section class="page on">
    <div class="card hero">
      <h2>Luyện thi IELTS theo band điểm</h2>
      <p style="opacity:.92">Luyện đủ kỹ năng: Gõ câu mẫu Writing, Từ vựng học thuật theo chủ đề, Ngữ pháp phục vụ IELTS, Đọc - Nghe đúng định dạng đề thi, Luyện nói Part 1-2-3 và Writing Task 1-2 có bài mẫu phân tích.</p>
      <div class="ringwrap" style="margin-top:14px">
        <div class="ring"><svg width="120" height="120"><circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.35)" stroke-width="11" fill="none"/><circle id="ringFg" cx="60" cy="60" r="52" stroke="#e8b33c" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div class="num"><span id="statMin">0</span><small>phút hôm nay</small></div></div>
        <div style="min-width:210px;flex:1">
          <div class="row"><label>Mục tiêu mỗi ngày (phút):</label><input type="number" id="goalInp" min="15" max="180" step="5" value="${state.goal}" style="max-width:100px"></div>
          <p style="margin-top:8px">Chuỗi ngày học: <b id="statStreak">0</b> ngày &nbsp;·&nbsp; Tổng phút đã học: <b id="statTotal">0</b></p>
          <div class="row" style="margin-top:10px"><button class="btn" id="btnContinue">Học tiếp</button></div>
        </div>
      </div>
    </div>
    <div class="statgrid" id="homeStats"></div>
    <div class="card"><h3>Quy mô kho nội dung (tự soạn theo chuẩn IELTS)</h3>
      <div class="statgrid">
        <div class="stat"><b>${totalSent}</b><span>câu mẫu Writing để gõ</span></div>
        <div class="stat"><b>${totalCards}</b><span>thẻ từ vựng theo chủ đề</span></div>
        <div class="stat"><b>${CONTENT.grammar.length}</b><span>trạm ngữ pháp</span></div>
        <div class="stat"><b>${CONTENT.reading.length}</b><span>bài đọc kiểu IELTS</span></div>
        <div class="stat"><b>${CONTENT.listening.length}</b><span>câu nghe Section 1-4</span></div>
        <div class="stat"><b>${CONTENT.speaking.length}</b><span>kịch bản Speaking</span></div>
        <div class="stat"><b>${CONTENT.writing.length}</b><span>đề Writing có bài mẫu</span></div>
        <div class="stat"><b>${totalQ}</b><span>câu hỏi có giải thích</span></div>
      </div>
    </div>
    <div class="card"><h3>Bài kiểm tra thử kiểu IELTS</h3><p class="mut">6 câu ngắn (từ vựng học thuật, ngữ pháp, đọc, paraphrase) để ước tính band hiện tại của bạn. Không cần tài khoản.</p><div id="trialBox" style="margin-top:10px"></div></div>
  </section>`;
  $("#homeStats").innerHTML=`
    <div class="stat"><b>${Object.keys(state.progress).filter(k=>k.startsWith("writing:")&&(state.progress[k]||{}).done).length}/${CONTENT.writing.length}</b><span>đề Writing đã hoàn thành</span></div>
    <div class="stat"><b>${CONTENT.grammar.filter((g,i)=>(getProg("grammar","s"+i)||{}).mastered).length}/${CONTENT.grammar.length}</b><span>trạm ngữ pháp đã nắm vững</span></div>
    <div class="stat"><b>${Object.keys(state.cards).filter(k=>state.cards[k].box>=4).length}</b><span>từ vựng sắp thuộc (hộp 4-5)</span></div>
    <div class="stat"><b>${Object.keys(state.savedWords).length}</b><span>từ đã tra và lưu</span></div>`;
  renderHomeStats();
  $("#goalInp").onchange=e=>{ let v=parseInt(e.target.value||"30",10); v=Math.min(180,Math.max(15,v)); state.goal=v; e.target.value=v; saveLocal(); renderHomeStats(); };
  $("#btnContinue").onclick=()=>go(state.lastSection&&state.lastSection!=="home"?state.lastSection:"typing");
  renderTrial($("#trialBox"));
}
function renderHomeStats(){ const min=state.studyLog[today()]||0; const el=$("#statMin"); if(!el)return; el.textContent=min; $("#statStreak").textContent=streak(); $("#statTotal").textContent=Object.values(state.studyLog).reduce((a,b)=>a+b,0); const c=326.7; const p=Math.min(1,min/Math.max(1,state.goal)); const ring=$("#ringFg"); if(ring) ring.style.strokeDashoffset=String(c*(1-p)); }
function renderTrial(box){
  if(!trialState){ box.innerHTML=`<button class="btn teal" id="trialStart">Bắt đầu kiểm tra thử</button>`; $("#trialStart").onclick=()=>{ trialState={i:0,score:0,answered:false}; renderTrial(box); }; return; }
  const t=trialState;
  if(t.i>=CONTENT.trial.length){ const bands=["Band 5.0","Band 5.5","Band 6.0","Band 6.5","Band 7.0","Band 7.5+"]; const est=bands[Math.min(5,t.score)]; box.innerHTML=`<p>Bạn đúng <b>${t.score}/${CONTENT.trial.length}</b> câu. Band ước tính: <b>${est}</b>. Đây chỉ là gợi ý từ 6 câu ngắn - hãy luyện theo các phân hệ có nhãn từ band này trở lên.</p><div class="row" style="margin-top:8px"><button class="btn light" id="trialAgain">Làm lại</button></div>`; $("#trialAgain").onclick=()=>{ trialState=null; renderTrial(box); }; return; }
  const q=CONTENT.trial[t.i];
  box.innerHTML=`<p><span class="badge gold">${esc(q.level)}</span> <b>Câu ${t.i+1}/${CONTENT.trial.length}:</b> ${esc(q.q)}</p><div>${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="why" id="trialWhy"></div><div class="row"><button class="btn teal hidden" id="trialNext">${t.i===CONTENT.trial.length-1?"Xem kết quả":"Câu tiếp theo"}</button></div>`;

let typingSel=null, typingRun=null;
function viewTyping(app){
  if(typingSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Gõ câu - Câu mẫu IELTS Writing theo band</h2><p class="mut">Gõ lại chính xác từng ký tự; gõ sai phải sửa mới đi tiếp. Cuối bài có chấm độ chính xác và tốc độ (từ/phút - WPM).</p><div class="row" style="margin:10px 0">${bandFilterHTML("tyBand","all")}</div><div class="grid" id="tyGrid"></div></div></section>`;
    const draw=()=>{ const f=$("#tyBand").value; $("#tyGrid").innerHTML=CONTENT.typing.map((l,i)=>({l,i})).filter(({l})=>f==="all"||l.level===f).map(({l,i})=>{ const p=getProg("typing","L"+i)||{}; return `<div class="tile" data-i="${i}"><span class="badge">${esc(l.level)}</span> ${p.done?'<span class="badge done">Đã hoàn thành</span>':""}<div class="t">${esc(l.title)}</div><div class="mut">${l.sentences.length} câu${p.bestAcc?` · Kỷ lục chính xác: ${p.bestAcc}%`:""}</div></div>`; }).join(""); $$("#tyGrid .tile").forEach(t=>t.onclick=()=>{ typingSel=+t.dataset.i; typingRun=null; render(); }); };
    $("#tyBand").onchange=draw; draw(); return;
  }
  const L=CONTENT.typing[typingSel];
  if(!typingRun) typingRun={s:0,typed:"",errors:0,correct:0,start:null};
  const r=typingRun, sent=L.sentences[r.s];
  const chars=sent.split("").map((c,i)=>{ let cls=""; if(i<r.typed.length)cls="ok"; else if(i===r.typed.length)cls="cur"; return `<span class="${cls}">${esc(c===" "?" ":c)}</span>`; }).join("");
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="tyBack">← Danh sách bài</button><span class="badge">${esc(L.level)}</span><b>${esc(L.title)}</b><span class="mut">Câu ${r.s+1}/${L.sentences.length}</span></div>
  <div class="typesent" style="margin-top:12px">${chars}</div>
  <textarea id="tyInp" rows="2" style="margin-top:10px" placeholder="Gõ lại câu ở trên vào đây..."></textarea>
  <div class="row" style="margin-top:8px"><span class="mut" id="tyStat"></span></div>
  <div id="tyDone"></div></div></section>`;
  $("#tyBack").onclick=()=>{ typingSel=null; typingRun=null; render(); };
  const inp=$("#tyInp"); inp.focus();
  const updStat=()=>{ const total=r.correct+r.errors; const acc=total?Math.round(r.correct/total*100):100; $("#tyStat").textContent=`Độ chính xác: ${acc}% · Đã gõ đúng ${r.typed.length}/${sent.length} ký tự`; };
  updStat();
  inp.addEventListener("input",()=>{
    if(!r.start) r.start=Date.now();
    let v=inp.value;
    while(v.length>r.typed.length){ const pos=r.typed.length; const ch=v[pos]; if(pos<sent.length&&ch===sent[pos]){ r.typed+=ch; r.correct++; } else { r.errors++; v=v.slice(0,r.typed.length); break; } }
    if(v.length<r.typed.length){ r.typed=v; }
    inp.value=r.typed; updStat();
    // vẽ lại ký tự đã đúng
    const box=$(".typesent"); if(box){ box.innerHTML=sent.split("").map((c,i)=>{ let cls=""; if(i<r.typed.length)cls="ok"; else if(i===r.typed.length)cls="cur"; return `<span class="${cls}">${esc(c)}</span>`; }).join(""); }
    if(r.typed===sent){ setTimeout(()=>{ r.s++; r.typed=""; if(r.s>=L.sentences.length){ const total=r.correct+r.errors; const acc=total?Math.round(r.correct/total*100):100; const mins=(Date.now()-r.start)/60000; const words=L.sentences.join(" ").split(/\s+/).length; const wpm=Math.max(1,Math.round(words/Math.max(mins,0.05))); const prev=getProg("typing","L"+typingSel)||{}; setProg("typing","L"+typingSel,{done:true,bestAcc:Math.max(prev.bestAcc||0,acc),wpm}); $("#tyDone").innerHTML=`<div class="card" style="background:#eafaf1;border-color:#bfe8d2;margin-top:12px"><h3>Hoàn thành bài!</h3><p>Độ chính xác: <b>${acc}%</b> · Tốc độ: <b>${wpm} WPM</b></p><div class="row" style="margin-top:8px"><button class="btn teal" id="tyAgain">Gõ lại bài này</button><button class="btn light" id="tyList">Về danh sách</button></div></div>`; $("#tyAgain").onclick=()=>{ typingRun=null; render(); }; $("#tyList").onclick=()=>{ typingSel=null; typingRun=null; render(); }; inp.disabled=true; } else { typingRun=r; render(); } },350); }
  });
  inp.addEventListener("paste",e=>e.preventDefault());
}

/* ================= TỪ VỰNG (SRS) ================= */
const INTERVALS=[1,1,3,7,16,35];
let vocabSel=null, vocabQueue=null, vocabPos=0, vocabFlipped=false;
function allDecks(){ const decks=CONTENT.vocab.map((v,i)=>({name:v.topic,band:v.band,cards:v.cards,setIdx:i})); const saved=Object.values(state.savedWords); if(saved.length) decks.push({name:"Từ đã tra (từ điển)",band:"Tổng hợp",cards:saved,setIdx:-1}); return decks; }
function cardKey(setIdx,ci,w){ return setIdx===-1? "sv:"+w : "s"+setIdx+":"+ci; }
function dueCards(){ const t=today(); const out=[]; allDecks().forEach(d=>d.cards.forEach((c,ci)=>{ const k=cardKey(d.setIdx,ci,c.w); const st=state.cards[k]; if(st&&st.due<=t) out.push({deck:d,c,ci,k}); })); return out; }
function viewVocab(app){
  if(vocabSel===null&&vocabQueue===null){
    const due=dueCards();
    app.innerHTML=`<section class="page on"><div class="card"><h2>Từ vựng IELTS theo chủ đề</h2><p class="mut">Mỗi thẻ có phiên âm, nghĩa, collocation đi kèm và ví dụ văn phong học thuật. Ôn tập giãn cách (SRS) theo các mốc 1-3-7-16-35 ngày: bấm "Đã thuộc" để giãn mốc ôn, "Chưa thuộc" để ôn lại sớm.</p>
    ${due.length?`<div class="row" style="margin:10px 0"><button class="btn" id="dueBtn">Ôn ${due.length} thẻ đến hạn hôm nay</button></div>`:`<p class="mut" style="margin:8px 0">Hôm nay không có thẻ nào đến hạn ôn.</p>`}
    <div class="grid">${allDecks().map((d,di)=>{ const total=d.cards.length; const known=d.cards.filter((c,ci)=>{ const st=state.cards[cardKey(d.setIdx,ci,c.w)]; return st&&st.box>=1; }).length; return `<div class="tile" data-di="${di}"><span class="badge">${esc(d.band)}</span><div class="t">${esc(d.name)}</div><div class="mut">${total} thẻ · Đã học ${known}/${total}</div><div class="bar"><i style="width:${total?Math.round(known/total*100):0}%"></i></div></div>`; }).join("")}</div></div></section>`;
    $$(".tile",app).forEach(t=>t.onclick=()=>{ const d=allDecks()[+t.dataset.di]; vocabSel=d; vocabQueue=d.cards.map((c,ci)=>({deck:d,c,ci,k:cardKey(d.setIdx,ci,c.w)})); vocabPos=0; vocabFlipped=false; render(); });
    const db=$("#dueBtn"); if(db) db.onclick=()=>{ vocabQueue=dueCards(); vocabSel={name:"Ôn tập đến hạn"}; vocabPos=0; vocabFlipped=false; render(); };
    return;
  }
  if(!vocabQueue||vocabPos>=vocabQueue.length){ app.innerHTML=`<section class="page on"><div class="card"><h2>Hoàn thành lượt ôn!</h2><p class="mut">Các thẻ sẽ tự xuất hiện lại theo lịch giãn cách. Hẹn gặp bạn ở buổi ôn tiếp theo.</p><div class="row" style="margin-top:10px"><button class="btn teal" id="vBack">Về danh sách bộ từ</button></div></div></section>`; $("#vBack").onclick=()=>{ vocabSel=null; vocabQueue=null; render(); }; return; }
  const item=vocabQueue[vocabPos], c=item.c, st=state.cards[item.k]||{box:0};
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="vBack2">← Danh sách bộ</button><b>${esc(vocabSel.name)}</b><span class="mut">Thẻ ${vocabPos+1}/${vocabQueue.length} · Hộp SRS: ${st.box||0}/5</span></div>
  <div class="flip ${vocabFlipped?"flipped":""}" id="flipCard" style="margin-top:12px"><div class="inner">
    <div class="face"><div class="word">${esc(c.w)}</div><div class="ipa">${esc(c.ipa||"")}</div><button class="iconbtn" id="vSpeak" title="Nghe phát âm">🔊</button><p class="mut" style="margin-top:10px">Bấm vào thẻ để lật xem nghĩa</p></div>
    <div class="face back"><div class="word" style="font-size:24px">${esc(c.w)}</div><p style="margin:6px 0"><b>Nghĩa:</b> ${esc(c.vi||"")}</p>${c.col?`<p style="margin:4px 0"><b>Collocation:</b> ${esc(c.col)}</p>`:""}<p style="margin:6px 0"><b>Ví dụ:</b> ${esc(c.ex||"")}</p><p class="mut">${esc(c.exv||"")}</p></div>
  </div></div>
  <div class="row" style="margin-top:12px"><button class="btn light" id="vNo">Chưa thuộc - ôn lại sớm</button><button class="btn teal" id="vYes">Đã thuộc - giãn mốc ôn</button></div>
  </div></section>`;
  $("#vBack2").onclick=()=>{ vocabSel=null; vocabQueue=null; render(); };
  $("#flipCard").onclick=e=>{ if(e.target.id==="vSpeak")return; vocabFlipped=!vocabFlipped; $("#flipCard").classList.toggle("flipped",vocabFlipped); };
  $("#vSpeak").onclick=e=>{ e.stopPropagation(); speak(c.w,0.9); };
  const mark=known=>{ const cur=state.cards[item.k]||{box:0,due:today()}; let box; if(known){ box=Math.min(5,(cur.box||0)+1); } else { box=0; } state.cards[item.k]={box,due:addDays(today(),INTERVALS[box])}; saveLocal(); vocabPos++; vocabFlipped=false; render(); };
  $("#vYes").onclick=()=>mark(true); $("#vNo").onclick=()=>mark(false);
}

  $("#rBack").onclick=()=>{ readSel=null; readRun=null; render(); };

  $("#rSubmit").onclick=()=>{ if(Object.keys(r.answers).length<R.questions.length){ toast("Hãy trả lời đủ các câu hỏi trước khi chấm."); return; } r.submitted=true; let score=0; R.questions.forEach((q,qi)=>{ const chosen=r.answers[qi]; if(chosen===q.a)score++; $$(".r-opt",app).filter(x=>+x.dataset.q===qi).forEach(x=>{ const i=+x.dataset.i; if(i===q.a)x.classList.add("right"); else if(i===chosen)x.classList.add("wrong"); x.disabled=true; }); const w=$("#rWhy"+qi); w.innerHTML=(chosen===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why); w.classList.add("show"); }); const prev=getProg("reading","R"+readSel)||{}; setProg("reading","R"+readSel,{score:Math.max(prev.score||0,score)}); $("#rScore").textContent=`Kết quả: ${score}/${R.questions.length}`; $("#rSubmit").disabled=true; };
  $("#rTransBtn").onclick=()=>{ $("#rTrans").classList.toggle("hidden"); };
}

/* ================= NGHE (IELTS Listening) ================= */
let lisSel=null, lisMode="dict", lisRate=1, lisQuiz=null;
function normWords(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g,"").split(/\s+/).filter(Boolean); }
function gradeDictation(target,typed){ const T=normWords(target), U=normWords(typed); let ok=0; T.forEach((w,i)=>{ if(U[i]===w) ok++; }); return {ok,total:T.length}; }
function viewListening(app){
  const sections=["Section 1","Section 2","Section 3","Section 4"];
  if(lisSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Nghe - theo IELTS Listening (Section 1-4)</h2><p class="mut">Section 1-2: đời sống hằng ngày · Section 3: thảo luận học tập · Section 4: bài giảng học thuật. Nghe bằng giọng đọc của trình duyệt, 3 chế độ: chép chính tả, nói nhại, trắc nghiệm; chỉnh được tốc độ 0,75x / 1x.</p>
    ${sections.map(sec=>`<h3 style="margin-top:14px">${sec}</h3><div class="grid">${CONTENT.listening.map((l,i)=>({l,i})).filter(({l})=>l.section===sec).map(({l,i})=>{ const p=getProg("listening","N"+i)||{}; return `<div class="tile" data-i="${i}"><span class="badge">${esc(l.section)}</span> ${p.shadow?'<span class="badge done">Đã nói nhại</span>':""}<div class="t">${esc(l.topic)}</div><div class="mut">Câu nghe số ${i+1}${p.dict?` · Chép tốt nhất: ${p.dict}`:""}</div></div>`; }).join("")}</div>`).join("")}
    </div></section>`;
    $$(".tile",app).forEach(t=>t.onclick=()=>{ lisSel=+t.dataset.i; lisMode="dict"; lisQuiz=null; render(); });
    return;
  }
  const L=CONTENT.listening[lisSel], p=getProg("listening","N"+lisSel)||{};
  let body="";
  if(lisMode==="dict"){ body=`<p class="mut">Nghe rồi gõ lại toàn bộ câu (chấm theo từng từ, không phân biệt hoa thường và dấu câu).</p><textarea id="lisInp" rows="3" style="margin-top:8px" placeholder="Gõ câu bạn nghe được..."></textarea><div class="row" style="margin-top:8px"><button class="btn teal" id="lisCheck">Kiểm tra</button><span id="lisRes" style="font-weight:600"></span></div><div class="why" id="lisReveal"></div>`; }
  else if(lisMode==="shadow"){ body=`<p class="mut">Nghe từng lượt rồi nói nhại theo đúng ngữ điệu. Khi đã luyện xong, bấm nút đánh dấu.</p><div class="row" style="margin-top:8px"><button class="btn teal" id="lisShadowBtn">${p.shadow?"Đã đánh dấu đã luyện ✓ (bấm để bỏ)":"Đánh dấu đã nói nhại"}</button></div>`; }
  else { if(!lisQuiz){ const others=CONTENT.listening.map((l,i)=>i).filter(i=>i!==lisSel&&CONTENT.listening[i].section===L.section); const d1=others[lisSel%others.length], d2=others[(lisSel+3)%others.length]; const opts=[lisSel,d1,d2].sort(()=>0.5-Math.random()); lisQuiz={opts,answered:false}; }
    body=`<p class="mut">Nghe kỹ rồi chọn đúng câu bạn vừa nghe trong 3 câu dưới đây.</p>${lisQuiz.opts.map(i=>`<button class="opt lis-opt" data-i="${i}">${esc(CONTENT.listening[i].text)}</button>`).join("")}<div class="why" id="lisQuizWhy"></div>`; }
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="lisBack">← Danh sách câu nghe</button><span class="badge">${esc(L.section)}</span><b>${esc(L.topic)}</b></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="lisPlay">▶ Nghe câu này</button><label class="mut">Tốc độ:</label><select id="lisRateSel" style="max-width:110px"><option value="0.75" ${lisRate===0.75?"selected":""}>0,75x</option><option value="1" ${lisRate===1?"selected":""}>1x</option></select></div>
  <div class="modebar"><button data-m="dict" class="${lisMode==="dict"?"on":""}">Chép chính tả</button><button data-m="shadow" class="${lisMode==="shadow"?"on":""}">Nói nhại</button><button data-m="quiz" class="${lisMode==="quiz"?"on":""}">Trắc nghiệm</button></div>
  <div id="lisBody">${body}</div></div></section>`;
  $("#lisBack").onclick=()=>{ lisSel=null; render(); };
  $("#lisPlay").onclick=()=>speak(L.text,lisRate);
  $("#lisRateSel").onchange=e=>{ lisRate=parseFloat(e.target.value); };
  $$(".modebar button",app).forEach(b=>b.onclick=()=>{ lisMode=b.dataset.m; if(lisMode!=="quiz")lisQuiz=null; render(); });
  if(lisMode==="dict"){ $("#lisCheck").onclick=()=>{ const g=gradeDictation(L.text,$("#lisInp").value); $("#lisRes").textContent=`Đúng ${g.ok}/${g.total} từ`; const rv=$("#lisReveal"); rv.innerHTML=`<b>Đáp án:</b> ${esc(L.text)}`; rv.classList.add("show"); const prev=getProg("listening","N"+lisSel)||{}; setProg("listening","N"+lisSel,Object.assign({},prev,{dict:`${g.ok}/${g.total}`})); }; }
  if(lisMode==="shadow"){ $("#lisShadowBtn").onclick=()=>{ const prev=getProg("listening","N"+lisSel)||{}; setProg("listening","N"+lisSel,Object.assign({},prev,{shadow:!prev.shadow})); render(); }; }
  if(lisMode==="quiz"){ $$(".lis-opt",app).forEach(b=>b.onclick=()=>{ if(lisQuiz.answered)return; lisQuiz.answered=true; const i=+b.dataset.i; $$(".lis-opt",app).forEach(x=>{ const xi=+x.dataset.i; if(xi===lisSel)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#lisQuizWhy"); w.innerHTML=i===lisSel?"<b>Đúng!</b> Bạn đã nghe và nhận diện chính xác.":"<b>Chưa đúng.</b> Hãy nghe lại và so sánh các từ khác nhau giữa các câu."; w.classList.add("show"); }); }
}

/* ================= LUYỆN NÓI (IELTS Speaking) ================= */
let spSel=null, spMode="sub", spQuizRun=null;
function viewSpeaking(app){
  if(spSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Luyện nói - IELTS Speaking Part 1, 2, 3</h2><p class="mut">Bài mẫu theo band cho từng phần thi: Part 1 (phỏng vấn ngắn), Part 2 (cue card, nói 1-2 phút), Part 3 (thảo luận sâu). 4 chế độ: xem phụ đề Anh-Việt, chép chính tả, nói nhại theo bài mẫu, trắc nghiệm từ vựng/cấu trúc.</p>
    ${["Part 1","Part 2","Part 3"].map(pt=>`<h3 style="margin-top:14px">${pt}</h3><div class="grid">${CONTENT.speaking.map((s,i)=>({s,i})).filter(({s})=>s.part===pt).map(({s,i})=>{ const p=getProg("speaking","SP"+i)||{}; const pr=p.practiced?Object.keys(p.practiced).length:0; return `<div class="tile" data-i="${i}"><span class="badge">${esc(s.part)}</span> <span class="badge gold">${esc(s.band)}</span><div class="t">${esc(s.topic)}</div><div class="mut">${s.lines.length} dòng mẫu · Đã luyện ${pr} dòng</div></div>`; }).join("")}</div>`).join("")}
    </div></section>`;
    $$(".tile",app).forEach(t=>t.onclick=()=>{ spSel=+t.dataset.i; spMode="sub"; spQuizRun=null; render(); });
    return;
  }
  const S=CONTENT.speaking[spSel], p=getProg("speaking","SP"+spSel)||{practiced:{}};
  const practiced=p.practiced||{};
  let body="";
  if(spMode==="sub"){ body=S.lines.map((l,li)=>`<div class="line"><div class="who">${esc(l.who)}</div><div class="txt"><div>${esc(l.en)}</div><div class="vi">${esc(l.vi)}</div></div><button class="iconbtn sp-play" data-li="${li}">🔊</button></div>`).join(""); }
  else if(spMode==="dict"){ body=`<p class="mut">Chọn nút nghe ở từng dòng, gõ lại câu mẫu rồi bấm kiểm tra (chấm theo từng từ).</p>`+S.lines.map((l,li)=>`<div class="line"><div class="who">${esc(l.who)}</div><div class="txt"><div class="row"><button class="btn light sp-play" data-li="${li}">▶ Nghe dòng ${li+1}</button></div><textarea class="sp-dict" data-li="${li}" rows="2" style="margin-top:6px" placeholder="Gõ lại dòng này..."></textarea><div class="row" style="margin-top:5px"><button class="btn teal sp-check" data-li="${li}">Kiểm tra</button><span class="sp-res" data-li="${li}" style="font-weight:600"></span></div></div></div>`).join(""); }
  else if(spMode==="shadow"){ body=S.lines.map((l,li)=>`<div class="line"><div class="who">${esc(l.who)}</div><div class="txt"><div>${esc(l.en)}</div><div class="vi">${esc(l.vi)}</div><label style="display:block;margin-top:5px"><input type="checkbox" class="sp-pr" data-li="${li}" ${practiced[li]?"checked":""} style="width:auto"> Đã nói nhại xong dòng này</label></div><button class="iconbtn sp-play" data-li="${li}">🔊</button></div>`).join(""); }
  else { const r=spQuizRun||(spQuizRun={answers:{},submitted:false}); body=S.quiz.map((q,qi)=>`<div style="margin-top:10px"><p><b>Câu ${qi+1}.</b> ${esc(q.q)}</p>${q.o.map((o,oi)=>`<button class="opt sp-opt" data-q="${qi}" data-i="${oi}" ${r.submitted?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why" id="spWhy${qi}"></div></div>`).join("")+`<div class="row" style="margin-top:10px"><button class="btn teal" id="spSubmit" ${r.submitted?"disabled":""}>Chấm trắc nghiệm</button><span id="spScore" style="font-weight:700"></span></div>`; }
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="spBack">← Danh sách bài nói</button><span class="badge">${esc(S.part)}</span><span class="badge gold">Bài mẫu ${esc(S.band)}</span><b>${esc(S.topic)}</b></div>
  <div class="modebar"><button data-m="sub" class="${spMode==="sub"?"on":""}">Xem phụ đề</button><button data-m="dict" class="${spMode==="dict"?"on":""}">Chép chính tả</button><button data-m="shadow" class="${spMode==="shadow"?"on":""}">Nói nhại</button><button data-m="quiz" class="${spMode==="quiz"?"on":""}">Trắc nghiệm</button></div>
  <div class="row"><button class="btn light" id="spAll">▶ Nghe toàn bộ bài mẫu</button></div>
  <div style="margin-top:8px">${body}</div></div></section>`;
  $("#spBack").onclick=()=>{ spSel=null; spQuizRun=null; render(); };
  $$(".modebar button",app).forEach(b=>b.onclick=()=>{ spMode=b.dataset.m; if(spMode!=="quiz")spQuizRun=null; render(); });
  $("#spAll").onclick=()=>{ let i=0; const playNext=()=>{ if(i>=S.lines.length)return; const l=S.lines[i++]; const u=new SpeechSynthesisUtterance(l.en); u.lang="en-GB"; u.onend=playNext; try{speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }; playNext(); };
  $$(".sp-play",app).forEach(b=>b.onclick=()=>speak(S.lines[+b.dataset.li].en,0.95));
  $$(".sp-check",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const inp=$(`.sp-dict[data-li="${li}"]`); const g=gradeDictation(S.lines[li].en,inp.value); $(`.sp-res[data-li="${li}"]`).textContent=`Đúng ${g.ok}/${g.total} từ. Đáp án: ${S.lines[li].en}`; });
  $$(".sp-pr",app).forEach(cb=>cb.onchange=()=>{ const li=+cb.dataset.li; const prev=getProg("speaking","SP"+spSel)||{practiced:{}}; const pr=Object.assign({},prev.practiced||{}); if(cb.checked)pr[li]=true; else delete pr[li]; setProg("speaking","SP"+spSel,Object.assign({},prev,{practiced:pr})); });
  const sub=$("#spSubmit"); if(sub) sub.onclick=()=>{ const r=spQuizRun; if(Object.keys(r.answers).length<S.quiz.length){ toast("Hãy trả lời đủ 3 câu."); return; } r.submitted=true; let score=0; S.quiz.forEach((q,qi)=>{ const chosen=r.answers[qi]; if(chosen===q.a)score++; $$(".sp-opt",app).filter(x=>+x.dataset.q===qi).forEach(x=>{ const i=+x.dataset.i; if(i===q.a)x.classList.add("right"); else if(i===chosen)x.classList.add("wrong"); x.disabled=true; }); const w=$("#spWhy"+qi); w.innerHTML=(chosen===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why); w.classList.add("show"); }); const prev=getProg("speaking","SP"+spSel)||{}; setProg("speaking","SP"+spSel,Object.assign({},prev,{quiz:score})); $("#spScore").textContent=`Kết quả: ${score}/3`; sub.disabled=true; };
  $$(".sp-opt",app).forEach(b=>b.onclick=()=>{ const q=+b.dataset.q; spQuizRun.answers[q]=+b.dataset.i; $$(".sp-opt",app).filter(x=>+x.dataset.q===q).forEach(x=>{ x.style.borderColor=""; x.style.background=""; }); b.style.borderColor="var(--teal)"; b.style.background="#eef7f9"; });
}

/* ================= WRITING ================= */
let wrSel=null, wrFilter="all", wrShowModel=false;
function viewWriting(app){
  if(wrSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Writing - Task 1 & Task 2 có bài mẫu</h2><p class="mut">Task 1 mô tả dữ liệu bằng chữ (đọc số liệu rồi tự viết), Task 2 kèm dàn ý. Mỗi đề có bài mẫu band cao, phân tích cấu trúc và cụm từ ghi điểm. Hãy tự viết vào khung soạn thảo, đối chiếu bài mẫu, rồi đánh dấu hoàn thành.</p>
    <div class="row" style="margin:10px 0"><select id="wrF" style="max-width:200px"><option value="all">Tất cả đề</option><option value="Task 1" ${wrFilter==="Task 1"?"selected":""}>Task 1</option><option value="Task 2" ${wrFilter==="Task 2"?"selected":""}>Task 2</option></select></div>
    <div class="grid">${CONTENT.writing.map((w,i)=>({w,i})).filter(({w})=>wrFilter==="all"||w.type===wrFilter).map(({w,i})=>{ const p=getProg("writing","W"+i)||{}; return `<div class="tile" data-i="${i}"><span class="badge">${esc(w.type)}</span> <span class="badge gold">Bài mẫu ${esc(w.band)}</span> ${p.done?'<span class="badge done">Đã hoàn thành</span>':""}<div class="t">${esc(w.title)}</div><div class="mut">${esc(w.prompt.slice(0,90))}...</div></div>`; }).join("")}</div></div></section>`;
    $("#wrF").onchange=e=>{ wrFilter=e.target.value; render(); };
    $$(".tile",app).forEach(t=>t.onclick=()=>{ wrSel=+t.dataset.i; wrShowModel=false; render(); });
    return;
  }
  const W=CONTENT.writing[wrSel], p=getProg("writing","W"+wrSel)||{};
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="wBack">← Danh sách đề</button><span class="badge">${esc(W.type)}</span><span class="badge gold">Bài mẫu ${esc(W.band)}</span><b>${esc(W.title)}</b></div>
  <p style="margin-top:10px"><b>Đề bài:</b> ${esc(W.prompt)}</p>
  <div class="why show" style="margin-top:10px"><b>${W.type==="Task 1"?"Dữ kiện của biểu đồ (mô tả bằng chữ):":"Dàn ý gợi ý:"}</b><br>${esc(W.dataDesc)}</div>
  <h3 style="margin-top:14px">Bài viết của bạn</h3>
  <textarea id="wText" rows="10" placeholder="Tự viết bài của bạn vào đây trước khi xem bài mẫu...">${esc(p.text||"")}</textarea>
  <div class="row" style="margin-top:6px"><span class="mut" id="wCount">0 từ</span><span class="grow"></span><button class="btn light" id="wSave">Lưu bài viết</button><button class="btn ${p.done?"light":"teal"}" id="wDone">${p.done?"Đã đánh dấu hoàn thành ✓ (bấm để bỏ)":"Đánh dấu đã hoàn thành"}</button></div>
  </div>
  <div class="card"><div class="row"><h3 style="margin:0">Bài mẫu & phân tích</h3><span class="grow"></span><button class="btn teal" id="wModelBtn">${wrShowModel?"Ẩn bài mẫu":"Xem bài mẫu"}</button></div>
  <div id="wModel" class="${wrShowModel?"":"hidden"}"><div class="modelbox" style="margin-top:10px">${esc(W.model)}</div>
  <p style="margin-top:12px"><b>Phân tích cấu trúc:</b> ${esc(W.analysis)}</p>
  <h3 style="margin-top:12px">Cụm từ ghi điểm</h3>${W.phrases.map(ph=>`<p style="margin:4px 0"><b>${esc(ph.en)}</b> - ${esc(ph.vi)}</p>`).join("")}</div></div></section>`;
  $("#wBack").onclick=()=>{ wrSel=null; render(); };
  const wc=()=>{ const v=$("#wText").value.trim(); $("#wCount").textContent=(v?v.split(/\s+/).length:0)+" từ (Task 1 cần tối thiểu 150 từ, Task 2 cần tối thiểu 250 từ)"; };
  $("#wText").addEventListener("input",wc); wc();
  $("#wSave").onclick=()=>{ const prev=getProg("writing","W"+wrSel)||{}; setProg("writing","W"+wrSel,Object.assign({},prev,{text:$("#wText").value})); toast("Đã lưu bài viết."); };
  $("#wDone").onclick=()=>{ const prev=getProg("writing","W"+wrSel)||{}; setProg("writing","W"+wrSel,Object.assign({},prev,{text:$("#wText").value,done:!prev.done})); render(); };
  $("#wModelBtn").onclick=()=>{ wrShowModel=!wrShowModel; render(); };
}

/* ================= TỪ ĐIỂN ================= */
$("#dictFab").onclick=()=>{ $("#dictPanel").classList.toggle("open"); $("#dictInput").focus(); };
$("#dictClose").onclick=()=>$("#dictPanel").classList.remove("open");
$("#dictInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#dictGo").click(); });
$("#dictGo").onclick=async()=>{
  const w=$("#dictInput").value.trim().toLowerCase(); const box=$("#dictResult");
  if(!w){ box.innerHTML=""; return; }
  box.innerHTML="<p class='mut'>Đang tra...</p>";
  try{
    const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
    if(!res.ok) throw new Error("nf");
    const data=await res.json(); const e0=data[0];
    const phon=e0.phonetic||((e0.phonetics||[]).find(x=>x.text)||{}).text||"";
    const meanings=(e0.meanings||[]).slice(0,2).map(m=>`<p style="margin:6px 0"><i>${esc(m.partOfSpeech)}</i>: ${esc((m.definitions||[]).slice(0,2).map(d=>d.definition).join("; "))}</p>`).join("");
    const ex=((e0.meanings||[]).flatMap(m=>m.definitions||[]).find(d=>d.example)||{}).example||"";
    const defShort=(((e0.meanings||[])[0]||{}).definitions||[])[0]?.definition||"";
    box.innerHTML=`<div class="word" style="font-size:26px">${esc(e0.word)}</div><div class="ipa">${esc(phon)}</div>${meanings}${ex?`<p class="mut">Ví dụ: ${esc(ex)}</p>`:""}<div class="row" style="margin-top:10px"><button class="btn teal" id="dictSave">Lưu vào bộ ôn tập</button><button class="btn light" id="dictSpeak">🔊 Nghe</button></div>`;
    $("#dictSpeak").onclick=()=>speak(e0.word,0.9);
    $("#dictSave").onclick=()=>{ state.savedWords[e0.word.toLowerCase()]={w:e0.word,ipa:phon,vi:"Nghĩa (Anh-Anh): "+defShort,col:"",ex:ex,exv:"Từ đã tra từ từ điển"}; saveLocal(); pushWord(e0.word.toLowerCase()); toast("Đã lưu từ '"+e0.word+"' vào bộ Từ đã tra."); };
  }catch(err){ box.innerHTML="<p class='mut'>Không tìm thấy từ này, hoặc máy đang mất mạng. Hãy kiểm tra chính tả và thử lại.</p>"; }
};

/* ================= KHỞI ĐỘNG ================= */
loadLocal();
if(!IS_REAL) $("#previewBanner").style.display="block";
renderTabs(); renderUserBox(); render();
if(IS_REAL&&window.__supabaseReady){ window.__supabaseReady.then(async client=>{ sb=client; if(!sb) return; try{ const {data}=await sb.auth.getSession(); if(data&&data.session){ sbUser=data.session.user; await pullRemote(); renderUserBox(); render(); } sb.auth.onAuthStateChange(async(_ev,session)=>{ sbUser=session?session.user:null; renderUserBox(); if(sbUser){ await pullRemote(); render(); } }); }catch(e){} }); }
</script>
