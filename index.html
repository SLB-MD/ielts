<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi IELTS - Học tiếng Anh theo band điểm</title>
<style>
:root{--teal:#0b5563;--teal2:#0e7490;--gold:#e8b33c;--bg:#f4f7f8;--card:#ffffff;--ink:#16323a;--mut:#5b7180;--ok:#1e9e6a;--bad:#d9534f;--line:#dbe6ea;--radius:14px;--shadow:0 1px 4px rgba(20,60,80,.06);--shadow2:0 8px 22px rgba(11,85,99,.13);--focus:#f2c14e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo span{color:var(--gold)}
.hwrap .sp{flex:1}
.userbox{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--gold);color:#17323b;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.btn.teal{background:var(--teal);color:#fff}
.btn.light{background:#e8f1f4;color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
.twrap{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.twrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.tab.on{background:var(--teal);color:#fff}
#previewBanner{display:none;background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
main{max-width:1080px;margin:0 auto;padding:18px 14px 110px}
section.page{display:none}
section.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(20,60,80,.05)}
.card h2{font-size:19px;margin-bottom:8px;color:var(--teal)}
.card h3{font-size:16px;margin-bottom:6px;color:var(--teal)}
.mut{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.tile:hover{border-color:var(--teal2);transform:translateY(-1px)}
.tile .t{font-weight:700;font-size:15px;margin:4px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#e3f0f2;color:var(--teal)}
.badge.gold{background:#fdf0cd;color:#8a6410}
.badge.done{background:#dcf4e7;color:#12714a}
.bar{height:8px;background:#e6eef1;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--teal2)}
select,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 1 auto}
.grow{flex:1 1 200px}
.hero{background:linear-gradient(135deg,#0b5563,#12809b);color:#fff;border:0}
.hero h2{color:#fff}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.ring .num small{font-size:11px;font-weight:600;opacity:.85}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{font-size:12.5px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;margin:7px 0;font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--teal2)}
.opt.right{border-color:var(--ok);background:#eafaf1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.why{display:none;background:#f0f7f9;border-left:4px solid var(--teal2);padding:9px 12px;border-radius:6px;font-size:14px;margin:6px 0 12px}
.why.show{display:block}
.typesent{font-size:21px;line-height:1.9;letter-spacing:.3px;background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:70px}
.typesent span.ok{color:var(--ok)}
.typesent span.cur{background:#ffe9a8;border-radius:3px}
.flip{perspective:900px;cursor:pointer}
.flip .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;overflow:auto}
.face.back{transform:rotateY(180deg);background:#f2f9fa;align-items:flex-start;text-align:left;justify-content:flex-start}
.word{font-size:34px;font-weight:800;color:var(--teal)}
.ipa{color:var(--mut);font-size:16px;margin-top:4px}
.passage{white-space:pre-wrap;font-size:16.5px;line-height:1.85;background:#fcfdfd;border:1px solid var(--line);border-radius:12px;padding:18px}
.line{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;align-items:flex-start}
.line .who{font-weight:700;color:var(--teal);min-width:78px;font-size:13px;padding-top:2px}
.line .txt{flex:1}
.line .vi{color:var(--mut);font-size:14px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:0 0 auto}
.iconbtn:hover{border-color:var(--teal2)}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.modebar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.modebar button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#dictFab{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#dictPanel{position:fixed;right:14px;bottom:78px;z-index:81;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:16px;display:none}
#dictPanel.open{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;background:#17323b;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;max-width:92vw;text-align:center}
footer{max-width:1080px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:13px;text-align:center}
.kbd{font-size:13px;color:var(--mut)}
.modelbox{background:#fbf8ee;border:1px solid #ecdfae;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.8;font-size:15.5px}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
select:focus,input:focus,textarea:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(14,116,144,.15);outline:none}
#bandBar{background:#eef5f7;border-bottom:1px solid var(--line);position:sticky;top:112px;z-index:39}
.bandwrap{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px}
.bandwrap .bb-label{font-weight:700;color:var(--teal);font-size:14px}
.bandwrap select{width:auto;min-width:180px;padding:8px 10px}
.bandwrap .bb-hint{font-size:13px;color:var(--mut)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.skillcard{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.skillcard:hover{border-color:var(--teal2);transform:translateY(-2px);box-shadow:var(--shadow2)}
.skillcard .ic{font-size:26px}
.skillcard .t{font-weight:800;font-size:16px;margin:6px 0 2px;color:var(--teal)}
.skillcard .d{font-size:13.5px;color:var(--mut);min-height:38px}
.skillcard .n{font-size:13px;margin-top:8px;color:var(--ink)}
.stage{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fff}
.stage.target{border-color:var(--gold);background:#fffdf4;box-shadow:var(--shadow2)}
.stage.start{border-color:#9fd4b6;background:#f4fcf7}
.stage .shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage .sname{font-weight:800;font-size:16px;color:var(--teal)}
.stage .spct{margin-left:auto;font-weight:800;color:var(--teal)}
.stage .skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#f7fafb;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal2);background:#eef7f9}
.chip b{color:var(--teal)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mut);background:#fbfdfd;font-size:14.5px}
.line.playing{background:#fff6d8;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,179,60,.25)}
.playing-row{background:#fff6d8}
.guide{background:#eef7f9;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 13px;font-size:14.5px;margin-top:12px}
.posline{font-size:13.5px;color:var(--mut);background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.term{border-bottom:1.5px dotted var(--teal2);cursor:pointer;color:var(--teal);font-weight:600;white-space:nowrap}
.term sup{font-size:10px}
#glossPop{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;width:min(430px,calc(100vw - 28px));background:#fff;border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.25);padding:16px;display:none}
#glossPop.open{display:block}
#glossPop p{font-size:14.5px;margin:6px 0 10px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;text-align:left;background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;width:100%;color:var(--ink)}
.step .slab{flex:1}
.step .sstat{font-size:12.5px;color:var(--mut);white-space:nowrap}
.step.st-done{border-color:#bfe8d2;background:#eafaf1}
.step.st-doing{border-color:var(--gold);background:#fffdf4}
.step:disabled{opacity:.55;cursor:default}
.ph-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ph-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.ph-btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
@keyframes mouthMove{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.mouth-anim .tongue{animation:mouthMove .45s ease-in-out 2}
.pb-bar{flex-wrap:wrap;gap:6px}
.pb-bar .btn{padding:7px 11px;font-size:13.5px}
.pb-res{font-weight:600}
.pb-marks{margin-top:4px;font-size:15px}
.obs-strip{display:flex;gap:14px;flex-wrap:wrap}
.obs-img{flex:0 1 300px;min-width:230px}
.obs-vids{flex:1 1 300px;display:flex;flex-direction:column;gap:12px;min-width:250px}
.obs-vid{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdfd}
.mirror-box{border:1.5px solid var(--teal2);border-radius:12px;padding:12px;background:#f7fcfd;margin-top:10px}
.mr-stage{position:relative;border-radius:12px;overflow:hidden;background:#10222a;max-width:520px}
.mr-video{width:100%;display:block;transform:scaleX(-1)}
.mr-cv{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.g-row{display:flex;align-items:center;gap:8px;margin-top:5px}
.g-lab{flex:0 0 128px;font-size:13px;color:var(--mut)}
.g-lab.in{color:var(--ok);font-weight:700}
.g-track{position:relative;flex:1;height:12px;background:#e8eff2;border-radius:99px}
.g-zone{position:absolute;top:0;bottom:0;background:rgba(30,158,106,.30);border-radius:99px;display:none}
.g-val{position:absolute;top:-3px;width:4px;height:18px;background:var(--teal);border-radius:2px;transform:translateX(-2px)}
.g-num{flex:0 0 42px;font-size:13px;font-weight:600}
.mr-pass{background:#eafaf1;border:1.5px solid #bfe8d2;border-radius:12px;padding:10px 12px}
.grow{flex:1}
.wordbad{color:#d9534f;font-weight:700;text-decoration:underline}
.wordok{color:var(--ok);font-weight:600}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#bottomNav{display:none}
@media(max-width:768px){
nav.tabs{display:none}
#bandBar{top:56px}
#bottomNav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,60,80,.10)}
#bottomNav .bwrap{display:flex;overflow-x:auto;scrollbar-width:none}
#bottomNav .bwrap::-webkit-scrollbar{display:none}
#bottomNav button{flex:1 0 auto;min-width:62px;border:0;background:transparent;padding:7px 4px 9px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#bottomNav button .bic{font-size:19px;line-height:1}
#bottomNav button.on{color:var(--teal)}
#dictFab{bottom:86px}
.toast{bottom:150px}
main{padding-bottom:130px}
}
@media(max-width:640px){.word{font-size:27px}.typesent{font-size:18px}nav.tabs{top:56px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">IELTS <span>Master</span> · Luyện thi IELTS</div>
    <div class="sp"></div>
    <div class="userbox" id="userBox"></div>
  </div>
</header>
<div id="previewBanner">Bạn đang học thử trên máy này - tiến độ được lưu ngay trong trình duyệt, không cần tài khoản.</div>
<nav class="tabs"><div class="twrap" id="tabBar"></div></nav>
<div id="bandBar"><div class="bandwrap"><span class="bb-label">🎯 Cấp độ:</span><select id="globalBand" aria-label="Chọn cấp độ band"></select><span id="bandTargetChip"></span><span class="bb-hint" id="bandHint"></span></div></div>
<main id="app"></main>
<footer>Web luyện thi IELTS tự soạn theo định dạng và tiêu chí band của IELTS. Nội dung phục vụ tự học, không phải đề thi thật.</footer>
<nav id="bottomNav"><div class="bwrap" id="bottomBar"></div></nav>
<button id="dictFab">📖 Từ điển</button>
<div id="dictPanel">
  <div class="row"><b style="color:var(--teal)">Tra từ điển Anh - Anh</b><span class="grow"></span><button class="iconbtn" id="dictClose">✕</button></div>
  <div class="row" style="margin-top:10px"><input type="text" id="dictInput" class="grow" placeholder="Nhập từ tiếng Anh..."><button class="btn teal" id="dictGo">Tra</button></div>
  <div id="dictResult" style="margin-top:12px"></div>
</div>
<div id="glossPop"><b style="color:var(--teal)" id="glossTitle">Giải thích dễ hiểu</b><p id="glossText"></p><button class="btn light" id="glossClose">Đã hiểu</button></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="content.js"></script>
<script>
"use strict";
/* ================= TIỆN ÍCH ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let toastT=null; function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2600)}
function bandNum(b){ const m=String(b||"").match(/[\d.]+/); return m?parseFloat(m[0]):999; }
function bandFromText(s){ const m=String(s||"").match(/^Band\s*[\d.]+\+?/); return m?m[0].replace(/\s+/g," "):null; }
function itemBand(x){ if(!x) return null; if(x.band) return x.band; if(x.level) return x.level; return null; }
function vocabSetBand(v){ return itemBand(v)||bandFromText(v&&(v.theme||v.topic)); }
function listeningBand(l){ return itemBand(l)||bandFromText(l&&l.topic); }
function collectBands(){ const s=new Set(); const add=b=>{ if(b&&/^Band /.test(b)) s.add(b); };
  (CONTENT.typing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.grammar||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.reading||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.speaking||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.writing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.vocab||[]).forEach(x=>add(vocabSetBand(x)));
  (CONTENT.listening||[]).forEach(x=>add(listeningBand(x)));
  return [...s].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b)); }
const BANDS=collectBands();
const LADDER=[...new Set(["Band 0",...BANDS])].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b));
const BAND0_NAME="Band 0 - Nền tảng cho người mất gốc";
function bandLabel(b){ return b==="Band 0"?BAND0_NAME:b; }
const GLOSSARY={band:"Band là thang điểm của IELTS, từ 0 đến 9. Band càng cao nghĩa là tiếng Anh càng tốt. Ví dụ Band 6.5 là mức khá, thường đủ để xét vào nhiều trường đại học.",collocation:"Collocation là các từ hay đi cùng nhau, ví dụ 'make a decision' nghĩa là đưa ra quyết định. Học từ theo cụm như vậy giúp câu văn tự nhiên như người bản xứ.",paraphrase:"Paraphrase là nói hoặc viết lại cùng một ý bằng từ ngữ khác. Đây là kỹ năng giám khảo IELTS rất coi trọng.",cuecard:"Cue card là thẻ gợi ý trong phần Speaking Part 2. Trên thẻ có một chủ đề và vài ý gợi ý. Bạn có 1 phút chuẩn bị, rồi nói 1-2 phút về chủ đề đó.",srs:"Ôn giãn cách là cách ôn lại từ vựng đúng lúc sắp quên, theo các mốc ngày xa dần (1, 3, 7, 16, 35 ngày). Cách này giúp nhớ lâu mà tốn ít thời gian.",wpm:"WPM là số từ bạn gõ được trong một phút. Gõ nhanh và đúng giúp bạn viết bài thi kịp giờ."};
function termHTML(label,key){ return `<span class="term" data-term="${key}" title="Bấm để xem giải thích">${esc(label)}<sup>?</sup></span>`; }
function guideHTML(text){ return `<div class="guide">💡 ${esc(text)}</div>`; }
function stageLineHTML(band){ if(!band) return ""; const st=bandStageStats(band); if(!st.total) return `<div class="posline">📍 Bạn đang ở chặng <b>${esc(bandLabel(band))}</b>.</div>`; return `<div class="posline">📍 Bạn đang ở chặng <b>${esc(bandLabel(band))}</b> - đã xong ${st.done}/${st.total} mục của chặng này.</div>`; }

let sessErrs=[];
function syncErrors(){ setProg("meta","errors",{list:(state.errors||[]).slice(-200)}); }
function logError(e){ if(!Array.isArray(state.errors)) state.errors=[]; const t=today(); const key=e.sec+"|"+e.q; const ex=state.errors.find(x=>(x.sec+"|"+x.q)===key&&!x.done);
  if(ex){ ex.count=(ex.count||1)+1; ex.date=t; ex.due=addDays(t,1); ex.streak=0; if(e.o)ex.o=e.o; if(e.a!==undefined)ex.a=e.a; if(e.why)ex.why=e.why; }
  else state.errors.push({id:"e"+Date.now()+"_"+Math.floor(Math.random()*1e5),sec:e.sec,kind:e.kind||"mc",q:e.q,o:e.o||null,a:e.a,why:e.why||"",date:t,due:addDays(t,1),streak:0,done:false,count:1});
  if(state.errors.length>200) state.errors=state.errors.slice(-200);
  sessErrs.push({sec:e.sec,q:e.q}); syncErrors(); saveLocal(); }
function dueErrors(){ const t=today(); return (state.errors||[]).filter(e=>!e.done&&e.due<=t); }
function errReviewHTML(){ if(!sessErrs.length) return ""; const items=sessErrs.map(se=>{ const e=(state.errors||[]).filter(x=>x.sec===se.sec&&x.q===se.q).pop(); return e?`<div style="margin:7px 0"><p><b>${esc(e.q)}</b></p><p class="mut">Đáp án đúng: <b>${esc(e.kind==="mc"&&e.o?String(e.o[e.a]):String(e.a))}</b>${e.why?(" - "+esc(e.why)):""}</p></div>`:""; }).join("");

function firstItemIdxForBand(sec,b){ if(sec==="typing") return CONTENT.typing.findIndex(l=>itemBand(l)===b); if(sec==="grammar") return CONTENT.grammar.findIndex(g=>itemBand(g)===b); if(sec==="reading") return CONTENT.reading.findIndex(r=>itemBand(r)===b); if(sec==="listening") return CONTENT.listening.findIndex(l=>listeningBand(l)===b); if(sec==="speaking") return CONTENT.speaking.findIndex(s=>itemBand(s)===b); if(sec==="writing") return CONTENT.writing.findIndex(w=>itemBand(w)===b); if(sec==="vocab"){ const d=allDecks().find(d=>d.band===b); return d?d.setIdx:-1; } return -1; }
function openFirstForBand(b){ for(const sec of ["typing","grammar","reading","listening","speaking","writing","vocab"]){ const i=firstItemIdxForBand(sec,b); if(i>=0){ openItem(sec,i); return true; } } return false; }

function buildTodayPlan(){ const plan=[]; const secName={typing:"Gõ câu",vocab:"Từ vựng",grammar:"Ngữ pháp",reading:"Đọc",listening:"Nghe",speaking:"Luyện nói",writing:"Writing",video:"Video"};

  if(due.length) plan.push({text:`Ôn ${due.length} thẻ từ vựng đến hạn hôm nay trước - ôn đúng lúc sắp quên là nhớ lâu nhất`,btn:"Ôn ngay",act:()=>{ vocabQueue=dueCards(); vocabSel={name:"Ôn tập đến hạn"}; vocabPos=0; vocabFlipped=false; vocabMode="flash"; go("vocab"); }});
  const curB=state.targetBand||LADDER.find(b=>!stagePassed(b))||LADDER[LADDER.length-1];

  if(curStep&&plan.length<3){ let pushed=false;
    const ls=state.lastStudy;

    if(!pushed){ for(const sec of curStep.secs){ if(sec==="video"){ plan.push({text:`Theo lộ trình chặng ${curB} - ${curStep.label}: xem một video của chặng này và làm 3 câu kiểm tra dưới video`,btn:"Xem video",act:()=>{ setGlobalBand(curB,true); go("video"); }}); pushed=true; break; }
      const idxs=sec==="vocab"?allDecks().filter(d=>d.band===curB).map(d=>d.setIdx):CONTENT[sec].map((x,i)=>({x,i})).filter(({x})=>(sec==="listening"?listeningBand(x):itemBand(x))===curB).map(({i})=>i);
      const ii=idxs.find(i=>sec==="vocab"?((allDecks().find(d=>d.setIdx===i)||{cards:[]}).cards.some((c,ci)=>{ const st2=state.cards[cardKey(i,ci,c.w)]; return !st2||st2.box<1; })):!itemDone(sec,i));

  }
  if(plan.length<3&&curB){ const contentSteps=steps.filter(s=>!s.isTest&&s.status!=="empty"); if(contentSteps.length&&contentSteps.every(s=>s.status==="done")&&!stagePassed(curB)&&stageTestPool(curB).length){ plan.push({text:`Các bước học ở chặng ${curB} đã xong - làm bài kiểm tra cuối chặng để chốt chặng này`,btn:"Kiểm tra cuối chặng",act:()=>startStageTest(curB)}); } }
  if(plan.length<3&&!state.trialDone) plan.push({text:"Làm bài kiểm tra thử ngắn để biết mình đang ở band nào",btn:"Kiểm tra ngay",act:()=>{ trialState={i:0,score:0,answered:false}; render(); const tb=$("#trialBox"); if(tb) tb.scrollIntoView({block:"center"}); }});
  if(plan.length<3){ const min=state.studyLog[today()]||0; if(min<state.goal) plan.push({text:`Học thêm ${state.goal-min} phút nữa để đạt mục tiêu hôm nay (${state.goal} phút)`,btn:"Vào học",act:()=>go("typing")}); }
  return plan.slice(0,3); }

let typingSel=null, typingRun=null;

  }

  const r=typingRun, sent=L.sentences[r.s];

  <div class="typesent" style="margin-top:12px">${chars}</div>
  <textarea id="tyInp" rows="2" style="margin-top:10px" placeholder="Gõ lại câu ở trên vào đây..."></textarea>
  <div class="row" style="margin-top:8px"><span class="mut" id="tyStat"></span></div>
  <div id="tyDone"></div></div></section>`;
  $("#tyBack").onclick=()=>{ typingSel=null; typingRun=null; render(); };
  const inp=$("#tyInp"); inp.focus();

  updStat();

    if(!r.start) r.start=Date.now();

  });
  inp.addEventListener("paste",e=>e.preventDefault());
}

const INTERVALS=[1,1,3,7,16,35];
let vocabSel=null, vocabQueue=null, vocabPos=0, vocabFlipped=false, vocabMode="flash", vocabQuiz=null;
function buildVocabQuiz(d){ const cards=d.cards.slice(0,10); const pool=CONTENT.vocab.flatMap(v=>v.cards); const src=cards.length>=4?cards:pool; const items=cards.map((c,i)=>{ const ds=[]; for(const off of [1,3,5,2,4]){ const cand=src[(i+off)%src.length]; if(cand&&cand.vi!==c.vi&&!ds.includes(cand.vi)) ds.push(cand.vi); if(ds.length>=3) break; } const opts=ds.slice(0,3); const pos=opts.length?i%(opts.length+1):0; opts.splice(pos,0,c.vi); return {w:c.w,ipa:c.ipa||"",vi:c.vi,opts,a:pos}; }); return {items,pos:0,score:0,answered:false,wrongs:[]}; }
function renderVocabQuiz(app){ const d=vocabSel, q=vocabQuiz||(vocabQuiz=buildVocabQuiz(d));
  const head=`<div class="row"><button class="btn light" id="vBack2">← Danh sách bộ</button><b>${esc(d.name)}</b>${d.band?`<span class="badge gold">${esc(d.band)}</span>`:""}</div>

    ${q.wrongs.length?`<h3 style="margin-top:12px">Các từ cần ôn lại</h3>${q.wrongs.map(w=>`<p style="margin:5px 0"><b>${esc(w.w)}</b> - nghĩa đúng: ${esc(w.vi)}</p>`).join("")}`:`<p class="mut" style="margin-top:8px">Không có từ nào sai trong lượt này.</p>`}

    wireHead(); $("#vqAgain").onclick=()=>{ vocabQuiz=buildVocabQuiz(d); render(); }; $("#vqFlash").onclick=()=>{ vocabMode="flash"; render(); }; return; }
  const it=q.items[q.pos];

  ${guideHTML("Chế độ kiểm tra: đọc từ tiếng Anh rồi chọn nghĩa tiếng Việt đúng trong 4 lựa chọn. Chọn xong là biết ngay đúng hay sai.")}${stageLineHTML(d.band)}
  <p class="mut" style="margin-top:12px">Câu ${q.pos+1}/${q.items.length} · Đã đúng: ${q.score}</p>
  <div style="text-align:center;margin:14px 0"><div style="font-size:30px;font-weight:800;color:var(--teal)">${esc(it.w)}</div><div class="mut">${esc(it.ipa)}</div><button class="btn light" id="vqSpeak" style="margin-top:6px">🔊 Nghe phát âm</button></div>

  $("#vqNext").onclick=()=>{ q.pos++; q.answered=false; render(); }; }
function allDecks(){ const decks=CONTENT.vocab.map((v,i)=>({name:v.topic||v.theme||("Bộ từ "+(i+1)),band:vocabSetBand(v),cards:v.cards,setIdx:i})); const saved=Object.values(state.savedWords); if(saved.length) decks.push({name:"Từ đã tra (từ điển)",band:null,cards:saved,setIdx:-1}); return decks; }
function deckVisible(d){ const f=effectiveBand(); if(f==="all")return true; if(!d.band)return true; return d.band===f; }

function dueCards(){ const t=today(); const out=[]; allDecks().forEach(d=>d.cards.forEach((c,ci)=>{ const k=cardKey(d.setIdx,ci,c.w); const st=state.cards[k]; if(st&&st.due<=t) out.push({deck:d,c,ci,k}); })); return out; }
function viewVocab(app){

    <div class="grid">${allDecks().map((d,di)=>({d,di})).filter(({d})=>deckVisible(d)).map(({d,di})=>{ const total=d.cards.length; const known=d.cards.filter((c,ci)=>{ const st=state.cards[cardKey(d.setIdx,ci,c.w)]; return st&&st.box>=1; }).length; return `<div class="tile" data-di="${di}">${d.band?`<span class="badge">${esc(d.band)}</span>`:`<span class="badge gold">Mọi cấp độ</span>`}<div class="t">${esc(d.name)}</div><div class="mut">${total} thẻ · Đã học ${known}/${total}</div><div class="bar"><i style="width:${total?Math.round(known/total*100):0}%"></i></div></div>`; }).join("")||`<div class="empty" style="grid-column:1/-1">Chưa có bộ từ nào ở cấp độ đang chọn. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`}</div></div></section>`;
    wireHowTo(app);
    $$(".tile",app).forEach(t=>t.onclick=()=>{ const d=allDecks()[+t.dataset.di]; vocabSel=d; vocabQueue=d.cards.map((c,ci)=>({deck:d,c,ci,k:cardKey(d.setIdx,ci,c.w)})); vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; markStudy("vocab",d.setIdx,d.name); render(); });
    const db=$("#dueBtn"); if(db) db.onclick=()=>{ vocabQueue=dueCards(); vocabSel={name:"Ôn tập đến hạn"}; vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; render(); };
    return;

let lisSel=null, lisMode="dict", lisRate=1, lisQuiz=null;
function normWords(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g,"").split(/\s+/).filter(Boolean); }
function gradeDictation(target,typed){ const T=normWords(target), U=normWords(typed); let ok=0; T.forEach((w,i)=>{ if(U[i]===w) ok++; }); return {ok,total:T.length}; }
function viewListening(app){
  const sections=["Section 1","Section 2","Section 3","Section 4"];

    </div></section>`;

  else if(lisMode==="shadow"){ body=`<p class="mut">Luyện nói nhại theo trình tự chuẩn: NHÌN hình khẩu hình và video người thật, SOI gương của bạn, NGHE mẫu, rồi ĐỌC to và để web check so với câu gốc.</p><div id="lisObs" style="margin-top:8px"></div><div class="row pb-bar" style="margin-top:8px"><button class="btn light" id="lisPbPlay" data-act="play">🔊 Nghe mẫu</button><button class="btn light" id="lisPbSlow" data-act="slow">🐢 Nghe chậm</button><button class="btn light" id="lisPbMirror" data-act="mirror">🪞 Gương khẩu hình</button><button class="btn teal" id="lisPbRec" data-act="rec">🎤 Ghi âm và check giọng</button></div><div id="lisPbRes" style="margin-top:6px"></div><div id="lisExtra" style="margin-top:6px"></div><div class="row" style="margin-top:8px"><button class="btn teal" id="lisShadowBtn">${p.shadow?"Đã đánh dấu đã luyện ✓ (bấm để bỏ)":"Đánh dấu đã nói nhại"}</button></div>`; }

function gradeWords(ref,said){ const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g,"").split(/\s+/).filter(Boolean); const R=norm(ref), S=norm(said); let si=0; const marks=R.map(w=>{ const j=S.indexOf(w,si); if(j>=0){ si=j+1; return true; } return false; }); return {ok:marks.filter(Boolean).length,total:R.length,marks,R}; }

{s:"ð",label:"Âm /ð/ - giống /θ/ nhưng rung cổ họng",words:["this","brother","breathe"]},

  ${spMode==="sub"?`<p class="mut" style="margin-top:8px">${SR_OK()?"Cách kiểm tra ở trang này (Lớp 1): ở thanh luyện tập của từng dòng, bấm 🎤 Ghi âm và check giọng rồi đọc to câu mẫu - web vừa ghi âm để bạn nghe lại, vừa nghe giọng bạn, so từng từ và tô đỏ từ sai hoặc thiếu.":"Trình duyệt này không có nhận diện giọng nói, nên Lớp 1 kiểm tra bằng cách gõ lại câu mẫu: gõ đúng từng từ là đạt, từ sai sẽ bị tô đỏ."}</p>`:""}
  <div id="spObs" style="margin-top:10px"></div>
  <div id="spMouthBox" class="hidden" style="margin-top:10px"></div>

  <div class="row" style="margin-top:8px"><button class="btn light" id="l3Rec">🎙️ Ghi âm giọng của tôi</button><span class="mut" id="l3RecStat">Chưa ghi âm</span></div><div id="l3Play" style="margin-top:6px"></div>
  <div style="margin-top:10px;opacity:.65"><p><b>Kết quả mẫu (sẽ có số thật khi kích hoạt):</b></p><p class="mut">Điểm từng từ: - · Âm cần luyện: - </p></div></div></section>`;
  $("#spBack").onclick=()=>{ spSel=null; spQuizRun=null; render(); };
  $$(".modebar button",app).forEach(b=>b.onclick=()=>{ spMode=b.dataset.m; if(spMode!=="quiz")spQuizRun=null; render(); });
  const clearHi=()=>$$(".line",app).forEach(x=>x.classList.remove("playing"));
  const playLine=(li,after)=>{ const tok=++spTok; spLastLine=li; const rb=$("#spReplay"); if(rb)rb.disabled=false; clearHi(); const el=$(`.line[data-line="${li}"]`,app); if(el){ el.classList.add("playing"); try{el.scrollIntoView({block:"nearest"})}catch(e){} } speak(S.lines[li].en,spRate,()=>{ if(tok!==spTok)return; const e2=$(`.line[data-line="${li}"]`,app); if(e2)e2.classList.remove("playing"); if(after)after(); }); setTimeout(()=>{ if(tok!==spTok)return; const e3=$(`.line[data-line="${li}"]`,app); if(e3)e3.classList.remove("playing"); },Math.max(3000,Math.round(S.lines[li].en.length*95/spRate))); };
  $("#spAll").onclick=()=>{ let i=0; const next=()=>{ if(i>=S.lines.length)return; playLine(i++,next); }; next(); };
  const rp=$("#spReplay"); if(rp) rp.onclick=()=>{ if(spLastLine!==null) playLine(spLastLine); };
  const rs=$("#spRateSel"); if(rs) rs.onchange=e=>{ spRate=parseFloat(e.target.value); };
  $$(".sp-play",app).forEach(b=>b.onclick=()=>playLine(+b.dataset.li));
  $$(".sp-slow",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; spLastLine=li; speak(S.lines[li].en,0.55); });
  $$(".sp-chunks",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const words=S.lines[li].en.split(/\s+/); const chunks=[]; for(let i=0;i<words.length;i+=4) chunks.push(words.slice(i,i+4).join(" ")); let ci=0; const step=()=>{ if(ci>=chunks.length) return; speak(chunks[ci++],spRate,step); }; step(); });
  const judgeLine=(li,said)=>{ const g=gradeWords(S.lines[li].en,said); const chk=$(`.sp-chk[data-li="${li}"]`,app); if(chk) chk.textContent=g.ok===g.total?`✅ Đúng hết ${g.total} từ!`:`⚠️ Đúng ${g.ok}/${g.total} từ - từ đỏ là từ sai/thiếu`; const wv=$(`.sp-words[data-li="${li}"]`,app); if(wv) wv.innerHTML=wordsHTML(g); if(g.ok<g.total) logError({sec:"speaking",kind:"type",q:"Đọc câu mẫu: "+S.lines[li].en,a:S.lines[li].en,why:"Bạn đọc đúng "+g.ok+"/"+g.total+" từ. Nghe mẫu chậm, chú ý các từ bị tô đỏ rồi đọc lại."}); const prev=getProg("speaking","SP"+spSel)||{}; const ck=Object.assign({},prev.checked||{}); ck[li]=g.ok+"/"+g.total; setProg("speaking","SP"+spSel,Object.assign({},prev,{checked:ck})); };
  $$(".sp-mic",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; const chk=$(`.sp-chk[data-li="${li}"]`,app); if(chk) chk.textContent="🎙️ Đang nghe bạn đọc..."; rec.onresult=e=>judgeLine(li,e.results[0][0].transcript); rec.onerror=()=>{ if(chk) chk.textContent="Chưa nghe rõ - bấm lại và đọc to hơn"; }; try{ rec.start(); }catch(e){} });
  $$(".sp-typecheck",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const inp=$(`.sp-typein[data-li="${li}"]`,app); judgeLine(li,inp?inp.value:""); });
  const mb=$("#spMouthBtn"); if(mb) mb.onclick=()=>{ const box=$("#spMouthBox"); if(!box) return; box.classList.toggle("hidden"); if(!box.dataset.wired){ box.innerHTML=mouthPanelHTML(); wireMouthPanel(box,"θ"); box.dataset.wired="1"; } };
  const sym0=(()=>{ for(const l of S.lines){ const s=lineTargetPhoneme(l); if(s) return s; } return null; })();
  const spObs=$("#spObs"); if(spObs){ spObs.innerHTML=obsStripHTML(sym0,"sp"); wireObsVideos(spObs); }
  const smb=$("#spMirrorBtn"); if(smb) smb.onclick=()=>{ const box=$("#spMouthBox"); if(!box) return; box.classList.remove("hidden"); if(!box.dataset.wired){ box.innerHTML=mouthPanelHTML(); wireMouthPanel(box,sym0||"θ"); box.dataset.wired="1"; } const slot=$(".mirror-slot",box); if(slot) mirrorToggle(slot,sym0||box._curSym||"θ"); };
  $$(".sp-mirror",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const slot=$(`.pb-extra[data-li="${li}"]`,app); if(slot) mirrorToggle(slot,lineTargetPhoneme(S.lines[li])); });
  $$(".sp-rec",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; pbCheckVoice({text:S.lines[li].en,btn:b,resEl:$(`.sp-chk[data-li="${li}"]`,app),playEl:$(`.pb-extra[data-li="${li}"]`,app),typeBox:false,judge:said=>judgeLine(li,said)}); });
  const l3=$("#l3Rec"); if(l3) l3.onclick=async()=>{ const stat=$("#l3RecStat"); try{ if(!navigator.mediaDevices||!window.MediaRecorder) throw new Error("unsupported"); const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const rec=new MediaRecorder(stream); const chunks=[]; rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); const url=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"})); const pl=$("#l3Play"); if(pl) pl.innerHTML=`<audio controls src="${url}" style="width:100%"></audio><p class="mut">Đây là bản ghi giọng của bạn để tự nghe lại. Điểm chi tiết từng âm sẽ hiện ở đây khi dịch vụ chấm phát âm được kích hoạt.</p>`; if(stat) stat.textContent="Đã ghi âm xong"; }; if(stat) stat.textContent="Đang ghi âm... bấm nút lần nữa để dừng"; rec.start(); l3.onclick=()=>{ try{ rec.stop(); }catch(e){} }; }catch(e){ if(stat) stat.textContent="Trình duyệt này chưa ghi âm được - bạn vẫn luyện nói và kiểm tra Lớp 1, Lớp 2 bình thường."; } };
  $$(".sp-check",app).forEach(b=>b.onclick=()=>{ const li=+b.dataset.li; const inp=$(`.sp-dict[data-li="${li}"]`); const g=gradeDictation(S.lines[li].en,inp.value); if(g.ok<g.total) logError({sec:"speaking",kind:"type",q:"Chép chính tả dòng nói: "+S.lines[li].en,a:S.lines[li].en,why:"Bạn gõ đúng "+g.ok+"/"+g.total+" từ."}); $(`.sp-res[data-li="${li}"]`).textContent=g.ok===g.total?`Giỏi lắm! Bạn gõ đúng hết ${g.total} từ.`:`Đúng ${g.ok}/${g.total} từ. Câu mẫu: ${S.lines[li].en}`; });
  $$(".sp-pr",app).forEach(cb=>cb.onchange=()=>{ const li=+cb.dataset.li; const prev=getProg("speaking","SP"+spSel)||{practiced:{}}; const pr=Object.assign({},prev.practiced||{}); if(cb.checked)pr[li]=true; else delete pr[li]; setProg("speaking","SP"+spSel,Object.assign({},prev,{practiced:pr})); });
  const sub=$("#spSubmit"); if(sub) sub.onclick=()=>{ const r=spQuizRun; if(Object.keys(r.answers).length<S.quiz.length){ toast("Hãy trả lời đủ "+S.quiz.length+" câu."); return; } r.submitted=true; sessErrs=[]; let score=0; S.quiz.forEach((q,qi)=>{ const chosen=r.answers[qi]; if(chosen===q.a)score++; else logError({sec:"speaking",q:q.q,o:q.o,a:q.a,why:q.why}); $$(".sp-opt",app).filter(x=>+x.dataset.q===qi).forEach(x=>{ const i=+x.dataset.i; if(i===q.a)x.classList.add("right"); else if(i===chosen)x.classList.add("wrong"); x.disabled=true; }); const w=$("#spWhy"+qi); w.innerHTML=(chosen===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why); w.classList.add("show"); }); const prev=getProg("speaking","SP"+spSel)||{}; setProg("speaking","SP"+spSel,Object.assign({},prev,{quiz:score})); $("#spScore").textContent=`Kết quả: ${score}/${S.quiz.length}`; sub.disabled=true; const er=$("#errReview"); if(er) er.innerHTML=errReviewHTML(); };
  $$(".sp-opt",app).forEach(b=>b.onclick=()=>{ const q=+b.dataset.q; spQuizRun.answers[q]=+b.dataset.i; $$(".sp-opt",app).filter(x=>+x.dataset.q===q).forEach(x=>{ x.style.borderColor=""; x.style.background=""; }); b.style.borderColor="var(--teal)"; b.style.background="#eef7f9"; });

let wrSel=null, wrFilter="all", wrShowModel=false;
function rubricMsg(rb){ const n=["req","org","lex","gram"].filter(k=>rb&&rb[k]).length; if(n===0) return "Hãy đọc lại bài và tích vào các mục bạn đã làm được."; if(n===4) return "Xuất sắc! Bài của bạn đạt cả 4 mục cơ bản. Hãy đối chiếu thêm với bài mẫu để học cụm từ hay."; return "Bạn đạt "+n+"/4 mục. Hãy sửa các mục chưa tích trước khi xem bài mẫu nhé."; }
function viewWriting(app){
  if(wrSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Writing - Task 1 & Task 2 có bài mẫu</h2><p class="mut">Task 1 mô tả dữ liệu bằng chữ (đọc số liệu rồi tự viết), Task 2 kèm dàn ý. Mỗi đề có bài mẫu band cao, phân tích cấu trúc và cụm từ ghi điểm. Hãy tự viết vào khung soạn thảo, đối chiếu bài mẫu, rồi đánh dấu hoàn thành.</p>
    <div class="row" style="margin:10px 0"><select id="wrF" style="max-width:200px"><option value="all">Tất cả đề</option><option value="Task 1" ${wrFilter==="Task 1"?"selected":""}>Task 1</option><option value="Task 2" ${wrFilter==="Task 2"?"selected":""}>Task 2</option></select></div>
    ${howToHTML("writing")}
    <div class="grid" id="wrGrid">${CONTENT.writing.map((w,i)=>({w,i})).filter(({w})=>(wrFilter==="all"||w.type===wrFilter)&&(effectiveBand()==="all"||itemBand(w)===effectiveBand())).map(({w,i})=>{ const p=getProg("writing","W"+i)||{}; return `<div class="tile" data-i="${i}"><span class="badge">${esc(w.type)}</span> <span class="badge gold">Bài mẫu ${esc(itemBand(w)||"")}</span> ${p.done?'<span class="badge done">Đã hoàn thành</span>':""}<div class="t">${esc(w.title)}</div><div class="mut">${esc(w.prompt.slice(0,90))}...</div></div>`; }).join("")}</div></div></section>`;
    if(!$$("#wrGrid .tile",app).length) $("#wrGrid").innerHTML=`<div class="empty" style="grid-column:1/-1">Chưa có đề Writing nào khớp bộ lọc hiện tại. Hãy đổi loại đề hoặc chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`;
    wireHowTo(app);
    $("#wrF").onchange=e=>{ wrFilter=e.target.value; render(); };
    $$(".tile",app).forEach(t=>t.onclick=()=>{ wrSel=+t.dataset.i; wrShowModel=false; markStudy("writing",wrSel); render(); });
    return;
  }
  const W=CONTENT.writing[wrSel], p=getProg("writing","W"+wrSel)||{};
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="wBack">← Danh sách đề</button><span class="badge">${esc(W.type)}</span><span class="badge gold">Bài mẫu ${esc(W.band)}</span><b>${esc(W.title)}</b></div>
  ${guideHTML("Bài này dạy cách viết một dạng đề Writing. Nhiệm vụ: đọc đề và dàn ý, tự viết bài của bạn vào khung soạn thảo, rồi mở bài mẫu để so sánh cách viết.")}${stageLineHTML(itemBand(W))}
  <p style="margin-top:10px"><b>Đề bài:</b> ${esc(W.prompt)}</p>
  <div class="why show" style="margin-top:10px"><b>${W.type==="Task 1"?"Dữ kiện của biểu đồ (mô tả bằng chữ):":"Dàn ý gợi ý:"}</b><br>${esc(W.dataDesc)}</div>
  <h3 style="margin-top:14px">Bài viết của bạn</h3>
  <textarea id="wText" rows="10" placeholder="Tự viết bài của bạn vào đây trước khi xem bài mẫu...">${esc(p.text||"")}</textarea>
  <div class="row" style="margin-top:6px"><span class="mut" id="wCount">0 từ</span><span class="grow"></span><button class="btn light" id="wSave">Lưu bài viết</button><button class="btn ${p.done?"light":"teal"}" id="wDone">${p.done?"Đã đánh dấu hoàn thành ✓ (bấm để bỏ)":"Đánh dấu đã hoàn thành"}</button></div>
  </div>
  <div class="card"><h3>Tự chấm bài của bạn (4 mục)</h3><p class="mut">Đọc lại bài vừa viết và tích vào mục bạn đã làm được. Mỗi mục có một lời nhắc ngắn. Phần nhận xét sâu từng câu sẽ do Gia sư AI đảm nhận khi tính năng đó được kích hoạt.</p>
  ${[["req","Đúng yêu cầu đề","Bài có trả lời đúng và đủ ý của đề không? Đề hỏi gì, bài đáp nấy."],["org","Bố cục rõ ràng","Bài có mở bài, thân bài, kết bài và mỗi đoạn một ý chính không?"],["lex","Từ vựng ghi điểm","Bài có dùng từ theo chủ đề và collocation tự nhiên, ít lặp từ không?"],["gram","Ngữ pháp chắc","Bài có câu phức, nhiều loại câu và ít lỗi ngữ pháp cơ bản không?"]].map(([k,lb,hint])=>{ const rb=(p.rubric||{}); return `<label style="display:block;margin:8px 0"><input type="checkbox" class="wr-rub" data-k="${k}" ${rb[k]?"checked":""} style="width:auto"> <b>${lb}</b> - <span class="mut">${hint}</span></label>`; }).join("")}
  <p id="wrRubMsg" style="font-weight:600;margin-top:8px">${rubricMsg(p.rubric||{})}</p></div>
  <div class="card"><div class="row"><h3 style="margin:0">Bài mẫu & phân tích</h3><span class="grow"></span><button class="btn teal" id="wModelBtn">${wrShowModel?"Ẩn bài mẫu":"Xem bài mẫu"}</button></div>
  <div id="wModel" class="${wrShowModel?"":"hidden"}"><div class="modelbox" style="margin-top:10px">${esc(W.model)}</div>
  <p style="margin-top:12px"><b>Phân tích cấu trúc:</b> ${esc(W.analysis)}</p>
  <h3 style="margin-top:12px">Cụm từ ghi điểm</h3>${W.phrases.map(ph=>`<p style="margin:4px 0"><b>${esc(ph.en)}</b> - ${esc(ph.vi)}</p>`).join("")}</div></div></section>`;
  $("#wBack").onclick=()=>{ wrSel=null; render(); };
  const wc=()=>{ const v=$("#wText").value.trim(); $("#wCount").textContent=(v?v.split(/\s+/).length:0)+" từ (Task 1 cần tối thiểu 150 từ, Task 2 cần tối thiểu 250 từ)"; };
  $("#wText").addEventListener("input",wc); wc();
  $("#wSave").onclick=()=>{ const prev=getProg("writing","W"+wrSel)||{}; setProg("writing","W"+wrSel,Object.assign({},prev,{text:$("#wText").value})); toast("Đã lưu bài viết."); };
  $("#wDone").onclick=()=>{ const prev=getProg("writing","W"+wrSel)||{}; setProg("writing","W"+wrSel,Object.assign({},prev,{text:$("#wText").value,done:!prev.done})); render(); };
  $$(".wr-rub",app).forEach(cb=>cb.onchange=()=>{ const prev=getProg("writing","W"+wrSel)||{}; const rb=Object.assign({},prev.rubric||{}); rb[cb.dataset.k]=cb.checked; setProg("writing","W"+wrSel,Object.assign({},prev,{rubric:rb})); const m=$("#wrRubMsg"); if(m) m.textContent=rubricMsg(rb); });
  $("#wModelBtn").onclick=()=>{ wrShowModel=!wrShowModel; render(); };
}

let vidQuizState={};
function videoCardHTML(v,vi){ const saved=getProg("video","V"+vi); return `<div class="tile" style="cursor:default"><span class="badge">${esc(v.level)}</span>${v.skill?` <span class="badge gold">${esc(v.skill)}</span>`:""}<div class="t">${esc(v.title)}</div><div class="mut">Kênh: ${esc(v.channel)}</div><p class="mut" style="margin:6px 0">${esc(v.note)}</p><div id="vidBox${vi}"><button class="btn teal vid-play" data-vi="${vi}">▶ Xem tại đây</button></div><p style="margin-top:8px"><a href="${esc(v.url)}" target="_blank" rel="noopener">Mở trên YouTube ↗</a> <span class="mut">(bấm vào đây nếu video không phát được trong trang)</span></p><div class="row" style="margin-top:6px"><button class="btn light vid-quiz-btn" data-vi="${vi}">✅ Kiểm tra sau khi xem (3 câu)</button><span class="mut" id="vidStatus${vi}">${saved?("Đã kiểm tra: "+saved.score+"/"+saved.total+" câu đúng"):""}</span></div><div id="vidQuiz${vi}" style="margin-top:8px"></div></div>`; }
function renderVidQuiz(vi){ const box=$("#vidQuiz"+vi); if(!box) return; const qs=VIDEO_QUIZ[vi]||[]; const st=vidQuizState[vi]||(vidQuizState[vi]={answered:{},score:0});
  box.innerHTML=qs.map((q,qi)=>`<div style="margin-top:8px"><p><b>Câu ${qi+1}.</b> ${esc(q.q)}</p>${q.o.map((o,oi)=>`<button class="opt vqq-opt" data-vi="${vi}" data-qi="${qi}" data-i="${oi}" ${st.answered[qi]!==undefined?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why ${st.answered[qi]!==undefined?"show":""}" id="vqWhy${vi}_${qi}">${st.answered[qi]!==undefined?((st.answered[qi]===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why)):""}</div></div>`).join("")+(Object.keys(st.answered).length>=qs.length?`<p style="margin-top:8px"><b>Kết quả: ${st.score}/${qs.length} câu đúng.</b> ${st.score>=2?"Tốt! Bạn đã nắm ý chính của video.":"Hãy xem lại video rồi thử lại nhé."}</p>`:"");
  $$(".vqq-opt",box).forEach(b=>b.onclick=()=>{ const qi=+b.dataset.qi, i=+b.dataset.i, q=qs[qi]; if(st.answered[qi]!==undefined) return; st.answered[qi]=i; if(i===q.a) st.score++; else logError({sec:"video",q:q.q,o:q.o,a:q.a,why:q.why}); if(Object.keys(st.answered).length>=qs.length){ setProg("video","V"+vi,{score:st.score,total:qs.length}); const sv=$("#vidStatus"+vi); if(sv) sv.textContent="Đã kiểm tra: "+st.score+"/"+qs.length+" câu đúng"; } renderVidQuiz(vi); }); }
function viewVideo(app){
  const f=effectiveBand();
  const vis=v=>f==="all"||v.bands.includes(f);
  const groups=[["foundation","Khối nền tảng - từ Band 0 tới A2/B1"],["ielts","Khối IELTS - theo kỹ năng và band mục tiêu"]];
  app.innerHTML=`<section class="page on"><div class="card"><h2>Video bài học</h2><p class="mut">Mỗi thẻ là một video học tiếng Anh được chọn lọc, xếp từ nền tảng Band 0 tới band cao. Nhiệm vụ của bạn: bấm "Xem tại đây" để học ngay trong trang, nghe kỹ và ghi lại những từ mới bạn gặp. Các video thuộc về kênh gốc trên YouTube; nếu kênh tắt tính năng nhúng, hãy bấm "Mở trên YouTube".</p>
  ${howToHTML("video")}
  ${groups.map(([g,gt])=>{ const items=VIDEOS.map((v,vi)=>({v,vi})).filter(({v})=>v.g===g&&vis(v)); if(!items.length) return ""; return `<h3 style="margin-top:16px">${gt}</h3><div class="grid">${items.map(({v,vi})=>videoCardHTML(v,vi)).join("")}</div>`; }).join("")||`<div class="empty" style="margin-top:12px">Chưa có video nào ở cấp độ ${esc(f)}. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`}
  </div></section>`;
  $$(".vid-play",app).forEach(b=>b.onclick=()=>{ const v=VIDEOS[+b.dataset.vi]; const box=$("#vidBox"+b.dataset.vi); if(box) box.innerHTML=`<iframe src="${esc(v.embed)}" title="${esc(v.title)}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`; });
  $$(".vid-quiz-btn",app).forEach(b=>b.onclick=()=>renderVidQuiz(+b.dataset.vi));
  wireHowTo(app);
}

function mouthSVG(p){ const hx=Math.round(70+p.f*60), hy=Math.round(122-p.h*48), tx=Math.round(142-p.tip*96), ty=Math.round(112-p.h*20-p.tip*16), lipO=Math.round(8+p.o*20), lipR=Math.round(6+p.r*8), lipX=Math.round(26+p.r*7);
  return `<svg viewBox="0 0 220 170" style="width:100%;max-width:340px;background:#fdf8ee;border:1px solid var(--line);border-radius:12px" role="img" aria-label="Khẩu hình âm /${p.s}/">
  <path d="M30,30 Q60,14 96,16 Q150,18 176,40 Q190,52 188,74" fill="none" stroke="#c9a86a" stroke-width="5" stroke-linecap="round"/>

  <path d="M20,150 Q110,162 196,150" fill="none" stroke="#c9a86a" stroke-width="5" stroke-linecap="round"/>
  <g class="tongue"><path d="M172,132 Q${hx},${hy} ${tx},${ty} L${tx+7},${ty+15} Q${hx},${hy+27} 172,144 Z" fill="#e88ca0" stroke="#c95f7c" stroke-width="1.5"/></g>
  <ellipse cx="${lipX}" cy="${Math.round(64-lipO/2)}" rx="${lipR+3}" ry="${Math.round(5+lipO/3)}" fill="#d96f6f"/>
  <ellipse cx="${lipX}" cy="${Math.round(64+lipO/2+4)}" rx="${lipR+3}" ry="${Math.round(5+lipO/3)}" fill="#c95f5f"/>
  <text x="196" y="164" font-size="10" fill="#5b7180" text-anchor="end">mặt cắt bên</text></svg>`; }
function phonemeOf(sym){ return PHONEMES.find(p=>p.s===sym)||PHONEMES[11]; }
function firstPhonemeOf(word){ const w=(word||"").toLowerCase(); if(w.startsWith("th")) return "θ"; if(w.startsWith("sh")) return "ʃ"; if(w.startsWith("ch")) return "tʃ"; if(w.startsWith("ph")) return "f"; if(w.startsWith("wh")) return "w"; if(w.startsWith("qu")) return "k"; const map={a:"æ",b:"b",c:"k",d:"d",e:"e",f:"f",g:"ɡ",h:"h",i:"ɪ",j:"dʒ",k:"k",l:"l",m:"m",n:"n",o:"ɒ",p:"p",r:"r",s:"s",t:"t",u:"ʌ",v:"v",w:"w",y:"j",z:"z"}; return map[w[0]]||"ə"; }

    if(MIRROR.slot&&root.contains(MIRROR.slot)) mirrorSetTarget(cur.s); } };
  $$(".ph-btn",root).forEach(b=>b.onclick=()=>{ cur=phonemeOf(b.dataset.s); draw(); });
  draw(); }

/* ================= SUY ÂM ĐÍCH TỪ CÂU MẪU ================= */
function derivePhonemeFromText(text,ipa){ if(ipa){ const prio=["tʃ","dʒ","θ","ð","ʃ","ʒ","æ","u:","ʊ","ɔ:","ɑ:","aɪ","aʊ","ɔɪ","eɪ","əʊ","ŋ","r","w","f","v","s","z","ɪ","i:","e","ʌ","ɒ","ɜ:","ə"]; for(const s of prio){ if(String(ipa).includes(s)) return s; } }
  const rawSyms=["tʃ","dʒ","θ","ð","ʃ","ʒ","æ","u:","ʊ","ɔ:","ɑ:","aɪ","aʊ","ɔɪ","eɪ","əʊ","ɪ","ʌ","ɒ","ɜ:","i:","ə","ŋ"]; const rawT=String(text||""); for(const s of rawSyms){ if(rawT.includes(s)) return s; }
  const words=String(text||"").toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
  for(const w of words){ const t=targetSoundOf(w); if(t&&PHONEMES.some(p=>p.s===t)) return t; }
  for(const w of words){ if(w.startsWith("th")) return "θ"; if(w.startsWith("sh")) return "ʃ"; if(w.startsWith("ch")) return "tʃ"; if(w.startsWith("wh")) return "w"; if(w.endsWith("ng")&&w.length>3) return "ŋ"; }
  return null; }
function lineTargetPhoneme(l){ if(!l) return null; let out=derivePhonemeFromText(l.en,l.ipa); if(!out&&l.link) out=derivePhonemeFromText(l.link); if(!out&&l.chunks&&l.chunks.length){ for(const ch of l.chunks){ out=derivePhonemeFromText(ch); if(out) break; } } return out; }

let PB_ACTIVE=null;
function pbGenericJudge(o,g){ if(!o.resEl) return; const ok=g.ok===g.total; o.resEl.innerHTML=`<span style="font-weight:700">${ok?`✅ Đúng hết ${g.total} từ!`:`⚠️ Đúng ${g.ok}/${g.total} từ - phần gạch đỏ là từ sai hoặc thiếu`}</span><div class="pb-marks">${wordsHTML(g)}</div>`; }

function pbStopBtn(btn){ const st=btn&&btn._pb; if(!st) return; btn._pbOn=false; btn.textContent=st.label; try{ if(st.sr) st.sr.abort(); }catch(e){} try{ if(st.rec&&st.rec.state!=="inactive") st.rec.stop(); }catch(e){} if(PB_ACTIVE===st) PB_ACTIVE=null; }
function pbCheckVoice(o){ const btn=o.btn; if(!btn) return; if(btn._pbOn){ pbStopBtn(btn); return; } if(PB_ACTIVE&&PB_ACTIVE.btn!==btn) pbStopBtn(PB_ACTIVE.btn);
  const st={btn,o,label:btn.textContent,chunks:[],rec:null,stream:null,sr:null,judged:false}; btn._pb=st; btn._pbOn=true; PB_ACTIVE=st; btn.textContent="⏹ Dừng và xem kết quả";
  if(o.resEl) o.resEl.innerHTML=SR_OK()?"🎙️ Đang nghe bạn đọc - hãy đọc to câu mẫu...":"🎙️ Đang ghi âm - đọc to câu mẫu, xong bấm nút một lần nữa để dừng và nghe lại. Trình duyệt này không có nhận diện giọng nói, nên hãy gõ lại câu vào ô ở dưới để check từng từ.";
  if(SR_OK()){ try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; st.sr=rec;
    rec.onresult=e=>{ const said=e.results[0][0].transcript; st.judged=true; const g=gradeWords(o.text,said); pbGenericJudge(o,g); if(o.judge) o.judge(said,g); setTimeout(()=>pbStopBtn(btn),600); };
    rec.onerror=()=>{ if(!st.judged&&o.resEl){ o.resEl.innerHTML="Chưa nghe rõ - hãy bấm lại nút ghi âm và đọc to, rõ hơn."; if(o.typeBox!==false) pbTypeIn(o); } };
    rec.start(); }catch(e){} }
  else if(o.typeBox!==false) pbTypeIn(o);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder){ navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ if(!btn._pbOn){ stream.getTracks().forEach(t=>t.stop()); return; } st.stream=stream; try{ const mr=new MediaRecorder(stream); st.rec=mr; mr.ondataavailable=e=>{ if(e.data&&e.data.size) st.chunks.push(e.data); }; mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(st.chunks.length&&o.playEl){ const url=URL.createObjectURL(new Blob(st.chunks,{type:mr.mimeType||"audio/webm"})); let box=o.playEl.querySelector(".pb-playbox"); if(!box){ box=document.createElement("div"); box.className="pb-playbox"; o.playEl.appendChild(box); } box.innerHTML=`<p class="mut" style="margin-top:6px">🎧 Bản ghi giọng của bạn - nghe lại và so với giọng mẫu:</p><audio controls src="${url}" style="width:100%"></audio>`; } }; mr.start(); }catch(e){} }).catch(()=>{ if(o.playEl&&!o.playEl.querySelector(".pb-playbox")){ const box=document.createElement("div"); box.className="pb-playbox"; box.innerHTML=`<p class="mut" style="margin-top:6px">Không ghi âm được vì chưa được cấp quyền micro. Bạn vẫn check được bằng nhận diện giọng nói hoặc gõ lại câu.</p>`; o.playEl.appendChild(box); } }); }

  const itemHTML=e=>`<div class="tile" style="cursor:default"><span class="badge">${esc(ERR_SEC_NAME[e.sec]||e.sec)}</span> ${e.done?'<span class="badge done">Đã sửa xong</span>':`<span class="badge gold">Đã sửa đúng ${e.streak||0}/2 lần</span>`}<div class="t" style="font-size:15.5px">${esc(e.q)}</div><div class="mut">Đáp án đúng: <b>${esc(errAnswerText(e))}</b>${e.why?(" - "+esc(e.why)):""}</div><div class="mut">Sai ${e.count||1} lần · Lần gần nhất: ${esc(e.date)}${e.done?"":(" · Đến hạn ôn: "+esc(e.due))}</div>${!e.done?`<div class="row" style="margin-top:7px"><button class="btn teal err-practice" data-id="${esc(e.id)}">${errPracticeId===e.id?"Đang luyện...":"Luyện lại câu này"}</button></div><div class="err-practice-box" data-id="${esc(e.id)}"></div>`:""}</div>`;
  app.innerHTML=`<section class="page on"><div class="card"><h2>📕 Sổ lỗi sai của bạn</h2><p class="mut">Mọi câu trả lời sai ở mọi phần học đều tự lưu vào đây. Luyện lại đúng 2 lần liên tiếp là lỗi được đánh dấu đã sửa xong. Lỗi chưa sửa sẽ quay lại theo nhịp ôn giãn cách, giống thẻ từ vựng.</p>
  ${howToHTML("errors")}
  <h3 style="margin-top:14px">Đến hạn ôn hôm nay (${due.length})</h3>${due.length?`<div class="grid">${due.map(itemHTML).join("")}</div>`:`<p class="mut">Không có lỗi nào đến hạn hôm nay. Tốt lắm!</p>`}

  <h3 style="margin-top:16px">Đã sửa xong (${done.length})</h3>${done.length?`<div class="grid">${done.map(itemHTML).join("")}</div>`:`<p class="mut">Chưa có lỗi nào được sửa xong. Cứ luyện lại đúng 2 lần liên tiếp là xong một lỗi.</p>`}
  </div></section>`;
  wireHowTo(app);
  $$(".err-practice",app).forEach(b=>b.onclick=()=>{ errPracticeId=b.dataset.id; renderErrPractice(app); });

}
function renderErrPractice(app){ const e=(state.errors||[]).find(x=>x.id===errPracticeId); const box=$(`.err-practice-box[data-id="${CSS.escape(errPracticeId||"")}"]`,app); if(!e||!box) return;
  const judge=ok=>{ if(ok){ e.streak=(e.streak||0)+1; if(e.streak>=2){ e.done=true; e.due=""; } else { e.due=addDays(today(),1); } } else { e.streak=0; e.due=addDays(today(),1); e.count=(e.count||1)+1; e.date=today(); }
    syncErrors(); saveLocal(); toast(ok?(e.done?"Đã sửa xong lỗi này!":"Đúng rồi! Sửa đúng thêm 1 lần nữa (vào ngày mai) là xong."):"Chưa đúng - lỗi này sẽ quay lại vào ngày mai."); errPracticeId=null; render(); };
  if(e.kind==="mc"&&e.o){ box.innerHTML=`<div style="margin-top:8px"><p><b>Trả lời lại:</b></p>${e.o.map((o,oi)=>`<button class="opt err-opt" data-i="${oi}">${esc(o)}</button>`).join("")}<div class="why" id="errWhy"></div></div>`;
    $$(".err-opt",box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; const ok=i===e.a; $$(".err-opt",box).forEach((x,xi)=>{ if(xi===e.a)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#errWhy",box); if(w){ w.innerHTML=(ok?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(e.why||""); w.classList.add("show"); } setTimeout(()=>judge(ok),700); });
  } else { box.innerHTML=`<div style="margin-top:8px"><p><b>Gõ lại đáp án đúng:</b></p><textarea class="err-inp" rows="2" placeholder="Gõ lại câu đúng vào đây..."></textarea><div class="row" style="margin-top:6px"><button class="btn teal err-chk">Kiểm tra</button><span class="err-res" style="font-weight:600"></span></div></div>`;
    $(".err-chk",box).onclick=()=>{ const inp=$(".err-inp",box); const g=gradeDictation(String(e.a),inp?inp.value:""); const ok=g.ok===g.total&&g.total>0; const r=$(".err-res",box); if(r) r.textContent=ok?"Đúng hết!":("Đúng "+g.ok+"/"+g.total+" từ - đáp án đúng: "+e.a); setTimeout(()=>judge(ok),700); }; }
}

let combatSel=null, combatRun=null;
function combatBand(sc){ return sc.band||sc.level||null; }
function viewCombat(app){ const scenarios=CONTENT.roleplay||[];
  if(combatSel===null){ const f=effectiveBand();
    app.innerHTML=`<section class="page on"><div class="card"><h2>🎭 Thực chiến giao tiếp - đóng vai đời thực</h2><p class="mut">Vào vai trong các tình huống thật: web đọc lời của đối tác bằng giọng máy, bạn đáp lại bằng giọng nói (nếu trình duyệt hỗ trợ) hoặc gõ. Mỗi lượt đều được chấm ngay; lỗi sai tự vào Sổ lỗi sai; cuối tình huống có tổng kết các cụm câu bản địa bạn đã dùng được.</p>

    </div></section>`;
    wireHowTo(app);
    $$(".tile",app).forEach(t=>t.onclick=()=>{ combatSel=+t.dataset.i; combatRun={ti:0,passed:0,failed:0,answers:{},verdicts:{},chunks:[],errCount:0,finished:false,spokeTurn:-1}; render(); });
    return; }
  const sc=scenarios[combatSel]; const run=combatRun; const turns=sc.turns||[];
  const cur=turns[run.ti];
  const transcript=turns.slice(0,Math.min(run.ti+1,turns.length)).map((t,ti)=>{ if(t.from==="partner") return `<div class="line"><div class="who">${esc(sc.partner||"Đối tác")}</div><div class="txt"><div>${esc(t.text||"")}</div></div><button class="iconbtn cb-speak" data-ti="${ti}">🔊</button></div>`;
    const v=run.verdicts[ti]; const ans=run.answers[ti];
    return `<div class="line" style="background:#f2f9fa"><div class="who">Bạn</div><div class="txt"><div class="mut">${esc(t.prompt||"Lượt của bạn:")}</div>${ans!==undefined?`<div>${esc(ans)}</div><div style="margin-top:3px">${v?'<span class="badge done">✅ Đạt</span>':'<span class="badge" style="background:#f6d5d3">Chưa đạt</span>'} ${t.tip&&!v?esc(t.tip):""}</div>`:`<div class="mut">(đang chờ bạn trả lời ở dưới)</div>`}</div></div>`; }).join("");
  let action="";
  if(run.finished){ const total=run.passed+run.failed; const pct=total?Math.round(run.passed/total*100):0;
    action=`<div class="card" style="background:#eafaf1;border-color:#bfe8d2;margin-top:12px"><h3>Tổng kết tình huống</h3><p>Bạn đạt <b>${run.passed}/${total}</b> lượt (${pct}%).</p><p class="mut">Lỗi đã lưu vào Sổ lỗi sai trong buổi này: <b>${run.errCount}</b> lỗi.</p>${run.chunks.length?`<p style="margin-top:6px"><b>Cụm câu bản địa bạn đã dùng được:</b></p>${run.chunks.map(c=>`<p style="margin:3px 0">• ${esc(c)}</p>`).join("")}`:`<p class="mut">Chưa thu thập được cụm câu bản địa nào - hãy thử dùng các cụm gợi ý ở từng lượt.</p>`}<div class="row" style="margin-top:10px"><button class="btn teal" id="cbAgain">Làm lại tình huống</button><button class="btn light" id="cbList">Về danh sách</button><button class="btn light" onclick="go('errors')">Xem Sổ lỗi sai</button></div></div>`;
  } else if(cur&&cur.from==="partner"){ action=`<div class="row" style="margin-top:10px"><button class="btn teal" id="cbNext">Đã nghe - tiếp tục</button></div>`; }
  else if(cur){ action=`<div style="margin-top:10px"><label class="mut">Câu trả lời của bạn ${SR_OK()?"(gõ vào ô, hoặc dùng nút Ghi âm và check giọng ở thanh luyện tập bên dưới)":"(gõ vào ô dưới)"}:</label><textarea id="cbInp" rows="2" placeholder="Trả lời bằng tiếng Anh..."></textarea><div class="row" style="margin-top:7px"><button class="btn teal" id="cbSend">Gửi câu trả lời</button><span class="mut" id="cbHint">${cur.hint?esc(cur.hint):""}</span></div><div class="row pb-bar" style="margin-top:8px"><button class="btn light" id="cbPlay" data-act="play">🔊 Nghe mẫu</button><button class="btn light" id="cbSlow" data-act="slow">🐢 Nghe chậm</button><button class="btn light" id="cbMirror" data-act="mirror">🪞 Gương khẩu hình</button><button class="btn teal" id="cbRec" data-act="rec">🎤 Ghi âm và check giọng</button><span class="mut" id="cbPbRes"></span></div><div id="cbExtra" style="margin-top:6px"></div></div>`; }
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="cbBack">← Danh sách tình huống</button>${combatBand(sc)?`<span class="badge">${esc(combatBand(sc))}</span>`:""}<b>${esc(sc.title)}</b><span class="mut">Lượt ${Math.min(run.ti+1,turns.length)}/${turns.length}</span></div>
  <p class="mut" style="margin-top:8px">${esc(sc.setting||"")}</p>${sc.goal?`<p style="margin-top:4px"><b>Mục tiêu của bạn:</b> ${esc(sc.goal)}</p>`:""}
  <div id="cbObs" style="margin:10px 0"></div>
  <div style="margin-top:10px">${transcript}</div>${action}</div></section>`;
  $("#cbBack").onclick=()=>{ combatSel=null; combatRun=null; render(); };
  $$(".cb-speak",app).forEach(b=>b.onclick=()=>{ const t=turns[+b.dataset.ti]; if(t) speak(t.text||"",0.95); });
  if(cur&&cur.from==="partner"&&!run.finished&&run.spokeTurn!==run.ti){ run.spokeTurn=run.ti; setTimeout(()=>speak(cur.text||"",0.95),250); }
  const nx=$("#cbNext"); if(nx) nx.onclick=()=>{ run.ti++; if(run.ti>=turns.length) finishCombat(sc,run); render(); };
  const send=()=>{ const inp=$("#cbInp"); const said=(inp?inp.value:"").trim(); if(!said){ toast("Hãy nhập hoặc nói câu trả lời của bạn."); return; } judgeCombatTurn(sc,run,said); };
  const sb2=$("#cbSend"); if(sb2) sb2.onclick=send;
  const cObs=$("#cbObs"); if(cObs){ const syms=sc.turns.filter(t=>t.from==="learner").map(t=>derivePhonemeFromText(t.expect||"")).filter(Boolean); cObs.innerHTML=obsStripHTML(syms[0]||null,"sp"); wireObsVideos(cObs); }
  if(cur&&cur.from==="learner"){ const cp=$("#cbPlay"); if(cp) cp.onclick=()=>{ if(cur.expect) speak(cur.expect,0.95); else toast("Lượt này không có câu mẫu sẵn - hãy tự nói theo gợi ý ở trên."); };
    const cs=$("#cbSlow"); if(cs) cs.onclick=()=>{ if(cur.expect) speak(cur.expect,0.55); else toast("Lượt này không có câu mẫu sẵn - hãy tự nói theo gợi ý ở trên."); };
    const cm=$("#cbMirror"); if(cm) cm.onclick=()=>{ const slot=$("#cbExtra"); if(slot) mirrorToggle(slot,derivePhonemeFromText(cur.expect||"")); };
    const cr=$("#cbRec"); if(cr) cr.onclick=()=>pbCheckVoice({text:cur.expect||(cur.keywords||[]).join(" "),btn:cr,resEl:$("#cbPbRes"),playEl:$("#cbExtra"),typeBox:false,judge:said=>{ const inp=$("#cbInp"); if(inp) inp.value=said; judgeCombatTurn(sc,run,said); }}); }
  const mic=$("#cbMic"); if(mic) mic.onclick=()=>{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; const rec=new SR(); rec.lang="en-US"; rec.interimResults=false; mic.textContent="🎙️ Đang nghe..."; rec.onresult=e=>{ const inp=$("#cbInp"); if(inp) inp.value=e.results[0][0].transcript; mic.textContent="🎤 Nói câu trả lời"; }; rec.onerror=()=>{ mic.textContent="🎤 Nói câu trả lời"; }; try{ rec.start(); }catch(e){} };
  const ag=$("#cbAgain"); if(ag) ag.onclick=()=>{ combatRun={ti:0,passed:0,failed:0,answers:{},verdicts:{},chunks:[],errCount:0,finished:false,spokeTurn:-1}; render(); };
  const bl=$("#cbList"); if(bl) bl.onclick=()=>{ combatSel=null; combatRun=null; render(); };
}
function judgeCombatTurn(sc,run,said){ const t=sc.turns[run.ti]; let ok=false;
  if(t.keywords&&t.keywords.length){ const low=" "+said.toLowerCase()+" "; const hit=t.keywords.filter(k=>low.includes(k.toLowerCase())).length; ok=hit>=Math.ceil(t.keywords.length*0.6); }
  else if(t.expect){ ok=gradeWords(t.expect,said).ok/Math.max(1,gradeWords(t.expect,said).total)>=0.7; }
  else ok=said.trim().length>0;
  run.answers[run.ti]=said; run.verdicts[run.ti]=ok;
  if(ok){ run.passed++; (t.chunks||[]).concat(sc.chunks||[]).forEach(c=>{ if(!run.chunks.includes(c)) run.chunks.push(c); }); }
  else { run.failed++; run.errCount++; logError({sec:"combat",kind:"type",q:"Thực chiến \""+sc.title+"\": "+(t.prompt||"Lượt của bạn"),a:t.expect||(t.keywords||[]).join(", "),why:t.tip||"Xem cụm câu gợi ý trong tình huống và thử lại lượt này."}); }
  run.ti++; if(run.ti>=sc.turns.length) finishCombat(sc,run); render(); }
function finishCombat(sc,run){ run.finished=true; const total=run.passed+run.failed; const prev=getProg("combat","C"+combatSel)||{}; setProg("combat","C"+combatSel,{best:Math.max(prev.best||0,run.passed),total}); }

/* ================= GIA SƯ AI ================= */
const TUTOR_SOON="Gia sư AI sắp ra mắt - tính năng đang được hoàn thiện. Trong lúc chờ, bạn cứ học theo lộ trình ở trang chủ nhé, phần nào chưa hiểu hãy bấm vào các từ có gạch chấm để xem giải thích dễ hiểu.";
let tutorState={mode:"chat",msgs:[],busy:false};
const TUTOR_MODES=[["explain","Giải thích từ/câu này"],["fix","Sửa câu tiếng Anh của tôi"],["writing","Nhận xét bài Writing của tôi"],["grammar","Hỏi về ngữ pháp"]];
function latestWriting(){ let found=null; CONTENT.writing.forEach((w,i)=>{ const p=getProg("writing","W"+i); if(p&&p.text&&p.text.trim()) found={i,title:w.title,text:p.text}; }); return found; }
function tutorCtxText(){ if(tutorState.mode==="writing"){ const lw=latestWriting(); return lw?("Bài Writing sẽ gửi kèm: \""+lw.title+"\" ("+lw.text.trim().split(/\s+/).length+" từ). Bạn chỉ cần ghi thêm yêu cầu nếu muốn, hoặc bấm Gửi luôn."):"Bạn chưa lưu bài Writing nào. Hãy viết một bài ở phân hệ Writing trước, hoặc dán bài viết của bạn vào ô hỏi ở dưới."; } if(tutorState.mode==="explain") return "Dán từ hoặc câu tiếng Anh bạn chưa hiểu vào ô hỏi, gia sư sẽ giải thích bằng tiếng Việt thật dễ hiểu."; if(tutorState.mode==="fix") return "Dán câu tiếng Anh bạn tự viết vào ô hỏi, gia sư sẽ sửa và giải thích vì sao."; if(tutorState.mode==="grammar") return "Gõ câu hỏi ngữ pháp của bạn vào ô hỏi, ví dụ: khi nào dùng thì hiện tại hoàn thành?"; return ""; }
function viewTutor(app){
  app.innerHTML=`<section class="page on"><div class="card"><h2>🤖 Gia sư AI</h2>
  <p class="mut">Gia sư AI trả lời câu hỏi học tiếng Anh của bạn: giải thích từ và câu, sửa câu bạn viết, nhận xét bài Writing, giải thích ngữ pháp. Chọn một việc ở dưới rồi gõ câu hỏi của bạn.</p>
  <div class="row" style="margin-top:10px">${TUTOR_MODES.map(([m,lb])=>`<button class="chip tutor-mode ${tutorState.mode===m?"on":""}" data-m="${m}" style="font-size:14px;padding:9px 13px">${lb}</button>`).join("")}</div>
  <p class="mut" id="tutorCtx" style="margin-top:8px">${esc(tutorCtxText())}</p>
  <div id="tutorLog" style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px">
    ${tutorState.msgs.length?tutorState.msgs.map(m=>`<div style="align-self:${m.who==="me"?"flex-end":"flex-start"};max-width:88%;background:${m.who==="me"?"#e3f0f3":"#f7fafb"};border:1px solid var(--line);border-radius:12px;padding:9px 12px;white-space:pre-wrap">${esc(m.text)}</div>`).join(""):`<div style="align-self:flex-start;max-width:88%;background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:9px 12px">Chào bạn! Mình là gia sư AI của web. Bạn muốn mình giúp gì hôm nay?</div>`}
  </div>
  <div class="row" style="margin-top:10px;align-items:flex-end"><textarea id="tutorInp" rows="2" placeholder="Gõ câu hỏi của bạn vào đây..." style="flex:1"></textarea><button class="btn" id="tutorSend" ${tutorState.busy?"disabled":""}>${tutorState.busy?"Đang gửi...":"Gửi cho gia sư"}</button></div>
  </div></section>`;
  $$(".tutor-mode",app).forEach(b=>b.onclick=()=>{ tutorState.mode=b.dataset.m; render(); });
  $("#tutorSend").onclick=sendTutor;
  const inp=$("#tutorInp"); if(inp) inp.onkeydown=e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) sendTutor(); };
  const log=$("#tutorLog"); if(log) log.scrollTop=log.scrollHeight;

async function sendTutor(){ const inp=$("#tutorInp"); const msg=(inp?inp.value:"").trim(); if(tutorState.busy) return;
  const mode=tutorState.mode; const lw=mode==="writing"?latestWriting():null;
  if(!msg&&!lw){ toast("Hãy gõ câu hỏi của bạn trước nhé."); return; }
  const shown=msg||("(Nhận xét bài Writing đã lưu của tôi)");
  tutorState.msgs.push({who:"me",text:(mode==="writing"&&lw)?(shown+"\n[Đã gửi kèm bài: "+lw.title+"]"):shown});
  const context=lw?lw.text:undefined;
  if(!IS_REAL||!sbUser){ tutorState.msgs.push({who:"ai",text:TUTOR_SOON}); render(); return; }
  tutorState.busy=true; tutorState.msgs.push({who:"ai",text:"Gia sư đang suy nghĩ..."}); render();
  const waitIdx=tutorState.msgs.length-1;
  try{
    const sess=await sb.auth.getSession(); const token=sess&&sess.data&&sess.data.session?sess.data.session.access_token:null;
    if(!token) throw new Error("no session");
    const res=await fetch(window.SUPABASE_URL+"/functions/v1/ai-tutor",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"apikey":window.SUPABASE_ANON_KEY},body:JSON.stringify({message:msg,mode,context})});
    if(!res.ok) throw new Error("bad status");
    const data=await res.json(); const reply=data&&(data.reply||data.message||data.text);
    if(!reply) throw new Error("empty reply");
    tutorState.msgs[waitIdx]={who:"ai",text:String(reply)};
  }catch(e){ tutorState.msgs[waitIdx]={who:"ai",text:TUTOR_SOON}; }
  tutorState.busy=false; render();
}

/* ================= TỪ ĐIỂN ================= */
$("#dictFab").onclick=()=>{ $("#dictPanel").classList.toggle("open"); $("#dictInput").focus(); };
$("#dictClose").onclick=()=>$("#dictPanel").classList.remove("open");
$("#dictInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#dictGo").click(); });
$("#dictGo").onclick=async()=>{
  const w=$("#dictInput").value.trim().toLowerCase(); const box=$("#dictResult");
  if(!w){ box.innerHTML=""; return; }
  box.innerHTML="<p class='mut'>Đang tra...</p>";
  try{
    const res=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));
    if(!res.ok) throw new Error("nf");
    const data=await res.json(); const e0=data[0];
    const phon=e0.phonetic||((e0.phonetics||[]).find(x=>x.text)||{}).text||"";
    const meanings=(e0.meanings||[]).slice(0,2).map(m=>`<p style="margin:6px 0"><i>${esc(m.partOfSpeech)}</i>: ${esc((m.definitions||[]).slice(0,2).map(d=>d.definition).join("; "))}</p>`).join("");
    const ex=((e0.meanings||[]).flatMap(m=>m.definitions||[]).find(d=>d.example)||{}).example||"";
    const defShort=(((e0.meanings||[])[0]||{}).definitions||[])[0]?.definition||"";
    box.innerHTML=`<div class="word" style="font-size:26px">${esc(e0.word)}</div><div class="ipa">${esc(phon)}</div>${meanings}${ex?`<p class="mut">Ví dụ: ${esc(ex)}</p>`:""}<div class="row" style="margin-top:10px"><button class="btn teal" id="dictSave">Lưu vào bộ ôn tập</button><button class="btn light" id="dictSpeak">🔊 Nghe</button></div>`;
    $("#dictSpeak").onclick=()=>speak(e0.word,0.9);
    $("#dictSave").onclick=()=>{ state.savedWords[e0.word.toLowerCase()]={w:e0.word,ipa:phon,vi:"Nghĩa (Anh-Anh): "+defShort,col:"",ex:ex,exv:"Từ đã tra từ từ điển"}; saveLocal(); pushWord(e0.word.toLowerCase()); toast("Đã lưu từ '"+e0.word+"' vào bộ Từ đã tra."); };
  }catch(err){ box.innerHTML="<p class='mut'>Không tìm thấy từ này, hoặc máy đang mất mạng. Hãy kiểm tra chính tả và thử lại.</p>"; }
};

document.addEventListener("click",e=>{ const t=e.target&&e.target.closest?e.target.closest(".term"):null; if(!t) return; const pop=$("#glossPop"); if(pop&&GLOSSARY[t.dataset.term]){ $("#glossText").textContent=GLOSSARY[t.dataset.term]; pop.classList.add("open"); } });
const __gc=$("#glossClose"); if(__gc) __gc.onclick=()=>$("#glossPop").classList.remove("open");

/* ================= KHỞI ĐỘNG ================= */
loadLocal();
if(!IS_REAL) $("#previewBanner").style.display="block";
renderTabs(); renderUserBox(); render();
if(IS_REAL&&window.__supabaseReady){ window.__supabaseReady.then(async client=>{ sb=client; if(!sb) return; try{ const {data}=await sb.auth.getSession(); if(data&&data.session){ sbUser=data.session.user; await pullRemote(); renderUserBox(); render(); } sb.auth.onAuthStateChange(async(_ev,session)=>{ sbUser=session?session.user:null; renderUserBox(); if(sbUser){ await pullRemote(); render(); } }); }catch(e){} }); }
</script>
