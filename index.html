<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi IELTS - Học tiếng Anh theo band điểm</title>
<style>
:root{--teal:#0b5563;--teal2:#0e7490;--gold:#e8b33c;--bg:#f4f7f8;--card:#ffffff;--ink:#16323a;--mut:#5b7180;--ok:#1e9e6a;--bad:#d9534f;--line:#dbe6ea;--radius:14px;--shadow:0 1px 4px rgba(20,60,80,.06);--shadow2:0 8px 22px rgba(11,85,99,.13);--focus:#f2c14e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo span{color:var(--gold)}
.hwrap .sp{flex:1}
.userbox{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--gold);color:#17323b;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.btn.teal{background:var(--teal);color:#fff}
.btn.light{background:#e8f1f4;color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
.twrap{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.twrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.tab.on{background:var(--teal);color:#fff}
#previewBanner{display:none;background:#fff7dd;border-bottom:1px solid #ecd28a;color:#7a5b12;font-size:13px;text-align:center;padding:7px 12px}
main{max-width:1080px;margin:0 auto;padding:18px 14px 110px}
section.page{display:none}
section.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(20,60,80,.05)}
.card h2{font-size:19px;margin-bottom:8px;color:var(--teal)}
.card h3{font-size:16px;margin-bottom:6px;color:var(--teal)}
.mut{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;transition:.15s}
.tile:hover{border-color:var(--teal2);transform:translateY(-1px)}
.tile .t{font-weight:700;font-size:15px;margin:4px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#e3f0f2;color:var(--teal)}
.badge.gold{background:#fdf0cd;color:#8a6410}
.badge.done{background:#dcf4e7;color:#12714a}
.bar{height:8px;background:#e6eef1;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--teal2)}
select,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 1 auto}
.grow{flex:1 1 200px}
.hero{background:linear-gradient(135deg,#0b5563,#12809b);color:#fff;border:0}
.hero h2{color:#fff}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.ring .num small{font-size:11px;font-weight:600;opacity:.85}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--teal)}
.stat span{font-size:12.5px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;margin:7px 0;font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--teal2)}
.opt.right{border-color:var(--ok);background:#eafaf1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.why{display:none;background:#f0f7f9;border-left:4px solid var(--teal2);padding:9px 12px;border-radius:6px;font-size:14px;margin:6px 0 12px}
.why.show{display:block}
.typesent{font-size:21px;line-height:1.9;letter-spacing:.3px;background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:70px}
.typesent span.ok{color:var(--ok)}
.typesent span.cur{background:#ffe9a8;border-radius:3px}
.flip{perspective:900px;cursor:pointer}
.flip .inner{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.5px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;overflow:auto}
.face.back{transform:rotateY(180deg);background:#f2f9fa;align-items:flex-start;text-align:left;justify-content:flex-start}
.word{font-size:34px;font-weight:800;color:var(--teal)}
.ipa{color:var(--mut);font-size:16px;margin-top:4px}
.passage{white-space:pre-wrap;font-size:16.5px;line-height:1.85;background:#fcfdfd;border:1px solid var(--line);border-radius:12px;padding:18px}
.line{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;align-items:flex-start}
.line .who{font-weight:700;color:var(--teal);min-width:78px;font-size:13px;padding-top:2px}
.line .txt{flex:1}
.line .vi{color:var(--mut);font-size:14px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:0 0 auto}
.iconbtn:hover{border-color:var(--teal2)}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.modebar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.modebar button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#dictFab{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#dictPanel{position:fixed;right:14px;bottom:78px;z-index:81;width:min(360px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:16px;display:none}
#dictPanel.open{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;background:#17323b;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;max-width:92vw;text-align:center}
footer{max-width:1080px;margin:0 auto;padding:0 14px 30px;color:var(--mut);font-size:13px;text-align:center}
.kbd{font-size:13px;color:var(--mut)}
.modelbox{background:#fbf8ee;border:1px solid #ecdfae;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.8;font-size:15.5px}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
select:focus,input:focus,textarea:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(14,116,144,.15);outline:none}
#bandBar{background:#eef5f7;border-bottom:1px solid var(--line);position:sticky;top:112px;z-index:39}
.bandwrap{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px}
.bandwrap .bb-label{font-weight:700;color:var(--teal);font-size:14px}
.bandwrap select{width:auto;min-width:180px;padding:8px 10px}
.bandwrap .bb-hint{font-size:13px;color:var(--mut)}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.skillcard{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.skillcard:hover{border-color:var(--teal2);transform:translateY(-2px);box-shadow:var(--shadow2)}
.skillcard .ic{font-size:26px}
.skillcard .t{font-weight:800;font-size:16px;margin:6px 0 2px;color:var(--teal)}
.skillcard .d{font-size:13.5px;color:var(--mut);min-height:38px}
.skillcard .n{font-size:13px;margin-top:8px;color:var(--ink)}
.stage{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fff}
.stage.target{border-color:var(--gold);background:#fffdf4;box-shadow:var(--shadow2)}
.stage.start{border-color:#9fd4b6;background:#f4fcf7}
.stage .shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage .sname{font-weight:800;font-size:16px;color:var(--teal)}
.stage .spct{margin-left:auto;font-weight:800;color:var(--teal)}
.stage .skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#f7fafb;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal2);background:#eef7f9}
.chip b{color:var(--teal)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mut);background:#fbfdfd;font-size:14.5px}
.line.playing{background:#fff6d8;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,179,60,.25)}
.playing-row{background:#fff6d8}
.guide{background:#eef7f9;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 13px;font-size:14.5px;margin-top:12px}
.posline{font-size:13.5px;color:var(--mut);background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.term{border-bottom:1.5px dotted var(--teal2);cursor:pointer;color:var(--teal);font-weight:600;white-space:nowrap}
.term sup{font-size:10px}
#glossPop{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;width:min(430px,calc(100vw - 28px));background:#fff;border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.25);padding:16px;display:none}
#glossPop.open{display:block}
#glossPop p{font-size:14.5px;margin:6px 0 10px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.step{display:flex;gap:10px;align-items:center;text-align:left;background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;width:100%;color:var(--ink)}
.step .slab{flex:1}
.step .sstat{font-size:12.5px;color:var(--mut);white-space:nowrap}
.step.st-done{border-color:#bfe8d2;background:#eafaf1}
.step.st-doing{border-color:var(--gold);background:#fffdf4}
.step:disabled{opacity:.55;cursor:default}
.ph-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ph-btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.ph-btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
@keyframes mouthMove{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.mouth-anim .tongue{animation:mouthMove .45s ease-in-out 2}
.pb-bar{flex-wrap:wrap;gap:6px}
.pb-bar .btn{padding:7px 11px;font-size:13.5px}
.pb-res{font-weight:600}
.pb-marks{margin-top:4px;font-size:15px}
.obs-strip{display:flex;gap:14px;flex-wrap:wrap}
.obs-img{flex:0 1 300px;min-width:230px}
.obs-vids{flex:1 1 300px;display:flex;flex-direction:column;gap:12px;min-width:250px}
.obs-vid{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdfd}
.mirror-box{border:1.5px solid var(--teal2);border-radius:12px;padding:12px;background:#f7fcfd;margin-top:10px}
.mr-stage{position:relative;border-radius:12px;overflow:hidden;background:#10222a;max-width:520px}
.mr-video{width:100%;display:block;transform:scaleX(-1)}
.mr-cv{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.g-row{display:flex;align-items:center;gap:8px;margin-top:5px}
.g-lab{flex:0 0 128px;font-size:13px;color:var(--mut)}
.g-lab.in{color:var(--ok);font-weight:700}
.g-track{position:relative;flex:1;height:12px;background:#e8eff2;border-radius:99px}
.g-zone{position:absolute;top:0;bottom:0;background:rgba(30,158,106,.30);border-radius:99px;display:none}
.g-val{position:absolute;top:-3px;width:4px;height:18px;background:var(--teal);border-radius:2px;transform:translateX(-2px)}
.g-num{flex:0 0 42px;font-size:13px;font-weight:600}
.mr-pass{background:#eafaf1;border:1.5px solid #bfe8d2;border-radius:12px;padding:10px 12px}
.mr-vidbox{flex:0 1 190px;min-width:150px}
.mr-vid-strip{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:360px;overflow:auto}
.mr-vid{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.mr-vid video{width:100%;height:auto;border-radius:7px;display:block;background:#10222a}
.mr-vid-del{position:absolute;top:7px;right:7px;padding:2px 8px;font-size:12px;border-radius:999px}
.vid-tile.playing{border-color:var(--gold);background:#fffdf4}
.grow{flex:1}
.wordbad{color:#d9534f;font-weight:700;text-decoration:underline}
.wordok{color:var(--ok);font-weight:600}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#bottomNav{display:none}
@media(max-width:768px){
nav.tabs{display:none}
#bandBar{top:56px}
#bottomNav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,60,80,.10)}
#bottomNav .bwrap{display:flex;overflow-x:auto;scrollbar-width:none}
#bottomNav .bwrap::-webkit-scrollbar{display:none}
#bottomNav button{flex:1 0 auto;min-width:62px;border:0;background:transparent;padding:7px 4px 9px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#bottomNav button .bic{font-size:19px;line-height:1}
#bottomNav button.on{color:var(--teal)}
#dictFab{bottom:86px}
.toast{bottom:150px}
main{padding-bottom:130px}
}
@media(max-width:640px){.word{font-size:27px}.typesent{font-size:18px}nav.tabs{top:56px}}
.bandest{background:#eef7f9;border:1.5px solid var(--teal2);border-radius:10px;padding:10px 12px;margin-top:10px}
.critrow{border-top:1px solid var(--line);padding:10px 0}
.critmachine{background:#f7fafb;border:1px dashed var(--teal2);border-radius:8px;padding:6px 9px;font-size:13.5px;margin:5px 0}
.revq{border-top:1px solid var(--line);padding:9px 0}
.oktxt{color:var(--ok);font-weight:700}
.badtxt{color:var(--bad);font-weight:700}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cmp2{grid-template-columns:1fr}}
.hardbtn{font-size:13px;padding:6px 12px}
.mock-opt.mock-sel{border-color:var(--teal);background:#eef7f9}
/* ===== Responsive dien thoai + iPad (khoi bo sung, nam cuoi de de len quy tac cu khi trung) ===== */
.obs-img svg{display:block;margin:0 auto}
@media(min-width:641px) and (max-width:1024px){
.grid,.skillgrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.passage{font-size:17px;line-height:1.9}
.card{padding:17px}
.obs-img{flex-basis:275px}
.mr-stage{margin:0 auto}
}
@media(max-width:880px){.cmp2{grid-template-columns:1fr}}
@media(max-width:820px){
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{font-size:16px}
.btn{min-height:42px}
.chip{padding:8px 13px}
.ph-btn{min-height:40px;padding:7px 10px}
.iconbtn{width:40px;height:40px}
}
@media(max-width:768px){
header{padding:10px 12px}
.logo{font-size:17px}
}
@media(max-width:640px){
main{padding:14px 10px 122px}
.card{padding:14px}
.obs-strip{gap:10px}
.obs-img{flex:1 1 100%;min-width:0}
.obs-vids{flex:1 1 100%;min-width:0}
.mr-vidbox{flex:1 1 100%;min-width:0}
.mr-cam{flex:1 1 100%;min-width:0}
.mr-stage{margin:0 auto}
.vid-player{flex-basis:100%!important;min-width:0!important}
.vid-list{flex-basis:100%!important;min-width:0!important}
.g-lab{flex-basis:102px;font-size:12.5px}
.g-num{flex-basis:36px}
.bandwrap select{min-width:150px}
}
@media(max-width:560px){
.line{flex-direction:column;gap:3px}
.line .who{min-width:0;padding-top:0}
}
@media(max-width:480px){
.statgrid{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.stat b{font-size:22px}
.stage{padding:12px}
}
/* Bản đồ bảng chữ cái: nguyên âm - phụ âm, nhóm theo âm của tên chữ */
.az-map{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfd}
.az-zone{margin-top:10px}
.az-zone-t{font-weight:700;font-size:13.5px;color:var(--teal);letter-spacing:.02em}
.az-zone-v{background:#fffaf0;border:1px solid #f0d9a0;border-radius:10px;padding:9px 10px}
.az-zone-v .az-zone-t{color:#8a6410}
.az-note{font-size:13.5px;color:#7a5d12;margin-top:6px}
.az-cells{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.az-cell{position:relative;min-width:40px;height:40px;padding:0 6px;border-radius:10px;border:1.5px solid var(--teal2);background:#eef7f9;color:var(--teal);font-size:17px;font-weight:800;cursor:pointer}
.az-cell:hover{background:#dceef3}
.az-cell.az-v{background:#fdf0cd;border-color:var(--gold);color:#8a6410}
.az-cell.az-v:hover{background:#fbe7ae}
.az-cell.az-cur{outline:3px solid var(--teal);outline-offset:1px}
.az-cell i{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:11px;color:var(--ok);background:#fff;border-radius:50%;padding:0 2px}
.az-grp{margin-top:8px}
.az-grp-t{font-size:13.5px;font-weight:600;color:var(--ink)}
.az-grp-t .ipa{color:var(--teal2);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">IELTS <span>Master</span> · Luyện thi IELTS</div>
    <div class="sp"></div>
    <div class="userbox" id="userBox"></div>
  </div>
</header>
<div id="previewBanner">Bạn đang học thử trên máy này - tiến độ được lưu ngay trong trình duyệt, không cần tài khoản.</div>
<nav class="tabs"><div class="twrap" id="tabBar"></div></nav>
<div id="bandBar"><div class="bandwrap"><span class="bb-label">🎯 Cấp độ:</span><select id="globalBand" aria-label="Chọn cấp độ band"></select><span id="bandTargetChip"></span><span class="bb-hint" id="bandHint"></span></div></div>
<main id="app"></main>
<footer>Web luyện thi IELTS tự soạn theo định dạng và tiêu chí band của IELTS. Nội dung phục vụ tự học, không phải đề thi thật.</footer>
<nav id="bottomNav"><div class="bwrap" id="bottomBar"></div></nav>
<button id="dictFab">📖 Từ điển</button>
<div id="dictPanel">
  <div class="row"><b style="color:var(--teal)">Tra từ điển Anh - Anh</b><span class="grow"></span><button class="iconbtn" id="dictClose">✕</button></div>
  <div class="row" style="margin-top:10px"><input type="text" id="dictInput" class="grow" placeholder="Nhập từ tiếng Anh..."><button class="btn teal" id="dictGo">Tra</button></div>
  <div id="dictResult" style="margin-top:12px"></div>
</div>
<div id="glossPop"><b style="color:var(--teal)" id="glossTitle">Giải thích dễ hiểu</b><p id="glossText"></p><button class="btn light" id="glossClose">Đã hiểu</button></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="content.js"></script>
<script>
"use strict";
/* ================= TIỆN ÍCH ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let toastT=null; function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",2600)}
function bandNum(b){ const m=String(b||"").match(/[\d.]+/); return m?parseFloat(m[0]):999; }
function bandFromText(s){ const m=String(s||"").match(/^Band\s*[\d.]+\+?/); return m?m[0].replace(/\s+/g," "):null; }
function itemBand(x){ if(!x) return null; if(x.band) return x.band; if(x.level) return x.level; return null; }
function vocabSetBand(v){ return itemBand(v)||bandFromText(v&&(v.theme||v.topic)); }
function listeningBand(l){ return itemBand(l)||bandFromText(l&&l.topic); }
function collectBands(){ const s=new Set(); const add=b=>{ if(b&&/^Band /.test(b)) s.add(b); };
  (CONTENT.typing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.grammar||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.reading||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.speaking||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.writing||[]).forEach(x=>add(itemBand(x)));
  (CONTENT.vocab||[]).forEach(x=>add(vocabSetBand(x)));
  (CONTENT.listening||[]).forEach(x=>add(listeningBand(x)));
  return [...s].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b)); }
const BANDS=collectBands();
/* THANG BAND CHUẨN của web - nguồn định nghĩa duy nhất cho mọi nơi liệt kê hoặc suy ra band:
   thanh lọc cấp độ, lộ trình các chặng, ô chọn Band mục tiêu, kiểm tra cuối chặng, nhiệm vụ thực chiến, gợi ý sau bài kiểm tra thử.
   Nhãn CEFR ghi kèm theo kiểu "tương đương" nằm ở BAND_CEFR ngay dưới đây. */
const BAND_SCALE=["Band 0","Band 2.0","Band 2.5","Band 3.0","Band 3.5","Band 4.0","Band 4.5","Band 5.0","Band 5.5","Band 6.0","Band 6.5","Band 7.0","Band 7.5+"];
const BAND_CEFR={"Band 0":"Pre-A1","Band 2.0":"A1","Band 2.5":"A1","Band 3.0":"A2","Band 3.5":"A2","Band 4.0":"B1","Band 4.5":"B1","Band 5.0":"cuối B1 - bắt đầu B2","Band 5.5":"B2 (đầu dải)","Band 6.0":"B2","Band 6.5":"B2","Band 7.0":"C1","Band 7.5+":"C1"};
const LADDER=[...new Set([...BAND_SCALE,...BANDS])].sort((a,b)=>bandNum(a)-bandNum(b)||a.localeCompare(b));
const BAND0_NAME="Band 0 - Nền tảng cho người mất gốc";
function bandLabel(b){ return b==="Band 0"?BAND0_NAME:b; }
function bandStageName(b){ const c=BAND_CEFR[b]; const base=bandLabel(b); return c?base+" · tương đương "+c:base; }
function trialSuggestBand(score,total){ const f=total?score/total:0; const TH=[0,0.16,0.22,0.28,0.34,0.41,0.47,0.53,0.59,0.66,0.72,0.78,0.84]; let idx=0; TH.forEach((t,i)=>{ if(f>=t) idx=i; }); return BAND_SCALE[Math.min(idx,BAND_SCALE.length-1)]; }
/* ================= THANG ĐIỂM: QUY ĐỔI ĐIỂM THÔ -> BAND ƯỚC LƯỢNG (Giai đoạn 4) =================
   Bảng quy đổi tham khảo phổ biến cho đề 40 câu, neo vào 2 điểm Cambridge công bố trong Teacher's Book
   Mindset Level 1: Reading 15-22/40 tương đương khoảng Band 5.0-5.5; Listening 16-22/40 tương đương khoảng Band 5.0-5.5.
   Bài có số câu khác 40: quy điểm thô về thang 40 theo tỉ lệ rồi tra bảng. IELTS không công bố bảng quy đổi cố định. */
const BAND_EST_NOTE="Band ước lượng để tham khảo - IELTS không công bố bảng quy đổi cố định";
const RAW_BAND_TABLE={reading:[[39,9.0],[37,8.5],[35,8.0],[33,7.5],[30,7.0],[27,6.5],[23,6.0],[19,5.5],[15,5.0],[13,4.5],[10,4.0],[8,3.5],[6,3.0],[4,2.5],[0,2.0]],listening:[[39,9.0],[37,8.5],[35,8.0],[32,7.5],[30,7.0],[26,6.5],[23,6.0],[19,5.5],[16,5.0],[13,4.5],[10,4.0],[8,3.5],[6,3.0],[4,2.5],[0,2.0]]};
function rawToBand(score,total,skill){ if(!total||total<=0) return null; const raw40=Math.round(score/total*40); const tbl=RAW_BAND_TABLE[skill]||RAW_BAND_TABLE.reading; for(const pair of tbl){ if(raw40>=pair[0]) return pair[1]; } return 2.0; }
function fmtBand(b){ return (Math.round(b*10)/10).toFixed(1); }
function bandEstHTML(score,total,skill,label){ const b=rawToBand(score,total,skill); if(b===null) return ""; return `<div class="bandest"><b>${esc(label||"Band ước lượng")}: Band ${fmtBand(b)}</b> <span class="mut">(điểm thô ${score}/${total} câu, quy về thang 40 câu)</span><br><span class="mut">${BAND_EST_NOTE}. Điểm neo tham khảo: Teacher's Book Mindset Level 1 (Cambridge) - Reading 15-22/40 và Listening 16-22/40 tương đương khoảng Band 5.0-5.5.</span></div>`; }

/* ================= 4 TIÊU CHÍ CHẤM CHÍNH THỨC (mỗi tiêu chí 25%) =================
   Mô tả Band 5/6/7 diễn đạt lại ngắn gọn bằng tiếng Việt từ bản mô tả band công khai (public band descriptors). */
const WRITING_CRITERIA=[
["task","Hoàn thành yêu cầu (Task Achievement - Task 1 / Task Response - Task 2)",{5:"Trả lời được phần nào yêu cầu nhưng còn thiếu ý chính hoặc ý chưa rõ; quan điểm có thể chưa nhất quán, còn chi tiết thừa hoặc lạc ý.",6:"Đáp ứng đủ các phần của đề, quan điểm rõ ràng; ý chính liên quan nhưng một số ý chưa được triển khai hết hoặc kết luận chưa thật chặt.",7:"Đáp ứng tốt mọi phần của đề; quan điểm rõ và phát triển xuyên suốt; ý chính được mở rộng, có dẫn chứng và dữ kiện hỗ trợ hợp lý."}],
["coh","Mạch lạc và liên kết (Coherence and Cohesion)",{5:"Có sắp xếp ý nhưng chưa thật logic, tiến triển chưa rõ; từ nối ít, dùng chưa chính xác hoặc lặp lại; chia đoạn có thể chưa hợp lý.",6:"Ý được sắp xếp mạch lạc, có tiến triển chung; dùng được các phương tiện liên kết dù đôi chỗ còn máy móc hoặc chưa linh hoạt; chia đoạn nhìn chung ổn.",7:"Tổ chức ý logic, tiến triển rõ ràng từ đầu tới cuối; dùng đa dạng phương tiện liên kết và tham chiếu một cách linh hoạt; chia đoạn hiệu quả."}],
["lex","Vốn từ (Lexical Resource)",{5:"Vốn từ còn hạn chế, chỉ đủ ở mức tối thiểu; lỗi chọn từ và chính tả khá nhiều, đôi khi khiến người đọc phải đoán ý.",6:"Vốn từ đủ dùng và nhìn chung phù hợp; đôi chỗ thiếu chính xác hoặc lặp từ nhưng không cản trở việc hiểu; còn ít lỗi chính tả.",7:"Vốn từ đủ rộng để diễn đạt linh hoạt và chính xác; có dùng từ ít thông dụng và cụm từ tự nhiên (collocation); lỗi chính tả rất ít."}],
["gram","Ngữ pháp đa dạng và chính xác (Grammatical Range and Accuracy)",{5:"Chủ yếu là câu đơn giản, lặp cấu trúc; câu phức thường sai; lỗi ngữ pháp và dấu câu nhiều, có thể gây khó đọc.",6:"Biết pha trộn câu đơn và câu phức nhưng độ linh hoạt còn hạn chế; câu phức hay sai hơn câu đơn, nhưng lỗi hiếm khi cản trở việc hiểu.",7:"Dùng đa dạng cấu trúc phức với độ linh hoạt và chính xác khá cao; nhiều câu hoàn toàn không có lỗi; lỗi còn lại không gây cản trở."}]];
const SPEAKING_CRITERIA=[
["flu","Trôi chảy và mạch lạc (Fluency and Coherence)",{5:"Giữ được mạch nói nhưng hay lặp lại, tự sửa và nói chậm; từ nối dùng còn đơn điệu hoặc chưa hợp.",6:"Sẵn sàng nói dài; thỉnh thoảng mất mạch vì ngập ngừng, lặp hoặc tự sửa; dùng được nhiều từ nối dù chưa luôn phù hợp.",7:"Nói dài một cách tự nhiên, hầu như không mất mạch; ngập ngừng chủ yếu do tìm ý chứ không phải tìm từ; từ nối dùng linh hoạt."}],
["lex","Vốn từ (Lexical Resource)",{5:"Nói được cả chủ đề quen thuộc lẫn lạ nhưng thiếu linh hoạt; có cố gắng diễn đạt lại (paraphrase) nhưng kết quả chưa đều.",6:"Vốn từ đủ rộng để bàn luận dài và rõ ý dù đôi chỗ chưa hợp; diễn đạt lại nhìn chung thành công.",7:"Dùng từ linh hoạt trên nhiều chủ đề; có từ ít thông dụng, cách diễn đạt thành ngữ và collocation tự nhiên; paraphrase hiệu quả."}],
["gram","Ngữ pháp đa dạng và chính xác (Grammatical Range and Accuracy)",{5:"Câu cơ bản dùng khá chính xác; cấu trúc phức còn ít và thường có lỗi, đôi khi gây khó hiểu.",6:"Pha trộn câu đơn và câu phức nhưng chưa linh hoạt; câu phức thường có lỗi nhưng hiếm khi gây khó hiểu.",7:"Dùng đa dạng cấu trúc phức với độ linh hoạt tốt; thường xuyên nói được những câu hoàn toàn không có lỗi."}],
["pron","Phát âm (Pronunciation)",{5:"Bản mô tả công khai định nghĩa theo band kề: có các đặc điểm của Band 4 và một số, nhưng chưa đủ, đặc điểm tích cực của Band 6.",6:"Dùng được nhiều đặc điểm phát âm (trọng âm, ngữ điệu, nối âm) nhưng kiểm soát chưa đều; nhìn chung nghe hiểu được, đôi lúc phát âm sai làm giảm độ rõ.",7:"Bản mô tả công khai định nghĩa theo band kề: có mọi đặc điểm tích cực của Band 6 và một số đặc điểm của Band 8."}]];
function criteriaBlockHTML(criteria,saved,hints){ return criteria.map(([k,name,desc])=>{ const cur=saved?saved[k]:undefined;
  return `<div class="critrow"><p><b>${esc(name)}</b>${typeof cur==="number"?` <span class="badge gold">Tự chấm: Band ${fmtBand(cur)}</span>`:""}</p>${hints&&hints[k]?`<div class="critmachine">${hints[k]}</div>`:""}<div>${[5,6,7].map(b=>`<p class="mut" style="margin:3px 0"><b>Band ${b}:</b> ${esc(desc[b])}</p>`).join("")}</div><div class="row" style="margin-top:4px"><span class="mut">Tự thấy mình ở mức:</span>${[4.5,5,5.5,6,6.5,7,7.5].map(v=>`<button class="chip crit-pick ${cur===v?"on":""}" data-k="${k}" data-v="${v}">Band ${fmtBand(v)}</button>`).join("")}</div></div>`; }).join(""); }
function critAvg(saved,criteria){ if(!saved) return null; const vs=criteria.map(([k])=>saved[k]).filter(v=>typeof v==="number"); if(vs.length<criteria.length) return null; return Math.round((vs.reduce((a,b)=>a+b,0)/vs.length)*2)/2; }

/* ================= SRS THỐNG NHẤT: MỤC KHÓ (Giai đoạn 4) =================
   Mục khó do người học tự đánh dấu (thẻ từ, trạm ngữ pháp, từng câu hỏi) vào cùng hàng đợi ôn giãn cách
   với Sổ lỗi sai và thẻ từ. Mốc ôn giãn dần 1-3-7-14-30 ngày; đúng liên tiếp 2 lần ở các lần ôn cách quãng mới ra khỏi hàng đợi. */
const HARD_INTERVALS=[1,3,7,14,30];
function hardMap(){ if(!state.hard||typeof state.hard!=="object"||Array.isArray(state.hard)) state.hard={}; return state.hard; }
function hardKeyOf(it){ return it.kind+":"+it.key; }
function syncHard(){ setProg("meta","hard",{map:hardMap()}); }
function isHard(it){ const h=hardMap()[hardKeyOf(it)]; return !!(h&&!h.done); }
function toggleHard(it){ const m=hardMap(); const k=hardKeyOf(it); if(m[k]&&!m[k].done){ delete m[k]; toast("Đã bỏ đánh dấu khó."); } else { m[k]={kind:it.kind,key:it.key,label:it.label||"",data:it.data||{},due:today(),streak:0,level:0,done:false,added:today()}; toast("Đã đánh dấu khó - mục này sẽ vào hàng đợi ôn giãn cách ở Sổ lỗi sai."); } syncHard(); saveLocal(); }
function dueHard(){ const t=today(); return Object.values(hardMap()).filter(h=>!h.done&&h.due<=t); }
function allHard(){ return Object.values(hardMap()).filter(h=>!h.done); }
function totalDueToday(){ return dueErrors().length+dueCards().length+dueHard().length; }
function hardBtnHTML(it){ const on=isHard(it); return `<button class="btn light hardbtn" data-hard="${encodeURIComponent(JSON.stringify(it))}">${on?"★ Đã đánh dấu khó (bấm để bỏ)":"☆ Đánh dấu khó"}</button>`; }
function wireHardBtns(root){ if(!root) return; $$(".hardbtn",root).forEach(b=>b.onclick=()=>{ try{ const it=JSON.parse(decodeURIComponent(b.dataset.hard)); toggleHard(it); b.textContent=isHard(it)?"★ Đã đánh dấu khó (bấm để bỏ)":"☆ Đánh dấu khó"; const n=$("#dueStripNum"); if(n) n.textContent=totalDueToday(); }catch(e){} }); }
function mountHardBtn(el,it){ if(!el) return; const d=document.createElement("div"); d.style.marginTop="6px"; d.innerHTML=hardBtnHTML(it); el.appendChild(d); wireHardBtns(d); }
function hardJudge(h,ok){ if(ok){ h.streak=(h.streak||0)+1; if(h.streak>=2){ h.done=true; h.due=""; } else { h.level=(h.level||0)+1; h.due=addDays(today(),HARD_INTERVALS[Math.min(h.level,HARD_INTERVALS.length-1)]); } } else { h.streak=0; h.due=addDays(today(),1); } syncHard(); saveLocal(); }
function hardVocabCard(h){ const d=h.data||{}; if(typeof d.setIdx==="number"&&d.setIdx>=0){ const deck=CONTENT.vocab[d.setIdx]; if(deck&&deck.cards[d.ci]) return deck.cards[d.ci]; } const sw=Object.values(state.savedWords||{}).find(x=>x&&x.w===d.w); return sw||{w:d.w||h.label,vi:""}; }

const GLOSSARY={band:"Band là thang điểm của IELTS, từ 0 đến 9. Band càng cao nghĩa là tiếng Anh càng tốt. Ví dụ Band 6.5 là mức khá, thường đủ để xét vào nhiều trường đại học.",collocation:"Collocation là các từ hay đi cùng nhau, ví dụ 'make a decision' nghĩa là đưa ra quyết định. Học từ theo cụm như vậy giúp câu văn tự nhiên như người bản xứ.",paraphrase:"Paraphrase là nói hoặc viết lại cùng một ý bằng từ ngữ khác. Đây là kỹ năng giám khảo IELTS rất coi trọng.",cuecard:"Cue card là thẻ gợi ý trong phần Speaking Part 2. Trên thẻ có một chủ đề và vài ý gợi ý. Bạn có 1 phút chuẩn bị, rồi nói 1-2 phút về chủ đề đó.",srs:"Ôn giãn cách là cách ôn lại từ vựng đúng lúc sắp quên, theo các mốc ngày xa dần (1, 3, 7, 16, 35 ngày). Cách này giúp nhớ lâu mà tốn ít thời gian.",wpm:"WPM là số từ bạn gõ được trong một phút. Gõ nhanh và đúng giúp bạn viết bài thi kịp giờ.",ielts:"IELTS là kỳ thi tiếng Anh quốc tế, điểm thi là thang band từ 0 đến 9. Kết quả IELTS hay được dùng để xét du học, xin việc và định cư. Web này dẫn bạn từ mất gốc lên dần tới band bạn cần.",part:"Part nghĩa là một phần của bài thi Nói. Bài thi Nói có 3 Part: Part 1 hỏi đáp ngắn về bản thân, Part 2 nói 1-2 phút về một chủ đề trên thẻ gợi ý, Part 3 thảo luận sâu hơn về chủ đề đó.",section:"Section nghĩa là một phần của bài thi Nghe hoặc Đọc. Bài Nghe có 4 Section, khó dần lên: Section 1-2 là chuyện đời thường, Section 3 là thảo luận học tập, Section 4 là bài giảng học thuật.",ipa:"IPA là bảng ký hiệu phiên âm quốc tế: mỗi âm tiếng Anh có một ký hiệu riêng, viết giữa hai dấu gạch chéo như /i:/. Nhìn phiên âm là biết cách đọc một từ, kể cả từ bạn chưa gặp bao giờ.",task:"Trong bài thi Viết (Writing), Task 1 là bài viết mô tả biểu đồ hoặc sơ đồ (ít nhất 150 từ), Task 2 là bài luận nêu ý kiến (ít nhất 250 từ). Task 2 quan trọng hơn và chiếm nhiều điểm hơn."};
function termHTML(label,key){ return `<span class="term" data-term="${key}" title="Bấm để xem giải thích">${esc(label)}<sup>?</sup></span>`; }
function guideHTML(text){ return `<div class="guide">💡 ${esc(text)}</div>`; }
function stageLineHTML(band){ if(!band) return ""; const st=bandStageStats(band); if(!st.total) return `<div class="posline">📍 Bạn đang ở chặng <b>${esc(bandLabel(band))}</b>.</div>`; return `<div class="posline">📍 Bạn đang ở chặng <b>${esc(bandLabel(band))}</b> - đã xong ${st.done}/${st.total} mục của chặng này.</div>`; }

const PROG_TAB={typing:"typing",grammar:"grammar",reading:"reading",listening:"listening",speaking:"speaking",writing:"writing"};

function studyTitle(tab,idx){ try{ if(tab==="typing")return CONTENT.typing[idx].title; if(tab==="grammar")return CONTENT.grammar[idx].name; if(tab==="reading")return CONTENT.reading[idx].title; if(tab==="listening")return CONTENT.listening[idx].topic; if(tab==="speaking")return CONTENT.speaking[idx].topic; if(tab==="writing")return CONTENT.writing[idx].title; if(tab==="vocab"){ const d=allDecks().find(d=>d.setIdx===idx); return d?d.name:"Từ vựng"; } }catch(e){} return ""; }
function markStudy(tab,idx,title){ if(idx===null||idx===undefined||isNaN(idx))return; const same=state.lastStudy&&state.lastStudy.tab===tab&&state.lastStudy.idx===idx; state.lastStudy={tab,idx,title:title||studyTitle(tab,idx),ts:Date.now()}; if(!same) sessErrs=[]; saveLocal(); }
let sessErrs=[];
function syncErrors(){ setProg("meta","errors",{list:(state.errors||[]).slice(-200)}); }
function logError(e){ if(!Array.isArray(state.errors)) state.errors=[]; const t=today(); const key=e.sec+"|"+e.q; const ex=state.errors.find(x=>(x.sec+"|"+x.q)===key&&!x.done);
  if(ex){ ex.count=(ex.count||1)+1; ex.date=t; ex.due=addDays(t,1); ex.streak=0; if(e.o)ex.o=e.o; if(e.a!==undefined)ex.a=e.a; if(e.why)ex.why=e.why; }
  else state.errors.push({id:"e"+Date.now()+"_"+Math.floor(Math.random()*1e5),sec:e.sec,kind:e.kind||"mc",q:e.q,o:e.o||null,a:e.a,why:e.why||"",date:t,due:addDays(t,1),streak:0,done:false,count:1});
  if(state.errors.length>200) state.errors=state.errors.slice(-200);
  sessErrs.push({sec:e.sec,q:e.q}); syncErrors(); saveLocal(); }
function dueErrors(){ const t=today(); return (state.errors||[]).filter(e=>!e.done&&e.due<=t); }
function errReviewHTML(){ if(!sessErrs.length) return ""; const items=sessErrs.map(se=>{ const e=(state.errors||[]).filter(x=>x.sec===se.sec&&x.q===se.q).pop(); return e?`<div style="margin:7px 0"><p><b>${esc(e.q)}</b></p><p class="mut">Đáp án đúng: <b>${esc(e.kind==="mc"&&e.o?String(e.o[e.a]):String(e.a))}</b>${e.why?(" - "+esc(e.why)):""}</p></div>`:""; }).join("");
  return `<div class="card" style="border-color:#f0d3d1;background:#fdf3f3;margin-top:12px"><h3>Xem lại lỗi sai trong bài này (${sessErrs.length} câu)</h3>${items}<div class="row" style="margin-top:8px"><button class="btn teal" onclick="go('errors')">Mở Sổ lỗi sai để luyện lại</button></div><p class="mut" style="margin-top:6px">Mọi câu sai đã được tự lưu vào Sổ lỗi sai. Luyện lại đúng 2 lần liên tiếp là coi như đã sửa xong lỗi đó.</p></div>`; }

async function pullRemote(){ if(!sb||!sbUser)return;

    if(sw.data) sw.data.forEach(r=>{state.savedWords[r.word]=r.data});
    const sl=await sb.from("study_log").select("day,minutes").eq("user_id",sbUser.id);
    if(sl.data) sl.data.forEach(r=>{state.studyLog[r.day]=r.minutes});

    const mw=state.progress["meta:welcomed"]; if(mw&&mw.v) state.welcomed=true;

function openItem(sec,idx){ if(sec==="typing"&&CONTENT.typing[idx]){ typingSel=idx; typingRun=null; } else if(sec==="grammar"&&CONTENT.grammar[idx]){ gramSel=idx; gramRun={answers:{},submitted:false}; } else if(sec==="reading"&&CONTENT.reading[idx]){ readSel=idx; readRun={answers:{},submitted:false}; } else if(sec==="listening"&&CONTENT.listening[idx]){ lisSel=idx; lisMode="dict"; lisQuiz=null; } else if(sec==="speaking"&&CONTENT.speaking[idx]){ spSel=idx; spMode="sub"; spQuizRun=null; spLastLine=null; } else if(sec==="writing"&&CONTENT.writing[idx]){ wrSel=idx; wrShowModel=false; } else if(sec==="vocab"){ const decks=allDecks(); const di=decks.findIndex(d=>d.setIdx===idx); if(di>=0){ const d=decks[di]; vocabSel=d; if(isAZDeck(d)) azOrderMode="group"; vocabQueue=azQueueFor(d); vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; } }
  go(sec); }
function continueStudy(ls){ openItem(ls.tab,ls.idx); }
function firstItemIdxForBand(sec,b){ if(sec==="typing") return CONTENT.typing.findIndex(l=>itemBand(l)===b); if(sec==="grammar") return CONTENT.grammar.findIndex(g=>itemBand(g)===b); if(sec==="reading") return CONTENT.reading.findIndex(r=>itemBand(r)===b); if(sec==="listening") return CONTENT.listening.findIndex(l=>listeningBand(l)===b); if(sec==="speaking") return CONTENT.speaking.findIndex(s=>itemBand(s)===b); if(sec==="writing") return CONTENT.writing.findIndex(w=>itemBand(w)===b); if(sec==="vocab"){ if(b==="Band 0"){ const ai=alphabetDeckIdx(); if(ai>=0) return ai; } const d=allDecks().find(d=>d.band===b); return d?d.setIdx:-1; } return -1; }
function openFirstForBand(b){ for(const sec of ["typing","grammar","reading","listening","speaking","writing","vocab"]){ const i=firstItemIdxForBand(sec,b); if(i>=0){ openItem(sec,i); return true; } } return false; }
function alphabetDeckIdx(){ const d=allDecks().find(x=>x.setIdx>=0&&/26 chữ cái/i.test(x.name)); return d?d.setIdx:-1; }
function startFromZero(){ setTargetBand("Band 0"); const vi=alphabetDeckIdx(); if(vi>=0){ openItem("vocab",vi); return; } if(!openFirstForBand("Band 0")) openItem("vocab",24); }
function dismissWelcome(){ if(!state.welcomed){ state.welcomed=true; setProg("meta","welcomed",{v:1}); saveLocal(); } }
function buildTodayPlan(){ const plan=[]; const secName={typing:"Gõ câu",vocab:"Từ vựng",grammar:"Ngữ pháp",reading:"Đọc",listening:"Nghe",speaking:"Luyện nói",writing:"Writing",video:"Video"};

  if(plan.length<3&&!state.trialDone) plan.push({text:"Làm bài kiểm tra thử ngắn để biết mình đang ở band nào",btn:"Kiểm tra ngay",act:()=>{ trialState={i:0,score:0,answered:false}; render(); const tb=$("#trialBox"); if(tb) tb.scrollIntoView({block:"center"}); }});

  return plan.slice(0,3); }

function renderHomeStats(){ const min=state.studyLog[today()]||0; const el=$("#statMin"); if(!el)return; el.textContent=min; $("#statStreak").textContent=streak(); $("#statTotal").textContent=Object.values(state.studyLog).reduce((a,b)=>a+b,0); const c=326.7; const p=Math.min(1,min/Math.max(1,state.goal)); const ring=$("#ringFg"); if(ring) ring.style.strokeDashoffset=String(c*(1-p)); }
function renderTrial(box){
  if(!trialState){ box.innerHTML=`<button class="btn teal" id="trialStart">Bắt đầu kiểm tra thử</button>`; $("#trialStart").onclick=()=>{ trialState={i:0,score:0,answered:false,answers:[]}; renderTrial(box); }; return; }
  const t=trialState; if(!Array.isArray(t.answers)) t.answers=[];
  if(t.i>=CONTENT.trial.length){ if(!state.trialDone){ state.trialDone=true; saveLocal(); } const est=trialSuggestBand(t.score,CONTENT.trial.length); const low=est==="Band 0"; const curT=state.targetBand||est;
    const reviewHTML=CONTENT.trial.map((q,qi)=>{ const ch=t.answers[qi]; const ok=ch===q.a; return `<div class="revq"><p><span class="badge gold">${esc(q.level)}</span> <b>Câu ${qi+1}.</b> ${esc(q.q)}</p><p class="${ok?"oktxt":"badtxt"}">${ok?"✅ Bạn đã chọn đúng":("❌ Bạn chọn: <b>"+esc(ch!==undefined&&q.options[ch]!==undefined?q.options[ch]:"(chưa trả lời)")+"</b>")}</p><p>Đáp án đúng: <b>${esc(q.options[q.a])}</b></p><p class="mut">${esc(q.why||"")}</p><div class="hardSlot"></div></div>`; }).join("");
    box.innerHTML=`<p>Bạn đúng <b>${t.score}/${CONTENT.trial.length}</b> câu. ${termHTML("Band","band")} gợi ý chặng học: <b>${est}</b>. Đây chỉ là gợi ý từ ${CONTENT.trial.length} câu ngắn.</p>${bandEstHTML(t.score,CONTENT.trial.length,"reading","Band ước lượng từ bài kiểm tra thử")}${low?`<div class="why show" style="margin-top:8px">Kết quả còn thấp - không sao cả. Bạn nên bắt đầu từ <b>Band 0 - Nền tảng cho người mất gốc</b> để xây nền từ vựng và ngữ pháp cơ bản trước, rồi đi lên dần theo lộ trình ở trang chủ.</div>`:`<div class="why show" style="margin-top:8px">Gợi ý tương đối: với kết quả này, bạn nên bắt đầu học từ chặng <b>${esc(bandStageName(est))}</b> trong lộ trình ở trang chủ. Đây chỉ là gợi ý tương đối từ một bài kiểm tra ngắn, không phải điểm thi thật.</div>`}<div class="row" style="margin-top:10px"><label><b>Band mục tiêu của tôi:</b></label><select id="trialBandSel" style="max-width:270px">${LADDER.map(b=>`<option value="${esc(b)}" ${b===curT?"selected":""}>${esc(bandLabel(b))}</option>`).join("")}</select><button class="btn teal" id="trialSetTarget">Đặt làm mục tiêu</button><button class="btn light" id="trialReviewBtn">Xem lại từng câu</button><button class="btn light" id="trialAgain">Làm lại</button></div><p class="mut" style="margin-top:6px">Chưa có nền tảng? Bắt đầu từ Band 0. Khi đặt mục tiêu, bộ lọc cấp độ và lộ trình sẽ chuyển theo band bạn chọn.</p><p class="mut" id="trialTargetMsg" style="margin-top:4px">${state.targetBand?("Mục tiêu hiện tại của bạn: <b>"+esc(bandLabel(state.targetBand))+"</b>."):""}</p><div id="trialReview" class="hidden" style="margin-top:6px">${reviewHTML}</div>`;
    $("#trialAgain").onclick=()=>{ trialState=null; renderTrial(box); };
    $("#trialSetTarget").onclick=()=>{ const b=$("#trialBandSel").value; setTargetBand(b); const m=$("#trialTargetMsg"); if(m) m.innerHTML="Đã đặt band mục tiêu: <b>"+esc(bandLabel(b))+"</b>. Lộ trình và bộ lọc cấp độ đã chuyển theo mục tiêu này."; toast("Đã đặt band mục tiêu: "+b); };
    const rb=$("#trialReviewBtn"); if(rb) rb.onclick=()=>{ const rv=$("#trialReview"); if(rv){ rv.classList.toggle("hidden"); rb.textContent=rv.classList.contains("hidden")?"Xem lại từng câu":"Ẩn phần xem lại"; } };

function viewTyping(app){

    $("#tyBand").onchange=e=>{ setGlobalBand(e.target.value,true); draw(); }; wireHowTo(app); draw(); return;
  }
  const L=CONTENT.typing[typingSel];
  if(!typingRun) typingRun={s:0,typed:"",errors:0,correct:0,start:null,serr:0};
  const r=typingRun, sent=L.sentences[r.s];

  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="tyBack">← Danh sách bài</button><span class="badge">${esc(L.level)}</span><b>${esc(L.title)}</b><span class="mut">Câu ${r.s+1}/${L.sentences.length}</span></div>
  ${guideHTML("Bài này giúp bạn nhớ cách viết câu tiếng Anh chuẩn IELTS. Nhiệm vụ: nhìn câu mẫu trong khung này, rồi gõ lại y hệt vào ô trống bên dưới. Gõ đúng ký tự nào, ký tự đó chuyển màu xanh.")}${stageLineHTML(itemBand(L))}
  <div class="typesent" style="margin-top:12px">${chars}</div>
  <textarea id="tyInp" rows="2" style="margin-top:10px" placeholder="Gõ lại câu ở trên vào đây..."></textarea>
  <div class="row" style="margin-top:8px"><span class="mut" id="tyStat"></span></div>
  <div id="tyDone"></div></div></section>`;
  $("#tyBack").onclick=()=>{ typingSel=null; typingRun=null; render(); };
  const inp=$("#tyInp"); inp.focus();

  updStat();

    if(!r.start) r.start=Date.now();
    let v=inp.value;
    while(v.length>r.typed.length){ const pos=r.typed.length; const ch=v[pos]; if(pos<sent.length&&ch===sent[pos]){ r.typed+=ch; r.correct++; } else { r.errors++; r.serr=(r.serr||0)+1; v=v.slice(0,r.typed.length); break; } }
    if(v.length<r.typed.length){ r.typed=v; }

    const box=$(".typesent"); if(box){ box.innerHTML=sent.split("").map((c,i)=>{ let cls=""; if(i<r.typed.length)cls="ok"; else if(i===r.typed.length)cls="cur"; return `<span class="${cls}">${esc(c)}</span>`; }).join(""); }

  });
  inp.addEventListener("paste",e=>e.preventDefault());

const INTERVALS=[1,1,3,7,16,35];
/* ============ BẢNG CHỮ CÁI: NGUYÊN ÂM - PHỤ ÂM + NHÓM THEO ÂM CỦA TÊN CHỮ ============
   Giáo trình ESL/IELTS vỡ lòng dạy bảng chữ cái theo nhóm tên chữ để luyện nghe - đánh vần:
   tên các chữ trong cùng nhóm đọc gần giống nhau nên phải học cạnh nhau để phân biệt.
   Tiến độ từng thẻ khóa theo cardKey(setIdx, ci, w) với ci là chỉ số GỐC trong bộ,
   nên thứ tự trình thẻ chỉ là cách sắp xếp hàng đợi - không ảnh hưởng tiến độ/Hộp nhớ SRS. */
const AZ_GROUP_META={ei:{ipa:"/eɪ/",vn:"ây"},ii:{ipa:"/iː/",vn:"i dài"},e:{ipa:"/e/",vn:"e"},ai:{ipa:"/aɪ/",vn:"ai"},ou:{ipa:"/əʊ/",vn:"âu"},juu:{ipa:"/juː/",vn:"iu"},aa:{ipa:"/ɑː/",vn:"a dài"}};
const AZ_GROUP_ORDER=["ei","ii","e","ai","ou","juu","aa"];
let azOrderMode="group";
function isAZDeck(d){ return !!(d&&d.cards&&d.cards.length&&d.cards[0]&&d.cards[0].kind&&d.cards[0].ngrp); }
function azOrderIndices(d,mode){
  if(mode!=="group") return d.cards.map((c,ci)=>ci);
  const seen=new Set(), out=[];
  d.cards.forEach((c,ci)=>{ if(c.kind==="vowel"){ out.push(ci); seen.add(ci); } });
  for(const g of AZ_GROUP_ORDER) d.cards.forEach((c,ci)=>{ if(!seen.has(ci)&&c.kind==="consonant"&&c.ngrp===g){ out.push(ci); seen.add(ci); } });
  d.cards.forEach((c,ci)=>{ if(!seen.has(ci)) out.push(ci); });
  return out;
}
function azQueueFor(d){ return azOrderIndices(d,isAZDeck(d)?azOrderMode:"az").map(ci=>({deck:d,c:d.cards[ci],ci,k:cardKey(d.setIdx,ci,d.cards[ci].w)})); }
function azGroupLabel(c){ const m=AZ_GROUP_META[c.ngrp]; return (c.kind==="vowel"?"Nguyên âm":"Phụ âm")+" - nhóm tên \""+(m?m.vn:"")+"\""+(m?(" "+m.ipa):""); }
function azMapHTML(d){
  const byLetter={}; d.cards.forEach((c,ci)=>byLetter[c.w]=ci);
  const curCi=(vocabQueue&&vocabQueue[vocabPos])?vocabQueue[vocabPos].ci:-1;
  const cell=ci=>{ const c=d.cards[ci]; const st2=state.cards[cardKey(d.setIdx,ci,c.w)]; const done=st2&&st2.box>=1; return "<button class=\"az-cell "+(c.kind==="vowel"?"az-v":"az-c")+(ci===curCi?" az-cur":"")+"\" data-azci=\""+ci+"\" title=\""+esc(azGroupLabel(c))+"\">"+esc(c.w)+(done?"<i>✓</i>":"")+"</button>"; };
  const vowels=["A","E","I","O","U"].map(L=>cell(byLetter[L])).join("");
  const groups=AZ_GROUP_ORDER.map(g=>{ const meta=AZ_GROUP_META[g]; const mem=d.cards.map((c,ci)=>({c,ci})).filter(x=>x.c.ngrp===g); return "<div class=\"az-grp\"><div class=\"az-grp-t\">Nhóm \""+meta.vn+"\" <span class=\"ipa\">"+meta.ipa+"</span></div><div class=\"az-cells\">"+mem.map(x=>cell(x.ci)).join("")+"</div></div>"; }).join("");
  return "<div class=\"az-map\">"
  +"<div class=\"row\" style=\"gap:6px\"><b>🗺️ Bản đồ bảng chữ cái - nguyên âm, phụ âm và nhóm tên chữ</b><span class=\"grow\"></span><button class=\"chip"+(azOrderMode==="group"?" on":"")+"\" id=\"azModeGroup\">Học theo nhóm</button><button class=\"chip"+(azOrderMode==="az"?" on":"")+"\" id=\"azModeAZ\">Thứ tự A-Z</button></div>"
  +"<div class=\"az-zone az-zone-v\"><div class=\"az-zone-t\">NGUYÊN ÂM - 5 chữ</div><div class=\"az-cells\">"+vowels+"</div><p class=\"az-note\">5 nguyên âm là linh hồn của mọi từ: từ nào cũng có ít nhất một nguyên âm. Hãy học 5 chữ này trước tiên.</p></div>"
  +"<div class=\"az-zone\"><div class=\"az-zone-t\">PHỤ ÂM - 21 chữ, xếp theo nhóm tên chữ</div>"+groups+"<p class=\"mut\" style=\"margin-top:6px\">Bảng nhóm ở trên là bản đồ tra cứu đánh vần: mỗi nhóm liệt kê đủ các chữ có tên đọc giống nhau (có cả nguyên âm nếu chữ đó thuộc nhóm tên này).</p></div>"
  +"<p class=\"mut\" style=\"margin-top:8px\">Vì sao học theo nhóm tên này? Trong IELTS Listening, người ta hay đánh vần tên người và địa chỉ (ví dụ: My name is Linh - L, I, N, H). Các chữ trong cùng một nhóm có tên đọc gần giống nhau (riêng nhóm \"i dài\" có tới 8 chữ), nên học cạnh nhau để nghe và phân biệt cho rõ. Bấm vào một ô chữ để nhảy ngay tới thẻ chữ đó; ô có dấu ✓ là chữ bạn đã thuộc.</p>"
  +"</div>";
}
let vocabSel=null, vocabQueue=null, vocabPos=0, vocabFlipped=false, vocabMode="flash", vocabQuiz=null;
function buildVocabQuiz(d){ const cards=d.cards.slice(0,10); const pool=CONTENT.vocab.flatMap(v=>v.cards); const src=cards.length>=4?cards:pool; const items=cards.map((c,i)=>{ const ds=[]; for(const off of [1,3,5,2,4]){ const cand=src[(i+off)%src.length]; if(cand&&cand.vi!==c.vi&&!ds.includes(cand.vi)) ds.push(cand.vi); if(ds.length>=3) break; } const opts=ds.slice(0,3); const pos=opts.length?i%(opts.length+1):0; opts.splice(pos,0,c.vi); return {w:c.w,ipa:c.ipa||"",vi:c.vi,opts,a:pos}; }); return {items,pos:0,score:0,answered:false,wrongs:[]}; }
function renderVocabQuiz(app){ const d=vocabSel, q=vocabQuiz||(vocabQuiz=buildVocabQuiz(d));

  if(q.pos>=q.items.length){ const total=q.items.length; const prev=getProg("vocab","Q"+d.setIdx)||{}; if(q.score>(prev.best||0)) setProg("vocab","Q"+d.setIdx,{best:q.score,total}); 
    app.innerHTML=`<section class="page on"><div class="card">${head}
    <h3 style="margin-top:14px">Kết quả kiểm tra: ${q.score}/${total} câu đúng</h3><p class="mut">${q.score>=Math.ceil(total*0.8)?"Rất tốt! Bạn đã nhớ nghĩa của hầu hết các từ trong lượt này.":"Hãy ôn lại các thẻ chưa thuộc rồi kiểm tra lại nhé."} Kết quả đã được tính vào tiến độ của bộ từ này.</p>
    ${q.wrongs.length?`<h3 style="margin-top:12px">Các từ cần ôn lại</h3>${q.wrongs.map(w=>`<p style="margin:5px 0"><b>${esc(w.w)}</b> - nghĩa đúng: ${esc(w.vi)}</p>`).join("")}`:`<p class="mut" style="margin-top:8px">Không có từ nào sai trong lượt này.</p>`}
    <div class="row" style="margin-top:10px"><button class="btn teal" id="vqAgain">Kiểm tra lại</button><button class="btn light" id="vqFlash">Về thẻ ghi nhớ</button></div></div></section>`;
    wireHead(); $("#vqAgain").onclick=()=>{ vocabQuiz=buildVocabQuiz(d); render(); }; $("#vqFlash").onclick=()=>{ vocabMode="flash"; render(); }; return; }
  const it=q.items[q.pos];
  app.innerHTML=`<section class="page on"><div class="card">${head}
  ${guideHTML("Chế độ kiểm tra: đọc từ tiếng Anh rồi chọn nghĩa tiếng Việt đúng trong 4 lựa chọn. Chọn xong là biết ngay đúng hay sai.")}${stageLineHTML(d.band)}
  <p class="mut" style="margin-top:12px">Câu ${q.pos+1}/${q.items.length} · Đã đúng: ${q.score}</p>
  <div style="text-align:center;margin:14px 0"><div style="font-size:30px;font-weight:800;color:var(--teal)">${esc(it.w)}</div><div class="mut">${esc(it.ipa)}</div><button class="btn light" id="vqSpeak" style="margin-top:6px">🔊 Nghe phát âm</button></div>
  <p><b>Từ này nghĩa là gì?</b></p>
  <div>${it.opts.map((o,oi)=>`<button class="opt vqo-opt" data-i="${oi}">${esc(o)}</button>`).join("")}</div>
  <div class="why" id="vqWhy"></div>
  <div class="row" style="margin-top:10px"><button class="btn teal hidden" id="vqNext">${q.pos===q.items.length-1?"Xem kết quả":"Câu tiếp theo"}</button></div>
  </div></section>`;
  wireHead();
  $("#vqSpeak").onclick=()=>speak(it.w,0.9);
  $$(".vqo-opt",app).forEach(b=>b.onclick=()=>{ if(q.answered) return; q.answered=true; const i=+b.dataset.i; $$(".vqo-opt",app).forEach((x,xi)=>{ if(xi===it.a)x.classList.add("right"); else if(xi===i)x.classList.add("wrong"); x.disabled=true; }); const w=$("#vqWhy"); if(i===it.a){ q.score++; w.innerHTML="<b>Đúng!</b> \""+esc(it.w)+"\" nghĩa là: "+esc(it.vi); } else { w.innerHTML="<b>Chưa đúng.</b> \""+esc(it.w)+"\" nghĩa là: "+esc(it.vi); q.wrongs.push(it); logError({sec:"vocab",q:"Từ \""+it.w+"\" nghĩa là gì?",o:it.opts,a:it.a,why:"\""+it.w+"\" nghĩa là: "+it.vi}); } w.classList.add("show"); $("#vqNext").classList.remove("hidden"); });

function allDecks(){ const decks=CONTENT.vocab.map((v,i)=>({name:v.topic||v.theme||("Bộ từ "+(i+1)),band:vocabSetBand(v),cards:v.cards,setIdx:i})); const saved=Object.values(state.savedWords); if(saved.length) decks.push({name:"Từ đã tra (từ điển)",band:null,cards:saved,setIdx:-1}); return decks; }
function deckVisible(d){ const f=effectiveBand(); if(f==="all")return true; if(!d.band)return true; return d.band===f; }
function cardKey(setIdx,ci,w){ return setIdx===-1? "sv:"+w : "s"+setIdx+":"+ci; }
function dueCards(){ const t=today(); const out=[]; allDecks().forEach(d=>d.cards.forEach((c,ci)=>{ const k=cardKey(d.setIdx,ci,c.w); const st=state.cards[k]; if(st&&st.due<=t) out.push({deck:d,c,ci,k}); })); return out; }
function viewVocab(app){
  if(vocabSel===null&&vocabQueue===null){
    const due=dueCards();
    app.innerHTML=`<section class="page on"><div class="card"><h2>Từ vựng IELTS theo chủ đề</h2><p class="mut">Mỗi thẻ có ${termHTML("phiên âm (IPA)","ipa")}, nghĩa, ${termHTML("collocation","collocation")} đi kèm và ví dụ văn phong học thuật. ${termHTML("Ôn tập giãn cách (SRS)","srs")} theo các mốc 1-3-7-16-35 ngày: bấm "Đã thuộc" để giãn mốc ôn, "Chưa thuộc" để ôn lại sớm.</p>
    ${howToHTML("vocab")}
    ${due.length?`<div class="row" style="margin:10px 0"><button class="btn" id="dueBtn">Ôn ${due.length} thẻ đến hạn hôm nay</button></div>`:`<p class="mut" style="margin:8px 0">Hôm nay không có thẻ nào đến hạn ôn.</p>`}
    <div class="grid">${allDecks().map((d,di)=>({d,di})).filter(({d})=>deckVisible(d)).map(({d,di})=>{ const total=d.cards.length; const known=d.cards.filter((c,ci)=>{ const st=state.cards[cardKey(d.setIdx,ci,c.w)]; return st&&st.box>=1; }).length; return `<div class="tile" data-di="${di}">${d.band?`<span class="badge">${esc(d.band)}</span>`:`<span class="badge gold">Mọi cấp độ</span>`}<div class="t">${esc(d.name)}</div><div class="mut">${total} thẻ · Đã học ${known}/${total}</div><div class="bar"><i style="width:${total?Math.round(known/total*100):0}%"></i></div></div>`; }).join("")||`<div class="empty" style="grid-column:1/-1">Chưa có bộ từ nào ở cấp độ đang chọn. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`}</div></div></section>`;
    wireHowTo(app);
    $$(".tile",app).forEach(t=>t.onclick=()=>{ const d=allDecks()[+t.dataset.di]; vocabSel=d; if(isAZDeck(d)) azOrderMode="group"; vocabQueue=azQueueFor(d); vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; markStudy("vocab",d.setIdx,d.name); render(); });
    const db=$("#dueBtn"); if(db) db.onclick=()=>{ vocabQueue=dueCards(); vocabSel={name:"Ôn tập đến hạn"}; vocabPos=0; vocabFlipped=false; vocabMode="flash"; vocabQuiz=null; render(); };
    return;
  }
  if(vocabMode==="quiz"&&vocabSel&&vocabSel.cards){ renderVocabQuiz(app); return; }
  if(!vocabQueue||vocabPos>=vocabQueue.length){ app.innerHTML=`<section class="page on"><div class="card"><h2>Hoàn thành lượt ôn!</h2>${vocabSel&&/26 chữ cái/i.test(vocabSel.name)?`<p style="margin-top:6px"><b>🎉 Bạn vừa học xong 26 chữ cái - bước đầu tiên đã hoàn thành!</b> Quay lại Trang chủ, phần Lộ trình và thẻ "Hôm nay học gì" sẽ chỉ bạn bước tiếp theo.</p>`:""}<p class="mut">Các thẻ sẽ tự xuất hiện lại theo lịch giãn cách. Hẹn gặp bạn ở buổi ôn tiếp theo.</p><div class="row" style="margin-top:10px"><button class="btn teal" id="vBack">Về danh sách bộ từ</button></div></div></section>`; $("#vBack").onclick=()=>{ vocabSel=null; vocabQueue=null; render(); }; return; }
  const item=vocabQueue[vocabPos], c=item.c, st=state.cards[item.k]||{box:0};
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="vBack2">← Danh sách bộ</button><b>${esc(vocabSel.name)}</b>${vocabSel.band?`<span class="badge gold">${esc(vocabSel.band)}</span>`:""}<span class="mut">Thẻ ${vocabPos+1}/${vocabQueue.length} · Hộp nhớ: ${st.box||0}/5</span></div>
  ${guideHTML("Thẻ này dạy bạn một từ mới. Nhiệm vụ: đọc từ, bấm loa để nghe phát âm, bấm vào thẻ để lật xem nghĩa. Xem xong, tự chấm mình đã thuộc hay chưa thuộc.")}${stageLineHTML(vocabSel.band)}
  ${isAZDeck(vocabSel)?azMapHTML(vocabSel):""}
  ${vocabSel.band==="Band 0"?`<div style="background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px"><b>🔤 Bảng 44 âm tiếng Anh - bấm vào một âm để xem khẩu hình miệng</b><div id="vBand0Mouth">${mouthPanelHTML()}</div></div>`:""}
  ${vocabSel.cards?`<div class="row" style="margin-top:10px"><button class="chip on" id="vModeFlash">🃏 Thẻ ghi nhớ</button><button class="chip" id="vModeQuiz">✅ Kiểm tra nghĩa của từ</button>${vocabSel.setIdx!==undefined&&getProg("vocab","Q"+vocabSel.setIdx)?`<span class="mut">Kiểm tra tốt nhất: ${getProg("vocab","Q"+vocabSel.setIdx).best}/${getProg("vocab","Q"+vocabSel.setIdx).total}</span>`:""}<span class="grow"></span><button class="chip" id="vMouthBtn">👄 Khẩu hình âm đầu</button></div><div id="vMouthBox" class="hidden" style="margin-top:10px"></div>`:""}
  ${c.kind&&c.ngrp?`<div style="margin-top:10px"><span class="badge ${c.kind==="vowel"?"gold":""}">${esc(azGroupLabel(c))}</span> <span class="mut">- chữ ${esc(c.w)} nằm trong nhóm này; hãy nghe kỹ để phân biệt với các chữ cùng nhóm khi người ta đánh vần.</span></div>`:""}
  <div class="flip ${vocabFlipped?"flipped":""}" id="flipCard" style="margin-top:12px"><div class="inner">
    <div class="face"><div class="word">${esc(c.w)}</div><div class="ipa">${esc(c.ipa||"")}</div><button class="iconbtn" id="vSpeak" title="Nghe phát âm">🔊</button><p class="mut" style="margin-top:10px">Bấm vào thẻ để lật xem nghĩa</p></div>
    <div class="face back"><div class="word" style="font-size:24px">${esc(c.w)}</div><p style="margin:6px 0"><b>Nghĩa:</b> ${esc(c.vi||"")}</p>${c.col?`<p style="margin:4px 0"><b>Collocation:</b> ${esc(c.col)}</p>`:""}<p style="margin:6px 0"><b>Ví dụ:</b> ${esc(c.ex||"")}</p><p class="mut">${esc(c.exv||"")}</p>${c.ex2?`<p style="margin:4px 0"><b>Thêm một từ nữa:</b> ${esc(c.ex2)}</p>`:""}${c.tip?`<p style="margin:4px 0"><b>💡 Mẹo nhớ:</b> ${esc(c.tip)}</p>`:""}</div>
  </div></div>
  ${c.vid?`<div style="margin-top:12px;border:1.5px solid var(--teal2);border-radius:12px;padding:12px;background:#f7fcfd"><b>🎬 Video riêng của chữ ${esc(c.w)} - kênh Jack Hartmann</b><p class="mut" style="margin-top:3px">Video này chỉ dạy chữ ${esc(c.w)}: cách đọc tên chữ, âm của chữ và các từ ví dụ. Bấm nút phát ngay trên khung để xem trong trang này và đọc theo nhé.</p><div style="margin-top:8px"><iframe src="https://www.youtube-nocookie.com/embed/${esc(c.vid)}" title="Video phát âm riêng của chữ ${esc(c.w)}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`:""}
  ${vocabSel.cards?`<div class="row pb-bar" style="margin-top:12px"><button class="btn light" id="vPbPlay" data-act="play">🔊 Nghe mẫu</button><button class="btn light" id="vPbSlow" data-act="slow">🐢 Nghe chậm</button><button class="btn light" id="vPbMirror" data-act="mirror">🪞 Gương khẩu hình</button><button class="btn teal" id="vPbRec" data-act="rec">🎤 Ghi âm và check giọng</button></div><div class="pb-res" id="vPbRes" style="margin-top:6px"></div><div id="vPbBox" style="margin-top:6px"></div>`:""}
  <div class="row" style="margin-top:12px"><button class="btn light" id="vNo">Chưa thuộc - ôn lại sớm</button><button class="btn teal" id="vYes">Đã thuộc - giãn mốc ôn</button></div>
  <div id="vHardSlot" style="margin-top:10px"></div>
  </div></section>`;
  $("#vBack2").onclick=()=>{ vocabSel=null; vocabQueue=null; vocabQuiz=null; vocabMode="flash"; render(); };
  $$(".az-cell",app).forEach(b=>b.onclick=()=>{ const ci=+b.dataset.azci; const p=vocabQueue.findIndex(q=>q.ci===ci); if(p>=0){ vocabPos=p; vocabFlipped=false; render(); } });
  const azSetMode=m=>{ if(!isAZDeck(vocabSel)||azOrderMode===m) return; azOrderMode=m; const curCi=vocabQueue&&vocabQueue[vocabPos]?vocabQueue[vocabPos].ci:0; vocabQueue=azQueueFor(vocabSel); const p=vocabQueue.findIndex(q=>q.ci===curCi); vocabPos=p>=0?p:0; vocabFlipped=false; render(); };
  const azmg=$("#azModeGroup"); if(azmg) azmg.onclick=()=>azSetMode("group");
  const azma=$("#azModeAZ"); if(azma) azma.onclick=()=>azSetMode("az");
  const vmq=$("#vModeQuiz"); if(vmq) vmq.onclick=()=>{ vocabMode="quiz"; vocabQuiz=buildVocabQuiz(vocabSel); render(); };
  const vmb=$("#vMouthBtn"); if(vmb) vmb.onclick=()=>{ const box=$("#vMouthBox"); if(!box) return; box.classList.toggle("hidden"); if(!box.dataset.wired){ box.innerHTML=mouthPanelHTML(); wireMouthPanel(box, firstPhonemeOf(c.w)); box.dataset.wired="1"; } else { const btn=box.querySelector(`.ph-btn[data-s="${CSS.escape(firstPhonemeOf(c.w))}"]`); if(btn) btn.click(); } };
  const vp1=$("#vPbPlay"); if(vp1) vp1.onclick=()=>speak(c.w,0.9);
  const vp2=$("#vPbSlow"); if(vp2) vp2.onclick=()=>speak(c.w,0.55);
  const vp3=$("#vPbMirror"); if(vp3) vp3.onclick=()=>{ const box=$("#vMouthBox"); if(!box) return; box.classList.remove("hidden"); if(!box.dataset.wired){ box.innerHTML=mouthPanelHTML(); wireMouthPanel(box, firstPhonemeOf(c.w)); box.dataset.wired="1"; } else { const btn=box.querySelector(`.ph-btn[data-s="${CSS.escape(firstPhonemeOf(c.w))}"]`); if(btn) btn.click(); } const slot=$(".mirror-slot",box); if(slot) mirrorToggle(slot, firstPhonemeOf(c.w)); };
  const vp4=$("#vPbRec"); if(vp4) vp4.onclick=()=>pbCheckVoice({text:c.w,btn:vp4,resEl:$("#vPbRes"),playEl:$("#vPbBox"),judge:(said,g)=>{ const ok=g.ok===g.total; if(item.deck&&item.deck.setIdx!==undefined) setProg("vocab","W"+item.deck.setIdx+"_"+item.ci,{ok,say:said}); if(!ok) logError({sec:"vocab",kind:"type",q:"Đọc từ vựng: "+c.w,a:c.w,why:"Đọc lại từ này chậm và rõ từng âm. Phiên âm: "+(c.ipa||"")}); }});
  const vh=$("#vHardSlot"); if(vh){ vh.innerHTML=hardBtnHTML({kind:"vocab",key:item.k,label:c.w,data:{setIdx:(item.deck&&typeof item.deck.setIdx==="number")?item.deck.setIdx:-1,ci:item.ci,w:c.w}}); wireHardBtns(vh); }
  const bm0=$("#vBand0Mouth"); if(bm0) wireMouthPanel(bm0,"i:");
  $("#flipCard").onclick=e=>{ if(e.target.id==="vSpeak")return; vocabFlipped=!vocabFlipped; $("#flipCard").classList.toggle("flipped",vocabFlipped); };
  $("#vSpeak").onclick=e=>{ e.stopPropagation(); speak(c.w,0.9); };
  const mark=known=>{ const cur=state.cards[item.k]||{box:0,due:today()}; let box; if(known){ box=Math.min(5,(cur.box||0)+1); } else { box=0; } state.cards[item.k]={box,due:addDays(today(),INTERVALS[box])}; saveLocal(); vocabPos++; vocabFlipped=false; render(); };
  $("#vYes").onclick=()=>mark(true); $("#vNo").onclick=()=>mark(false);
}

/* ================= NGỮ PHÁP ================= */
let gramSel=null, gramRun=null;
function viewGrammar(app){
  if(gramSel===null){
    const f=effectiveBand();
    const groups=(f==="all"?BANDS:[f]).map(b=>({b,list:CONTENT.grammar.map((g,i)=>({g,i})).filter(({g})=>itemBand(g)===b)})).filter(x=>x.list.length);
    app.innerHTML=`<section class="page on"><div class="card"><h2>Bản đồ ngữ pháp phục vụ IELTS</h2><p class="mut">${CONTENT.grammar.length} trạm theo band: câu phức, mệnh đề quan hệ, bị động, ${termHTML("paraphrase","paraphrase")} (viết lại câu)... Mỗi trạm có giải thích, ví dụ và bộ câu luyện riêng. Đạt từ 80% số câu là "Đã nắm vững".</p>${howToHTML("grammar")}
    ${groups.length?groups.map(({b,list})=>`<h3 style="margin-top:14px">${esc(bandLabel(b))}</h3><div class="grid">${list.map(({g,i})=>{ const p=getProg("grammar","s"+i)||{}; return `<div class="tile" data-i="${i}"><span class="badge">${esc(itemBand(g)||"")}</span> <span class="badge ${p.mastered?"done":""}">${p.mastered?"Đã nắm vững":("Trạm "+(i+1))}</span><div class="t">${esc(g.name)}</div><div class="mut">${p.best!==undefined?("Điểm cao nhất: "+p.best+"/"+g.quiz.length):"Chưa luyện"}</div></div>`; }).join("")}</div>`).join(""):`<div class="empty" style="margin-top:12px">Chưa có trạm ngữ pháp nào ở cấp độ ${esc(f)}. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`}
    </div></section>`;
    wireHowTo(app);
    $$(".tile",app).forEach(t=>t.onclick=()=>{ gramSel=+t.dataset.i; gramRun={answers:{},submitted:false}; markStudy("grammar",gramSel); render(); });
    return;
  }
  const g=CONTENT.grammar[gramSel], r=gramRun;
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="gBack">← Bản đồ trạm</button><span class="badge">${esc(g.level)}</span><b>Trạm ${gramSel+1}: ${esc(g.name)}</b><span id="gHardSlot"></span></div>
  ${guideHTML("Trạm này dạy bạn một điểm ngữ pháp. Nhiệm vụ: đọc phần giải thích và các ví dụ ở dưới, rồi trả lời các câu luyện tập. Đúng từ 80% số câu là qua trạm.")}${stageLineHTML(itemBand(g))}
  <p style="margin-top:10px">${esc(g.explain)}</p>
  <div style="margin:10px 0">${g.examples.map(e=>`<p class="kbd" style="font-size:14.5px;color:var(--ink)">• ${esc(e)}</p>`).join("")}</div>
  <h3>Luyện tập (${g.quiz.length} câu)</h3>
  ${g.quiz.map((q,qi)=>`<div style="margin-top:10px"><p><b>Câu ${qi+1}.</b> ${esc(q.q)}</p>${q.o.map((o,oi)=>`<button class="opt g-opt" data-q="${qi}" data-i="${oi}" ${r.submitted?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why" id="gWhy${qi}"></div></div>`).join("")}
  <div class="row" style="margin-top:12px"><button class="btn teal" id="gSubmit" ${r.submitted?"disabled":""}>Chấm bài</button><span id="gScore" style="font-weight:700"></span><button class="btn light hidden" id="gRetry">Làm lại trạm này</button></div>
  <div id="errReview"></div>
  </div></section>`;
  const gh=$("#gHardSlot"); if(gh){ gh.innerHTML=hardBtnHTML({kind:"grammar",key:"g"+gramSel,label:g.name,data:{g:gramSel}}); wireHardBtns(gh); }
  $("#gBack").onclick=()=>{ gramSel=null; gramRun=null; render(); };
  $$(".g-opt",app).forEach(b=>b.onclick=()=>{ const q=+b.dataset.q; r.answers[q]=+b.dataset.i; $$(".g-opt",app).filter(x=>+x.dataset.q===q).forEach(x=>x.style.borderColor=""); b.style.borderColor="var(--teal)"; b.style.background="#eef7f9"; });
  $("#gSubmit").onclick=()=>{ if(Object.keys(r.answers).length<g.quiz.length){ toast("Hãy trả lời đủ "+g.quiz.length+" câu trước khi chấm."); return; } r.submitted=true; sessErrs=[]; let score=0; g.quiz.forEach((q,qi)=>{ const chosen=r.answers[qi]; if(chosen===q.a)score++; else logError({sec:"grammar",q:q.q,o:q.o,a:q.a,why:q.why}); $$(".g-opt",app).filter(x=>+x.dataset.q===qi).forEach(x=>{ const i=+x.dataset.i; if(i===q.a)x.classList.add("right"); else if(i===chosen)x.classList.add("wrong"); x.disabled=true; }); const w=$("#gWhy"+qi); w.innerHTML=(chosen===q.a?"<b>Đúng.</b> ":"<b>Chưa đúng.</b> ")+esc(q.why); w.classList.add("show"); mountHardBtn(w,{kind:"mc",key:"grammar|"+q.q,label:q.q,data:{sec:"grammar",q:q.q,o:q.o,a:q.a,why:q.why}}); }); const mastered=score>=Math.ceil(g.quiz.length*0.8); const prev=getProg("grammar","s"+gramSel)||{}; setProg("grammar","s"+gramSel,{best:Math.max(prev.best||0,score),mastered:prev.mastered||mastered}); $("#gScore").textContent=`Kết quả: ${score}/${g.quiz.length} ${mastered?"- Đã nắm vững trạm này!":"- Cần đạt từ 80% để nắm vững, hãy ôn lại và thử lại."}`; $("#gSubmit").disabled=true; $("#gRetry").classList.remove("hidden"); const er=$("#errReview"); if(er) er.innerHTML=errReviewHTML(); };
  $("#gRetry").onclick=()=>{ gramRun={answers:{},submitted:false}; render(); };
}

/* ================= ĐỌC (IELTS Reading) ================= */
/* Các dạng câu hỏi đọc bổ sung: YNNG / MINFO / MSEND hiển thị như trắc nghiệm thông thường kèm nhãn dạng tiếng Việt dễ hiểu;
   TCOMP gõ đáp án vào ô, so khớp mềm (thường hóa, chấp nhận mọi biến thể cách nhau bằng dấu | trong trường answer). */
const READ_TYPE_LABEL={MC:"Trắc nghiệm (Multiple Choice)",TFNG:"Đúng / Sai / Không nêu (True / False / Not Given)",YNNG:"Ý tác giả - Yes / No / Not Given",MH:"Nối tiêu đề đoạn (Matching Headings)",MINFO:"Tìm thông tin nằm ở đoạn nào (Matching Information)",MSEND:"Nối hai nửa câu (Matching Sentence Endings)",MF:"Đối chiếu đặc điểm (Matching Features)",SC:"Hoàn thành tóm tắt (Summary Completion)",TCOMP:"Điền từ vào chỗ trống (Completion)",DLC:"Gắn nhãn sơ đồ (Diagram Label Completion)",SAQ:"Trả lời ngắn (Short-answer Questions)"};
function readOpts(q){ return q.options||q.o||[]; }
function ansVariants(ans){ return String(ans||"").split("|").map(s=>s.trim()).filter(Boolean); }
function normAns(s){ return String(s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/^[.!?,;:'"]+/g,"").replace(/[.!?,;:'"]+$/g,""); }
function softAnsMatch(typed,ans){ const t=normAns(typed); if(!t) return false; return ansVariants(ans).some(v=>normAns(v)===t); }
function readQHTML(q,qi,r){ const opts=readOpts(q); const label=READ_TYPE_LABEL[q.type]; const head=`<p><span class="badge gold">${esc(label?("Dạng: "+label):q.type)}</span> <b>Câu ${qi+1}.</b> ${esc(q.q)}</p>`;
  if(q.type==="TCOMP"||q.type==="DLC"||q.type==="SAQ"){ const prev=r.answers[qi]; const val=prev&&typeof prev==="object"?(prev.comp||""):""; const hint=q.type==="DLC"?"Gõ nhãn đúng cho vị trí được hỏi trên sơ đồ hoặc hình vẽ.":(q.type==="SAQ"?"Trả lời ngắn bằng từ hoặc cụm từ lấy từ bài đọc.":"Điền từ hoặc cụm từ còn thiếu vào chỗ ___ trong câu trên."); return `<div style="margin-top:10px">${head}<div class="row" style="margin-top:5px"><input class="r-comp" data-q="${qi}" placeholder="Gõ đáp án của bạn vào đây..." value="${esc(val)}" ${r.submitted?"disabled":""} style="flex:1;min-width:180px"><span class="mut">${hint}</span></div><div class="why" id="rWhy${qi}"></div></div>`; }
  return `<div style="margin-top:10px">${head}${opts.map((o,oi)=>`<button class="opt r-opt" data-q="${qi}" data-i="${oi}" ${r.submitted?"disabled":""}>${esc(o)}</button>`).join("")}<div class="why" id="rWhy${qi}"></div></div>`; }
let readSel=null, readRun=null;
function viewReading(app){
  if(readSel===null){
    app.innerHTML=`<section class="page on"><div class="card"><h2>Đọc - đúng định dạng IELTS Reading</h2><p class="mut">Các dạng câu hỏi: True/False/Not Given, Yes/No/Not Given, Matching Headings, Matching Information, Matching Features, Matching Sentence Endings, Multiple Choice, Summary Completion, Diagram Label Completion, Short-answer và điền từ vào chỗ trống. Chấm ngay kèm giải thích vị trí thông tin trong bài; có bản dịch mẫu và phân tích cụm từ ở cuối bài. Riêng ở các chặng đầu (Band 0 đến 3.5), bài đọc rất ngắn, câu hỏi đơn giản và luôn có giải thích tiếng Việt - bạn cứ yên tâm bắt đầu.</p><div class="row" style="margin:10px 0">${bandFilterHTML("rdBand",effectiveBand())}</div>${howToHTML("reading")}<div class="grid" id="rdGrid"></div></div></section>`;

/* ================= LUYỆN VIẾT TỪNG BƯỚC (Writing Drills) ================= */
let wdSel=null, wdDraft="", wdShowModel=false, wdPieces=null;
function wdItems(){ return CONTENT.writingDrills||[]; }
const WD_KIND={combine:"Ghép câu",paraphrase:"Viết lại câu (paraphrase)",order:"Sắp xếp từ thành câu"};
function shuffleArr(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function wdListHTML(){ const items=wdItems(); const f=effectiveBand(); const head=`<h3 style="margin-top:18px">🪜 Luyện viết từng bước</h3><p class="mut">Luyện viết từ những bước nhỏ nhất: ghép câu, viết lại câu, sắp xếp từ thành câu. Mỗi bài có đáp án mẫu để đối chiếu và tự đánh giá.</p>`;
  if(!items.length) return head+`<div class="empty" style="margin-top:8px">Đang bổ sung bài luyện viết từng bước. Trong lúc chờ, bạn cứ luyện các đề Writing ở trên nhé.</div>`;
  const vis=items.map((d,i)=>({d,i})).filter(({d})=>f==="all"||!d.band||d.band===f);
  if(!vis.length) return head+`<div class="empty" style="margin-top:8px">Chưa có bài luyện viết nào ở cấp độ đang chọn. Hãy chọn cấp độ khác ở thanh Cấp độ phía trên.</div>`;
  return head+`<div class="grid" style="margin-top:8px">${vis.map(({d,i})=>{ const p=getProg("writingDrills","WD"+i)||{}; return `<div class="tile wdtile" data-i="${i}">${d.band?`<span class="badge gold">${esc(d.band)}</span>`:""} <span class="badge">${esc(WD_KIND[d.kind]||d.kind)}</span> ${p.self==="ok"?'<span class="badge done">Tự chấm: làm đúng</span>':(p.self==="bad"?'<span class="badge" style="background:#f6d5d3">Đã lưu vào Sổ lỗi sai</span>':"")}<div class="t">${esc(d.title||"")}</div><div class="mut">${esc(d.prompt||"")}</div></div>`; }).join("")}</div>`; }
function viewWritingDrill(app){ const d=wdItems()[wdSel]; if(!d){ wdSel=null; render(); return; } const p=getProg("writingDrills","WD"+wdSel)||{};
  const pieces=d.kind==="order"?(wdPieces||String(d.given||"").split(" / ").map(s=>s.trim()).filter(Boolean)):null;
  app.innerHTML=`<section class="page on"><div class="card"><div class="row"><button class="btn light" id="wdBack">← Danh sách đề Writing</button>${d.band?`<span class="badge gold">${esc(d.band)}</span>`:""}<span class="badge">${esc(WD_KIND[d.kind]||d.kind)}</span><b>${esc(d.title||"")}</b></div>
  ${guideHTML("Bài này luyện viết từng bước nhỏ. Nhiệm vụ: đọc yêu cầu và phần cho sẵn, tự viết câu của bạn vào khung soạn thảo trước, rồi mở đáp án mẫu để đối chiếu và tự đánh giá thật trung thực.")}${stageLineHTML(d.band||null)}
  <p style="margin-top:10px"><b>Yêu cầu:</b> ${esc(d.prompt||"")}</p>
  ${d.kind==="order"?`<p style="margin-top:8px"><b>Các mảnh từ dưới đây đã bị xáo trộn - hãy sắp xếp thành một câu đúng:</b></p><div class="row" style="margin-top:6px">${pieces.map(pc=>`<span class="chip" style="cursor:default;font-size:15px">${esc(pc)}</span>`).join("")}</div>`:`<div class="why show" style="margin-top:10px"><b>Cho sẵn:</b><br>${esc(d.given||"")}</div>`}

let wrSel=null, wrFilter="all", wrShowModel=false;
function rubricMsg(rb){ const n=["req","org","lex","gram"].filter(k=>rb&&rb[k]).length; if(n===0) return "Hãy đọc lại bài và tích vào các mục bạn đã làm được."; if(n===4) return "Xuất sắc! Bài của bạn đạt cả 4 mục cơ bản. Hãy đối chiếu thêm với bài mẫu để học cụm từ hay."; return "Bạn đạt "+n+"/4 mục. Hãy sửa các mục chưa tích trước khi xem bài mẫu nhé."; }
function viewWriting(app){
